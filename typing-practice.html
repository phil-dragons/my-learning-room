","meaning_en":"stop trying to do something","meaning":"포기하다"},{"word_id":"v0033","headword":"acknowledge","story_form":"acknowledge","form":"acknowledge","meaning_en":"accept that something is true","meaning":"인정하다"},{"word_id":"v0090","headword":"allocate","story_form":"allocate","form":"allocate","meaning_en":"give something for a particular purpose","meaning":"배분하다"},{"word_id":"v0625","headword":"cooperate","story_form":"cooperate","form":"cooperate","meaning_en":"work together toward a goal","meaning":"협력하다"},{"word_id":"v1096","headword":"flexible","story_form":"flexible","form":"flexible","meaning_en":"willing to change plans","meaning":"융통성 있는"},{"word_id":"v1869","headword":"overcome","story_form":"overcome","form":"overcome","meaning_en":"successfully deal with a difficulty","meaning":"극복하다"},{"word_id":"v0024","headword":"accomplish","story_form":"accomplish","form":"accomplish","meaning_en":"succeed in doing something","meaning":"해내다"},{"word_id":"v1861","headword":"outcome","story_form":"outcome","form":"outcome","meaning_en":"the result of an action","meaning":"결과"}],"english":["I am **reluctant** to ask for help with our group project.","The work becomes a **burden**, and I want to **abandon** the project.","“I must **acknowledge** that I cannot do everything,” I tell my team.","“Let's **allocate** enough time for each job and **cooperate**,” Mina says.","We choose our jobs, but one member needs an extra day.","“We can be **flexible**,” I say, and we change our plan.","Together, we **overcome** the problem and **accomplish** more than I could alone.","The best **outcome** is learning to ask for help."],"korean":["나는 조별 과제에서 도움을 요청하는 것이 내키지 않는다.","일이 부담이 되어 과제를 포기하고 싶어진다.","“모든 일을 혼자 할 수 없다는 걸 인정해야겠어.” 나는 조원들에게 말한다.","“각 작업에 충분한 시간을 배분하고 협력하자.” 미나가 말한다.","우리는 일을 나누지만, 한 조원에게 하루가 더 필요하다.","“융통성을 발휘하면 돼.” 나는 말하고, 우리는 계획을 바꾼다.","함께 문제를 극복하고 내가 혼자 할 수 있었던 것보다 더 많은 일을 해낸다.","가장 좋은 결과는 도움을 요청하는 법을 배운 것이다."]},{"id":"O002","title":"음악 동아리의 소문","targets":[{"word_id":"v2279","headword":"rumor","story_form":"rumor","form":"rumor","meaning_en":"a story that may not be true","meaning":"소문"},{"word_id":"v2231","headword":"reveal","story_form":"reveal","form":"reveal","meaning_en":"make something known","meaning":"밝히다"},{"word_id":"v0028","headword":"accurate","story_form":"accurate","form":"accurate","meaning_en":"correct and without mistakes","meaning":"정확한"},{"word_id":"v0974","headword":"exaggerate","story_form":"exaggerate","form":"exaggerate","meaning_en":"make something seem bigger than it is","meaning":"과장하다"},{"word_id":"v0669","headword":"credible","story_form":"credible","form":"credible","meaning_en":"able to be believed","meaning":"믿을 만한"},{"word_id":"v0275","headword":"bias","story_form":"bias","form":"bias","meaning_en":"an unfair preference for one side","meaning":"편향, 선입견"},{"word_id":"v1942","headword":"perspective","story_form":"perspective","form":"perspective","meaning_en":"a way of thinking about something","meaning":"관점"},{"word_id":"v1775","headword":"neutral","story_form":"neutral","form":"neutral","meaning_en":"not supporting either side","meaning":"중립적인"},{"word_id":"v0571","headword":"conclude","story_form":"conclude","form":"conclude","meaning_en":"decide after considering information","meaning":"결론 내리다"},{"word_id":"v0828","headword":"distinguish","story_form":"distinguish","form":"distinguish","meaning_en":"recognize the difference between things","meaning":"구별하다"}],"english":["During lunch, Mina reads a **rumor** that the school is closing the music club.","The message does not **reveal** who wrote it.","“Is this **accurate**?” she asks Jun.","“People sometimes **exaggerate**, so we need a **credible** source,” he says.","“Our own **bias** may affect us; let's hear the teacher's **perspective** too.”","They stay **neutral** and ask the teacher, who explains that the club is only changing rooms.","“We should **distinguish** facts from guesses before we **conclude** anything,” Mina says.","She shares the teacher's answer, and the worried messages stop."],"korean":["점심시간에 미나는 학교가 음악 동아리를 없앤다는 소문을 읽는다.","메시지는 누가 썼는지 밝히지 않는다.","“이거 정확한 이야기야?” 미나는 준에게 묻는다.","“사람들은 가끔 과장하니까 믿을 만한 출처가 필요해.” 준이 말한다.","“우리의 선입견이 영향을 줄 수도 있어. 선생님 관점에서도 들어 보자.”","둘은 중립적인 태도로 선생님께 여쭤보고, 동아리가 교실만 옮긴다는 설명을 듣는다.","“어떤 결론을 내리기 전에 사실과 추측을 구별해야겠네.” 미나가 말한다.","미나가 선생님의 답변을 공유하자 걱정하는 메시지가 멈춘다."]},{"id":"O003","title":"첫 해외 여행","targets":[{"word_id":"v0009","headword":"abroad","story_form":"abroad","form":"abroad","meaning_en":"in or to another country","meaning":"해외로"},{"word_id":"v1910","headword":"passport","story_form":"passport","form":"passport","meaning_en":"an official document for foreign travel","meaning":"여권"},{"word_id":"v0915","headword":"embassy","story_form":"embassy","form":"embassy","meaning_en":"a country's official office in another country","meaning":"대사관"},{"word_id":"v0694","headword":"currency","story_form":"currency","form":"currency","meaning_en":"the money used in a country","meaning":"통화"},{"word_id":"v0023","headword":"accompany","story_form":"accompany","form":"accompany","meaning_en":"go somewhere with someone","meaning":"동행하다"},{"word_id":"v1422","headword":"inquire","story_form":"inquire","form":"inquire","meaning_en":"ask for information","meaning":"문의하다"},{"word_id":"v1818","headword":"obtain","story_form":"obtain","form":"obtain","meaning_en":"get something you need","meaning":"얻다"},{"word_id":"v0146","headword":"approximate","story_form":"approximate","form":"approximate","meaning_en":"close to the exact amount","meaning":"대략적인"},{"word_id":"v2055","headword":"prior","story_form":"prior","form":"prior","meaning_en":"happening before something else","meaning":"이전의"},{"word_id":"v1874","headword":"oversea","story_form":"overseas","form":"overseas","meaning_en":"in or to a foreign country","meaning":"해외의"}],"english":["Jin will travel **abroad** for the first time, and his aunt will **accompany** him.","He checks his **passport** and reads about the local **currency**.","“Where can we **obtain** travel information?” he asks.","“We can **inquire** at the travel office,” his aunt replies.","They write down the address of their country's **embassy**.","“I have no **prior** experience with **overseas** travel,” Jin admits.","His aunt helps him work out an **approximate** budget.","Jin puts the notes in his bag and feels ready to go."],"korean":["진은 처음 해외로 여행하며, 이모가 동행할 예정이다.","그는 여권을 확인하고 현지 통화에 관해 읽는다.","“여행 정보를 어디서 얻을 수 있을까요?” 그가 묻는다.","“여행 안내소에 문의할 수 있어.” 이모가 대답한다.","둘은 자국 대사관의 주소를 적어 둔다.","“해외여행을 해 본 경험이 전혀 없어요.” 진이 털어놓는다.","이모는 그가 대략적인 예산을 계산하도록 돕는다.","진은 메모를 가방에 넣고 떠날 준비가 됐다고 느낀다."]},{"id":"O004","title":"비행기 출발 전","targets":[{"word_id":"v0004","headword":"aboard","story_form":"aboard","form":"aboard","meaning_en":"on or onto a plane or ship","meaning":"탑승하여"},{"word_id":"v1908","headword":"passenger","story_form":"passenger","form":"passenger","meaning_en":"a person traveling in a vehicle","meaning":"승객"},{"word_id":"v2675","headword":"terminal","story_form":"terminal","form":"terminal","meaning_en":"a building where travelers arrive and leave","meaning":"터미널"},{"word_id":"v0763","headword":"depart","story_form":"depart","form":"depart","meaning_en":"leave a place","meaning":"출발하다"},{"word_id":"v1043","headword":"fasten","story_form":"fasten","form":"fasten","meaning_en":"close or attach something securely","meaning":"매다, 고정하다"},{"word_id":"v1870","headword":"overhead","story_form":"overhead","form":"overhead","meaning_en":"above your head","meaning":"머리 위의"},{"word_id":"v0781","headword":"destine","story_form":"destination","form":"destination","meaning_en":"the place you are traveling to","meaning":"목적지"},{"word_id":"v0010","headword":"absent","story_form":"absent","form":"absent","meaning_en":"not present","meaning":"없는, 불참한"},{"word_id":"v0068","headword":"agency","story_form":"agency","form":"agency","meaning_en":"a business providing a particular service","meaning":"대행사"},{"word_id":"v1873","headword":"overnight","story_form":"overnight","form":"overnight","meaning_en":"for or during the night","meaning":"하룻밤 동안"}],"english":["At the airport **terminal**, our travel **agency** sends us a new message.","One **passenger** is **absent**, so our group leader counts us again.","“Will we **depart** late?” I ask.","“No, he is staying **overnight** here and taking tomorrow's flight,” she explains.","We go **aboard** and find our seats.","“Put your bag in the **overhead** space and **fasten** your seat belt,” Dad says.","I check our **destination** on the screen one last time.","Then I sit back and watch the city grow smaller below us."],"korean":["공항 터미널에서 여행사가 우리에게 새 메시지를 보낸다.","승객 한 명이 없어 인솔자가 우리 인원을 다시 센다.","“늦게 출발하나요?” 내가 묻는다.","“아니, 그분은 여기서 하룻밤 묵고 내일 비행기를 타실 거야.” 인솔자가 설명한다.","우리는 탑승해서 자리를 찾는다.","“가방을 머리 위 수납공간에 넣고 안전띠를 매렴.” 아빠가 말한다.","나는 화면에서 목적지를 마지막으로 확인한다.","그러고는 편히 앉아 아래로 도시가 작아지는 모습을 본다."]},{"id":"O005","title":"섬으로 가는 배","targets":[{"word_id":"v1059","headword":"ferry","story_form":"ferry","form":"ferry","meaning_en":"a boat carrying people across water","meaning":"연락선"},{"word_id":"v1038","headword":"fare","story_form":"fare","form":"fare","meaning_en":"money paid for a journey","meaning":"운임"},{"word_id":"v1282","headword":"harbor","story_form":"harbor","form":"harbor","meaning_en":"a sheltered place for boats","meaning":"항구"},{"word_id":"v0115","headword":"anchor","story_form":"anchor","form":"anchor","meaning_en":"a heavy object keeping a boat in place","meaning":"닻"},{"word_id":"v0672","headword":"crew","story_form":"crew","form":"crew","meaning_en":"the people working on a ship","meaning":"승무원들"},{"word_id":"v0684","headword":"cruise","story_form":"cruise","form":"cruise","meaning_en":"a boat trip for pleasure","meaning":"유람선 여행"},{"word_id":"v2867","headword":"vessel","story_form":"vessel","form":"vessel","meaning_en":"a ship or large boat","meaning":"선박"},{"word_id":"v1262","headword":"gulf","story_form":"gulf","form":"gulf","meaning_en":"a large area of sea partly enclosed by land","meaning":"만"},{"word_id":"v1339","headword":"horizon","story_form":"horizon","form":"horizon","meaning_en":"the line where sky seems to meet sea","meaning":"수평선"},{"word_id":"v0344","headword":"breeze","story_form":"breeze","form":"breeze","meaning_en":"a light wind","meaning":"산들바람"}],"english":["At the **harbor**, we buy tickets for a **ferry** across the **gulf**.","“Is the **fare** the same for children?” I ask.","A member of the **crew** shows me the lower price.","A large **vessel** nearby raises its **anchor**.","“Is that our boat?” I ask Dad.","“No, that one is leaving on a long **cruise**,” he says.","On our little boat, a cool **breeze** touches my face.","I watch the **horizon** until our island comes into view."],"korean":["항구에서 우리는 만을 가로지르는 연락선 표를 산다.","“아이도 운임이 같나요?” 내가 묻는다.","승무원 한 명이 내게 더 낮은 요금을 보여 준다.","근처의 큰 선박이 닻을 올린다.","“저게 우리 배예요?” 내가 아빠에게 묻는다.","“아니, 저 배는 긴 유람선 여행을 떠나는 거야.” 아빠가 말한다.","우리의 작은 배에서 시원한 산들바람이 내 얼굴에 닿는다.","나는 섬이 보일 때까지 수평선을 바라본다."]},{"id":"O006","title":"멈춰 버린 자동차","targets":[{"word_id":"v1184","headword":"gasoline","story_form":"gasoline","form":"gasoline","meaning_en":"a liquid fuel used in cars","meaning":"휘발유"},{"word_id":"v1160","headword":"fuel","story_form":"fuel","form":"fuel","meaning_en":"something burned to produce energy","meaning":"연료"},{"word_id":"v1654","headword":"mechanic","story_form":"mechanic","form":"mechanic","meaning_en":"a person who repairs machines","meaning":"정비사"},{"word_id":"v0790","headword":"device","story_form":"device","form":"device","meaning_en":"a tool made for a particular purpose","meaning":"장치"},{"word_id":"v1655","headword":"mechanism","story_form":"mechanism","form":"mechanism","meaning_en":"parts that work together to do something","meaning":"작동 장치"},{"word_id":"v1543","headword":"leak","story_form":"leak","form":"leak","meaning_en":"a hole that lets liquid or gas escape","meaning":"새는 구멍, 누출 부위"},{"word_id":"v0017","headword":"accelerate","story_form":"accelerate","form":"accelerate","meaning_en":"increase speed","meaning":"속도를 높이다"},{"word_id":"v1272","headword":"halt","story_form":"halt","form":"halt","meaning_en":"stop moving","meaning":"멈추다"},{"word_id":"v2801","headword":"tube","story_form":"tube","form":"tube","meaning_en":"a long hollow object","meaning":"관"},{"word_id":"v0043","headword":"adjust","story_form":"adjust","form":"adjust","meaning_en":"change something slightly to make it work better","meaning":"조정하다"}],"english":["Our car begins to shake when Dad tries to **accelerate**.","He finds a safe place to **halt** and calls a **mechanic**.","“Are we out of **gasoline**?” I ask.","“There is enough **fuel**, but something else is wrong,” Dad says.","At the repair shop, a worker uses a small **device** to check the engine.","“There is a **leak** in this air **tube**,” she explains.","She replaces it and checks the **mechanism** before she starts to **adjust** anything else.","The engine sounds normal again, and we continue our trip."],"korean":["아빠가 속도를 높이려 하자 차가 흔들리기 시작한다.","아빠는 안전하게 멈출 곳을 찾아 정비사에게 전화한다.","“휘발유가 다 떨어졌어요?” 내가 묻는다.","“연료는 충분하지만 다른 문제가 있구나.” 아빠가 말한다.","정비소에서 직원이 작은 장치로 엔진을 점검한다.","“이 공기관에 새는 곳이 있어요.” 직원이 설명한다.","직원은 관을 교체하고 다른 부분을 조정하기 전에 작동 장치를 확인한다.","엔진 소리가 다시 정상으로 돌아와 우리는 여행을 계속한다."]},{"id":"O007","title":"작은 여관의 손님","targets":[{"word_id":"v1418","headword":"inn","story_form":"inn","form":"inn","meaning_en":"a small place offering rooms for travelers","meaning":"작은 여관"},{"word_id":"v0022","headword":"accommodate","story_form":"accommodate","form":"accommodate","meaning_en":"provide a place for someone to stay","meaning":"숙박시키다"},{"word_id":"v1343","headword":"host","story_form":"host","form":"host","meaning_en":"a person who welcomes guests","meaning":"주인, 손님을 맞는 사람"},{"word_id":"v0421","headword":"cater","story_form":"cater","form":"cater","meaning_en":"provide food for people","meaning":"음식을 제공하다"},{"word_id":"v0807","headword":"dine","story_form":"dine","form":"dine","meaning_en":"eat a meal","meaning":"식사하다"},{"word_id":"v2593","headword":"suite","story_form":"suite","form":"suite","meaning_en":"a set of connected hotel rooms","meaning":"스위트룸"},{"word_id":"v1609","headword":"luxury","story_form":"luxury","form":"luxury","meaning_en":"something comfortable but not necessary","meaning":"호사, 사치"},{"word_id":"v1557","headword":"leisure","story_form":"leisure","form":"leisure","meaning_en":"free time for rest or enjoyment","meaning":"여가"},{"word_id":"v0200","headword":"await","story_form":"await","form":"await","meaning_en":"wait for something","meaning":"기다리다"},{"word_id":"v1239","headword":"grateful","story_form":"grateful","form":"grateful","meaning_en":"feeling thankful","meaning":"고마워하는"}],"english":["We reach a small **inn** as the sun goes down.","“Can you **accommodate** three people?” Mom asks the **host**.","“Yes, our family **suite** is free,” he says.","The extra space feels like a **luxury** after our long trip.","“We also **cater** for guests, so you can **dine** downstairs.”","We sit by the window and **await** our hot soup.","“At last, some **leisure** time,” Dad says, putting away his phone.","We are **grateful** for a quiet meal and a warm place to sleep."],"korean":["해가 질 무렵 우리는 작은 여관에 도착한다.","“세 명이 묵을 수 있을까요?” 엄마가 주인에게 묻는다.","“네, 가족용 스위트룸이 비어 있어요.” 주인이 말한다.","긴 여행을 마친 우리에게 넓은 공간은 호사처럼 느껴진다.","“손님들께 음식도 제공하니 아래층에서 식사하실 수 있어요.”","우리는 창가에 앉아 따뜻한 수프를 기다린다.","“드디어 여유 시간이네.” 아빠가 휴대전화를 치우며 말한다.","우리는 조용한 식사와 따뜻한 잠자리에 고마움을 느낀다."]},{"id":"O008","title":"새집 꾸미기","targets":[{"word_id":"v1349","headword":"household","story_form":"household","form":"household","meaning_en":"the people living together in a home","meaning":"한집에 사는 사람들"},{"word_id":"v1448","headword":"interior","story_form":"interior","form":"interior","meaning_en":"the inside of a building","meaning":"실내"},{"word_id":"v1169","headword":"furnish","story_form":"furnish","form":"furnish","meaning_en":"provide a room with furniture","meaning":"가구를 갖추다"},{"word_id":"v0957","headword":"estate","story_form":"estate","form":"estate","meaning_en":"a large area of property or housing","meaning":"주택 단지"},{"word_id":"v1547","headword":"lease","story_form":"lease","form":"lease","meaning_en":"an agreement to rent property","meaning":"임대 계약"},{"word_id":"v2668","headword":"tenant","story_form":"tenant","form":"tenant","meaning_en":"a person who rents a home","meaning":"세입자"},{"word_id":"v2580","headword":"suburb","story_form":"suburb","form":"suburb","meaning_en":"an area outside a city's center","meaning":"교외"},{"word_id":"v2209","headword":"reside","story_form":"reside","form":"reside","meaning_en":"live in a place","meaning":"거주하다"},{"word_id":"v2848","headword":"vacuum","story_form":"vacuum","form":"vacuum","meaning_en":"clean using a machine that sucks up dust","meaning":"진공청소기로 청소하다"},{"word_id":"v1534","headword":"laundry","story_form":"laundry","form":"laundry","meaning_en":"clothes that need washing","meaning":"세탁물"}],"english":["Our **household** is moving to a housing **estate** in a quiet **suburb**.","Mom reads the **lease** before becoming a **tenant**.","“Will we **reside** here for a whole year?” I ask.","“That is the plan,” she says, opening the door.","The **interior** is empty, so we need to **furnish** the rooms.","“I can **vacuum** first,” I offer.","My brother carries the **laundry** to the little washing area.","By evening, our old table makes the new place feel like home."],"korean":["우리 가족은 조용한 교외의 주택 단지로 이사한다.","엄마는 세입자가 되기 전에 임대 계약서를 읽는다.","“여기서 일 년 내내 살게 되나요?” 내가 묻는다.","“그럴 계획이야.” 엄마가 문을 열며 말한다.","실내가 비어 있어 방에 가구를 갖춰야 한다.","“제가 먼저 진공청소기로 청소할게요.” 내가 나선다.","동생은 작은 세탁 공간으로 세탁물을 옮긴다.","저녁이 되자 우리가 쓰던 식탁 덕분에 새집이 우리 집처럼 느껴진다."]},{"id":"O009","title":"오래된 집 수리","targets":[{"word_id":"v1274","headword":"hammer","story_form":"hammer","form":"hammer","meaning_en":"a tool used to hit nails","meaning":"망치"},{"word_id":"v2322","headword":"screw","story_form":"screw","form":"screw","meaning_en":"a metal fastener with a spiral edge","meaning":"나사"},{"word_id":"v1517","headword":"ladder","story_form":"ladder","form":"ladder","meaning_en":"a tool with steps for climbing","meaning":"사다리"},{"word_id":"v2726","headword":"timber","story_form":"timber","form":"timber","meaning_en":"wood prepared for building","meaning":"건축용 목재"},{"word_id":"v0597","headword":"construct","story_form":"construct","form":"construct","meaning_en":"build something","meaning":"건설하다"},{"word_id":"v0572","headword":"concrete","story_form":"concrete","form":"concrete","meaning_en":"a hard building material made with cement","meaning":"콘크리트"},{"word_id":"v0950","headword":"erect","story_form":"erect","form":"erect","meaning_en":"put up a building or structure","meaning":"세우다"},{"word_id":"v0859","headword":"drain","story_form":"drain","form":"drain","meaning_en":"a pipe carrying unwanted water away","meaning":"배수관"},{"word_id":"v0710","headword":"damp","story_form":"damp","form":"damp","meaning_en":"slightly wet","meaning":"축축한"},{"word_id":"v2220","headword":"restore","story_form":"restore","form":"restore","meaning_en":"return something to good condition","meaning":"복구하다"}],"english":["We help **restore** an old garden house with a **damp** floor.","A worker clears the blocked **drain** before checking the walls.","“Will you **construct** a new floor?” I ask.","“Yes, with **concrete**, and we will **erect** a small roof outside.”","He measures the **timber** while another worker climbs a **ladder**.","“Is this a nail or a **screw**?” my sister asks.","“A nail; I need a **hammer** for that one,” he answers.","We stay clear of the tools and bring everyone water."],"korean":["우리는 바닥이 축축한 오래된 정원 오두막을 복구하는 일을 돕는다.","작업자가 벽을 점검하기 전에 막힌 배수관을 뚫는다.","“새 바닥을 만드실 건가요?” 내가 묻는다.","“그래, 콘크리트로 만들고 밖에는 작은 지붕을 세울 거야.”","다른 작업자가 사다리에 오르는 동안 그는 목재를 잰다.","“이건 못인가요, 나사인가요?” 여동생이 묻는다.","“못이야. 그걸 박으려면 망치가 필요하지.” 그가 대답한다.","우리는 공구에서 떨어져 있으면서 모두에게 물을 가져다준다."]},{"id":"O010","title":"사라진 소포","targets":[{"word_id":"v2903","headword":"warehouse","story_form":"warehouse","form":"warehouse","meaning_en":"a building for storing goods","meaning":"창고"},{"word_id":"v2226","headword":"retail","story_form":"retail","form":"retail","meaning_en":"selling goods directly to customers","meaning":"소매"},{"word_id":"v0540","headword":"commodity","story_form":"commodity","form":"commodity","meaning_en":"a product that can be bought and sold","meaning":"상품"},{"word_id":"v0361","headword":"bulk","story_form":"bulk","form":"bulk","meaning_en":"a large quantity bought together","meaning":"대량"},{"word_id":"v0366","headword":"bundle","story_form":"bundle","form":"bundle","meaning_en":"things tied or packed together","meaning":"묶음"},{"word_id":"v2283","headword":"sack","story_form":"sack","form":"sack","meaning_en":"a large strong bag","meaning":"자루"},{"word_id":"v2152","headword":"receipt","story_form":"receipt","form":"receipt","meaning_en":"a paper showing that you paid","meaning":"영수증"},{"word_id":"v0654","headword":"coupon","story_form":"coupon","form":"coupon","meaning_en":"a ticket giving a lower price","meaning":"할인권"},{"word_id":"v0226","headword":"bargain","story_form":"bargain","form":"bargain","meaning_en":"something bought at a good low price","meaning":"싸게 산 물건"},{"word_id":"v2770","headword":"transact","story_form":"transact","form":"transact","meaning_en":"carry out a business deal","meaning":"거래하다"}],"english":["At a **retail** shop, we buy a **bundle** of cloth with a **coupon**.","“What a **bargain**!” Mom says, but the wrong **sack** arrives at our home.","She finds the **receipt** and calls the shop's **warehouse**.","“We order cloth in **bulk**, so several bags look alike,” a worker explains.","He checks the number written beside each **commodity** on his list.","“Do we need to **transact** any more business?” Mom asks.","“No, we will exchange the bag without another payment.”","The correct cloth arrives the next morning, ready for our curtains."],"korean":["소매점에서 우리는 할인권으로 천 한 묶음을 산다.","“정말 싸게 샀네!” 엄마가 말하지만 집에는 다른 자루가 도착한다.","엄마는 영수증을 찾아 그 가게의 창고에 전화한다.","“저희가 천을 대량으로 주문해서 비슷한 자루가 여러 개 있어요.” 직원이 설명한다.","직원은 목록의 각 상품 옆에 적힌 번호를 확인한다.","“거래 절차를 더 진행해야 하나요?” 엄마가 묻는다.","“아니요, 추가 결제 없이 자루를 바꿔 드리겠습니다.”","다음 날 아침, 커튼을 만들 알맞은 천이 도착한다."]},{"id":"O011","title":"작은 가게의 시작","targets":[{"word_id":"v0938","headword":"enterprise","story_form":"enterprise","form":"enterprise","meaning_en":"a business or organized project","meaning":"사업"},{"word_id":"v2860","headword":"venture","story_form":"venture","form":"venture","meaning_en":"a new business involving risk","meaning":"모험적인 사업"},{"word_id":"v1670","headword":"merchant","story_form":"merchant","form":"merchant","meaning_en":"a person who buys and sells goods","meaning":"상인"},{"word_id":"v0034","headword":"acquire","story_form":"acquire","form":"acquire","meaning_en":"get or buy something","meaning":"취득하다"},{"word_id":"v0171","headword":"asset","story_form":"asset","form":"asset","meaning_en":"something valuable owned by a business","meaning":"자산"},{"word_id":"v0223","headword":"bankrupt","story_form":"bankrupt","form":"bankrupt","meaning_en":"unable to pay debts","meaning":"파산한"},{"word_id":"v0743","headword":"deficit","story_form":"deficit","form":"deficit","meaning_en":"the amount by which spending exceeds income","meaning":"적자"},{"word_id":"v2086","headword":"prosper","story_form":"prosper","form":"prosper","meaning_en":"grow and become successful","meaning":"번창하다"},{"word_id":"v2805","headword":"turnover","story_form":"turnover","form":"turnover","meaning_en":"the total sales of a business","meaning":"매출액"},{"word_id":"v1249","headword":"gross","story_form":"gross","form":"gross","meaning_en":"total before costs are taken away","meaning":"총액의"}],"english":["My uncle starts a small **enterprise** selling used books.","A friendly **merchant** helps him **acquire** his first books.","“Will this **venture** make us rich?” I ask.","“First, we must avoid going **bankrupt**,” he says with a smile.","Our early costs leave a **deficit**, but the books are still a useful **asset**.","“Our **gross** income is our **turnover**, before we take away costs,” he explains.","I help him record each sale instead of guessing our profit.","As more readers visit, the shop begins to **prosper**."],"korean":["삼촌이 중고책을 파는 작은 사업을 시작한다.","친절한 상인이 그가 첫 책들을 구입하도록 돕는다.","“이 사업으로 부자가 될까요?” 내가 묻는다.","“먼저 파산하지 않도록 해야지.” 삼촌이 웃으며 말한다.","초기 비용 때문에 적자가 나지만, 책은 여전히 유용한 자산이다.","“비용을 빼기 전 총수입이 매출액이야.” 삼촌이 설명한다.","나는 이익을 추측하는 대신 판매 내역을 하나씩 기록하도록 돕는다.","독자가 더 많이 찾아오면서 가게가 번창하기 시작한다."]},{"id":"O012","title":"바뀌는 회사","targets":[{"word_id":"v0635","headword":"corporate","story_form":"corporate","form":"corporate","meaning_en":"related to a company","meaning":"회사의"},{"word_id":"v0985","headword":"executive","story_form":"executive","form":"executive","meaning_en":"a senior manager in a business","meaning":"경영진, 임원"},{"word_id":"v0523","headword":"colleague","story_form":"colleague","form":"colleague","meaning_en":"a person you work with","meaning":"동료"},{"word_id":"v1295","headword":"headquarters","story_form":"headquarters","form":"headquarters","meaning_en":"the main office of an organization","meaning":"본사"},{"word_id":"v1317","headword":"hierarchy","story_form":"hierarchy","form":"hierarchy","meaning_en":"a system of levels of authority","meaning":"위계 체계"},{"word_id":"v2210","headword":"resign","story_form":"resign","form":"resign","meaning_en":"officially leave a job","meaning":"사임하다"},{"word_id":"v1672","headword":"merge","story_form":"merge","form":"merge","meaning_en":"join together into one","meaning":"합병하다"},{"word_id":"v2167","headword":"reform","story_form":"reform","form":"reform","meaning_en":"change something to improve it","meaning":"개혁하다"},{"word_id":"v0044","headword":"administer","story_form":"administration","form":"administration","meaning_en":"the work of managing an organization","meaning":"행정, 관리"},{"word_id":"v0035","headword":"acquisition","story_form":"acquisition","form":"acquisition","meaning_en":"the purchase of one company by another","meaning":"인수"}],"english":["Mom's **colleague** visits us after a meeting at **headquarters**.","They discuss a change in **corporate** plans.","“Will the two companies **merge**?” I ask.","“No, it is an **acquisition**; our company is buying the smaller one,” Mom says.","One **executive** will **resign**, and others will share the work.","“We also need to **reform** the **administration**,” her colleague adds.","They draw a new **hierarchy** to show who will report to whom.","I see that buying a company is only the start of the work."],"korean":["엄마의 동료가 본사 회의를 마치고 우리 집에 온다.","두 사람은 회사 계획의 변화에 관해 이야기한다.","“두 회사가 합병하나요?” 내가 묻는다.","“아니, 인수야. 우리 회사가 작은 회사를 사는 거지.” 엄마가 말한다.","임원 한 명이 사임하고 다른 사람들이 일을 나눌 예정이다.","“관리 체계도 개선해야 해요.” 동료가 덧붙인다.","둘은 누가 누구에게 보고할지 보여 주는 새로운 조직 체계를 그린다.","나는 회사를 사는 것이 일의 시작일 뿐임을 알게 된다."]},{"id":"O013","title":"내 발명품","targets":[{"word_id":"v1420","headword":"innovate","story_form":"innovate","form":"innovate","meaning_en":"create a new way of doing something","meaning":"혁신하다"},{"word_id":"v1914","headword":"patent","story_form":"patent","form":"patent","meaning_en":"an official right protecting an invention","meaning":"특허"},{"word_id":"v0566","headword":"conceive","story_form":"conceive","form":"conceive","meaning_en":"think of a new idea","meaning":"생각해 내다"},{"word_id":"v0558","headword":"component","story_form":"component","form":"component","meaning_en":"one part of a machine or system","meaning":"부품"},{"word_id":"v0168","headword":"assemble","story_form":"assemble","form":"assemble","meaning_en":"put parts together","meaning":"조립하다"},{"word_id":"v0548","headword":"compatible","story_form":"compatible","form":"compatible","meaning_en":"able to work well together","meaning":"호환되는"},{"word_id":"v1706","headword":"modify","story_form":"modify","form":"modify","meaning_en":"change something to improve it","meaning":"수정하다"},{"word_id":"v1397","headword":"incorporate","story_form":"incorporate","form":"incorporate","meaning_en":"include something as part of a whole","meaning":"포함하다"},{"word_id":"v1093","headword":"flaw","story_form":"flaw","form":"flaw","meaning_en":"a mistake or weakness","meaning":"결함"},{"word_id":"v0792","headword":"devise","story_form":"devise","form":"devise","meaning_en":"plan or invent a solution","meaning":"고안하다"}],"english":["Our club wants to **innovate** by making a better plant-watering tool.","We **conceive** a simple design and **devise** a way to test it.","“Can we **incorporate** this old bottle?” I ask.","“Yes, but every **component** must be **compatible**,” Mina says.","We **assemble** the parts and find a **flaw**: too much water comes out.","“Let's **modify** the opening before talking about a **patent**,” our teacher suggests.","We make it smaller and try again with a dry pot.","This time, the soil becomes wet slowly, just as we planned."],"korean":["우리 동아리는 더 나은 식물 급수 도구를 만들어 혁신하고 싶다.","우리는 간단한 설계를 생각해 내고 시험 방법을 고안한다.","“이 오래된 병도 넣어 쓸 수 있을까?” 내가 묻는다.","“응, 하지만 모든 부품이 서로 맞아야 해.” 미나가 말한다.","부품을 조립하자 물이 너무 많이 나오는 결함을 발견한다.","“특허 이야기를 하기 전에 구멍을 수정해 보자.” 선생님이 제안한다.","우리는 구멍을 줄이고 마른 화분으로 다시 시험한다.","이번에는 계획대로 흙이 천천히 젖는다."]},{"id":"O014","title":"컴퓨터가 멈춘 날","targets":[{"word_id":"v0905","headword":"electronic","story_form":"electronic","form":"electronic","meaning_en":"using electrical circuits","meaning":"전자의"},{"word_id":"v1430","headword":"install","story_form":"install","form":"install","meaning_en":"put software or equipment in place","meaning":"설치하다"},{"word_id":"v1421","headword":"input","story_form":"input","form":"input","meaning_en":"information entered into a computer","meaning":"입력"},{"word_id":"v1863","headword":"output","story_form":"output","form":"output","meaning_en":"information produced by a computer","meaning":"출력"},{"word_id":"v0717","headword":"database","story_form":"database","form":"database","meaning_en":"an organized collection of information","meaning":"데이터베이스"},{"word_id":"v0719","headword":"datum","story_form":"data","form":"data","meaning_en":"facts collected for use or study","meaning":"자료, 데이터"},{"word_id":"v0749","headword":"delete","story_form":"delete","form":"delete","meaning_en":"remove stored information","meaning":"삭제하다"},{"word_id":"v1424","headword":"insert","story_form":"insert","form":"insert","meaning_en":"put something into something else","meaning":"삽입하다"},{"word_id":"v2836","headword":"update","story_form":"update","form":"update","meaning_en":"bring something up to date","meaning":"갱신하다"},{"word_id":"v1705","headword":"mode","story_form":"mode","form":"mode","meaning_en":"a particular way a device works","meaning":"작동 방식, 모드"}],"english":["We use an **electronic** sign to show our club's meeting times.","After we **install** an **update**, the screen goes blank.","“Did we **delete** the **data**?” I ask.","“No, the **database** is safe,” our teacher says.","She checks our **input** and the screen's **output**.","“We need to **insert** the correct date and leave test **mode**.”","I follow her instructions, and our meeting list appears.","We check every date before putting the sign by the door."],"korean":["우리는 전자 안내판으로 동아리 모임 시간을 보여 준다.","업데이트를 설치한 뒤 화면이 꺼진다.","“데이터를 삭제한 건가요?” 내가 묻는다.","“아니, 데이터베이스는 안전해.” 선생님이 말한다.","선생님은 입력한 정보와 화면 출력을 확인한다.","“정확한 날짜를 넣고 시험 모드에서 나와야 해.”","내가 지시를 따르자 모임 목록이 나타난다.","우리는 문 옆에 안내판을 놓기 전에 모든 날짜를 확인한다."]},{"id":"O015","title":"친구의 정보","targets":[{"word_id":"v1774","headword":"network","story_form":"network","form":"network","meaning_en":"a group of connected computers","meaning":"네트워크"},{"word_id":"v0845","headword":"domain","story_form":"domain","form":"domain","meaning_en":"the name identifying a website","meaning":"도메인"},{"word_id":"v0590","headword":"consent","story_form":"consent","form":"consent","meaning_en":"permission freely given","meaning":"동의"},{"word_id":"v1556","headword":"legitimate","story_form":"legitimate","form":"legitimate","meaning_en":"real and allowed by the rules","meaning":"정당한, 합법적인"},{"word_id":"v2222","headword":"restrict","story_form":"restrict","form":"restrict","meaning_en":"limit what someone can do","meaning":"제한하다"},{"word_id":"v1008","headword":"external","story_form":"external","form":"external","meaning_en":"coming from outside","meaning":"외부의"},{"word_id":"v2303","headword":"scan","story_form":"scan","form":"scan","meaning_en":"check something carefully with a tool","meaning":"검사하다"},{"word_id":"v2882","headword":"virus","story_form":"virus","form":"virus","meaning_en":"harmful software that can spread","meaning":"컴퓨터 바이러스"},{"word_id":"v0959","headword":"ethic","story_form":"ethical","form":"ethical","meaning_en":"following ideas about right and wrong","meaning":"윤리적인"},{"word_id":"v1938","headword":"permanent","story_form":"permanent","form":"permanent","meaning_en":"lasting without a planned end","meaning":"영구적인"}],"english":["A message on our school **network** asks for my friend's photograph.","The **domain** is unfamiliar, so I ask our teacher about this **external** request.","“Is it **legitimate**?” I ask.","“We must check, and sharing without her **consent** would not be **ethical**,” she says.","She uses the school's tools to **scan** the message for a **virus**.","“Online sharing can leave a **permanent** record,” she reminds me.","We **restrict** access to the class photo folder.","I tell my friend about the message instead of sending her picture."],"korean":["학교 네트워크의 한 메시지가 내 친구의 사진을 요구한다.","도메인이 낯설어 나는 이 외부 요청을 선생님께 여쭤본다.","“정당한 요청인가요?” 내가 묻는다.","“확인해야 하고, 친구의 동의 없이 공유하는 것은 윤리적이지 않아.” 선생님이 말한다.","선생님은 학교 도구로 메시지에 바이러스가 있는지 검사한다.","“온라인 공유는 영구적인 기록을 남길 수 있어.” 선생님이 알려 준다.","우리는 학급 사진 폴더에 대한 접근을 제한한다.","나는 사진을 보내는 대신 친구에게 그 메시지를 알려 준다."]},{"id":"O016","title":"새로운 뉴스","targets":[{"word_id":"v0352","headword":"broadcast","story_form":"broadcast","form":"broadcast","meaning_en":"send a program to many people","meaning":"방송하다"},{"word_id":"v1661","headword":"medium","story_form":"media","form":"media","meaning_en":"organizations that provide news and information","meaning":"언론, 매체"},{"word_id":"v0431","headword":"censor","story_form":"censor","form":"censor","meaning_en":"remove information before it is made public","meaning":"검열하다"},{"word_id":"v1030","headword":"false","story_form":"false","form":"false","meaning_en":"not true","meaning":"거짓의"},{"word_id":"v0829","headword":"distort","story_form":"distort","form":"distort","meaning_en":"change information in a misleading way","meaning":"왜곡하다"},{"word_id":"v0482","headword":"cite","story_form":"cite","form":"cite","meaning_en":"mention a source as evidence","meaning":"인용하다"},{"word_id":"v0615","headword":"controversy","story_form":"controversy","form":"controversy","meaning_en":"a strong public disagreement","meaning":"논란"},{"word_id":"v0136","headword":"apparent","story_form":"apparent","form":"apparent","meaning_en":"seeming clear but possibly not real","meaning":"겉으로 보이는"},{"word_id":"v2039","headword":"presume","story_form":"presume","form":"presume","meaning_en":"believe something without enough proof","meaning":"추정하다"},{"word_id":"v0480","headword":"circulate","story_form":"circulate","form":"circulate","meaning_en":"spread among people","meaning":"유포되다"}],"english":["A short video begins to **circulate**, and several **media** groups discuss it.","Its **apparent** message causes a **controversy** at school.","“Should we **broadcast** it on our school channel?” I ask.","“Do not **presume** it tells the whole story,” our teacher says.","We find that the short clip can **distort** what the speaker meant.","“Checking a **false** claim is different from trying to **censor** an opinion,” she explains.","We **cite** the full video and explain what was missing.","Our report gives classmates enough information to think for themselves."],"korean":["짧은 영상이 퍼지기 시작하고 여러 언론 매체가 이를 다룬다.","겉으로 드러난 내용 때문에 학교에서 논란이 생긴다.","“학교 채널로 방송할까요?” 내가 묻는다.","“이게 이야기 전체를 보여 준다고 단정하지 마.” 선생님이 말한다.","우리는 짧은 영상이 발언자의 뜻을 왜곡할 수 있음을 발견한다.","“거짓 주장을 확인하는 것과 의견을 검열하려는 것은 달라.” 선생님이 설명한다.","우리는 전체 영상을 출처로 제시하고 빠진 내용을 설명한다.","우리 보도는 친구들이 스스로 생각할 만큼 충분한 정보를 제공한다."]},{"id":"O017","title":"신문 동아리","targets":[{"word_id":"v1485","headword":"journal","story_form":"journal","form":"journal","meaning_en":"a regularly published collection of writing","meaning":"정기 간행물"},{"word_id":"v0194","headword":"author","story_form":"author","form":"author","meaning_en":"the person who wrote something","meaning":"저자"},{"word_id":"v2098","headword":"publish","story_form":"publish","form":"publish","meaning_en":"make writing available to readers","meaning":"발행하다"},{"word_id":"v0630","headword":"copyright","story_form":"copyright","form":"copyright","meaning_en":"the right to control copying of a work","meaning":"저작권"},{"word_id":"v0857","headword":"draft","story_form":"draft","form":"draft","meaning_en":"an early version of writing","meaning":"초고"},{"word_id":"v2234","headword":"revise","story_form":"revise","form":"revise","meaning_en":"change writing to improve it","meaning":"수정하다"},{"word_id":"v1130","headword":"format","story_form":"format","form":"format","meaning_en":"the way information is arranged","meaning":"형식"},{"word_id":"v0528","headword":"column","story_form":"column","form":"column","meaning_en":"a regular section in a publication","meaning":"고정 칼럼"},{"word_id":"v2181","headword":"relevant","story_form":"relevant","form":"relevant","meaning_en":"connected to the subject","meaning":"관련 있는"},{"word_id":"v0552","headword":"compile","story_form":"compile","form":"compile","meaning_en":"collect information into one work","meaning":"엮다"}],"english":["Our class plans to **publish** a small **journal** about school life.","I write a **draft** for the food **column**.","“Can I use this picture?” I ask its **author** in an email.","Our teacher reminds us to respect **copyright**.","“Keep only the **relevant** details when you **revise**,” she says.","We choose one **format** and **compile** everyone's work.","The artist gives permission, so we add her name below the picture.","At lunch, our first readers laugh at a story about burnt toast."],"korean":["우리 반은 학교생활을 다룬 작은 정기 간행물을 발행하려 한다.","나는 음식 칼럼의 초고를 쓴다.","“이 그림을 사용해도 될까요?” 나는 이메일로 원작자에게 묻는다.","선생님은 저작권을 존중하라고 알려 주신다.","“수정할 때는 관련 있는 세부 내용만 남겨.” 선생님이 말한다.","우리는 하나의 형식을 정하고 모두의 작품을 엮는다.","그림 작가가 허락해서 우리는 그림 아래에 이름을 넣는다.","점심시간에 첫 독자들이 탄 토스트 이야기를 읽으며 웃는다."]},{"id":"O018","title":"도서관의 발견","targets":[{"word_id":"v1803","headword":"novel","story_form":"novel","form":"novel","meaning_en":"a long book telling an invented story","meaning":"소설"},{"word_id":"v1065","headword":"fiction","story_form":"fiction","form":"fiction","meaning_en":"stories about invented people and events","meaning":"허구 문학"},{"word_id":"v1584","headword":"literature","story_form":"literature","form":"literature","meaning_en":"written works valued as art","meaning":"문학"},{"word_id":"v0282","headword":"biography","story_form":"biography","form":"biography","meaning_en":"the story of a real person's life","meaning":"전기"},{"word_id":"v1752","headword":"narrate","story_form":"narrate","form":"narrate","meaning_en":"tell a story","meaning":"이야기를 서술하다"},{"word_id":"v1983","headword":"plot","story_form":"plot","form":"plot","meaning_en":"the main events of a story","meaning":"줄거리"},{"word_id":"v2862","headword":"verse","story_form":"verse","form":"verse","meaning_en":"writing arranged in poetic lines","meaning":"운문"},{"word_id":"v1907","headword":"passage","story_form":"passage","form":"passage","meaning_en":"a short part of a written work","meaning":"글의 한 대목"},{"word_id":"v1856","headword":"origin","story_form":"origin","form":"origin","meaning_en":"where something began","meaning":"기원"},{"word_id":"v0193","headword":"authentic","story_form":"authentic","form":"authentic","meaning_en":"real and not an imitation","meaning":"진짜의"}],"english":["At the library, I choose a **novel** about a young sailor.","“Is this a **biography**?” I ask.","“No, it is **fiction**,” the librarian says, showing me the **literature** shelf.","The writer uses **verse** to **narrate** part of the journey.","I read a **passage** aloud and try to follow the **plot**.","“What is the **origin** of this sea song?” I ask.","The librarian finds an **authentic** old songbook with the same words.","I borrow both books to see how a writer can turn history into a story."],"korean":["도서관에서 나는 어린 선원에 관한 소설을 고른다.","“이건 전기인가요?” 내가 묻는다.","“아니, 허구의 이야기야.” 사서가 문학 서가를 보여 주며 말한다.","작가는 여행의 일부를 운문으로 서술한다.","나는 한 대목을 소리 내어 읽으며 줄거리를 따라가 본다.","“이 뱃노래의 기원은 무엇인가요?” 내가 묻는다.","사서는 같은 가사가 실린 진짜 옛 노래책을 찾는다.","나는 작가가 역사를 어떻게 이야기로 바꾸는지 보려고 두 책을 빌린다."]},{"id":"O019","title":"선생님의 질문","targets":[{"word_id":"v0016","headword":"academy","story_form":"academy","form":"academy","meaning_en":"a school for a special subject","meaning":"전문 학교"},{"word_id":"v1435","headword":"institute","story_form":"institute","form":"institute","meaning_en":"an organization for education or research","meaning":"교육·연구 기관"},{"word_id":"v0696","headword":"curriculum","story_form":"curriculum","form":"curriculum","meaning_en":"the subjects taught in a course","meaning":"교육 과정"},{"word_id":"v1023","headword":"faculty","story_form":"faculty","form":"faculty","meaning_en":"the teachers at a college or school","meaning":"교수진"},{"word_id":"v1550","headword":"lecture","story_form":"lecture","form":"lecture","meaning_en":"a talk teaching a subject","meaning":"강의"},{"word_id":"v2067","headword":"professor","story_form":"professor","form":"professor","meaning_en":"a senior college teacher","meaning":"교수"},{"word_id":"v2312","headword":"scholar","story_form":"scholar","form":"scholar","meaning_en":"a person who studies a subject deeply","meaning":"학자"},{"word_id":"v1441","headword":"intellect","story_form":"intellect","form":"intellect","meaning_en":"the ability to understand and reason","meaning":"지적 능력"},{"word_id":"v1237","headword":"grasp","story_form":"grasp","form":"grasp","meaning_en":"understand an idea","meaning":"이해하다"},{"word_id":"v0561","headword":"comprehend","story_form":"comprehend","form":"comprehend","meaning_en":"understand something fully","meaning":"이해하다"}],"english":["Our music **academy** visits a research **institute** for a special **lecture**.","A **professor** explains how music and the brain are connected.","“Is this part of your **curriculum**?” I ask.","“Yes, several members of our **faculty** teach it,” she says.","I cannot **grasp** her first example, so I ask again.","“A **scholar** asks questions too; learning is not a test of perfect **intellect**.”","She taps a simple rhythm, and I begin to **comprehend** the idea.","I leave with a new question written in my notebook."],"korean":["우리 음악 학교는 특별 강의를 들으러 연구 기관을 방문한다.","교수 한 분이 음악과 뇌의 관계를 설명한다.","“이것도 교육 과정에 들어 있나요?” 내가 묻는다.","“그래, 우리 교수진 중 여러 분이 가르치신단다.” 교수가 말한다.","나는 첫 예시를 이해하지 못해서 다시 묻는다.","“학자도 질문을 해. 배움은 완벽한 지적 능력을 시험하는 일이 아니야.”","교수가 간단한 리듬을 두드리자 나는 개념을 이해하기 시작한다.","나는 공책에 새로운 질문 하나를 적은 채 나선다."]},{"id":"O020","title":"진로를 찾는 날","targets":[{"word_id":"v1230","headword":"graduate","story_form":"graduate","form":"graduate","meaning_en":"finish a course of study","meaning":"졸업하다"},{"word_id":"v2890","headword":"vocation","story_form":"vocation","form":"vocation","meaning_en":"work that feels especially right for you","meaning":"천직"},{"word_id":"v0166","headword":"aspire","story_form":"aspire","form":"aspire","meaning_en":"hope strongly to achieve something","meaning":"열망하다"},{"word_id":"v0108","headword":"ambition","story_form":"ambition","form":"ambition","meaning_en":"a strong wish to achieve something","meaning":"포부"},{"word_id":"v2109","headword":"pursue","story_form":"pursue","form":"pursue","meaning_en":"work toward a goal","meaning":"추구하다"},{"word_id":"v1909","headword":"passion","story_form":"passion","form":"passion","meaning_en":"a strong love for something","meaning":"열정"},{"word_id":"v2640","headword":"talent","story_form":"talent","form":"talent","meaning_en":"a natural ability","meaning":"재능"},{"word_id":"v0998","headword":"expertise","story_form":"expertise","form":"expertise","meaning_en":"special knowledge and skill","meaning":"전문 지식"},{"word_id":"v1865","headword":"outstanding","story_form":"outstanding","form":"outstanding","meaning_en":"much better than usual","meaning":"뛰어난"},{"word_id":"v1843","headword":"opportune","story_form":"opportunity","form":"opportunity","meaning_en":"a chance to do something","meaning":"기회"}],"english":["My sister will **graduate** soon, but she has not chosen a **vocation**.","“I **aspire** to help animals,” she tells a visiting nurse from an animal clinic.","The nurse asks about her **ambition** and her **passion** for science.","“I have some **talent**, but no real **expertise** yet,” my sister says.","“You do not have to be **outstanding** on your first day.”","The nurse offers an **opportunity** to observe work at an animal clinic.","My sister decides to **pursue** that chance before making a final choice.","She comes home with many notes and a clearer idea of what she enjoys."],"korean":["언니는 곧 졸업하지만 아직 천직으로 삼을 일을 고르지 못했다.","“동물들을 돕는 사람이 되고 싶어요.” 언니는 동물병원에서 방문한 간호사에게 말한다.","간호사는 언니의 포부와 과학에 대한 열정을 묻는다.","“재능은 조금 있지만 아직 전문 지식은 없어요.” 언니가 말한다.","“첫날부터 뛰어나야 하는 건 아니란다.”","간호사는 동물병원에서 일을 관찰할 기회를 제안한다.","언니는 최종 결정을 내리기 전에 그 기회를 잡아 보기로 한다.","언니는 많은 메모와 함께 자신이 무엇을 좋아하는지 더 분명히 알고 돌아온다."]},{"id":"O021","title":"학교 토론회","targets":[{"word_id":"v0069","headword":"agenda","story_form":"agenda","form":"agenda","meaning_en":"a list of things to discuss","meaning":"의제 목록"},{"word_id":"v0748","headword":"delegate","story_form":"delegate","form":"delegate","meaning_en":"a person chosen to represent others","meaning":"대표"},{"word_id":"v0616","headword":"convene","story_form":"convene","form":"convene","meaning_en":"come together for a meeting","meaning":"회의를 열다"},{"word_id":"v0576","headword":"confer","story_form":"confer","form":"confer","meaning_en":"discuss something to make a decision","meaning":"협의하다"},{"word_id":"v0817","headword":"discourse","story_form":"discourse","form":"discourse","meaning_en":"serious discussion of a subject","meaning":"담론, 논의"},{"word_id":"v0603","headword":"contend","story_form":"contend","form":"contend","meaning_en":"argue that something is true","meaning":"주장하다"},{"word_id":"v0169","headword":"assert","story_form":"assert","form":"assert","meaning_en":"state something firmly","meaning":"단언하다"},{"word_id":"v0610","headword":"contradict","story_form":"contradict","form":"contradict","meaning_en":"say the opposite of a statement","meaning":"반박하다"},{"word_id":"v2142","headword":"rational","story_form":"rational","form":"rational","meaning_en":"based on clear thought and reasons","meaning":"합리적인"},{"word_id":"v1594","headword":"logic","story_form":"logic","form":"logic","meaning_en":"reasoning that connects ideas clearly","meaning":"논리"}],"english":["Each class sends a **delegate** to discuss school lunches.","We **convene** at four and read the **agenda**.","“I **contend** that we need more fruit,” I say.","“Can you **assert** that everyone agrees?” another student asks.","“No, and you may **contradict** me; this should be a **rational** discussion.”","We **confer** in pairs and check the **logic** behind each idea.","Our teacher calls this respectful **discourse**, and we agree to ask all the classes."],"korean":["각 반은 급식에 관해 논의할 대표를 보낸다.","우리는 네 시에 모여 의제 목록을 읽는다.","“과일이 더 필요하다고 생각합니다.” 내가 주장한다.","“모두가 동의한다고 단언할 수 있나요?” 다른 학생이 묻는다.","“아니요. 반박해도 괜찮아요. 합리적인 토론이어야 하니까요.”","우리는 짝끼리 협의하며 각 생각의 논리를 확인한다.","선생님은 이를 존중하는 논의라고 부르고, 우리는 모든 반에 물어보기로 한다."]},{"id":"O022","title":"교실의 규칙","targets":[{"word_id":"v1259","headword":"guideline","story_form":"guideline","form":"guideline","meaning_en":"advice about how to do something","meaning":"지침"},{"word_id":"v1795","headword":"norm","story_form":"norm","form":"norm","meaning_en":"a usual or accepted way of behaving","meaning":"규범"},{"word_id":"v0582","headword":"conform","story_form":"conform","form":"conform","meaning_en":"follow accepted rules or standards","meaning":"따르다"},{"word_id":"v1813","headword":"obey","story_form":"obey","form":"obey","meaning_en":"do what a rule or person says","meaning":"복종하다, 지키다"},{"word_id":"v1815","headword":"oblige","story_form":"oblige","form":"oblige","meaning_en":"require someone to do something","meaning":"의무를 지우다"},{"word_id":"v2073","headword":"prohibit","story_form":"prohibit","form":"prohibit","meaning_en":"officially say something is not allowed","meaning":"금지하다"},{"word_id":"v1119","headword":"forbid","story_form":"forbid","form":"forbid","meaning_en":"tell someone they must not do something","meaning":"금하다"},{"word_id":"v1939","headword":"permit","story_form":"permit","form":"permit","meaning_en":"allow something","meaning":"허용하다"},{"word_id":"v1388","headword":"impose","story_form":"impose","form":"impose","meaning_en":"make people accept a rule","meaning":"부과하다"},{"word_id":"v2560","headword":"strict","story_form":"strict","form":"strict","meaning_en":"requiring rules to be followed closely","meaning":"엄격한"}],"english":["Our club writes a **guideline** for using the shared art room.","“Will you **impose** **strict** rules?” one member asks.","“We need to **prohibit** unsafe actions, but we can **permit** different ideas,” I say.","Our teacher will **forbid** running near the tools.","“The rules **oblige** everyone to clean up,” she adds.","We agree to **obey** the safety rules and **conform** to this shared **norm**.","After the meeting, even the youngest member helps put the brushes away."],"korean":["우리 동아리는 공동 미술실 이용 지침을 쓴다.","“엄격한 규칙을 강요할 건가요?” 한 회원이 묻는다.","“위험한 행동은 금지해야 하지만 다양한 생각은 허용할 수 있어요.” 내가 말한다.","선생님은 공구 근처에서 뛰는 것을 금하실 것이다.","“규칙에 따라 모두가 청소할 의무가 있어.” 선생님이 덧붙인다.","우리는 안전 규칙을 지키고 이 공동 규범을 따르기로 한다.","회의가 끝나자 가장 어린 회원도 붓 정리를 돕는다."]},{"id":"O023","title":"작은 선거","targets":[{"word_id":"v0395","headword":"candidate","story_form":"candidate","form":"candidate","meaning_en":"a person seeking an elected position","meaning":"후보자"},{"word_id":"v1790","headword":"nominate","story_form":"nominate","form":"nominate","meaning_en":"officially suggest someone for a position","meaning":"후보로 추천하다"},{"word_id":"v1996","headword":"poll","story_form":"poll","form":"poll","meaning_en":"a vote or survey of opinions","meaning":"투표, 여론 조사"},{"word_id":"v2136","headword":"rank","story_form":"rank","form":"rank","meaning_en":"place things in an order","meaning":"순위를 매기다"},{"word_id":"v0676","headword":"criterion","story_form":"criterion","form":"criterion","meaning_en":"a standard used to judge something","meaning":"판단 기준"},{"word_id":"v1673","headword":"merit","story_form":"merit","form":"merit","meaning_en":"a good quality deserving recognition","meaning":"장점, 공로"},{"word_id":"v2052","headword":"principal","story_form":"principal","form":"principal","meaning_en":"the person leading a school","meaning":"교장"},{"word_id":"v1901","headword":"participate","story_form":"participate","form":"participate","meaning_en":"take part in an activity","meaning":"참여하다"},{"word_id":"v0257","headword":"behalf","story_form":"behalf","form":"behalf","meaning_en":"as the representative of someone","meaning":"~을 대표하여"},{"word_id":"v2037","headword":"preside","story_form":"preside","form":"preside","meaning_en":"lead a meeting or event","meaning":"회의를 주재하다"}],"english":["The **principal** asks our class to choose a club leader.","“I **nominate** Mina as a **candidate**,” Jun says.","Before the **poll**, we agree on one **criterion**: listening to others.","“Let's judge each person's **merit**, not just **rank** our friends,” I suggest.","Everyone can **participate**, and our teacher will **preside** over the meeting.","“I will speak on **behalf** of the whole club,” Mina promises.","After winning, she asks the other candidate to help collect everyone's ideas."],"korean":["교장 선생님은 우리 반에 동아리 대표를 뽑으라고 하신다.","“미나를 후보로 추천합니다.” 준이 말한다.","투표 전에 우리는 다른 사람의 말을 듣는 것을 판단 기준으로 정한다.","“친구들의 순위만 매기지 말고 각자의 장점을 판단하자.” 내가 제안한다.","모두가 참여할 수 있고 선생님이 회의를 주재하신다.","“동아리 전체를 대표해서 말할게요.” 미나가 약속한다.","당선된 후 미나는 다른 후보에게 모두의 의견을 모으는 일을 도와 달라고 한다."]},{"id":"O024","title":"언어 수업","targets":[{"word_id":"v1577","headword":"linguistic","story_form":"linguistic","form":"linguistic","meaning_en":"related to language","meaning":"언어의"},{"word_id":"v1452","headword":"interpret","story_form":"interpret","form":"interpret","meaning_en":"explain the meaning of something","meaning":"해석하다"},{"word_id":"v2774","headword":"translate","story_form":"translate","form":"translate","meaning_en":"express something in another language","meaning":"번역하다"},{"word_id":"v1949","headword":"phrase","story_form":"phrase","form":"phrase","meaning_en":"a small group of words","meaning":"구, 어구"},{"word_id":"v1848","headword":"oral","story_form":"oral","form":"oral","meaning_en":"spoken rather than written","meaning":"구두의"},{"word_id":"v2889","headword":"vocabulary","story_form":"vocabulary","form":"vocabulary","meaning_en":"the words someone knows or uses","meaning":"어휘"},{"word_id":"v1449","headword":"intermediate","story_form":"intermediate","form":"intermediate","meaning_en":"between beginner and advanced levels","meaning":"중급의"},{"word_id":"v0637","headword":"correspond","story_form":"correspond","form":"correspond","meaning_en":"match or have a similar meaning","meaning":"대응하다"},{"word_id":"v0619","headword":"convey","story_form":"convey","form":"convey","meaning_en":"communicate an idea or feeling","meaning":"전달하다"},{"word_id":"v2861","headword":"verb","story_form":"verb","form":"verb","meaning_en":"a word expressing an action or state","meaning":"동사"}],"english":["In our **intermediate** English class, we do an **oral** activity.","The teacher asks us to **translate** a short **phrase**.","“Does each **verb** **correspond** to just one Korean word?” I ask.","“No; **interpret** the situation before you choose your words,” she says.","We use our **vocabulary** to **convey** the speaker's worry.","“That is a **linguistic** choice, not a word puzzle,” she explains.","I try again, and this time my partner understands how the speaker feels."],"korean":["중급 영어 수업에서 우리는 말하기 활동을 한다.","선생님은 짧은 어구를 번역하라고 하신다.","“각 동사가 한국어 단어 하나에만 대응하나요?” 내가 묻는다.","“아니, 말을 고르기 전에 상황을 해석해 봐.” 선생님이 말한다.","우리는 아는 어휘를 활용해 화자의 걱정을 전달한다.","“그것은 단어 퍼즐이 아니라 언어적인 선택이야.” 선생님이 설명한다.","나는 다시 시도하고, 이번에는 짝이 화자의 감정을 이해한다."]},{"id":"O025","title":"실험실의 발견","targets":[{"word_id":"v1363","headword":"hypothesis","story_form":"hypothesis","form":"hypothesis","meaning_en":"an idea that can be tested","meaning":"가설"},{"word_id":"v0114","headword":"analyze","story_form":"analyze","form":"analyze","meaning_en":"study parts carefully to understand a whole","meaning":"분석하다"},{"word_id":"v0962","headword":"evaluate","story_form":"evaluate","form":"evaluate","meaning_en":"judge the quality or value of something","meaning":"평가하다"},{"word_id":"v2025","headword":"precise","story_form":"precise","form":"precise","meaning_en":"exact and carefully measured","meaning":"정확한"},{"word_id":"v0951","headword":"err","story_form":"err","form":"err","meaning_en":"make a mistake","meaning":"실수하다"},{"word_id":"v1407","headword":"infer","story_form":"infer","form":"infer","meaning_en":"reach an idea from evidence","meaning":"추론하다"},{"word_id":"v2080","headword":"proof","story_form":"proof","form":"proof","meaning_en":"evidence that shows something is true","meaning":"증거"},{"word_id":"v2850","headword":"valid","story_form":"valid","form":"valid","meaning_en":"supported by sound reasons","meaning":"타당한"},{"word_id":"v1946","headword":"phenomenon","story_form":"phenomenon","form":"phenomenon","meaning_en":"something that happens and can be observed","meaning":"현상"},{"word_id":"v1415","headword":"initial","story_form":"initial","form":"initial","meaning_en":"happening at the beginning","meaning":"초기의"}],"english":["Our **initial** **hypothesis** is that plants grow faster beside a window.","We **analyze** our measurements and **evaluate** the test.","“Are these numbers **precise** enough?” I ask.","“We can all **err**, so measure again,” our teacher says.","One tall plant is not **proof** of the whole idea.","“What can we **infer** about this **phenomenon** from several plants?” she asks.","We collect more results before deciding whether our explanation is **valid**."],"korean":["우리의 초기 가설은 식물이 창가에서 더 빨리 자란다는 것이다.","우리는 측정값을 분석하고 실험을 평가한다.","“이 수치가 충분히 정확한가요?” 내가 묻는다.","“누구나 실수할 수 있으니 다시 재 보자.” 선생님이 말한다.","키 큰 식물 한 그루가 가설 전체의 증거는 아니다.","“여러 식물을 통해 이 현상에 대해 무엇을 추론할 수 있지?” 선생님이 묻는다.","우리는 설명이 타당한지 판단하기 전에 결과를 더 모은다."]},{"id":"O026","title":"작은 물질의 세계","targets":[{"word_id":"v0181","headword":"atom","story_form":"atom","form":"atom","meaning_en":"the smallest unit of a chemical element","meaning":"원자"},{"word_id":"v1712","headword":"molecule","story_form":"molecule","form":"molecule","meaning_en":"a group of atoms joined together","meaning":"분자"},{"word_id":"v1902","headword":"particle","story_form":"particle","form":"particle","meaning_en":"a very small piece of matter","meaning":"입자"},{"word_id":"v2577","headword":"substance","story_form":"substance","form":"substance","meaning_en":"a particular kind of material","meaning":"물질"},{"word_id":"v0560","headword":"compound","story_form":"compound","form":"compound","meaning_en":"a substance made of different elements joined together","meaning":"화합물"},{"word_id":"v0460","headword":"chemical","story_form":"chemical","form":"chemical","meaning_en":"a substance used or studied in chemistry","meaning":"화학 물질"},{"word_id":"v0032","headword":"acid","story_form":"acid","form":"acid","meaning_en":"a substance with a pH below seven","meaning":"산"},{"word_id":"v1581","headword":"liquid","story_form":"liquid","form":"liquid","meaning_en":"a material that flows and takes a container's shape","meaning":"액체"},{"word_id":"v0012","headword":"absorb","story_form":"absorb","form":"absorb","meaning_en":"take liquid or energy into something","meaning":"흡수하다"},{"word_id":"v1011","headword":"extract","story_form":"extract","form":"extract","meaning_en":"take something out of something else","meaning":"추출하다"}],"english":["Our teacher shows us water, a familiar **liquid** and **compound**.","A model shows each **atom** in a water **molecule**.","“Is every tiny **particle** the same **substance**?” I ask.","“No, and every **chemical** has its own properties,” she says.","She names an **acid** but keeps the samples closed.","“Today we will only watch paper **absorb** water and **extract** color from tea.”","We follow her instructions and watch a pale brown color spread."],"korean":["선생님은 익숙한 액체이자 화합물인 물을 보여 주신다.","모형은 물 분자를 이루는 각 원자를 보여 준다.","“작은 입자는 모두 같은 물질인가요?” 내가 묻는다.","“아니, 화학 물질마다 고유한 성질이 있어.” 선생님이 말한다.","선생님은 산의 한 종류를 말해 주시지만 시료는 닫아 두신다.","“오늘은 종이가 물을 흡수하는 것을 보고 차에서 색을 추출하기만 할 거야.”","우리는 지시를 따르며 옅은 갈색이 퍼지는 모습을 본다."]},{"id":"O027","title":"빛의 실험","targets":[{"word_id":"v1951","headword":"physics","story_form":"physics","form":"physics","meaning_en":"the study of matter, energy, and forces","meaning":"물리학"},{"word_id":"v2486","headword":"spectrum","story_form":"spectrum","form":"spectrum","meaning_en":"the range of colors in light","meaning":"스펙트럼"},{"word_id":"v0241","headword":"beam","story_form":"beam","form":"beam","meaning_en":"a narrow line of light","meaning":"빛줄기"},{"word_id":"v1614","headword":"magnet","story_form":"magnet","form":"magnet","meaning_en":"an object that attracts iron","meaning":"자석"},{"word_id":"v1173","headword":"fuse","story_form":"fuse","form":"fuse","meaning_en":"a safety part that breaks an unsafe circuit","meaning":"퓨즈"},{"word_id":"v2481","headword":"spark","story_form":"spark","form":"spark","meaning_en":"a tiny bright flash of electricity or fire","meaning":"불꽃"},{"word_id":"v1215","headword":"glow","story_form":"glow","form":"glow","meaning_en":"shine with a steady soft light","meaning":"은은히 빛나다"},{"word_id":"v2883","headword":"visible","story_form":"visible","form":"visible","meaning_en":"able to be seen","meaning":"눈에 보이는"},{"word_id":"v0120","headword":"angle","story_form":"angle","form":"angle","meaning_en":"the space between two meeting lines","meaning":"각도"},{"word_id":"v0687","headword":"crystal","story_form":"crystal","form":"crystal","meaning_en":"a solid with a regular inner structure","meaning":"결정"}],"english":["At a **physics** show, a clear **crystal** turns a **beam** of light into a **spectrum**.","“Why are more colors **visible** now?” I ask.","The guide changes the **angle** and explains how the light bends.","At another table, a **magnet** makes iron pieces move.","“Can that lamp **glow** without a wire?” my brother asks.","The guide points to its hidden battery and safety **fuse**.","We watch a tiny **spark** in a sealed display, then draw our favorite experiment."],"korean":["물리학 행사에서 투명한 결정이 빛줄기를 스펙트럼으로 바꾼다.","“왜 이제 더 많은 색이 보이나요?” 내가 묻는다.","안내자는 각도를 바꾸며 빛이 어떻게 꺾이는지 설명한다.","다른 탁자에서는 자석이 철 조각을 움직인다.","“저 등은 전선 없이도 빛날 수 있나요?” 동생이 묻는다.","안내자는 숨겨진 배터리와 안전 퓨즈를 가리킨다.","우리는 밀폐된 전시 장치 속 작은 불꽃을 보고 가장 좋아하는 실험을 그린다."]},{"id":"O028","title":"우주 관찰","targets":[{"word_id":"v2831","headword":"universe","story_form":"universe","form":"universe","meaning_en":"all space and everything in it","meaning":"우주"},{"word_id":"v1850","headword":"orbit","story_form":"orbit","form":"orbit","meaning_en":"the path of an object around another","meaning":"궤도"},{"word_id":"v2297","headword":"satellite","story_form":"satellite","form":"satellite","meaning_en":"an object moving around a planet","meaning":"위성"},{"word_id":"v1807","headword":"nuclear","story_form":"nuclear","form":"nuclear","meaning_en":"related to the center of an atom","meaning":"핵의"},{"word_id":"v1380","headword":"immense","story_form":"immense","form":"immense","meaning_en":"extremely large","meaning":"거대한"},{"word_id":"v2857","headword":"vast","story_form":"vast","form":"vast","meaning_en":"covering a very large area","meaning":"광대한"},{"word_id":"v2491","headword":"sphere","story_form":"sphere","form":"sphere","meaning_en":"a perfectly round solid shape","meaning":"구"},{"word_id":"v1895","headword":"parallel","story_form":"parallel","form":"parallel","meaning_en":"side by side and never meeting","meaning":"평행한"},{"word_id":"v2865","headword":"vertical","story_form":"vertical","form":"vertical","meaning_en":"straight up and down","meaning":"수직의"},{"word_id":"v2840","headword":"upward","story_form":"upward","form":"upward","meaning_en":"toward a higher place","meaning":"위쪽으로"}],"english":["At the space center, I look **upward** at an **immense** model of Earth.","A small **satellite** follows an **orbit** around the blue **sphere**.","“How big is the **universe**?” I ask.","“It is too **vast** to show in this room,” the guide replies.","A film explains that the sun gets energy from **nuclear** reactions.","“Draw two **parallel**, **vertical** lines for your rocket,” Dad suggests later.","I add a tiny window and imagine seeing Earth from far away."],"korean":["우주 센터에서 나는 거대한 지구 모형을 올려다본다.","작은 위성이 파란 구 주위의 궤도를 따라간다.","“우주는 얼마나 큰가요?” 내가 묻는다.","“너무 광대해서 이 방 안에는 보여 줄 수 없지.” 안내자가 대답한다.","영상은 태양이 핵반응에서 에너지를 얻는다고 설명한다.","“로켓을 그릴 때 평행한 수직선 두 개를 그려 봐.” 나중에 아빠가 제안한다.","나는 작은 창문을 더하고 멀리서 지구를 보는 상상을 한다."]},{"id":"O029","title":"땅의 기록","targets":[{"word_id":"v1198","headword":"geography","story_form":"geography","form":"geography","meaning_en":"the study of places and the earth's surface","meaning":"지리학"},{"word_id":"v1199","headword":"geology","story_form":"geology","form":"geology","meaning_en":"the study of rocks and the earth's history","meaning":"지질학"},{"word_id":"v1691","headword":"mineral","story_form":"mineral","form":"mineral","meaning_en":"a natural solid found in the earth","meaning":"광물"},{"word_id":"v1690","headword":"mine","story_form":"mine","form":"mine","meaning_en":"a place where minerals are taken from the ground","meaning":"광산"},{"word_id":"v0116","headword":"ancient","story_form":"ancient","form":"ancient","meaning_en":"from a very long time ago","meaning":"고대의"},{"word_id":"v0948","headword":"era","story_form":"era","form":"era","meaning_en":"a long period with particular features","meaning":"시대"},{"word_id":"v0971","headword":"evolution","story_form":"evolution","form":"evolution","meaning_en":"gradual biological change over generations","meaning":"진화"},{"word_id":"v1009","headword":"extinct","story_form":"extinct","form":"extinct","meaning_en":"having no living members left","meaning":"멸종한"},{"word_id":"v2050","headword":"primitive","story_form":"primitive","form":"primitive","meaning_en":"belonging to an early stage of development","meaning":"원시적인"},{"word_id":"v0972","headword":"evolve","story_form":"evolve","form":"evolve","meaning_en":"change gradually over generations","meaning":"진화하다"}],"english":["Our **geography** trip takes us to an old **mine**.","A **geology** guide shows us a bright **mineral** and an **ancient** shell.","“Did this animal live in the same **era** as dinosaurs?” I ask.","She checks the label before answering and explains that the animal is **extinct**.","“Does **evolution** mean animals choose to change?” my friend asks.","“No; populations **evolve** over generations, and **primitive** here means an early form.”","We add dates to our drawings so that we do not mix up the different ages."],"korean":["우리 지리 현장 학습은 오래된 광산으로 향한다.","지질 안내자는 밝은 광물과 아주 오래된 조개껍데기를 보여 준다.","“이 동물은 공룡과 같은 시대에 살았나요?” 내가 묻는다.","안내자는 답하기 전에 표지를 확인하고 그 동물이 멸종했다고 설명한다.","“진화란 동물이 변하기로 선택하는 건가요?” 친구가 묻는다.","“아니야. 개체군이 여러 세대에 걸쳐 진화하는 거야. 여기서 원시적이라는 것은 초기 형태라는 뜻이지.”","우리는 서로 다른 시대를 혼동하지 않도록 그림에 연대를 적는다."]},{"id":"O030","title":"동물 관찰","targets":[{"word_id":"v1268","headword":"habitat","story_form":"habitat","form":"habitat","meaning_en":"the natural home of a living thing","meaning":"서식지"},{"word_id":"v1412","headword":"inhabit","story_form":"inhabit","form":"inhabit","meaning_en":"live in a particular place","meaning":"서식하다"},{"word_id":"v2026","headword":"predator","story_form":"predator","form":"predator","meaning_en":"an animal that hunts other animals","meaning":"포식자"},{"word_id":"v2045","headword":"prey","story_form":"prey","form":"prey","meaning_en":"an animal hunted for food","meaning":"먹잇감"},{"word_id":"v1434","headword":"instinct","story_form":"instinct","form":"instinct","meaning_en":"a natural way of acting without being taught","meaning":"본능"},{"word_id":"v0343","headword":"breed","story_form":"breed","form":"breed","meaning_en":"produce young animals","meaning":"번식하다"},{"word_id":"v1100","headword":"flock","story_form":"flock","form":"flock","meaning_en":"a group of birds","meaning":"새 떼"},{"word_id":"v1683","headword":"migrate","story_form":"migrate","form":"migrate","meaning_en":"move regularly between regions","meaning":"이동하다"},{"word_id":"v1632","headword":"marine","story_form":"marine","form":"marine","meaning_en":"related to the sea","meaning":"해양의"},{"word_id":"v1423","headword":"insect","story_form":"insect","form":"insect","meaning_en":"a small animal with six legs","meaning":"곤충"}],"english":["We watch a **flock** of birds in a wetland **habitat**.","“Do they **inhabit** this place all year?” I ask.","“Some **migrate**, while others stay to **breed**,” the guide says.","A bird catches an **insect**, becoming a **predator** with tiny **prey**.","“Is hunting an **instinct**?” my friend asks.","The guide explains that animals can use both natural behavior and learning.","We finish at a **marine** display and compare sea animals with the wetland birds."],"korean":["우리는 습지 서식지에서 새 떼를 관찰한다.","“이 새들은 일 년 내내 여기 사나요?” 내가 묻는다.","“일부는 이동하고 다른 새들은 번식하려고 남아.” 안내자가 말한다.","새 한 마리가 곤충을 잡아 작은 먹잇감을 가진 포식자가 된다.","“사냥은 본능인가요?” 친구가 묻는다.","안내자는 동물이 본능적인 행동과 학습을 모두 활용할 수 있다고 설명한다.","우리는 해양 전시관에서 관람을 마치며 바다 동물과 습지의 새를 비교한다."]},{"id":"O031","title":"농장의 하루","targets":[{"word_id":"v0074","headword":"agriculture","story_form":"agriculture","form":"agriculture","meaning_en":"the work of growing food and raising animals","meaning":"농업"},{"word_id":"v0688","headword":"cultivate","story_form":"cultivate","form":"cultivate","meaning_en":"prepare land and grow plants","meaning":"경작하다"},{"word_id":"v1060","headword":"fertile","story_form":"fertile","form":"fertile","meaning_en":"able to support strong plant growth","meaning":"비옥한"},{"word_id":"v0678","headword":"crop","story_form":"crop","form":"crop","meaning_en":"plants grown for food or use","meaning":"농작물"},{"word_id":"v1287","headword":"harvest","story_form":"harvest","form":"harvest","meaning_en":"collect a crop when it is ready","meaning":"수확하다"},{"word_id":"v1231","headword":"grain","story_form":"grain","form":"grain","meaning_en":"small dry seeds used as food","meaning":"곡물"},{"word_id":"v2936","headword":"wheat","story_form":"wheat","form":"wheat","meaning_en":"a grain often used to make bread","meaning":"밀"},{"word_id":"v0633","headword":"corn","story_form":"corn","form":"corn","meaning_en":"a tall plant with yellow edible seeds","meaning":"옥수수"},{"word_id":"v0708","headword":"dairy","story_form":"dairy","form":"dairy","meaning_en":"related to milk production","meaning":"낙농의"},{"word_id":"v0422","headword":"cattle","story_form":"cattle","form":"cattle","meaning_en":"large farm animals such as cows","meaning":"소들"}],"english":["Our class visits a farm to learn about **agriculture**.","The farmer shows us **fertile** land where she can **cultivate** several plants.","“Which **crop** will you **harvest** first?” I ask.","“The **wheat**; the **corn** needs more time,” she answers.","We compare two kinds of **grain** in small bowls.","“Are those **cattle** part of a **dairy** farm?” my friend asks.","The farmer nods, and we follow her to see where the milk is collected."],"korean":["우리 반은 농업을 배우러 농장에 간다.","농부는 여러 식물을 경작할 수 있는 비옥한 땅을 보여 준다.","“어떤 농작물을 먼저 수확하실 건가요?” 내가 묻는다.","“밀이야. 옥수수는 시간이 더 필요해.” 농부가 대답한다.","우리는 작은 그릇에 담긴 두 종류의 곡물을 비교한다.","“저 소들은 낙농장에서 기르는 건가요?” 친구가 묻는다.","농부가 고개를 끄덕여 우리는 우유를 모으는 곳을 보러 따라간다."]},{"id":"O032","title":"정원의 변화","targets":[{"word_id":"v0303","headword":"blossom","story_form":"blossom","form":"blossom","meaning_en":"produce flowers","meaning":"꽃이 피다"},{"word_id":"v2535","headword":"stem","story_form":"stem","form":"stem","meaning_en":"the main stalk supporting a plant","meaning":"줄기"},{"word_id":"v2923","headword":"weed","story_form":"weed","form":"weed","meaning_en":"an unwanted plant in a garden","meaning":"잡초"},{"word_id":"v1155","headword":"frost","story_form":"frost","form":"frost","meaning_en":"a thin layer of ice on a surface","meaning":"서리"},{"word_id":"v1711","headword":"moist","story_form":"moisture","form":"moisture","meaning_en":"water present in small amounts","meaning":"수분"},{"word_id":"v0729","headword":"decay","story_form":"decay","form":"decay","meaning_en":"break down naturally over time","meaning":"부패하다"},{"word_id":"v2268","headword":"rot","story_form":"rot","form":"rot","meaning_en":"become damaged through natural decay","meaning":"썩다"},{"word_id":"v1103","headword":"flourish","story_form":"flourish","form":"flourish","meaning_en":"grow strongly and well","meaning":"무성하게 자라다"},{"word_id":"v0006","headword":"abound","story_form":"abundant","form":"abundant","meaning_en":"present in large amounts","meaning":"풍부한"},{"word_id":"v2994","headword":"yield","story_form":"yield","form":"yield","meaning_en":"the amount of a crop produced","meaning":"수확량"}],"english":["After a night of **frost**, I check each plant's **stem**.","One **weed** is still growing beside our beans.","“Will our plants **blossom** soon?” I ask Grandma.","“They need warmth and enough **moisture** to **flourish**,” she says.","Old leaves **decay**, but we remove damaged fruit before more can **rot**.","“Will we have an **abundant** **yield**?” I ask.","“Let's care for them first,” she says, and hands me the watering can."],"korean":["서리가 내린 밤이 지난 뒤 나는 식물의 줄기를 하나씩 확인한다.","콩 옆에서는 잡초 하나가 여전히 자라고 있다.","“우리 식물에 곧 꽃이 필까요?” 내가 할머니께 묻는다.","“무성하게 자라려면 따뜻함과 충분한 수분이 필요하지.” 할머니가 말한다.","오래된 잎은 부패하지만, 우리는 다른 열매까지 썩기 전에 상한 열매를 치운다.","“풍부하게 수확할 수 있을까요?” 내가 묻는다.","“먼저 잘 돌봐 주자.” 할머니가 말하며 물뿌리개를 건네신다."]},{"id":"O033","title":"산길에서","targets":[{"word_id":"v2768","headword":"trail","story_form":"trail","form":"trail","meaning_en":"a path through the countryside","meaning":"오솔길"},{"word_id":"v2433","headword":"slope","story_form":"slope","form":"slope","meaning_en":"a surface that goes up or down","meaning":"비탈"},{"word_id":"v2534","headword":"steep","story_form":"steep","form":"steep","meaning_en":"rising at a sharp angle","meaning":"가파른"},{"word_id":"v1922","headword":"peak","story_form":"peak","form":"peak","meaning_en":"the pointed top of a mountain","meaning":"봉우리"},{"word_id":"v2596","headword":"summit","story_form":"summit","form":"summit","meaning_en":"the highest point of a mountain","meaning":"정상"},{"word_id":"v0770","headword":"descend","story_form":"descend","form":"descend","meaning_en":"move downward","meaning":"내려가다"},{"word_id":"v1394","headword":"incline","story_form":"incline","form":"incline","meaning_en":"a sloping surface","meaning":"경사면"},{"word_id":"v0760","headword":"dense","story_form":"dense","form":"dense","meaning_en":"closely packed together","meaning":"빽빽한"},{"word_id":"v2192","headword":"remote","story_form":"remote","form":"remote","meaning_en":"far from towns and people","meaning":"외딴"},{"word_id":"v1362","headword":"hut","story_form":"hut","form":"hut","meaning_en":"a small simple shelter","meaning":"오두막"}],"english":["Our **trail** passes through **dense** trees toward a **remote** **hut**.","A **steep** **slope** rises toward a snowy **peak**.","“Can we reach the **summit** today?” I ask.","“No, this **incline** is too difficult for our group,” our guide says.","We stop at the hut for water and look at the map.","“Let's **descend** before the light fades,” Dad suggests.","We return by the same path, pleased with the view we did see."],"korean":["우리 오솔길은 빽빽한 나무 사이를 지나 외딴 오두막으로 향한다.","가파른 비탈이 눈 덮인 봉우리 쪽으로 솟아 있다.","“오늘 정상에 갈 수 있나요?” 내가 묻는다.","“아니, 이 경사면은 우리 일행에게 너무 어려워.” 안내자가 말한다.","우리는 오두막에서 물을 마시며 지도를 본다.","“날이 어두워지기 전에 내려가자.” 아빠가 제안한다.","우리는 보았던 경치에 만족하며 같은 길로 돌아온다."]},{"id":"O034","title":"동굴 탐험","targets":[{"word_id":"v0425","headword":"cave","story_form":"cave","form":"cave","meaning_en":"a large natural hole in rock","meaning":"동굴"},{"word_id":"v1002","headword":"explore","story_form":"explore","form":"explore","meaning_en":"travel through a place to learn about it","meaning":"탐험하다"},{"word_id":"v0926","headword":"encounter","story_form":"encounter","form":"encounter","meaning_en":"meet or find unexpectedly","meaning":"마주치다"},{"word_id":"v1595","headword":"lone","story_form":"lone","form":"lone","meaning_en":"alone without others","meaning":"혼자의"},{"word_id":"v2900","headword":"wander","story_form":"wander","form":"wander","meaning_en":"walk without a fixed direction","meaning":"돌아다니다"},{"word_id":"v0403","headword":"capture","story_form":"capture","form":"capture","meaning_en":"record an image or moment","meaning":"포착하다"},{"word_id":"v0085","headword":"alert","story_form":"alert","form":"alert","meaning_en":"watching carefully for danger","meaning":"경계하는"},{"word_id":"v0424","headword":"caution","story_form":"caution","form":"caution","meaning_en":"care taken to avoid danger","meaning":"주의"},{"word_id":"v0327","headword":"boundary","story_form":"boundary","form":"boundary","meaning_en":"a line marking an area's limit","meaning":"경계"},{"word_id":"v0545","headword":"companion","story_form":"companion","form":"companion","meaning_en":"a person who goes somewhere with you","meaning":"동행자"}],"english":["We enter a **cave** with a guide and **explore** the marked path.","My **companion** tries to **capture** the strange rocks in a photograph.","“May I **wander** past that **boundary**?” he asks.","“No; stay **alert** and use **caution** near the wet ground,” the guide replies.","We **encounter** a **lone** visitor who has stopped to tie her shoe.","“Your group is just ahead,” our guide tells her.","She joins them, and we take our pictures from behind the rope."],"korean":["우리는 안내자와 동굴에 들어가 표시된 길을 탐험한다.","동행자는 사진으로 신기한 바위를 포착하려 한다.","“저 경계 너머를 돌아다녀도 되나요?” 그가 묻는다.","“안 돼. 경계하면서 젖은 바닥 근처에서는 주의해.” 안내자가 대답한다.","우리는 신발 끈을 묶으려고 멈춘 혼자 온 방문객과 마주친다.","“일행은 바로 앞에 있어요.” 안내자가 알려 준다.","그녀는 일행에 합류하고 우리는 밧줄 뒤에서 사진을 찍는다."]},{"id":"O035","title":"바다를 지키는 날","targets":[{"word_id":"v0944","headword":"environ","story_form":"environment","form":"environment","meaning_en":"the natural world around us","meaning":"환경"},{"word_id":"v0591","headword":"conserve","story_form":"conserve","form":"conserve","meaning_en":"use carefully to avoid waste","meaning":"아껴 쓰다"},{"word_id":"v2036","headword":"preserve","story_form":"preserve","form":"preserve","meaning_en":"keep something safe from damage","meaning":"보존하다"},{"word_id":"v2760","headword":"toxic","story_form":"toxic","form":"toxic","meaning_en":"poisonous or harmful","meaning":"유독한"},{"word_id":"v0919","headword":"emit","story_form":"emit","form":"emit","meaning_en":"send out gas, light, or heat","meaning":"배출하다"},{"word_id":"v1073","headword":"filter","story_form":"filter","form":"filter","meaning_en":"a device that removes unwanted material","meaning":"필터"},{"word_id":"v1080","headword":"finite","story_form":"finite","form":"finite","meaning_en":"having a limit","meaning":"한정된"},{"word_id":"v2617","headword":"sustain","story_form":"sustain","form":"sustain","meaning_en":"keep something going over time","meaning":"유지하다"},{"word_id":"v2305","headword":"scarce","story_form":"scarce","form":"scarce","meaning_en":"not available in large amounts","meaning":"부족한"},{"word_id":"v1212","headword":"globe","story_form":"globe","form":"globe","meaning_en":"the earth","meaning":"지구"}],"english":["Our club makes a display about the ocean **environment**.","Clean water is **scarce** in some places on the **globe**.","“How can we **preserve** the coast?” I ask.","“We must **conserve** water and stop **toxic** waste reaching the sea,” Mina says.","A model shows a factory that can **emit** harmful gas without a proper **filter**.","“Resources are **finite**, so change must **sustain** the world we share,” our teacher adds.","We end our display with small actions our own school can take."],"korean":["우리 동아리는 해양 환경에 관한 전시물을 만든다.","지구의 일부 지역에서는 깨끗한 물이 부족하다.","“해안을 어떻게 보존할 수 있을까요?” 내가 묻는다.","“물을 아껴 쓰고 유독한 폐기물이 바다로 가지 못하게 해야 해.” 미나가 말한다.","모형은 적절한 필터가 없으면 해로운 기체를 배출할 수 있는 공장을 보여 준다.","“자원은 한정되어 있으니 변화는 함께 사는 세상을 유지하는 데 도움이 되어야 해.” 선생님이 덧붙인다.","우리는 우리 학교가 실천할 작은 행동들을 전시 마지막에 넣는다."]},{"id":"O036","title":"폭풍 뒤의 구조","targets":[{"word_id":"v0814","headword":"disaster","story_form":"disaster","form":"disaster","meaning_en":"an event causing great damage","meaning":"재난"},{"word_id":"v0918","headword":"emergency","story_form":"emergency","form":"emergency","meaning_en":"a dangerous situation needing quick action","meaning":"비상사태"},{"word_id":"v0961","headword":"evacuate","story_form":"evacuate","form":"evacuate","meaning_en":"move people out of danger","meaning":"대피시키다"},{"word_id":"v2205","headword":"rescue","story_form":"rescue","form":"rescue","meaning_en":"save someone from danger","meaning":"구조하다"},{"word_id":"v0869","headword":"drown","story_form":"drown","form":"drown","meaning_en":"die because of being unable to breathe underwater","meaning":"익사하다"},{"word_id":"v2985","headword":"wreck","story_form":"wreck","form":"wreck","meaning_en":"a badly damaged ship or vehicle","meaning":"난파선, 잔해"},{"word_id":"v0521","headword":"collapse","story_form":"collapse","form":"collapse","meaning_en":"fall down suddenly","meaning":"무너지다"},{"word_id":"v2360","headword":"severe","story_form":"severe","form":"severe","meaning_en":"very serious or strong","meaning":"심각한"},{"word_id":"v1292","headword":"hazard","story_form":"hazard","form":"hazard","meaning_en":"something that may cause harm","meaning":"위험 요소"},{"word_id":"v0784","headword":"destruct","story_form":"destruction","form":"destruction","meaning_en":"great damage that ruins something","meaning":"파괴"}],"english":["After a **severe** storm, our town faces an **emergency**.","News of the **disaster** shows the **destruction** along the coast.","“Could that damaged wall **colla
