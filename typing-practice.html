pse**?” I ask Dad.","“Yes, it is a **hazard**; we must follow the order to **evacuate**,” he says.","From the safe shelter, we hear about a boat **wreck**.","“Did anyone **drown**?” I ask, and a worker says the team managed to **rescue** everyone.","We stay at the shelter until officials say it is safe to return."],"korean":["심한 폭풍 뒤에 우리 마을은 비상사태를 맞는다.","재난 뉴스는 해안을 따라 일어난 파괴를 보여 준다.","“저 부서진 벽이 무너질 수도 있나요?” 내가 아빠에게 묻는다.","“그래, 위험하니 대피 명령을 따라야 해.” 아빠가 말한다.","안전한 대피소에서 우리는 난파선 소식을 듣는다.","“익사한 사람이 있나요?” 내가 묻자 직원이 구조대가 모두를 구했다고 말한다.","우리는 관계자들이 돌아가도 안전하다고 할 때까지 대피소에 머문다."]},{"id":"O037","title":"운동을 시작한 날","targets":[{"word_id":"v0179","headword":"athlete","story_form":"athlete","form":"athlete","meaning_en":"a person trained in sports","meaning":"운동선수"},{"word_id":"v1266","headword":"gymnasium","story_form":"gymnasium","form":"gymnasium","meaning_en":"a large indoor space for exercise","meaning":"체육관"},{"word_id":"v1481","headword":"jog","story_form":"jog","form":"jog","meaning_en":"run slowly and steadily","meaning":"천천히 달리다"},{"word_id":"v2620","headword":"sweat","story_form":"sweat","form":"sweat","meaning_en":"water from the skin when the body is hot","meaning":"땀"},{"word_id":"v2552","headword":"strain","story_form":"strain","form":"strain","meaning_en":"too much pressure on a body part","meaning":"무리, 부담"},{"word_id":"v2538","headword":"stiff","story_form":"stiff","form":"stiff","meaning_en":"difficult to bend or move","meaning":"뻣뻣한"},{"word_id":"v1303","headword":"heel","story_form":"heel","form":"heel","meaning_en":"the back part of the foot","meaning":"뒤꿈치"},{"word_id":"v1526","headword":"lap","story_form":"lap","form":"lap","meaning_en":"one complete trip around a track","meaning":"한 바퀴"},{"word_id":"v1878","headword":"pace","story_form":"pace","form":"pace","meaning_en":"the speed of walking or running","meaning":"속도"},{"word_id":"v2875","headword":"vigor","story_form":"vigorous","form":"vigorous","meaning_en":"using a lot of energy","meaning":"활기찬, 격렬한"}],"english":["At the **gymnasium**, a young **athlete** leads our first running class.","I want a **vigorous** workout, but my legs feel **stiff**.","“Start at an easy **pace** and **jog** one **lap**,” she says.","After a short run, **sweat** runs down my face.","“My **heel** hurts,” I tell her.","“Then stop; we do not want extra **strain**,” she replies.","I rest beside the track and make a plan to ask about the pain before running again."],"korean":["체육관에서 젊은 운동선수가 첫 달리기 수업을 이끈다.","나는 활기찬 운동을 하고 싶지만 다리가 뻣뻣하다.","“편한 속도로 한 바퀴 천천히 달려 봐.” 선수가 말한다.","잠깐 달린 뒤 땀이 얼굴을 타고 흐른다.","“뒤꿈치가 아파요.” 내가 말한다.","“그럼 멈추자. 무리가 더 가면 안 돼.” 선수가 대답한다.","나는 트랙 옆에서 쉬며 다시 달리기 전에 통증에 대해 상담하기로 한다."]},{"id":"O038","title":"결승선까지","targets":[{"word_id":"v0551","headword":"compete","story_form":"compete","form":"compete","meaning_en":"try to win against others","meaning":"경쟁하다"},{"word_id":"v2250","headword":"rival","story_form":"rival","form":"rival","meaning_en":"a person competing against you","meaning":"경쟁자"},{"word_id":"v0739","headword":"defeat","story_form":"defeat","form":"defeat","meaning_en":"a failure to win","meaning":"패배"},{"word_id":"v2872","headword":"victory","story_form":"victory","form":"victory","meaning_en":"success in a competition","meaning":"승리"},{"word_id":"v2792","headword":"triumph","story_form":"triumph","form":"triumph","meaning_en":"a great success","meaning":"대성공"},{"word_id":"v1940","headword":"persist","story_form":"persist","form":"persist","meaning_en":"continue despite difficulty","meaning":"끈기 있게 계속하다"},{"word_id":"v0928","headword":"endure","story_form":"endure","form":"endure","meaning_en":"continue through something difficult","meaning":"견디다"},{"word_id":"v2237","headword":"reward","story_form":"reward","form":"reward","meaning_en":"something received for effort","meaning":"보상"},{"word_id":"v0316","headword":"boost","story_form":"boost","form":"boost","meaning_en":"increase confidence or strength","meaning":"북돋우다"},{"word_id":"v1276","headword":"handicap","story_form":"handicap","form":"handicap","meaning_en":"a disadvantage making success harder","meaning":"불리한 조건"}],"english":["I will **compete** in a race after missing several practice days.","That lost time is a **handicap**, and I fear another **defeat**.","“You can **persist** without expecting **victory** today,” my coach says.","A friendly **rival** helps **boost** my confidence at the starting line.","“We can **endure** a little nervousness,” she says.","I finish well behind her, but running the whole course feels like a **triumph**.","My **reward** is a happy walk home with a new friend."],"korean":["나는 연습을 며칠 빠진 뒤 경주에 출전한다.","놓친 시간은 불리한 조건이어서 나는 또 패배할까 걱정한다.","“오늘 승리를 기대하지 않아도 끈기 있게 계속할 수 있어.” 코치가 말한다.","친근한 경쟁자가 출발선에서 내 자신감을 북돋운다.","“약간의 긴장은 견딜 수 있어.” 그 친구가 말한다.","나는 그 친구보다 훨씬 늦게 들어오지만 완주 자체가 대성공처럼 느껴진다.","내 보상은 새 친구와 행복하게 집으로 걷는 것이다."]},{"id":"O039","title":"운동장에서 생긴 일","targets":[{"word_id":"v1393","headword":"incident","story_form":"incident","form":"incident","meaning_en":"an event, especially an unexpected one","meaning":"사건"},{"word_id":"v2971","headword":"witness","story_form":"witness","form":"witness","meaning_en":"a person who sees an event","meaning":"목격자"},{"word_id":"v2149","headword":"rear","story_form":"rear","form":"rear","meaning_en":"the back part of something","meaning":"뒤쪽"},{"word_id":"v1247","headword":"grip","story_form":"grip","form":"grip","meaning_en":"a firm hold","meaning":"꽉 잡음"},{"word_id":"v2339","headword":"seize","story_form":"seize","form":"seize","meaning_en":"take hold of something quickly","meaning":"붙잡다"},{"word_id":"v1912","headword":"pat","story_form":"pat","form":"pat","meaning_en":"touch gently with a flat hand","meaning":"가볍게 두드리다"},{"word_id":"v1788","headword":"nod","story_form":"nod","form":"nod","meaning_en":"move the head to show agreement","meaning":"고개를 끄덕이다"},{"word_id":"v2398","headword":"sigh","story_form":"sigh","form":"sigh","meaning_en":"breathe out to express a feeling","meaning":"한숨을 쉬다"},{"word_id":"v1886","headword":"pale","story_form":"pale","form":"pale","meaning_en":"having less color than usual","meaning":"창백한"},{"word_id":"v1754","headword":"nasty","story_form":"nasty","form":"nasty","meaning_en":"unpleasant or painful","meaning":"심한, 불쾌한"}],"english":["A small **incident** happens at the **rear** of the playground.","A boy loses his **grip** on a bag, and I **seize** it before it hits a puddle.","He looks **pale** after the **nasty** surprise.","“Did he fall?” a teacher asks me as the only **witness**.","“No, only the bag slipped,” I explain.","The boy begins to **nod**, and I **pat** his shoulder.","We both **sigh** with relief when we see that his lunch is still dry."],"korean":["운동장 뒤쪽에서 작은 사건이 일어난다.","소년이 가방을 놓쳐서 나는 웅덩이에 닿기 전에 붙잡는다.","소년은 크게 놀란 뒤 창백해 보인다.","선생님은 유일한 목격자인 나에게 “그 아이가 넘어졌니?”라고 묻는다.","“아니요, 가방만 미끄러졌어요.” 내가 설명한다.","소년이 고개를 끄덕이자 나는 어깨를 가볍게 두드린다.","도시락이 젖지 않은 것을 보고 우리는 둘 다 안도의 한숨을 쉰다."]},{"id":"O040","title":"병원에 간 아이","targets":[{"word_id":"v0502","headword":"clinic","story_form":"clinic","form":"clinic","meaning_en":"a place where people receive medical care","meaning":"의원"},{"word_id":"v2632","headword":"symptom","story_form":"symptom","form":"symptom","meaning_en":"a sign of illness","meaning":"증상"},{"word_id":"v0030","headword":"ache","story_form":"ache","form":"ache","meaning_en":"a continuing pain","meaning":"통증"},{"word_id":"v0850","headword":"dose","story_form":"dose","form":"dose","meaning_en":"an amount of medicine taken at one time","meaning":"1회 복용량"},{"word_id":"v1960","headword":"pill","story_form":"pill","form":"pill","meaning_en":"a small solid piece of medicine","meaning":"알약"},{"word_id":"v2033","headword":"prescribe","story_form":"prescribe","form":"prescribe","meaning_en":"officially order a medicine for a patient","meaning":"처방하다"},{"word_id":"v2183","headword":"relieve","story_form":"relieve","form":"relieve","meaning_en":"make pain or worry less","meaning":"완화하다"},{"word_id":"v2189","headword":"remedy","story_form":"remedy","form":"remedy","meaning_en":"a treatment for a problem","meaning":"치료법"},{"word_id":"v1296","headword":"heal","story_form":"heal","form":"heal","meaning_en":"become healthy again","meaning":"회복되다"},{"word_id":"v1684","headword":"mild","story_form":"mild","form":"mild","meaning_en":"not very severe","meaning":"가벼운"}],"english":["At the **clinic**, I tell the doctor about a **mild** **ache**.","She asks about each **symptom** before examining me.","“Will you **prescribe** a **pill**?” I ask.","“First we must understand the cause and choose the right **remedy**,” she says.","She explains what might **relieve** the discomfort and help me **heal**.","Mom asks her to write down any **dose** clearly.","We leave with instructions for my situation and a number to call with questions."],"korean":["의원에서 나는 의사에게 가벼운 통증을 말한다.","의사는 진찰하기 전에 증상을 하나씩 묻는다.","“알약을 처방해 주실 건가요?” 내가 묻는다.","“먼저 원인을 알아내고 알맞은 치료법을 골라야 해.” 의사가 말한다.","의사는 불편함을 완화하고 회복하는 데 무엇이 도움이 될지 설명한다.","엄마는 약을 쓴다면 복용량을 분명히 적어 달라고 부탁한다.","우리는 내 상황에 맞는 안내와 질문할 때 연락할 번호를 받아 나온다."]},{"id":"O041","title":"수술을 앞둔 가족","targets":[{"word_id":"v2609","headword":"surgery","story_form":"surgery","form":"surgery","meaning_en":"medical treatment involving an operation","meaning":"수술"},{"word_id":"v2821","headword":"undergo","story_form":"undergo","form":"undergo","meaning_en":"experience a process or treatment","meaning":"받다, 겪다"},{"word_id":"v1416","headword":"inject","story_form":"inject","form":"inject","meaning_en":"put a substance into the body with a needle","meaning":"주사하다"},{"word_id":"v2732","headword":"tissue","story_form":"tissue","form":"tissue","meaning_en":"a group of similar cells in the body","meaning":"조직"},{"word_id":"v1095","headword":"flesh","story_form":"flesh","form":"flesh","meaning_en":"the soft parts of a body","meaning":"살"},{"word_id":"v1382","headword":"immune","story_form":"immune","form":"immune","meaning_en":"able to resist a particular infection","meaning":"면역이 있는"},{"word_id":"v1406","headword":"infect","story_form":"infect","form":"infect","meaning_en":"enter a body and cause disease","meaning":"감염시키다"},{"word_id":"v2847","headword":"vaccine","story_form":"vaccine","form":"vaccine","meaning_en":"a preparation that helps prevent a disease","meaning":"백신"},{"word_id":"v2693","headword":"therapy","story_form":"therapy","form":"therapy","meaning_en":"treatment intended to improve health","meaning":"치료"},{"word_id":"v0394","headword":"cancer","story_form":"cancer","form":"cancer","meaning_en":"a disease involving uncontrolled cell growth","meaning":"암"}],"english":["At a hospital talk, a doctor explains how patients may **undergo** **surgery**.","She points to **tissue** in a model of soft **flesh**.","“Is every **therapy** an operation?” I ask.","“No, treatments differ; even **cancer** is not treated in only one way,” she says.","A second display shows how germs can **infect** the body.","“When you **inject** a **vaccine**, does everyone become fully **immune**?” a parent asks.","The doctor explains that protection varies, and we write down questions for our own doctors."],"korean":["병원 강연에서 의사는 환자가 수술을 받는 과정을 설명한다.","의사는 부드러운 살 모형의 조직을 가리킨다.","“치료는 모두 수술인가요?” 내가 묻는다.","“아니, 치료법은 달라. 암도 한 가지 방법으로만 치료하지는 않아.” 의사가 말한다.","두 번째 전시물은 세균이 몸을 감염시키는 과정을 보여 준다.","“백신을 주사하면 누구나 완전히 면역이 생기나요?” 한 부모가 묻는다.","의사는 보호 효과가 다양하다고 설명하고, 우리는 담당 의사에게 물어볼 질문을 적는다."]},{"id":"O042","title":"건강을 배우는 시간","targets":[{"word_id":"v0283","headword":"biology","story_form":"biology","form":"biology","meaning_en":"the study of living things","meaning":"생물학"},{"word_id":"v1190","headword":"gene","story_form":"gene","form":"gene","meaning_en":"a unit carrying inherited information","meaning":"유전자"},{"word_id":"v1854","headword":"organ","story_form":"organ","form":"organ","meaning_en":"a body part with a special job","meaning":"장기"},{"word_id":"v0794","headword":"diabetes","story_form":"diabetes","form":"diabetes","meaning_en":"a condition involving problems controlling blood sugar","meaning":"당뇨병"},{"word_id":"v2088","headword":"protein","story_form":"protein","form":"protein","meaning_en":"a nutrient used to build and repair the body","meaning":"단백질"},{"word_id":"v0742","headword":"deficiency","story_form":"deficiency","form":"deficiency","meaning_en":"a lack of something needed","meaning":"결핍"},{"word_id":"v2603","headword":"supplement","story_form":"supplement","form":"supplement","meaning_en":"something added to make up a lack","meaning":"보충제"},{"word_id":"v0475","headword":"chronic","story_form":"chronic","form":"chronic","meaning_en":"lasting for a long time","meaning":"만성의"},{"word_id":"v2175","headword":"regulate","story_form":"regulate","form":"regulate","meaning_en":"control and keep something at a suitable level","meaning":"조절하다"},{"word_id":"v1708","headword":"moderate","story_form":"moderate","form":"moderate","meaning_en":"not too much or too little","meaning":"적당한"}],"english":["In **biology**, we learn that a **gene** can affect how the body works.","A model shows an **organ** that helps **regulate** blood sugar.","“Is **diabetes** a **chronic** condition?” I ask.","Our teacher explains the word and reminds us that each person's care is different.","We then discuss **protein** and what a nutrient **deficiency** means.","“Should everyone take a **supplement**?” someone asks.","“No; learn about balanced, **moderate** habits and ask a professional about personal needs,” she replies."],"korean":["생물 시간에 우리는 유전자가 몸의 작동에 영향을 줄 수 있다고 배운다.","모형은 혈당 조절을 돕는 장기를 보여 준다.","“당뇨병은 만성 질환인가요?” 내가 묻는다.","선생님은 단어를 설명하고 사람마다 관리가 다르다고 알려 준다.","그다음 우리는 단백질과 영양 결핍의 뜻을 논의한다.","“모두 보충제를 먹어야 하나요?” 누군가 묻는다.","“아니, 균형 있고 적당한 습관을 배우고 개인에게 필요한 것은 전문가에게 물어봐.” 선생님이 대답한다."]},{"id":"O043","title":"점심 만들기","targets":[{"word_id":"v0459","headword":"chef","story_form":"chef","form":"chef","meaning_en":"a professional cook","meaning":"요리사"},{"word_id":"v1411","headword":"ingredient","story_form":"ingredient","form":"ingredient","meaning_en":"one food used to make a dish","meaning":"재료"},{"word_id":"v1092","headword":"flavor","story_form":"flavor","form":"flavor","meaning_en":"the taste of food","meaning":"풍미"},{"word_id":"v0697","headword":"curry","story_form":"curry","form":"curry","meaning_en":"a dish cooked with a mixture of spices","meaning":"카레"},{"word_id":"v2254","headword":"roast","story_form":"roast","form":"roast","meaning_en":"cook with dry heat in an oven","meaning":"굽다"},{"word_id":"v2143","headword":"raw","story_form":"raw","form":"raw","meaning_en":"not cooked","meaning":"날것의"},{"word_id":"v1925","headword":"peel","story_form":"peel","form":"peel","meaning_en":"remove the outer skin","meaning":"껍질을 벗기다"},{"word_id":"v2428","headword":"slice","story_form":"slice","form":"slice","meaning_en":"cut into thin flat pieces","meaning":"얇게 썰다"},{"word_id":"v2006","headword":"portion","story_form":"portion","form":"portion","meaning_en":"an amount served to one person","meaning":"1인분"},{"word_id":"v2168","headword":"refrigerate","story_form":"refrigerate","form":"refrigerate","meaning_en":"keep food cold in a refrigerator","meaning":"냉장하다"}],"english":["A **chef** visits our class to make vegetable **curry**.","We name each **ingredient** before we **peel** the carrots.","“May I **slice** these?” I ask.","“Use the safe tool here, and we will **roast** the other vegetables,” she says.","The **raw** vegetables become soft, and the room fills with a rich smell.","“How is the **flavor**?” she asks as she gives us each a small **portion**.","We enjoy lunch, then help her **refrigerate** the food she has set aside."],"korean":["요리사가 우리 반에 와서 채소 카레를 만든다.","우리는 당근 껍질을 벗기기 전에 재료의 이름을 하나씩 말한다.","“이것들을 얇게 썰어도 될까요?” 내가 묻는다.","“여기 안전한 도구를 쓰렴. 다른 채소는 구울 거야.” 요리사가 말한다.","날채소가 부드러워지고 교실에 풍부한 냄새가 퍼진다.","“풍미가 어떠니?” 요리사는 각자에게 조금씩 담아 주며 묻는다.","우리는 점심을 맛있게 먹고 따로 남겨 둔 음식을 냉장하는 일을 돕는다."]},{"id":"O044","title":"부엌의 작은 실수","targets":[{"word_id":"v1477","headword":"jar","story_form":"jar","form":"jar","meaning_en":"a wide container usually made of glass","meaning":"병, 단지"},{"word_id":"v2448","headword":"soak","story_form":"soak","form":"soak","meaning_en":"leave something in liquid","meaning":"담가 두다"},{"word_id":"v2509","headword":"squeeze","story_form":"squeeze","form":"squeeze","meaning_en":"press firmly to push liquid out","meaning":"짜다"},{"word_id":"v1963","headword":"pinch","story_form":"pinch","form":"pinch","meaning_en":"a tiny amount held between two fingers","meaning":"한 꼬집"},{"word_id":"v2492","headword":"spill","story_form":"spill","form":"spill","meaning_en":"accidentally let liquid fall out","meaning":"쏟다"},{"word_id":"v2496","headword":"splash","story_form":"splash","form":"splash","meaning_en":"make liquid fly in drops","meaning":"튀기다"},{"word_id":"v1106","headword":"flush","story_form":"flush","form":"flush","meaning_en":"wash through with flowing water","meaning":"물로 씻어 내리다"},{"word_id":"v2550","headword":"stove","story_form":"stove","form":"stove","meaning_en":"equipment used for cooking with heat","meaning":"조리용 화구"},{"word_id":"v2449","headword":"soap","story_form":"soap","form":"soap","meaning_en":"a substance used for washing","meaning":"비누"},{"word_id":"v1607","headword":"lump","story_form":"lump","form":"lump","meaning_en":"a small solid mass","meaning":"덩어리"}],"english":["I open a **jar** beside the **stove** and almost **spill** the juice.","“Move away from the heat before you **squeeze** that lemon,” Dad says.","I add a **pinch** of salt, but a **lump** falls into the bowl.","“Let's start this small bowl again,” he suggests.","We **soak** the sticky spoon and use **soap** to wash our hands.","“Don't **splash** me when you **flush** the sink with water!” he laughs.","I turn the water down, and we finish with a clean kitchen."],"korean":["나는 조리대 옆에서 병을 열다가 주스를 쏟을 뻔한다.","“레몬을 짜기 전에 열기에서 떨어져라.” 아빠가 말한다.","나는 소금 한 꼬집을 넣지만 덩어리 하나가 그릇에 떨어진다.","“이 작은 그릇은 다시 만들자.” 아빠가 제안한다.","우리는 끈적한 숟가락을 담가 두고 비누로 손을 씻는다.","“싱크대를 물로 씻어 낼 때 나한테 튀기지 마!” 아빠가 웃는다.","나는 물을 줄이고, 우리는 깨끗해진 부엌에서 일을 마친다."]},{"id":"O045","title":"옷을 고치는 날","targets":[{"word_id":"v1016","headword":"fabric","story_form":"fabric","form":"fabric","meaning_en":"material used to make clothes","meaning":"직물"},{"word_id":"v1064","headword":"fiber","story_form":"fiber","form":"fiber","meaning_en":"a thin thread making up a material","meaning":"섬유"},{"word_id":"v1548","headword":"leather","story_form":"leather","form":"leather","meaning_en":"material made from animal skin","meaning":"가죽"},{"word_id":"v1764","headword":"needle","story_form":"needle","form":"needle","meaning_en":"a thin pointed tool for sewing","meaning":"바늘"},{"word_id":"v2710","headword":"thread","story_form":"thread","form":"thread","meaning_en":"a thin string used for sewing","meaning":"실"},{"word_id":"v2542","headword":"stitch","story_form":"stitch","form":"stitch","meaning_en":"one loop of thread made in sewing","meaning":"바늘땀"},{"word_id":"v2920","headword":"weave","story_form":"weave","form":"weave","meaning_en":"make cloth by crossing threads","meaning":"짜다"},{"word_id":"v1510","headword":"knot","story_form":"knot","form":"knot","meaning_en":"a fastening made by tying string","meaning":"매듭"},{"word_id":"v2563","headword":"strip","story_form":"strip","form":"strip","meaning_en":"a long narrow piece","meaning":"길고 좁은 조각"},{"word_id":"v2564","headword":"stripe","story_form":"stripe","form":"stripe","meaning_en":"a long narrow band of color","meaning":"줄무늬"}],"english":["Grandma finds a torn **strip** of **fabric** on my bag.","A blue **stripe** runs beside the **leather** handle.","“Can we **weave** new cloth?” I ask, looking at each loose **fiber**.","“We only need to repair this part,” she says, taking a **needle** and **thread**.","She shows me one careful **stitch** and then another.","“Finish with a **knot** so it stays in place.”","I carry the repaired bag to school and point proudly to my small row of stitches."],"korean":["할머니는 내 가방에서 찢어진 길쭉한 천 조각을 발견하신다.","가죽 손잡이 옆에는 파란 줄무늬가 있다.","“새 천을 짤 수 있을까요?” 나는 풀린 섬유를 보며 묻는다.","“이 부분만 수선하면 돼.” 할머니는 바늘과 실을 들며 말한다.","할머니는 정성스러운 바늘땀을 하나씩 보여 주신다.","“제자리에 있도록 매듭으로 마무리하렴.”","나는 수선한 가방을 학교에 가져가 작은 바느질 줄을 자랑스럽게 가리킨다."]},{"id":"O046","title":"미술관의 그림","targets":[{"word_id":"v1176","headword":"gallery","story_form":"gallery","form":"gallery","meaning_en":"a place where art is displayed","meaning":"미술관"},{"word_id":"v0988","headword":"exhibit","story_form":"exhibit","form":"exhibit","meaning_en":"show something to the public","meaning":"전시하다"},{"word_id":"v0397","headword":"canvas","story_form":"canvas","form":"canvas","meaning_en":"strong cloth used for painting","meaning":"캔버스"},{"word_id":"v2007","headword":"portrait","story_form":"portrait","form":"portrait","meaning_en":"a picture of a person","meaning":"초상화"},{"word_id":"v1523","headword":"landscape","story_form":"landscape","form":"landscape","meaning_en":"a picture of natural scenery","meaning":"풍경화"},{"word_id":"v0765","headword":"depict","story_form":"depict","form":"depict","meaning_en":"show something in a picture","meaning":"묘사하다"},{"word_id":"v0058","headword":"aesthetic","story_form":"aesthetic","form":"aesthetic","meaning_en":"related to beauty and art","meaning":"미적인"},{"word_id":"v0013","headword":"abstract","story_form":"abstract","form":"abstract","meaning_en":"using shapes rather than realistic objects","meaning":"추상적인"},{"word_id":"v0612","headword":"contrast","story_form":"contrast","form":"contrast","meaning_en":"a clear difference between things","meaning":"대조"},{"word_id":"v2579","headword":"subtle","story_form":"subtle","form":"subtle","meaning_en":"not obvious or easy to notice","meaning":"미묘한"}],"english":["Our **gallery** will **exhibit** paintings by local students.","I see a **portrait** on one **canvas** and a **landscape** on another.","“What does this **abstract** picture **depict**?” I ask.","“It may show a feeling rather than a place,” the artist says.","She points out the **contrast** between dark and light colors.","“Notice the **subtle** changes too; they are part of its **aesthetic** effect.”","I step back and begin to see a quiet mood in the shapes."],"korean":["우리 미술관은 지역 학생들의 그림을 전시할 예정이다.","나는 한 캔버스에서는 초상화를, 다른 캔버스에서는 풍경화를 본다.","“이 추상화는 무엇을 묘사하나요?” 내가 묻는다.","“장소보다 감정을 보여 주는 것일 수도 있어.” 작가가 말한다.","작가는 어두운 색과 밝은 색의 대조를 짚어 준다.","“미묘한 변화도 봐. 그것도 미적인 효과의 일부야.”","나는 뒤로 물러나 도형들에서 조용한 분위기를 느끼기 시작한다."]},{"id":"O047","title":"작은 조각 전시회","targets":[{"word_id":"v2323","headword":"sculpt","story_form":"sculpt","form":"sculpt","meaning_en":"make a three-dimensional work of art","meaning":"조각하다"},{"word_id":"v0491","headword":"clay","story_form":"clay","form":"clay","meaning_en":"soft earth used to make pottery","meaning":"점토"},{"word_id":"v0412","headword":"carve","story_form":"carve","form":"carve","meaning_en":"cut a shape from a hard material","meaning":"깎아 만들다"},{"word_id":"v2526","headword":"statue","story_form":"statue","form":"statue","meaning_en":"a three-dimensional figure of a person or animal","meaning":"조각상"},{"word_id":"v1719","headword":"monument","story_form":"monument","form":"monument","meaning_en":"a structure built to remember someone or something","meaning":"기념물"},{"word_id":"v1615","headword":"magnificent","story_form":"magnificent","form":"magnificent","meaning_en":"very beautiful and impressive","meaning":"장엄한"},{"word_id":"v1012","headword":"extraordinary","story_form":"extraordinary","form":"extraordinary","meaning_en":"very unusual or impressive","meaning":"놀라운"},{"word_id":"v2485","headword":"spectacle","story_form":"spectacle","form":"spectacle","meaning_en":"an impressive sight","meaning":"장관"},{"word_id":"v0205","headword":"awe","story_form":"awe","form":"awe","meaning_en":"a feeling of wonder and respect","meaning":"경외감"},{"word_id":"v1187","headword":"gaze","story_form":"gaze","form":"gaze","meaning_en":"look steadily for a long time","meaning":"응시하다"}],"english":["We watch an artist **sculpt** a small bird from **clay**.","Outside stands a **magnificent** stone **statue**.","“Did you **carve** that **monument** too?” I ask.","“No, a team made it to remember the town's first teachers,” she says.","I **gaze** at its **extraordinary** details with **awe**.","“The **spectacle** is lovely, but look at the small work as well,” she suggests.","Her tiny bird seems ready to fly, and I draw it in my notebook."],"korean":["우리는 작가가 점토로 작은 새를 조각하는 모습을 본다.","밖에는 장엄한 석상이 서 있다.","“저 기념물도 직접 깎아 만드셨나요?” 내가 묻는다.","“아니, 마을의 첫 선생님들을 기리려고 한 팀이 만들었어.” 작가가 말한다.","나는 경외감을 느끼며 놀라운 세부 표현을 응시한다.","“큰 작품도 멋지지만 작은 작품도 보렴.” 작가가 제안한다.","작은 새가 당장 날아갈 것 같아서 나는 공책에 그린다."]},{"id":"O048","title":"음악회 준비","targets":[{"word_id":"v1851","headword":"orchestra","story_form":"orchestra","form":"orchestra","meaning_en":"a large group playing musical instruments","meaning":"관현악단"},{"word_id":"v0471","headword":"choir","story_form":"choir","form":"choir","meaning_en":"a group of singers","meaning":"합창단"},{"word_id":"v0474","headword":"chorus","story_form":"chorus","form":"chorus","meaning_en":"the repeated part of a song","meaning":"후렴"},{"word_id":"v0559","headword":"compose","story_form":"compose","form":"compose","meaning_en":"write music","meaning":"작곡하다"},{"word_id":"v2238","headword":"rhythm","story_form":"rhythm","form":"rhythm","meaning_en":"a pattern of beats in music","meaning":"리듬"},{"word_id":"v1285","headword":"harmony","story_form":"harmony","form":"harmony","meaning_en":"notes that sound pleasing together","meaning":"화음"},{"word_id":"v2631","headword":"symphony","story_form":"symphony","form":"symphony","meaning_en":"a long musical work for an orchestra","meaning":"교향곡"},{"word_id":"v1679","headword":"microphone","story_form":"microphone","form":"microphone","meaning_en":"a device that makes or records sound louder","meaning":"마이크"},{"word_id":"v1454","headword":"interval","story_form":"interval","form":"interval","meaning_en":"a break between parts of a performance","meaning":"휴식 시간"},{"word_id":"v0487","headword":"clap","story_form":"clap","form":"clap","meaning_en":"hit your hands together to show approval","meaning":"박수 치다"}],"english":["Our **choir** will sing with the school **orchestra**.","A student helps **compose** a short song with an easy **chorus**.","“Listen to the **rhythm** and the **harmony**,” our teacher says.","At the **microphone**, I feel small beside all the instruments.","“Are we singing during the **symphony**?” I whisper.","“No, our song comes after the **interval**,” Mina replies.","When we finish, the audience begins to **clap**, and I finally relax."],"korean":["우리 합창단은 학교 관현악단과 함께 노래할 예정이다.","학생 한 명이 쉬운 후렴이 있는 짧은 노래의 작곡을 돕는다.","“리듬과 화음을 들어 봐.” 선생님이 말한다.","마이크 앞에서 나는 많은 악기 옆에 서니 작아진 기분이 든다.","“교향곡 연주 중에 노래하나요?” 내가 속삭인다.","“아니, 우리 노래는 휴식 시간 다음이야.” 미나가 대답한다.","우리가 마치자 관객들이 박수를 치기 시작하고 나는 마침내 긴장을 푼다."]},{"id":"O049","title":"무대 뒤의 마술","targets":[{"word_id":"v1374","headword":"illude","story_form":"illusion","form":"illusion","meaning_en":"something that seems real but is not","meaning":"착각, 환영"},{"word_id":"v0160","headword":"artifice","story_form":"artificial","form":"artificial","meaning_en":"made by people rather than nature","meaning":"인공의"},{"word_id":"v1378","headword":"imitate","story_form":"imitate","form":"imitate","meaning_en":"copy someone's actions or sounds","meaning":"흉내 내다"},{"word_id":"v1197","headword":"genuine","story_form":"genuine","form":"genuine","meaning_en":"real and not fake","meaning":"진짜의"},{"word_id":"v2854","headword":"vanish","story_form":"vanish","form":"vanish","meaning_en":"disappear suddenly","meaning":"사라지다"},{"word_id":"v0177","headword":"astonish","story_form":"astonish","form":"astonish","meaning_en":"surprise someone greatly","meaning":"깜짝 놀라게 하다"},{"word_id":"v1458","headword":"intrigue","story_form":"intrigue","form":"intrigue","meaning_en":"make someone very interested","meaning":"호기심을 끌다"},{"word_id":"v2713","headword":"thrill","story_form":"thrill","form":"thrill","meaning_en":"a strong feeling of excitement","meaning":"짜릿함"},{"word_id":"v0298","headword":"blink","story_form":"blink","form":"blink","meaning_en":"close and open your eyes quickly","meaning":"눈을 깜빡이다"},{"word_id":"v2928","headword":"weird","story_form":"weird","form":"weird","meaning_en":"strange or unusual","meaning":"기이한"}],"english":["A **weird** light fills the stage around an **artificial** tree.","The magician makes a bird **vanish** before I can **blink**.","“Is it **genuine** magic?” my brother asks.","“It is an **illusion**, designed to **astonish** us,” I say.","The hidden doors **intrigue** me, and I feel a **thrill** when the bird returns.","“Can you **imitate** that trick?” my brother asks.","I try with a paper bird at home, but he sees it under my sleeve."],"korean":["기이한 빛이 인공 나무 주위의 무대를 채운다.","마술사는 내가 눈을 깜빡이기도 전에 새를 사라지게 한다.","“진짜 마법이야?” 동생이 묻는다.","“우리를 놀라게 하도록 만든 착시야.” 내가 말한다.","숨겨진 문들이 호기심을 끌고, 새가 돌아오자 나는 짜릿함을 느낀다.","“저 마술을 흉내 낼 수 있어?” 동생이 묻는다.","나는 집에서 종이 새로 해 보지만 동생이 소매 밑의 새를 발견한다."]},{"id":"O050","title":"축제의 하루","targets":[{"word_id":"v0428","headword":"celebrate","story_form":"celebrate","form":"celebrate","meaning_en":"do something special for a happy event","meaning":"기념하다"},{"word_id":"v0122","headword":"anniversary","story_form":"anniversary","form":"anniversary","meaning_en":"the yearly date of an important event","meaning":"기념일"},{"word_id":"v0641","headword":"costume","story_form":"costume","form":"costume","meaning_en":"special clothes for a performance or event","meaning":"의상"},{"word_id":"v0702","headword":"custom","story_form":"custom","form":"custom","meaning_en":"a traditional way of doing something","meaning":"풍습"},{"word_id":"v0960","headword":"ethnic","story_form":"ethnic","form":"ethnic","meaning_en":"related to a group sharing culture or origins","meaning":"민족의"},{"word_id":"v1313","headword":"heritage","story_form":"heritage","form":"heritage","meaning_en":"traditions passed down from earlier generations","meaning":"유산"},{"word_id":"v2787","headword":"tribe","story_form":"tribe","form":"tribe","meaning_en":"a community sharing culture and ancestry","meaning":"부족"},{"word_id":"v0835","headword":"diverse","story_form":"diverse","form":"diverse","meaning_en":"including many different kinds","meaning":"다양한"},{"word_id":"v2828","headword":"unique","story_form":"unique","form":"unique","meaning_en":"unlike anything else","meaning":"독특한"},{"word_id":"v2629","headword":"symbol","story_form":"symbol","form":"symbol","meaning_en":"something representing an idea","meaning":"상징"}],"english":["Our town will **celebrate** its hundredth **anniversary** with a festival.","Families from **diverse** **ethnic** backgrounds share their **heritage**.","“Is your **costume** part of a family **custom**?” I ask a dancer.","“It comes from my **tribe**, and each pattern has a story,” she says.","She points to a bird that is a **symbol** of hope.","“Every family's version is **unique**; please ask before taking a picture.”","I ask permission and write her explanation beside my photograph."],"korean":["우리 마을은 축제로 백 주년을 기념할 예정이다.","다양한 민족적 배경을 가진 가족들이 자기 문화유산을 나눈다.","“그 의상은 가족 풍습의 일부인가요?” 내가 무용수에게 묻는다.","“우리 부족에서 전해져 오고 무늬마다 이야기가 있어.” 무용수가 말한다.","무용수는 희망의 상징인 새를 가리킨다.","“집집마다 모양이 독특해. 사진을 찍기 전에는 물어봐 줘.”","나는 허락을 구하고 사진 옆에 설명을 적는다."]},{"id":"O051","title":"새로운 친구","targets":[{"word_id":"v1381","headword":"immigrate","story_form":"immigrate","form":"immigrate","meaning_en":"move to another country to live","meaning":"이민 오다"},{"word_id":"v0086","headword":"alien","story_form":"alien","form":"alien","meaning_en":"a person who is not a citizen of a country","meaning":"외국인"},{"word_id":"v2030","headword":"prejudice","story_form":"prejudice","form":"prejudice","meaning_en":"an unfair opinion formed without enough knowledge","meaning":"편견"},{"word_id":"v0818","headword":"discriminate","story_form":"discriminate","form":"discriminate","meaning_en":"treat someone unfairly because of their group","meaning":"차별하다"},{"word_id":"v0983","headword":"exclude","story_form":"exclude","form":"exclude","meaning_en":"leave someone out","meaning":"배제하다"},{"word_id":"v1440","headword":"integrate","story_form":"integrate","form":"integrate","meaning_en":"help someone become part of a group","meaning":"통합하다, 어울리게 하다"},{"word_id":"v0096","headword":"alongside","story_form":"alongside","form":"alongside","meaning_en":"next to or together with","meaning":"~와 함께"},{"word_id":"v0087","headword":"alike","story_form":"alike","form":"alike","meaning_en":"similar to each other","meaning":"비슷한"},{"word_id":"v1745","headword":"mutual","story_form":"mutual","form":"mutual","meaning_en":"shared by two or more people","meaning":"상호의"},{"word_id":"v0916","headword":"embrace","story_form":"embrace","form":"embrace","meaning_en":"welcome and accept something","meaning":"받아들이다"}],"english":["A new student tells us that his family chose to **immigrate** last year.","He asks why an old document uses the word **alien**.","“It is a formal term here, but it can sound unwelcoming,” our teacher explains.","“We must not **discriminate** or let **prejudice** make us **exclude** anyone.”","“How can we **integrate** everyone into our team?” I ask.","“Work **alongside** each other with **mutual** respect; you do not need to be **alike**.”","We **embrace** his different ideas, and our shared drawing becomes more interesting."],"korean":["새 학생은 가족이 작년에 이민을 오기로 했다고 말한다.","그는 왜 옛 서류에 외국인을 뜻하는 alien이라는 단어가 쓰였는지 묻는다.","“여기서는 공식 용어지만 환영하지 않는 말처럼 들릴 수 있어.” 선생님이 설명한다.","“차별하거나 편견 때문에 누군가를 배제해서는 안 돼.”","“어떻게 모두가 우리 팀에 어울리도록 할 수 있을까요?” 내가 묻는다.","“서로 존중하며 함께 일해 봐. 서로 비슷할 필요는 없어.”","우리는 그의 다른 생각을 받아들이고 공동 그림은 더 흥미로워진다."]},{"id":"O052","title":"친구 사이의 오해","targets":[{"word_id":"v0135","headword":"apology","story_form":"apology","form":"apology","meaning_en":"words saying you are sorry","meaning":"사과"},{"word_id":"v1827","headword":"offend","story_form":"offend","form":"offend","meaning_en":"make someone feel hurt or upset","meaning":"기분을 상하게 하다"},{"word_id":"v1438","headword":"insult","story_form":"insult","form":"insult","meaning_en":"say something that attacks someone's dignity","meaning":"모욕하다"},{"word_id":"v1704","headword":"mock","story_form":"mock","form":"mock","meaning_en":"laugh at someone unkindly","meaning":"조롱하다"},{"word_id":"v2655","headword":"tease","story_form":"tease","form":"tease","meaning_en":"make fun of someone","meaning":"놀리다"},{"word_id":"v2244","headword":"ridicule","story_form":"ridicule","form":"ridicule","meaning_en":"make someone seem foolish by laughing at them","meaning":"비웃다"},{"word_id":"v2094","headword":"provoke","story_form":"provoke","form":"provoke","meaning_en":"cause a strong reaction","meaning":"유발하다"},{"word_id":"v1172","headword":"fury","story_form":"furious","form":"furious","meaning_en":"extremely angry","meaning":"몹시 화난"},{"word_id":"v2128","headword":"rage","story_form":"rage","form":"rage","meaning_en":"very strong anger","meaning":"격분"},{"word_id":"v2173","headword":"regret","story_form":"regret","form":"regret","meaning_en":"feel sorry about something you did","meaning":"후회하다"}],"english":["I **tease** Jun about his drawing, but my words **offend** him.","He looks **furious**, and I realize I have helped **provoke** his **rage**.","“Why do you **mock** me?” he asks.","“I meant to joke, not **insult** you,” I say.","“But you still **ridicule** something I worked hard on.”","I **regret** what I said and offer a clear **apology**.","I give him space, and later ask if he would like to explain his picture."],"korean":["나는 준의 그림을 놀리지만 내 말은 준의 기분을 상하게 한다.","준은 몹시 화나 보이고, 나는 그의 분노를 일으켰음을 깨닫는다.","“왜 나를 조롱해?” 준이 묻는다.","“농담하려던 거지 모욕하려던 건 아니었어.” 내가 말한다.","“하지만 넌 내가 열심히 만든 걸 비웃고 있잖아.”","나는 내 말을 후회하며 분명하게 사과한다.","나는 준에게 시간을 주고 나중에 그림을 설명해 줄 마음이 있는지 묻는다."]},{"id":"O053","title":"괴롭힘을 멈추다","targets":[{"word_id":"v0363","headword":"bully","story_form":"bully","form":"bully","meaning_en":"a person who repeatedly hurts or frightens others","meaning":"괴롭히는 사람"},{"word_id":"v0015","headword":"abuse","story_form":"abuse","form":"abuse","meaning_en":"cruel or harmful treatment","meaning":"학대, 가혹 행위"},{"word_id":"v0583","headword":"confront","story_form":"confront","form":"confront","meaning_en":"face a difficult person or problem directly","meaning":"직면하다"},{"word_id":"v1455","headword":"intervene","story_form":"intervene","form":"intervene","meaning_en":"become involved to stop harm or solve a problem","meaning":"개입하다"},{"word_id":"v1447","headword":"interfere","story_form":"interfere","form":"interfere","meaning_en":"get involved in someone else's activity","meaning":"간섭하다"},{"word_id":"v2221","headword":"restrain","story_form":"restrain","form":"restrain","meaning_en":"stop someone from acting freely","meaning":"제지하다"},{"word_id":"v0573","headword":"condemn","story_form":"condemn","form":"condemn","meaning_en":"say strongly that something is wrong","meaning":"규탄하다"},{"word_id":"v0804","headword":"dignity","story_form":"dignity","form":"dignity","meaning_en":"the value of a person deserving respect","meaning":"존엄"},{"word_id":"v0655","headword":"courage","story_form":"courage","form":"courage","meaning_en":"the ability to act despite fear","meaning":"용기"},{"word_id":"v0071","headword":"aggress","story_form":"aggressive","form":"aggressive","meaning_en":"ready to threaten or attack","meaning":"공격적인"}],"english":["An **aggressive** **bully** keeps taking a younger student's bag.","“Don't **interfere**,” he tells us.","I feel afraid, but find the **courage** to call a teacher.","She comes to **intervene** and **confront** the behavior.","“We **condemn** this **abuse**; everyone's **dignity** matters,” she says.","She asks another adult to help **restrain** the student from chasing the child.","We stay with the younger student while the adults make sure he is safe."],"korean":["공격적인 학생이 어린 학생의 가방을 계속 빼앗는다.","“간섭하지 마.” 그가 우리에게 말한다.","나는 두렵지만 용기를 내어 선생님을 부른다.","선생님은 개입해서 그 행동을 바로잡으려고 오신다.","“이런 가혹 행위는 용납할 수 없어. 모두의 존엄은 중요해.” 선생님이 말한다.","선생님은 학생이 아이를 쫓지 못하게 제지하는 일을 다른 어른에게 부탁한다.","어른들이 안전을 확인하는 동안 우리는 어린 학생 곁에 있는다."]},{"id":"O054","title":"말하지 못한 마음","targets":[{"word_id":"v0130","headword":"anxiety","story_form":"anxiety","form":"anxiety","meaning_en":"worry about what may happen","meaning":"불안"},{"word_id":"v0862","headword":"dread","story_form":"dread","form":"dread","meaning_en":"feel great fear about something coming","meaning":"몹시 두려워하다"},{"word_id":"v0778","headword":"despair","story_form":"despair","form":"despair","meaning_en":"a feeling that there is no hope","meaning":"절망"},{"word_id":"v1875","headword":"overwhelm","story_form":"overwhelm","form":"overwhelm","meaning_en":"become too much for someone to manage","meaning":"압도하다"},{"word_id":"v0578","headword":"confide","story_form":"confide","form":"confide","meaning_en":"tell private feelings to someone you trust","meaning":"털어놓다"},{"word_id":"v1456","headword":"intimate","story_form":"intimate","form":"intimate","meaning_en":"very personal and private","meaning":"내밀한"},{"word_id":"v2630","headword":"sympathy","story_form":"sympathy","form":"sympathy","meaning_en":"care for someone who is suffering","meaning":"위로, 공감"},{"word_id":"v1246","headword":"grief","story_form":"grief","form":"grief","meaning_en":"deep sadness after a loss","meaning":"비탄"},{"word_id":"v1167","headword":"funeral","story_form":"funeral","form":"funeral","meaning_en":"a ceremony for someone who has died","meaning":"장례식"},{"word_id":"v1240","headword":"grave","story_form":"grave","form":"grave","meaning_en":"a place where a dead person is buried","meaning":"무덤"}],"english":["After Grandpa's **funeral**, I feel **anxiety** about returning to school.","I **dread** questions, and **grief** can **overwhelm** me without warning.","At his **grave**, I tell Mom that I sometimes feel **despair**.","“You can **confide** in me, even about **intimate** feelings,” she says.","A friend later offers **sympathy** without asking many questions.","“Would you like company or some quiet time?” she asks.","I choose a short walk with her and tell Mom that I would like more support."],"korean":["할아버지의 장례식 뒤에 나는 학교로 돌아가는 일이 불안하다.","나는 질문이 몹시 두렵고 슬픔은 예고 없이 나를 압도하기도 한다.","할아버지의 무덤에서 나는 엄마에게 때때로 절망감을 느낀다고 말한다.","“내밀한 감정도 엄마에게 털어놓아도 돼.” 엄마가 말한다.","나중에 친구는 많은 질문을 하지 않고 위로해 준다.","“같이 있어 줄까, 아니면 조용히 쉬고 싶어?” 친구가 묻는다.","나는 친구와 잠깐 걷기로 하고 엄마에게 도움이 더 필요하다고 말한다."]},{"id":"O055","title":"사진 속 가족","targets":[{"word_id":"v1405","headword":"infant","story_form":"infant","form":"infant","meaning_en":"a very young baby","meaning":"영아"},{"word_id":"v0047","headword":"adolescent","story_form":"adolescent","form":"adolescent","meaning_en":"a young person growing toward adulthood","meaning":"청소년"},{"word_id":"v1644","headword":"mature","story_form":"mature","form":"mature","meaning_en":"fully grown or behaving responsibly","meaning":"성숙한"},{"word_id":"v2503","headword":"spouse","story_form":"spouse","form":"spouse","meaning_en":"a husband or wife","meaning":"배우자"},{"word_id":"v1770","headword":"nephew","story_form":"nephew","form":"nephew","meaning_en":"a brother's or sister's son","meaning":"조카"},{"word_id":"v1255","headword":"guardian","story_form":"guardian","form":"guardian","meaning_en":"a person legally responsible for a child","meaning":"보호자"},{"word_id":"v1305","headword":"heir","story_form":"heir","form":"heir","meaning_en":"a person who receives someone's property after death","meaning":"상속인"},{"word_id":"v1189","headword":"gender","story_form":"gender","form":"gender","meaning_en":"a person's identity in relation to being a man, woman, or another gender","meaning":"성별 정체성"},{"word_id":"v1113","headword":"fond","story_form":"fond","form":"fond","meaning_en":"feeling love or affection","meaning":"좋아하는"},{"word_id":"v2207","headword":"resemble","story_form":"resemble","form":"resemble","meaning_en":"look like someone or something","meaning":"닮다"}],"english":["Our family album shows Dad as an **infant** and then an **adolescent**.","“You look more **mature** here,” I say, pointing to his wedding photo.","Dad introduces a relative's **spouse** and their young **nephew** in the next picture.","“Does he **resemble** me?” Dad asks.","We find a note naming Grandma as a child's **guardian**, and another naming an **heir**.","“A family is more than names, jobs, or **gender**,” Mom says.","I am especially **fond** of the last photo, where everyone is laughing together."],"korean":["가족 앨범에는 아기 시절과 청소년 시절의 아빠 모습이 담겨 있다.","“여기서는 더 성숙해 보여요.” 내가 결혼사진을 가리키며 말한다.","아빠는 다음 사진 속 친척의 배우자와 어린 조카를 소개한다.","“이 아이가 나를 닮았니?” 아빠가 묻는다.","우리는 할머니를 한 아이의 보호자로 적은 기록과 상속인을 적은 기록을 찾는다.","“가족은 이름이나 직업, 성별만으로 설명되는 게 아니야.” 엄마가 말한다.","나는 모두가 함께 웃는 마지막 사진이 특히 좋다."]},{"id":"O056","title":"다시 시작하는 하루","targets":[{"word_id":"v2272","headword":"routine","story_form":"routine","form":"routine","meaning_en":"a usual pattern of daily activities","meaning":"일과"},{"word_id":"v0830","headword":"distract","story_form":"distract","form":"distract","meaning_en":"take attention away from something","meaning":"주의를 흩뜨리다"},{"word_id":"v1766","headword":"neglect","story_form":"neglect","form":"neglect","meaning_en":"fail to give needed care or attention","meaning":"소홀히 하다"},{"word_id":"v2666","headword":"tempt","story_form":"tempt","form":"tempt","meaning_en":"make someone want to do something","meaning":"유혹하다"},{"word_id":"v1817","headword":"obsess","story_form":"obsess","form":"obsess","meaning_en":"fill someone's mind too much","meaning":"사로잡다"},{"word_id":"v0040","headword":"addict","story_form":"addict","form":"addict","meaning_en":"a person unable to stop a harmful habit","meaning":"중독자"},{"word_id":"v1177","headword":"gamble","story_form":"gamble","form":"gamble","meaning_en":"risk money on an uncertain result","meaning":"도박하다"},{"word_id":"v0945","headword":"envy","story_form":"envy","form":"envy","meaning_en":"want what another person has","meaning":"부러워하다"},{"word_id":"v1243","headword":"greed","story_form":"greed","form":"greed","meaning_en":"a strong wish to have more than needed","meaning":"탐욕"},{"word_id":"v0588","headword":"conscience","story_form":"conscience","form":"conscience","meaning_en":"the inner sense of right and wrong","meaning":"양심"}],"english":["An online game begins to **distract** me from my daily **routine**.","I **neglect** my homework and **envy** players with more coins.","“Do the rewards **tempt** you to **gamble** with real money?” Dad asks.","“They almost **obsess** me,” I admit, and my **conscience** feels uneasy.","“That sounds difficult; **greed** is not the only reason people struggle,” he says.","We read that calling someone an **addict** can hide the person behind the problem.","Together, we close the payment page and ask for help making a healthier plan."],"korean":["온라인 게임이 내 일상에서 주의를 빼앗기 시작한다.","나는 숙제를 소홀히 하고 동전이 많은 이용자를 부러워한다.","“보상 때문에 실제 돈을 걸고 도박하고 싶어지니?” 아빠가 묻는다.","“거기에 거의 사로잡힌 것 같아요.” 나는 인정하고 양심이 불편해진다.","“힘들겠구나. 사람들이 어려움을 겪는 이유가 탐욕뿐인 건 아니야.” 아빠가 말한다.","우리는 누군가를 중독자라고만 부르면 문제 뒤의 사람이 가려질 수 있다는 글을 읽는다.","우리는 함께 결제 창을 닫고 더 건강한 계획을 세우는 데 도움을 구한다."]},{"id":"O057","title":"생각이 달라질 때","targets":[{"word_id":"v1846","headword":"optimist","story_form":"optimist","form":"optimist","meaning_en":"a person who expects good things","meaning":"낙관주의자"},{"word_id":"v0707","headword":"cynical","story_form":"cynical","form":"cynical","meaning_en":"believing people mainly act selfishly","meaning":"냉소적인"},{"word_id":"v1749","headword":"naive","story_form":"naive","form":"naive","meaning_en":"trusting too easily because of little experience","meaning":"순진한"},{"word_id":"v1495","headword":"keen","story_form":"keen","form":"keen","meaning_en":"very interested in something","meaning":"열심인"},{"word_id":"v0884","headword":"eager","story_form":"eager","form":"eager","meaning_en":"strongly wanting to do something","meaning":"간절히 바라는"},{"word_id":"v0940","headword":"enthusiastic","story_form":"enthusiastic","form":"enthusiastic","meaning_en":"showing a lot of interest and excitement","meaning":"열정적인"},{"word_id":"v0882","headword":"dynamic","story_form":"dynamic","form":"dynamic","meaning_en":"full of energy and new ideas","meaning":"활기찬"},{"word_id":"v1710","headword":"modest","story_form":"modest","form":"modest","meaning_en":"not speaking too proudly about yourself","meaning":"겸손한"},{"word_id":"v1193","headword":"generous","story_form":"generous","form":"generous","meaning_en":"willing to give or share","meaning":"너그러운"},{"word_id":"v2346","headword":"sensible","story_form":"sensible","form":"sensible","meaning_en":"showing good practical judgment","meaning":"분별 있는"}],"english":["Our **dynamic** new leader is an **optimist** about the school fair.","I am **keen** to help, but Jun sounds **cynical**.","“Isn't it **naive** to expect everyone to work for free?” he asks.","“Some people are **generous**, but we still need a **sensible** plan,” I reply.","Our **enthusiastic** leader remains **modest** about her own ideas.","“I'm **eager** to hear yours too,” she tells Jun.","He suggests shorter work periods, and more classmates agree to join."],"korean":["활기찬 새 대표는 학교 축제에 대해 낙관적이다.","나는 돕고 싶지만 준은 냉소적으로 말한다.","“모두가 무료로 일할 거라고 기대하는 건 순진하지 않아?” 준이 묻는다.","“너그러운 사람들도 있지만 그래도 분별 있는 계획이 필요해.” 내가 대답한다.","열정적인 대표는 자기 생각에 대해 겸손한 태도를 유지한다.","“네 생각도 정말 듣고 싶어.” 대표가 준에게 말한다.","준이 더 짧은 근무 시간을 제안하자 더 많은 친구가 참여하기로 한다."]},{"id":"O058","title":"마음속 질문","targets":[{"word_id":"v2095","headword":"psychology","story_form":"psychology","form":"psychology","meaning_en":"the study of the mind and behavior","meaning":"심리학"},{"word_id":"v1933","headword":"perceive","story_form":"perceive","form":"perceive","meaning_en":"notice or understand something","meaning":"인식하다"},{"word_id":"v1426","headword":"insight","story_form":"insight","form":"insight","meaning_en":"a clear understanding of something","meaning":"통찰"},{"word_id":"v1413","headword":"inherent","story_form":"inherent","form":"inherent","meaning_en":"existing as a natural part of something","meaning":"내재한"},{"word_id":"v2822","headword":"underlie","story_form":"underlie","form":"underlie","meaning_en":"be the hidden cause or basis of something","meaning":"기저에 있다"},{"word_id":"v1728","headword":"motive","story_form":"motive","form":"motive","meaning_en":"a reason for doing something","meaning":"동기"},{"word_id":"v1386","headword":"imply","story_form":"imply","form":"imply","meaning_en":"suggest without saying directly","meaning":"암시하다"},{"word_id":"v2540","headword":"stimulate","story_form":"stimulate","form":"stimulate","meaning_en":"encourage activity or interest","meaning":"자극하다"},{"word_id":"v1403","headword":"induce","story_form":"induce","form":"induce","meaning_en":"cause a state or action","meaning":"유도하다"},{"word_id":"v1414","headword":"inhibit","story_form":"inhibit","form":"inhibit","meaning_en":"hold back an action or feeling","meaning":"억제하다"}],"english":["In a **psychology** activity, we discuss why people avoid asking questions.","“How do you **perceive** silence?” our teacher asks.","“It may **imply** that someone understands,” I answer.","“Or fear may **underlie** it; the **motive** is not always clear.”","She says that an **inherent** difference in style is not automatically a problem.","“Praise can **stimulate** interest, but pressure may **induce** fear and **inhibit** questions.”","This **insight** helps me wait kindly when my quiet partner begins to speak."],"korean":["심리학 활동에서 우리는 사람들이 질문을 피하는 이유를 논의한다.","“침묵을 어떻게 인식하니?” 선생님이 묻는다.","“이해한다는 것을 암시할 수도 있어요.” 내가 대답한다.","“두려움이 그 밑에 있을 수도 있어. 동기는 늘 분명한 게 아니지.”","선생님은 방식에 내재한 차이가 곧 문제인 것은 아니라고 말한다.","“칭찬은 흥미를 자극할 수 있지만 압박은 두려움을 유도하고 질문을 억제할 수 있어.”","이 통찰 덕분에 나는 말수가 적은 짝이 말을 시작할 때 다정하게 기다린다."]},{"id":"O059","title":"서로 다른 주장","targets":[{"word_id":"v0563","headword":"compromise","story_form":"compromise","form":"compromise","meaning_en":"an agreement in which each side gives up something","meaning":"타협"},{"word_id":"v1767","headword":"negotiate","story_form":"negotiate","form":"negotiate","meaning_en":"discuss to reach an agreement","meaning":"협상하다"},{"word_id":"v1657","headword":"mediate","story_form":"mediate","form":"mediate","meaning_en":"help others settle a disagreement","meaning":"중재하다"},{"word_id":"v0824","headword":"dispute","story_form":"dispute","form":"dispute","meaning_en":"a disagreement about something important","meaning":"분쟁"},{"word_id":"v2212","headword":"resolve","story_form":"resolve","form":"resolve","meaning_en":"find an answer to a problem","meaning":"해결하다"},{"word_id":"v0488","headword":"clash","story_form":"clash","form":"clash","meaning_en":"a strong disagreement or conflict","meaning":"충돌"},{"word_id":"v0092","headword":"ally","story_form":"ally","form":"ally","meaning_en":"a person or group that supports another","meaning":"협력자, 동맹"},{"word_id":"v2782","headword":"treaty","story_form":"treaty","form":"treaty","meaning_en":"a formal agreement between countries","meaning":"조약"},{"word_id":"v0025","headword":"accord","story_form":"accord","form":"accord","meaning_en":"an agreement between groups","meaning":"합의"},{"word_id":"v0649","headword":"counterpart","story_form":"counterpart","form":"counterpart","meaning_en":"a person with the same role in another group","meaning":"상대측 담당자"}],"english":["Two classes have a **dispute** over the same garden space.","Their plans **clash**, so a teacher offers to **mediate**.","“I will **negotiate** with my **counterpart** in the other class,” Mina says.","“Try to see an **ally**, not an enemy,” our teacher suggests.","The classes reach a **compromise** and **resolve** the problem by sharing the space.","“We have an **accord**, though it isn't a **treaty** between countries,” Mina jokes.","Both classes plant seeds on the same afternoon."],"korean":["두 반이 같은 정원 공간을 두고 다툰다.","계획이 충돌하자 선생님이 중재하겠다고 한다.","“다른 반 담당자와 협상할게요.” 미나가 말한다.","“적이 아니라 협력자로 보려고 해 봐.” 선생님이 제안한다.","두 반은 공간을 나누어 쓰는 타협에 도달해 문제를 해결한다.","“나라 사이의 조약은 아니지만 합의는 이루었네.” 미나가 농담한다.","두 반은 같은 날 오후에 씨를 심는다."]},{"id":"O060","title":"박물관의 나라 이야기","targets":[{"word_id":"v1384","headword":"imperial","story_form":"imperial","form":"imperial","meaning_en":"related to an empire","meaning":"제국의"},{"word_id":"v0526","headword":"colony","story_form":"colony","form":"colony","meaning_en":"a territory controlled by another country","meaning":"식민지"},{"word_id":"v1460","headword":"invade","story_form":"invade","form":"invade","meaning_en":"enter another land by force","meaning":"침략하다"},{"word_id":"v1821","headword":"occupy","story_form":"occupy","form":"occupy","meaning_en":"take and hold control of a place","meaning":"점령하다"},{"word_id":"v1924","headword":"peasant","story_form":"peasant","form":"peasant","meaning_en":"a poor farmer in a traditional society","meaning":"농민"},{"word_id":"v2151","headword":"rebel","story_form":"rebel","form":"rebel","meaning_en":"a person resisting a ruler","meaning":"반란자"},{"word_id":"v2236","headword":"revolution","story_form":"revolution","form":"revolution","meaning_en":"a major change in government or society","meaning":"혁명"},{"word_id":"v1565","headword":"liberty","story_form":"liberty","form":"liberty","meaning_en":"freedom to live and act","meaning":"자유"},{"word_id":"v2201","headword":"republic","story_form":"republic","form":"republic","meaning_en":"a country without a hereditary monarch as head","meaning":"공화국"},{"word_id":"v0607","headword":"continent","story_form":"continent","form":"continent","meaning_en":"one of the earth's largest land areas","meaning":"대륙"}],"english":["In a museum game, we build a fictional history on an empty **continent**.","An **imperial** army plans to **invade** and **occupy** a coastal town.","“Will it become a **colony**?” I ask.","The guide gives me a card for a **peasant** who becomes a **rebel**.","“Your character wants **liberty**, but what will change after the **revolution**?” she asks.","Our group chooses a **republic** and writes rules limiting the leaders' power.","We learn that a new name alone does not guarantee a fair society."],"korean":["박물관 게임에서 우리는 빈 대륙에 가상의 역사를 만든다.","제국 군대가 해안 마을을 침략하고 점령하려 한다.","“식민지가 되나요?” 내가 묻는다.","안내자는 반란자가 되는 농민의 카드를 내게 준다.","“네 인물은 자유를 원해. 그런데 혁명 뒤에는 무엇이 달라질까?” 안내자가 묻는다.","우리 모둠은 공화국을 선택하고 지도자의 권력을 제한하는 규칙을 쓴다.","우리는 새 이름만으로 공정한 사회가 보장되지는 않음을 배운다."]},{"id":"O061","title":"국회의 하루","targets":[{"word_id":"v1899","headword":"parliament","story_form":"parliament","form":"parliament","meaning_en":"a group elected to make a country's laws","meaning":"의회"},{"word_id":"v0586","headword":"congress","story_form":"congress","form":"congress","meaning_en":"a national lawmaking assembly","meaning":"국회, 의회"},{"word_id":"v1555","headword":"legislate","story_form":"legislate","form":"legislate","meaning_en":"make laws","meaning":"입법하다"},{"word_id":"v0756","headword":"democracy","story_form":"democracy","form":"democracy","meaning_en":"government in which people choose their leaders","meaning":"민주주의"},{"word_id":"v0757","headword":"democrat","story_form":"democrat","form":"democrat","meaning_en":"a person who supports democracy","meaning":"민주주의자"},{"word_id":"v1564","headword":"liberal","story_form":"liberal","form":"liberal","meaning_en":"supporting freedom and openness to change","meaning":"자유주의적인"},{"word_id":"v1370","headword":"ideology","story_form":"ideology","form":"ideology","meaning_en":"a system of political or social ideas","meaning":"이념"},{"word_id":"v0543","headword":"communist","story_form":"communist","form":"communist","meaning_en":"a supporter of common ownership of production","meaning":"공산주의자"},{"word_id":"v1052","headword":"federal","story_form":"federal","form":"federal","meaning_en":"sharing power between national and regional governments","meaning":"연방의"},{"word_id":"v1694","headword":"ministry","story_form":"ministry","form":"ministry","meaning_en":"a government department","meaning":"정부 부처"}],"english":["In a classroom game, we create a **federal** country and choose a **parliament**.","“Could we call it a **congress** instead?” Jun asks.","“Yes; names vary, but tell us how it will **legislate**,” our teacher says.","One card describes a **liberal** **ideology**, and another a **communist** position.","“Can a **democrat** disagree with both?” I ask.","“Yes; support for **democracy** does not settle every policy question.”","We give each **ministry** a job and let the class question its plans."],"korean":["교실 게임에서 우리는 연방 국가를 만들고 의회를 뽑는다.","“대신 congress라고 불러도 되나요?” 준이 묻는다.","“그래. 이름은 다양하니까 어떻게 입법할지 설명해 봐.” 선생님이 말한다.","카드 하나는 자유주의 이념을, 다른 하나는 공산주의자의 입장을 설명한다.","“민주주의자는 둘 다 동의하지 않을 수 있나요?” 내가 묻는다.","“그래. 민주주의 지지가 모든 정책 문제의 답을 정해 주는 것은 아니야.”","우리는 각 부처에 일을 맡기고 반 친구들이 계획에 질문하도록 한다."]},{"id":"O062","title":"도시를 바꾸는 계획","targets":[{"word_id":"v1648","headword":"mayor","story_form":"mayor","form":"mayor","meaning_en":"the elected leader of a town or city","meaning":"시장"},{"word_id":"v1678","headword":"metropolitan","story_form":"metropolitan","form":"metropolitan","meaning_en":"related to a large city and nearby areas","meaning":"대도시권의"},{"word_id":"v2841","headword":"urban","story_form":"urban","form":"urban","meaning_en":"related to towns and cities","meaning":"도시의"},{"word_id":"v2281","headword":"rural","story_form":"rural","form":"rural","meaning_en":"related to the countryside","meaning":"농촌의"},{"word_id":"v2093","headword":"province","story_form":"province","form":"province","meaning_en":"a major region of a country","meaning":"주, 도"},{"word_id":"v2333","headword":"sector","story_form":"sector","form":"sector","meaning_en":"one part of an economy or society","meaning":"부문"},{"word_id":"v2930","headword":"welfare","story_form":"welfare","form":"welfare","meaning_en":"people's health and well-being","meaning":"복지"},{"word_id":"v1385","headword":"implement","story_form":"implement","form":"implement","meaning_en":"put a plan into action","meaning":"시행하다"},{"word_id":"v1018","headword":"facilitate","story_form":"facilitate","form":"facilitate","meaning_en":"make an activity easier","meaning":"촉진하다"},{"word_id":"v2003","headword":"populate","story_form":"populate","form":"populate","meaning_en":"live in an area as its inhabitants","meaning":"거주하다"}],"english":["Our class sends a bus proposal to the **mayor**.","The route would connect a **rural** village with the **metropolitan** area.","“Who would **populate** the new homes near the station?” an official asks.","We include families moving from both **urban** neighborhoods and elsewhere in the **province**.","“Could the transport **sector** **implement** this next year?” I ask.","“We must study costs and how it would **facilitate** travel and improve **welfare**,” she says.","We leave with a list of questions to ask the people who would use the bus."],"korean":["우리 반은 시장에게 버스 제안서를 보낸다.","그 노선은 농촌 마을과 대도시권을 연결할 것이다.","“역 근처 새집에는 누가 거주하게 될까요?” 관계자가 묻는다.","우리는 도시 지역과 도내 다른 곳에서 이사하는 가족들을 포함한다.","“교통 부문에서 내년에 이것을 시행할 수 있나요?” 내가 묻는다.","“비용과 함께 이동을 어떻게 돕고 복지를 개선할지 검토해야 해요.” 관계자가 말한다.","우리는 버스 이용 예정자들에게 물을 질문 목록을 가지고 나온다."]},{"id":"O063","title":"법정에서 밝혀진 일","targets":[{"word_id":"v1492","headword":"jury","story_form":"jury","form":"jury","meaning_en":"a group chosen to decide facts in a trial","meaning":"배심원단"},{"word_id":"v0620","headword":"convict","story_form":"convict","form":"convict","meaning_en":"find someone guilty in court","meaning":"유죄로 판결하다"},{"word_id":"v1475","headword":"jail","story_form":"jail","form":"jail","meaning_en":"a place where people are kept in custody","meaning":"구치소, 감옥"},{"word_id":"v0701","headword":"custody","story_form":"custody","form":"custody","meaning_en":"being held by legal authorities","meaning":"구금"},{"word_id":"v1739","headword":"murder","story_form":"murder","form":"murder","meaning_en":"the unlawful intentional killing of a person","meaning":"살인"},{"word_id":"v0167","headword":"assault","story_form":"assault","form":"assault","meaning_en":"an unlawful physical attack","meaning":"폭행"},{"word_id":"v0740","headword":"defend","story_form":"defend","form":"defend","meaning_en":"argue in support of an accused person","meaning":"변호하다"},{"word_id":"v0647","headword":"counsel","story_form":"counsel","form":"counsel","meaning_en":"a lawyer giving legal advice or representation","meaning":"변호인"},{"word_id":"v1928","headword":"penalty","story_form":"penalty","form":"penalty","meaning_en":"a punishment for breaking a rule or law","meaning":"형벌"},{"word_id":"v0750","headword":"deliberate","story_form":"deliberate","form":"deliberate","meaning_en":"done intentionally","meaning":"고의적인"}],"english":["Our drama club rehearses a fictional trial, and I play a member of the **jury**.","The script first mentions **assault**, then a charge of **murder**.","“Was the act **deliberate**?” I ask the student playing **counsel**.","“My job is to **defend** the accused, not invent facts,” she answers.","The character is in **custody** in a **jail** while the story unfolds.","“We cannot **convict** someone just because we dislike them or want a **penalty**,” our director says.","We rewrite the scene so the audience can follow the evidence."],"korean":["연극 동아리에서 가상의 재판을 연습하며 나는 배심원 역할을 맡는다.","대본에는 처음에 폭행이, 그다음에는 살인 혐의가 나온다.","“그 행위는 고의적이었나요?” 내가 변호인 역할의 학생에게 묻는다.","“내 일은 피고인을 변호하는 것이지 사실을 지어내는 게 아니야.” 그 학생이 대답한다.","이야기가 전개되는 동안 그 인물은 구치소에 구금되어 있다.","“싫어하거나 벌주고 싶다는 이유로 누군가에게 유죄 판결을 내릴 수는 없어.” 연출자가 말한다.","우리는 관객이 증거를 따라갈 수 있도록 장면을 다시 쓴다."]},{"id":"O064","title":"전쟁 전시관에서","targets":[{"word_id":"v1179","headword":"gang","story_form":"gang","form":"gang","meaning_en":"a group involved in crime or trouble","meaning":"폭력 집단"},{"word_id":"v2247","headword":"riot","story_form":"riot","form":"riot","meaning_en":"violent public disorder involving a crowd","meaning":"폭동"},{"word_id":"v2681","headword":"terror","story_form":"terror","form":"terror","meaning_en":"extreme fear","meaning":"공포"},{"word_id":"v1344","headword":"hostile","story_form":"hostile","form":"hostile","meaning_en":"unfriendly and threatening","meaning":"적대적인"},{"word_id":"v0529","headword":"combat","story_form":"combat","form":"combat","meaning_en":"fighting between armed forces","meaning":"전투"},{"word_id":"v1700","headword":"missile","story_form":"missile","form":"missile","meaning_en":"a weapon sent through the air at a target","meaning":"미사일"},{"word_id":"v2793","headword":"troop","story_form":"troop","form":"troop","meaning_en":"a group of soldiers","meaning":"부대"},{"word_id":"v2574","headword":"submarine","story_form":"submarine","form":"submarine","meaning_en":"a ship that travels underwater","meaning":"잠수함"},{"word_id":"v2611","headword":"surrender","story_form":"surrender","form":"surrender","meaning_en":"stop fighting and accept defeat","meaning":"항복하다"},{"word_id":"v2229","headword":"retreat","story_form":"retreat","form":"retreat","meaning_en":"move back from danger or an enemy","meaning":"후퇴하다"}],"english":["A museum film shows a town where a violent **gang** starts a **riot**.","The next room describes the **terror** civilians feel during war.","“Is that a **missile** beside the **submarine** model?” I ask.","“Yes, but our focus is the cost of **combat**,” the guide says.","A letter describes a **troop** facing **hostile** forces.","“They chose to **retreat**, then **surrender**, so the fighting could end here.”","I write about the families returning home rather than the weapons in the display."],"korean":["박물관 영상은 폭력 집단이 폭동을 일으킨 마을을 보여 준다.","다음 방은 전쟁 중 민간인이 느끼는 공포를 설명한다.","“잠수함 모형 옆에 있는 건 미사일인가요?” 내가 묻는다.","“그래. 하지만 이 전시의 초점은 전투가 치르게 하는 대가야.” 안내자가 말한다.","편지에는 적대적인 군대와 마주한 부대가 나온다.","“그들은 후퇴한 뒤 항복하기로 했고, 이곳의 전투가 끝날 수 있었어.”","나는 전시된 무기보다 집으로 돌아가는 가족들에 관해 쓴다."]},{"id":"O065","title":"사라진 그림","targets":[{"word_id":"v0565","headword":"conceal","story_form":"conceal","form":"conceal","meaning_en":"keep something hidden","meaning":"숨기다"},{"word_id":"v0577","headword":"confess","story_form":"confess","form":"confess","meaning_en":"admit doing something wrong","meaning":"자백하다"},{"word_id":"v0272","headword":"betray","story_form":"betray","form":"betray","meaning_en":"break someone's trust","meaning":"배신하다"},{"word_id":"v0639","headword":"corrupt","story_form":"corrupt","form":"corrupt","meaning_en":"dishonest in the use of power","meaning":"부패한"},{"word_id":"v2304","headword":"scandal","story_form":"scandal","form":"scandal","meaning_en":"an event causing public shock over wrongdoing","meaning":"추문"},{"word_id":"v1625","headword":"manipulate","story_form":"manipulate","form":"manipulate","meaning_en":"control people or information unfairly","meaning":"조종하다"},{"word_id":"v1864","headword":"outrage","story_form":"outrage","form":"outrage","meaning_en":"strong anger at something unfair","meaning":"격분"},{"word_id":"v2232","headword":"revenge","story_form":"revenge","form":"revenge","meaning_en":"harm done in return for earlier harm","meaning":"복수"},{"word_id":"v2906","headword":"warrant","story_form":"warrant","form":"warrant","meaning_en":"an official order allowing a legal action","meaning":"영장"},{"word_id":"v0189","headword":"attribute","story_form":"attribute","form":"attribute","meaning_en":"say something was caused by something else","meaning":"~의 탓으로 돌리다"}],"english":["In our detective story, a **corrupt** dealer tries to **conceal** a stolen painting.","He hopes to **manipulate** his assistant and **attribute** the loss to her.","“Why would you **betray** someone who trusts you?” the detective asks.","A court issues a **warrant**, and the painting is found.","The **scandal** causes **outrage**, but the assistant refuses to seek **revenge**.","“Tell the truth and **confess**,” she says.","We end the story with the painting returned and the evidence sent to court."],"korean":["우리 추리 이야기에서 부패한 거래상이 훔친 그림을 숨기려 한다.","그는 조수를 조종하고 그림 분실을 조수 탓으로 돌리려 한다.","“왜 당신을 믿는 사람을 배신하죠?” 탐정이 묻는다.","법원이 영장을 발부하고 그림이 발견된다.","추문은 분노를 일으키지만 조수는 복수하지 않겠다고 한다.","“진실을 말하고 자백하세요.” 조수가 말한다.","우리는 그림이 돌아오고 증거가 법원에 제출되는 것으로 이야기를 끝낸다."]},{"id":"O066","title":"옛이야기 속 선택","targets":[{"word_id":"v1508","headword":"knight","story_form":"knight","form":"knight","meaning_en":"a soldier with a special rank in old stories","meaning":"기사"},{"word_id":"v1787","headword":"noble","story_form":"noble","form":"noble","meaning_en":"showing high moral qualities","meaning":"고결한"},{"word_id":"v1725","headword":"mortal","story_form":"mortal","form":"mortal","meaning_en":"a human being who can die","meaning":"인간"},{"word_id":"v0782","headword":"destiny","story_form":"destiny","form":"destiny","meaning_en":"the future believed to be meant for someone","meaning":"운명"},{"word_id":"v1045","headword":"fate","story_form":"fate","form":"fate","meaning_en":"the power thought to control events","meaning":"운명"},{"word_id":"v2284","headword":"sacred","story_form":"sacred","form":"sacred","meaning_en":"treated as holy or deeply important","meaning":"신성한"},{"word_id":"v2285","headword":"sacrifice","story_form":"sacrifice","form":"sacrifice","meaning_en":"give up something valuable for others","meaning":"희생하다"},{"word_id":"v2881","headword":"virtue","story_form":"virtue","form":"virtue","meaning_en":"a good moral quality","meaning":"미덕"},{"word_id":"v2951","headword":"wicked","story_form":"wicked","form":"wicked","meaning_en":"deliberately very bad","meaning":"사악한"},{"word_id":"v0245","headword":"beast","story_form":"beast","form":"beast","meaning_en":"an animal, especially a large or dangerous one","meaning":"짐승"}],"english":["In an old tale, a **knight** reaches a **sacred** forest.","A frightened **beast** blocks the path to a **wicked** king's castle.","“Is it my **destiny** to fight?” the knight asks a wise woman.","“You are a **mortal**, not a servant of **fate**,” she replies.","He chooses to **sacrifice** his chance of fame and help the wounded animal.","“That is a **noble** act; kindness is a **virtue** too,” she says.","The animal moves aside, and the knight finds a peaceful road around the castle."],"korean":["옛이야기에서 기사가 신성한 숲에 도착한다.","겁먹은 짐승이 사악한 왕의 성으로 가는 길을 막는다.","“싸우는 것이 제 운명인가요?” 기사가 현명한 여인에게 묻는다.","“당신은 인간이지 운명의 하인이 아니에요.” 여인이 대답한다.","기사는 명성을 얻을 기회를 희생하고 다친 동물을 돕기로 한다.","“고결한 행동이군요. 친절도 미덕이니까요.” 여인이 말한다.","동물이 비켜서자 기사는 성을 돌아가는 평화로운 길을 발견한다."]},{"id":"O067","title":"잠에서 깬 아이","targets":[{"word_id":"v1784","headword":"nightmare","story_form":"nightmare","form":"nightmare","meaning_en":"a frightening dream","meaning":"악몽"},{"word_id":"v1717","headword":"monster","story_form":"monster","form":"monster","meaning_en":"an imaginary frightening creature","meaning":"괴물"},{"word_id":"v0758","headword":"demon","story_form":"demon","form":"demon","meaning_en":"an evil spirit in stories or beliefs","meaning":"악령"},{"word_id":"v0791","headword":"devil","story_form":"devil","form":"devil","meaning_en":"an evil being in stories or beliefs","meaning":"악마"},{"word_id":"v1290","headword":"haunt","story_form":"haunt","form":"haunt","meaning_en":"keep returning to someone's mind","meaning":"계속 마음에 떠오르다"},{"word_id":"v1340","headword":"horror","story_form":"horror","form":"horror","meaning_en":"a strong feeling of fear","meaning":"공포"},{"word_id":"v0698","headword":"curse","story_form":"curse","form":"curse","meaning_en":"words believed to bring bad luck","meaning":"저주"},{"word_id":"v0837","headword":"divine","story_form":"divine","form":"divine","meaning_en":"related to a god","meaning":"신의"},{"word_id":"v1331","headword":"holy","story_form":"holy","form":"holy","meaning_en":"connected with religion and treated with respect","meaning":"성스러운"},{"word_id":"v1554","headword":"legend","story_form":"legend","form":"legend","meaning_en":"an old traditional story","meaning":"전설"}],"english":["I wake from a **nightmare** after reading a frightening **legend**.","A **monster**, a **demon**, and a **devil** filled the story.","“Will that **curse** follow me?” I ask Mom in **horror**.","“No, you were dreaming; those pictures can **haunt** your thoughts for a while.”","The tale also had a **holy** mountain and a voice described as **divine**.","“Let's choose a calmer ending together,” Mom suggests.","We imagine the mountain in daylight, and I feel ready to close the book."],"korean":["나는 무서운 전설을 읽은 뒤 악몽에서 깬다.","이야기에는 괴물과 악령과 악마가 가득했다.","“그 저주가 나를 따라올까요?” 내가 공포에 질려 엄마에게 묻는다.","“아니, 꿈을 꾼 거야. 그런 장면이 잠시 마음에 계속 떠오를 수는 있어.”","이야기에는 성스러운 산과 신의 목소리라고 묘사된 소리도 있었다.","“함께 더 편안한 결말을 골라 보자.” 엄마가 제안한다.","우리는 햇빛 아래의 산을 상상하고 나는 책을 덮을 마음이 든다."]},{"id":"O068","title":"마을의 오래된 예배당","targets":[{"word_id":"v2184","headword":"religion","story_form":"religion","form":"religion","meaning_en":"beliefs and practices concerning the sacred","meaning":"종교"},{"word_id":"v2048","headword":"priest","story_form":"priest","form":"priest","meaning_en":"a religious leader in some traditions","meaning":"성직자"},{"word_id":"v2023","headword":"preach","story_form":"preach","form":"preach","meaning_en":"give a religious talk","meaning":"설교하다"},{"word_id":"v2980","headword":"worship","story_form":"worship","form":"worship","meaning_en":"show religious respect and devotion","meaning":"예배하다"},{"word_id":"v2408","headword":"sin","story_form":"sin","form":"sin","meaning_en":"an act considered wrong by a religion","meaning":"죄"},{"word_id":"v2664","headword":"temple","story_form":"temple","form":"temple","meaning_en":"a building used for religious worship","meaning":"사원"},{"word_id":"v1947","headword":"philosophy","story_form":"philosophy","form":"philosophy","meaning_en":"the study of deep questions about life","meaning":"철학"},{"word_id":"v1747","headword":"myth","story_form":"myth","form":"myth","meaning_en":"a traditional story expressing a culture's beliefs","meaning":"신화"},{"word_id":"v2348","headword":"sentiment","story_form":"sentiment","form":"sentiment","meaning_en":"a feeling or opinion","meaning":"정서, 감정"},{"word_id":"v2870","headword":"vice","story_form":"vice","form":"vice","meaning_en":"a harmful habit or moral fault","meaning":"악덕"}],"english":["Our class visits a **temple** to learn about **religion** and local history.","A **priest** explains why people come to **worship**.","“What do you **preach** about?” I ask.","“Kindness, and how our tradition understands **sin** and **vice**,” he says.","A wall painting tells a **myth** with a strong **sentiment** of hope.","“Is this also **philosophy**?” my friend asks, and our teacher invites us to compare the questions.","We listen respectfully and write what we learned without expecting everyone to share one belief."],"korean":["우리 반은 종교와 지역 역사를 배우려고 사원을 방문한다.","성직자는 사람들이 예배하러 오는 이유를 설명한다.","“무엇에 관해 설교하시나요?” 내가 묻는다.","“친절과 우리 전통이 죄와 악덕을 어떻게 이해하는지 이야기해요.” 성직자가 말한다.","벽화는 희망의 정서가 강한 신화를 들려준다.","“이것도 철학인가요?” 친구가 묻자 선생님은 다루는 질문들을 비교해 보자고 한다.","우리는 모두가 같은 믿음을 가져야 한다고 생각하지 않고 존중하며 듣고 배운 것을 적는다."]},{"id":"O069","title":"다시 세운 다리","targets":[{"word_id":"v0147","headword":"architect","story_form":"architect","form":"architect","meaning_en":"a person who designs buildings","meaning":"건축가"},{"word_id":"v0805","headword":"dimension","story_form":"dimension","form":"dimension","meaning_en":"a measurement such as length or width","meaning":"치수"},{"word_id":"v1144","headword":"framework","story_form":"framework","form":"framework","meaning_en":"a supporting structure","meaning":"골조"},{"word_id":"v1483","headword":"joint","story_form":"joint","form":"joint","meaning_en":"a place where two parts meet","meaning":"접합부"},{"word_id":"v2259","headword":"rod","story_form":"rod","form":"rod","meaning_en":"a long thin straight piece","meaning":"막대"},{"word_id":"v0631","headword":"cord","story_form":"cord","form":"cord","meaning_en":"a strong thick string","meaning":"끈"},{"word_id":"v2479","headword":"span","story_form":"span","form":"span","meaning_en":"the distance between two supports","meaning":"지간, 두 지점 사이의 거리"},{"word_id":"v2176","headword":"reinforce","story_form":"reinforce","form":"reinforce","meaning_en":"make something stronger","meaning":"보강하다"},{"word_id":"v0626","headword":"coordinate","story_form":"coordinate","form":"coordinate","meaning_en":"organize parts so they work together","meaning":"조율하다"},{"word_id":"v1889","headword":"panel","story_form":"panel","form":"panel","meaning_en":"a flat piece forming part of a structure","meaning":"판"}],"english":["An **architect** helps our class build a model bridge.","We measure each **dimension** and decide the **span** between the banks.","“Can this **rod** support the **framework**?” I ask.","“Test the **joint** first, then **reinforce** the weak part,” she says.","We tie a **cord** around the base and add a light **panel** on top.","“Someone must **coordinate** the test,” Mina reminds us.","She counts slowly as we add small weights and record when the model bends."],"korean":["건축가가 우리 반의 모형 다리 만들기를 돕는다.","우리는 각 치수를 재고 양쪽 둑 사이의 거리를 정한다.","“이 막대가 골조를 지탱할 수 있나요?” 내가 묻는다.","“먼저 접합부를 시험하고 약한 부분을 보강하렴.” 건축가가 말한다.","우리는 바닥 주위에 끈을 묶고 위에 가벼운 판을 얹는다.","“누군가 시험 진행을 조율해야 해.” 미나가 알려 준다.","미나가 천천히 수를 세는 동안 우리는 작은 추를 더하고 모형이 휘는 때를 기록한다."]},{"id":"O070","title":"숫자를 읽는 법","targets":[{"word_id":"v2525","headword":"statistic","story_form":"statistic","form":"statistic","meaning_en":"a number describing collected information","meaning":"통계 수치"},{"word_id":"v2114","headword":"quantity","story_form":"quantity","form":"quantity","meaning_en":"how much of something there is","meaning":"수량"},{"word_id":"v2083","headword":"proportion","story_form":"proportion","form":"proportion","meaning_en":"one part compared with the whole","meaning":"비율"},{"word_id":"v1142","headword":"fraction","story_form":"fraction","form":"fraction","meaning_en":"a part of a whole","meaning":"분수, 일부"},{"word_id":"v1693","headword":"minimum","story_form":"minimum","form":"minimum","meaning_en":"the smallest amount allowed or possible","meaning":"최소값"},{"word_id":"v0736","headword":"decrease","story_form":"decrease","form":"decrease","meaning_en":"become smaller in amount","meaning":"감소하다"},{"word_id":"v0806","headword":"diminish","story_form":"diminish","form":"diminish","meaning_en":"become less strong or less in amount","meaning":"줄어들다"},{"word_id":"v0977","headword":"exceed","story_form":"exceed","form":"exceed","meaning_en":"be greater than a limit","meaning":"초과하다"},{"word_id":"v0980","headword":"excess","story_form":"excess","form":"excess","meaning_en":"an amount more than is needed","meaning":"초과량"},{"word_id":"v1688","headword":"million","story_form":"million","form":"million","meaning_en":"one thousand thousand","meaning":"백만"}],"english":["Our class studies a **statistic** about a city's water use.","The **quantity** is over a **million** liters a day.","“What **proportion** is used by schools?” I ask.","Our teacher shows that **fraction** on a circle and marks a **minimum** target for saving.","“If waste can **decrease**, total use may **diminish** too,” Mina says.","“But we must not **exceed** our budget or buy an **excess** of new equipment,” I add.","We begin by measuring our own school's use for a week."],"korean":["우리 반은 도시의 물 사용량에 관한 통계 수치를 살펴본다.","수량은 하루 백만 리터가 넘는다.","“학교가 사용하는 비율은 얼마인가요?” 내가 묻는다.","선생님은 원 위에 그 비율을 표시하고 절약을 위한 최소 목표를 적는다.","“낭비가 감소하면 전체 사용량도 줄어들 수 있어.” 미나가 말한다.","“하지만 예산을 넘기거나 새 장비를 필요 이상으로 사면 안 돼.” 내가 덧붙인다.","우리는 먼저 일주일 동안 우리 학교의 사용량을 재기로 한다."]},{"id":"O071","title":"설문 조사","targets":[{"word_id":"v2118","headword":"questionnaire","story_form":"questionnaire","form":"questionnaire","meaning_en":"a written set of questions","meaning":"설문지"},{"word_id":"v2134","headword":"random","story_form":"random","form":"random","meaning_en":"chosen without a planned pattern","meaning":"무작위의"},{"word_id":"v1400","headword":"index","story_form":"index","form":"index","meaning_en":"an organized list for finding information","meaning":"색인"},{"word_id":"v2068","headword":"profile","story_form":"profile","form":"profile","meaning_en":"a short description of a person or group","meaning":"특성 소개"},{"word_id":"v2785","headword":"trend","story_form":"trend","form":"trend","meaning_en":"a general direction of change","meaning":"추세"},{"word_id":"v2027","headword":"predict","story_form":"predict","form":"predict","meaning_en":"say what you think will happen","meaning":"예측하다"},{"word_id":"v0575","headword":"conduct","story_form":"conduct","form":"conduct","meaning_en":"organize and carry out an activity","meaning":"실시하다"},{"word_id":"v1926","headword":"peer","story_form":"peer","form":"peer","meaning_en":"a person of similar age or position","meaning":"또래"},{"word_id":"v0769","headword":"derive","story_form":"derive","form":"derive","meaning_en":"get information or ideas from something","meaning":"얻다, 도출하다"},{"word_id":"v0827","headword":"distinct","story_form":"distinct","form":"distinct","meaning_en":"clearly different","meaning":"뚜렷이 다른"}],"english":["We **conduct** a reading survey with a short **questionnaire**.","Each **peer** we ask comes from a **random** selection of students.","“Can we **derive** a reader **profile** from these answers?” I ask.","“Yes, but don't **predict** too much from a small group,” our teacher says.","We notice a **trend** toward short stories, with two **distinct** groups of interests.","“Add an **index** so people can find each question,” Mina suggests.","We share the report and invite students to explain answers we may have misunderstood."],"korean":["우리는 짧은 설문지로 독서 조사를 실시한다.","조사하는 또래들은 학생들 가운데 무작위로 선정된다.","“이 답변에서 독자의 특성을 도출할 수 있을까요?” 내가 묻는다.","“그래. 하지만 작은 집단만 보고 너무 많은 것을 예측하지 마.” 선생님이 말한다.","우리는 짧은 이야기를 선호하는 추세와 뚜렷이 다른 두 관심 집단을 발견한다.","“질문을 하나씩 찾을 수 있도록 색인을 넣자.” 미나가 제안한다.","우리는 보고서를 공유하고 오해했을 수 있는 답변을 학생들이 설명하도록 한다."]},{"id":"O072","title":"환경 발표회","targets":[{"word_id":"v2690","headword":"theme","story_form":"theme","form":"theme","meaning_en":"the main subject of a work","meaning":"주제"},{"word_id":"v1862","headword":"outline","story_form":"outline","form":"outline","meaning_en":"a short plan showing main points","meaning":"개요"},{"word_id":"v1319","headword":"highlight","story_form":"highlight","form":"highlight","meaning_en":"draw attention to something important","meaning":"강조하다"},{"word_id":"v0921","headword":"emphasis","story_form":"emphasis","form":"emphasis","meaning_en":"special attention given to something","meaning":"강조"},{"word_id":"v1166","headword":"fundamental","story_form":"fundamental","form":"fundamental","meaning_en":"forming the basic part of something","meaning":"근본적인"},{"word_id":"v0682","h
