"word_id":"v2510","headword":"stable","story_form":"stable","form":"stable","meaning_en":"a building where horses are kept","meaning":"마구간"},{"word_id":"v0411","headword":"cart","story_form":"cart","form":"cart","meaning_en":"a vehicle with wheels for carrying things","meaning":"수레"},{"word_id":"v1588","headword":"load","story_form":"load","form":"load","meaning_en":"things being carried","meaning":"짐"},{"word_id":"v2261","headword":"roll","story_form":"roll","form":"roll","meaning_en":"move something by turning it over and over","meaning":"굴리다"},{"word_id":"v2099","headword":"pull","story_form":"pull","form":"pull","meaning_en":"move something toward you using force","meaning":"끌다"}],"english":["In the **countryside**, we visit a farm with **sheep** and a little **lamb**.","I **pull** a **cart** with a small **load** of food toward the **stable**.","My brother helps me **roll** a heavy bucket across the **lawn**.","Then we fix the **fence** so the animals can stay safely inside."],"korean":["시골에서 우리는 양들과 어린 양 한 마리가 있는 농장을 방문한다.","나는 먹이를 조금 실은 수레를 마구간 쪽으로 끈다.","남동생은 무거운 양동이를 잔디밭 너머로 굴리는 것을 도와준다.","그런 다음 우리는 동물들이 안에 안전하게 있을 수 있도록 울타리를 고친다."]},{"id":"C037","title":"해변 청소","targets":[{"word_id":"v1997","headword":"pollute","story_form":"pollute","form":"pollute","meaning_en":"make air or water dirty and harmful","meaning":"오염시키다"},{"word_id":"v2908","headword":"waste","story_form":"waste","form":"waste","meaning_en":"things people throw away","meaning":"쓰레기"},{"word_id":"v0280","headword":"bin","story_form":"bin","form":"bin","meaning_en":"a container for rubbish","meaning":"쓰레기통"},{"word_id":"v2984","headword":"wrap","story_form":"wrap","form":"wrap","meaning_en":"material used to cover something","meaning":"포장지"},{"word_id":"v2193","headword":"remove","story_form":"remove","form":"remove","meaning_en":"take something away","meaning":"제거하다"},{"word_id":"v1186","headword":"gather","story_form":"gather","form":"gather","meaning_en":"bring things together","meaning":"모으다"},{"word_id":"v1284","headword":"harm","story_form":"harm","form":"harm","meaning_en":"hurt or damage something","meaning":"해치다"},{"word_id":"v0706","headword":"cycle","story_form":"cycle","form":"cycle","meaning_en":"a series of events that repeats","meaning":"주기"},{"word_id":"v2163","headword":"reduce","story_form":"reduce","form":"reduce","meaning_en":"make something smaller or less","meaning":"줄이다"},{"word_id":"v2214","headword":"resource","story_form":"resource","form":"resource","meaning_en":"something useful that people can use","meaning":"자원"}],"english":["Plastic **waste** can **pollute** the sea and **harm** animals.","We **gather** old food **wrap** from the beach and **remove** it from the sand.","Each full bag goes into a **bin** for the town workers to collect.","We learn that water moves in a **cycle** and that clean water is an important **resource**.","At home, we try to **reduce** the rubbish we make."],"korean":["플라스틱 쓰레기는 바다를 오염시키고 동물들을 해칠 수 있다.","우리는 해변에서 버려진 식품 포장지를 모아 모래 위에서 치운다.","가득 찬 봉지는 마을의 청소 담당자들이 수거하도록 쓰레기통에 넣는다.","우리는 물이 순환하며 깨끗한 물이 소중한 자원이라는 점을 배운다.","집에서도 우리는 만들어 내는 쓰레기를 줄이려고 한다."]},{"id":"C038","title":"산길에서","targets":[{"word_id":"v0498","headword":"cliff","story_form":"cliff","form":"cliff","meaning_en":"a high steep face of rock","meaning":"절벽"},{"word_id":"v2851","headword":"valley","story_form":"valley","form":"valley","meaning_en":"low land between hills or mountains","meaning":"계곡"},{"word_id":"v1753","headword":"narrow","story_form":"narrow","form":"narrow","meaning_en":"not wide","meaning":"좁은"},{"word_id":"v1915","headword":"path","story_form":"path","form":"path","meaning_en":"a small track for walking","meaning":"길"},{"word_id":"v2269","headword":"rough","story_form":"rough","form":"rough","meaning_en":"not smooth or even","meaning":"거친"},{"word_id":"v1730","headword":"mount","story_form":"mount","form":"mount","meaning_en":"go up something such as steps","meaning":"오르다"},{"word_id":"v1545","headword":"leap","story_form":"leap","form":"leap","meaning_en":"jump over something","meaning":"뛰어넘다"},{"word_id":"v2432","headword":"slip","story_form":"slip","form":"slip","meaning_en":"slide by accident","meaning":"미끄러지다"},{"word_id":"v2266","headword":"rope","story_form":"rope","form":"rope","meaning_en":"a thick strong cord","meaning":"밧줄"},{"word_id":"v0215","headword":"balance","story_form":"balance","form":"balance","meaning_en":"the ability to stay steady without falling","meaning":"균형"}],"english":["We follow a **narrow** **path** above a green **valley**.","Near a **cliff**, the ground is **rough**, so I hold a **rope** to keep my **balance**.","Our guide tells us not to **leap** from rock to rock because we might **slip**.","We slowly **mount** the last few steps and stop to look at the view."],"korean":["우리는 초록빛 계곡 위의 좁은 길을 따라간다.","절벽 근처에서는 땅이 거칠어서 나는 균형을 잡으려고 밧줄을 붙든다.","안내원은 미끄러질 수 있으니 바위 사이를 뛰어넘지 말라고 한다.","우리는 마지막 몇 계단을 천천히 올라 경치를 보려고 멈춘다."]},{"id":"C039","title":"보트를 타고","targets":[{"word_id":"v2288","headword":"sail","story_form":"sail","form":"sail","meaning_en":"travel on water in a boat","meaning":"항해하다"},{"word_id":"v0402","headword":"captain","story_form":"captain","form":"captain","meaning_en":"the person in charge of a ship","meaning":"선장"},{"word_id":"v0732","headword":"deck","story_form":"deck","form":"deck","meaning_en":"a floor on a ship","meaning":"갑판"},{"word_id":"v2005","headword":"port","story_form":"port","form":"port","meaning_en":"a place where ships arrive and leave","meaning":"항구"},{"word_id":"v0238","headword":"bay","story_form":"bay","form":"bay","meaning_en":"an area of sea partly surrounded by land","meaning":"만"},{"word_id":"v1469","headword":"island","story_form":"island","form":"island","meaning_en":"land with water all around it","meaning":"섬"},{"word_id":"v2721","headword":"tide","story_form":"tide","form":"tide","meaning_en":"the regular rise and fall of the sea","meaning":"조수, 밀물과 썰물"},{"word_id":"v0695","headword":"current","story_form":"current","form":"current","meaning_en":"water moving in one direction","meaning":"물살"},{"word_id":"v2905","headword":"warn","story_form":"warn","form":"warn","meaning_en":"tell someone about possible danger","meaning":"경고하다"},{"word_id":"v1109","headword":"fog","story_form":"fog","form":"fog","meaning_en":"a thick cloud near the ground","meaning":"안개"}],"english":["We **sail** from a small **port** into a quiet **bay**.","The **captain** lets us stand on the **deck** to see an **island**.","He points to the **current** and explains how the **tide** changes.","When **fog** appears, he comes to **warn** us, and we turn back before it gets thick."],"korean":["우리는 작은 항구에서 배를 타고 조용한 만으로 나아간다.","선장은 우리가 섬을 보도록 갑판에 서게 해 준다.","그는 물살을 가리키며 조수가 어떻게 변하는지 설명한다.","안개가 나타나자 그는 우리에게 경고하러 오고, 우리는 안개가 짙어지기 전에 돌아간다."]},{"id":"C040","title":"박물관의 옛 왕국","targets":[{"word_id":"v1741","headword":"museum","story_form":"museum","form":"museum","meaning_en":"a building where important objects are displayed","meaning":"박물관"},{"word_id":"v0433","headword":"century","story_form":"century","form":"century","meaning_en":"a period of one hundred years","meaning":"세기"},{"word_id":"v0923","headword":"empire","story_form":"empire","form":"empire","meaning_en":"several lands ruled by one ruler or government","meaning":"제국"},{"word_id":"v2274","headword":"royal","story_form":"royal","form":"royal","meaning_en":"belonging to a king or queen","meaning":"왕실의"},{"word_id":"v0681","headword":"crown","story_form":"crown","form":"crown","meaning_en":"a special head covering worn by a ruler","meaning":"왕관"},{"word_id":"v1885","headword":"palace","story_form":"palace","form":"palace","meaning_en":"a large home for a king or queen","meaning":"궁전"},{"word_id":"v0416","headword":"castle","story_form":"castle","form":"castle","meaning_en":"a large strong building with thick walls","meaning":"성"},{"word_id":"v1213","headword":"glory","story_form":"glory","form":"glory","meaning_en":"great praise and honor","meaning":"영광"},{"word_id":"v1232","headword":"grand","story_form":"grand","form":"grand","meaning_en":"large and impressive","meaning":"웅장한"},{"word_id":"v1911","headword":"past","story_form":"past","form":"past","meaning_en":"the time before now","meaning":"과거"}],"english":["At the **museum**, we learn about an **empire** from the **past**.","A **royal** **crown** sits beside a model of a **grand** **palace** and a stone **castle**.","A film shows how people lived there more than a **century** ago.","It tells of the **empire**’s **glory**, but also of the hard lives of its people."],"korean":["박물관에서 우리는 과거의 한 제국에 관해 배운다.","왕실의 왕관이 웅장한 궁전과 돌로 지은 성의 모형 옆에 놓여 있다.","영화는 한 세기보다 더 오래전에 사람들이 그곳에서 어떻게 살았는지 보여 준다.","영화는 제국의 영광뿐 아니라 그곳 사람들의 힘든 삶도 이야기한다."]},{"id":"C041","title":"새 아르바이트","targets":[{"word_id":"v0407","headword":"career","story_form":"career","form":"career","meaning_en":"the work you choose for your life","meaning":"진로"},{"word_id":"v0140","headword":"apply","story_form":"apply","form":"apply","meaning_en":"ask officially for a job","meaning":"지원하다"},{"word_id":"v1324","headword":"hire","story_form":"hire","form":"hire","meaning_en":"give someone a paid job","meaning":"고용하다"},{"word_id":"v0321","headword":"boss","story_form":"boss","form":"boss","meaning_en":"the person in charge at work","meaning":"상사"},{"word_id":"v2290","headword":"salary","story_form":"salary","form":"salary","meaning_en":"money paid regularly for your work","meaning":"급여"},{"word_id":"v0887","headword":"earn","story_form":"earn","form":"earn","meaning_en":"get money by working","meaning":"벌다"},{"word_id":"v0880","headword":"duty","story_form":"duty","form":"duty","meaning_en":"a task you are expected to do","meaning":"업무"},{"word_id":"v0924","headword":"employ","story_form":"employ","form":"employ","meaning_en":"give someone paid work","meaning":"고용하다"},{"word_id":"v0141","headword":"appoint","story_form":"appoint","form":"appoint","meaning_en":"choose someone for a position","meaning":"임명하다"},{"word_id":"v0995","headword":"experience","story_form":"experience","form":"experience","meaning_en":"knowledge gained by doing things","meaning":"경험"}],"english":["I **apply** for a job at a small shop to get work **experience**.","The **boss** wants to **hire** someone and asks about my future **career**.","“I can **employ** you this summer,” she says, “and **appoint** you to help at the front desk.”","She explains my **duty** and the **salary** I will **earn**.","I am excited to begin."],"korean":["나는 일한 경험을 쌓으려고 작은 가게에 지원한다.","사장은 누군가를 고용하려고 하며 내 장래 진로를 묻는다.","그녀는 “이번 여름에 너를 고용해서 안내 데스크를 돕는 일을 맡길 수 있겠구나.”라고 말한다.","그녀는 내 업무와 내가 받을 급여를 설명한다.","나는 일을 시작할 생각에 신이 난다."]},{"id":"C042","title":"가게를 여는 두 친구","targets":[{"word_id":"v0537","headword":"commerce","story_form":"commerce","form":"commerce","meaning_en":"the buying and selling of goods","meaning":"상업"},{"word_id":"v1082","headword":"firm","story_form":"firm","form":"firm","meaning_en":"a business or company","meaning":"회사"},{"word_id":"v0401","headword":"capital","story_form":"capital","form":"capital","meaning_en":"money used to start or run a business","meaning":"자본"},{"word_id":"v1462","headword":"invest","story_form":"invest","form":"invest","meaning_en":"put money into something to gain more","meaning":"투자하다"},{"word_id":"v2069","headword":"profit","story_form":"profit","form":"profit","meaning_en":"money left after paying business costs","meaning":"이익"},{"word_id":"v0994","headword":"expense","story_form":"expense","form":"expense","meaning_en":"money you need to spend","meaning":"비용"},{"word_id":"v1075","headword":"finance","story_form":"finance","form":"finance","meaning_en":"provide money for something","meaning":"자금을 대다"},{"word_id":"v0061","headword":"afford","story_form":"afford","form":"afford","meaning_en":"have enough money to pay for something","meaning":"여유가 있다"},{"word_id":"v2249","headword":"risk","story_form":"risk","form":"risk","meaning_en":"the chance that something bad may happen","meaning":"위험"},{"word_id":"v0724","headword":"deal","story_form":"deal","form":"deal","meaning_en":"an agreement in business","meaning":"거래"}],"english":["Two friends want to start a small **firm** and learn about **commerce**.","They save **capital** and **invest** their own money to **finance** the shop.","Before making a **deal** for new shelves, they check every **expense**.","They cannot **afford** a big **risk**, so they begin with only a few things to sell.","After a month, they make a small **profit**."],"korean":["두 친구는 작은 회사를 세우고 상업에 관해 배우고 싶어 한다.","그들은 자본을 모으고 자신의 돈을 투자해 가게에 자금을 댄다.","새 선반을 사는 거래를 하기 전에 모든 비용을 확인한다.","그들은 큰 위험을 감당할 여유가 없어서 팔 물건을 조금만 준비해 시작한다.","한 달 뒤, 그들은 작은 이익을 낸다."]},{"id":"C043","title":"은행에서의 약속","targets":[{"word_id":"v0026","headword":"account","story_form":"account","form":"account","meaning_en":"a place where a bank keeps your money","meaning":"계좌"},{"word_id":"v1589","headword":"loan","story_form":"loan","form":"loan","meaning_en":"money borrowed and paid back later","meaning":"대출"},{"word_id":"v0727","headword":"debt","story_form":"debt","form":"debt","meaning_en":"money that you owe","meaning":"빚"},{"word_id":"v1446","headword":"interest","story_form":"interest","form":"interest","meaning_en":"extra money paid for borrowing money","meaning":"이자"},{"word_id":"v0670","headword":"credit","story_form":"credit","form":"credit","meaning_en":"trust that you will pay money back","meaning":"신용"},{"word_id":"v0841","headword":"document","story_form":"document","form":"document","meaning_en":"a paper containing official information","meaning":"문서"},{"word_id":"v1559","headword":"lend","story_form":"lend","form":"lend","meaning_en":"let someone use something and return it later","meaning":"빌려주다"},{"word_id":"v0609","headword":"contract","story_form":"contract","form":"contract","meaning_en":"a formal agreement","meaning":"계약"},{"word_id":"v0875","headword":"due","story_form":"due","form":"due","meaning_en":"needing to be paid at a certain time","meaning":"기한이 된"},{"word_id":"v2400","headword":"sign","story_form":"sign","form":"sign","meaning_en":"write your name to show agreement","meaning":"서명하다"}],"english":["Mom opens an **account** and asks the bank for a small **loan**.","The bank checks her **credit** before agreeing to **lend** her money.","She reads the **contract** to see the **interest** rate and when the money is **due**.","Before she can **sign**, she makes a plan to pay back the **debt**.","She asks for a **document** with all the details."],"korean":["엄마는 계좌를 만들고 은행에 소액 대출을 신청하신다.","은행은 돈을 빌려주기로 하기 전에 엄마의 신용을 확인한다.","엄마는 이자율과 상환 기한을 알아보려고 계약서를 읽으신다.","서명하기 전에 엄마는 빚을 갚을 계획을 세우신다.","엄마는 모든 세부 사항이 담긴 문서를 요청하신다."]},{"id":"C044","title":"공장 견학","targets":[{"word_id":"v1022","headword":"factory","story_form":"factory","form":"factory","meaning_en":"a building where goods are made","meaning":"공장"},{"word_id":"v1627","headword":"manufacture","story_form":"manufacture","form":"manufacture","meaning_en":"make goods in large numbers","meaning":"제조하다"},{"word_id":"v2065","headword":"produce","story_form":"produce","form":"produce","meaning_en":"make or create something","meaning":"생산하다"},{"word_id":"v1610","headword":"machine","story_form":"machine","form":"machine","meaning_en":"a device with parts that do work","meaning":"기계"},{"word_id":"v0932","headword":"engine","story_form":"engine","form":"engine","meaning_en":"a machine that makes a vehicle move","meaning":"엔진"},{"word_id":"v1729","headword":"motor","story_form":"motor","form":"motor","meaning_en":"a machine that changes energy into movement","meaning":"모터"},{"word_id":"v1404","headword":"industry","story_form":"industry","form":"industry","meaning_en":"businesses that make a particular kind of goods","meaning":"산업"},{"word_id":"v2113","headword":"quality","story_form":"quality","form":"quality","meaning_en":"how good something is","meaning":"품질"},{"word_id":"v1428","headword":"inspect","story_form":"inspect","form":"inspect","meaning_en":"look at something carefully to check it","meaning":"검사하다"},{"word_id":"v2518","headword":"standard","story_form":"standard","form":"standard","meaning_en":"a level used to judge something","meaning":"기준"}],"english":["We visit a **factory** where workers **manufacture** small cars.","A large **machine** helps them **produce** parts for an **engine** and a **motor**.","Before a car leaves, workers **inspect** it to make sure its **quality** meets the **standard**.","Our guide explains how this **industry** gives jobs to many people."],"korean":["우리는 직원들이 작은 자동차를 제조하는 공장을 방문한다.","큰 기계가 엔진과 모터의 부품 생산을 돕는다.","자동차가 출고되기 전에 직원들은 품질이 기준에 맞는지 검사한다.","안내원은 이 산업이 어떻게 많은 사람에게 일자리를 제공하는지 설명한다."]},{"id":"C045","title":"마을 회의","targets":[{"word_id":"v0646","headword":"council","story_form":"council","form":"council","meaning_en":"a group elected to make local decisions","meaning":"의회"},{"word_id":"v0539","headword":"committee","story_form":"committee","form":"committee","meaning_en":"a group chosen to do a particular job","meaning":"위원회"},{"word_id":"v0438","headword":"chairman","story_form":"chairman","form":"chairman","meaning_en":"the person leading a committee","meaning":"위원장"},{"word_id":"v0483","headword":"citizen","story_form":"citizen","form":"citizen","meaning_en":"a person who belongs to a country","meaning":"시민"},{"word_id":"v2097","headword":"public","story_form":"public","form":"public","meaning_en":"provided for everyone to use","meaning":"공공의"},{"word_id":"v2084","headword":"propose","story_form":"propose","form":"propose","meaning_en":"suggest a plan or idea","meaning":"제안하다"},{"word_id":"v0726","headword":"debate","story_form":"debate","form":"debate","meaning_en":"discuss different sides of a question","meaning":"토론하다"},{"word_id":"v2894","headword":"vote","story_form":"vote","form":"vote","meaning_en":"choose by marking or saying your choice","meaning":"투표하다"},{"word_id":"v1992","headword":"policy","story_form":"policy","form":"policy","meaning_en":"a plan or rule for making decisions","meaning":"정책"},{"word_id":"v0544","headword":"community","story_form":"community","form":"community","meaning_en":"people living in the same area","meaning":"지역 사회"}],"english":["A **citizen** asks for a new **public** park in our **community**.","The **council** forms a **committee**, and its **chairman** opens a meeting.","We **propose** a plan and **debate** how to pay for it.","At the end, we **vote** to support a **policy** that keeps part of the land green."],"korean":["한 시민이 우리 지역 사회에 새 공원을 만들어 달라고 요청한다.","의회는 위원회를 구성하고, 위원장이 회의를 연다.","우리는 계획을 제안하고 비용을 어떻게 마련할지 토론한다.","마지막에 우리는 그 땅의 일부를 녹지로 유지하는 정책을 지지하는 데 표를 던진다."]},{"id":"C046","title":"학교 회장 선거","targets":[{"word_id":"v0903","headword":"elect","story_form":"elect","form":"elect","meaning_en":"choose someone by voting","meaning":"선출하다"},{"word_id":"v0464","headword":"chief","story_form":"chief","form":"chief","meaning_en":"the person leading a group","meaning":"대표"},{"word_id":"v2200","headword":"represent","story_form":"represent","form":"represent","meaning_en":"speak or act for others","meaning":"대표하다"},{"word_id":"v0486","headword":"claim","story_form":"claim","form":"claim","meaning_en":"say that something is true","meaning":"주장하다"},{"word_id":"v0137","headword":"appeal","story_form":"appeal","form":"appeal","meaning_en":"ask strongly for help or agreement","meaning":"호소하다"},{"word_id":"v2605","headword":"support","story_form":"support","form":"support","meaning_en":"help or agreement given to someone","meaning":"지지"},{"word_id":"v1844","headword":"oppose","story_form":"oppose","form":"oppose","meaning_en":"disagree with or act against something","meaning":"반대하다"},{"word_id":"v1027","headword":"fair","story_form":"fair","form":"fair","meaning_en":"treating people equally and honestly","meaning":"공정한"},{"word_id":"v1336","headword":"honor","story_form":"honor","form":"honor","meaning_en":"the respect people give you","meaning":"명예"},{"word_id":"v1540","headword":"lead","story_form":"lead","form":"lead","meaning_en":"guide a person or group","meaning":"이끌다"}],"english":["Our club will **elect** a new **chief** to **represent** us.","Two students **claim** that they can **lead** the club well and **appeal** for our **support**.","We listen to both and ask **fair** questions instead of trying to **oppose** every idea.","The winner says it is an **honor** to work for everyone."],"korean":["우리 동아리는 우리를 대표할 새 대표를 선출할 것이다.","두 학생은 동아리를 잘 이끌 수 있다고 주장하며 우리의 지지를 호소한다.","우리는 모든 생각에 반대하려 들기보다 두 사람의 말을 듣고 공정한 질문을 한다.","당선자는 모두를 위해 일하게 되어 영광이라고 말한다."]},{"id":"C047","title":"사라진 자전거","targets":[{"word_id":"v0673","headword":"crime","story_form":"crime","form":"crime","meaning_en":"an action that breaks the law","meaning":"범죄"},{"word_id":"v2698","headword":"thief","story_form":"thief","form":"thief","meaning_en":"a person who takes things without permission","meaning":"도둑"},{"word_id":"v2531","headword":"steal","story_form":"steal","form":"steal","meaning_en":"take something that belongs to someone else","meaning":"훔치다"},{"word_id":"v1830","headword":"officer","story_form":"officer","form":"officer","meaning_en":"a member of the police","meaning":"경찰관"},{"word_id":"v1463","headword":"investigate","story_form":"investigate","form":"investigate","meaning_en":"try to find out what happened","meaning":"수사하다"},{"word_id":"v0968","headword":"evidence","story_form":"evidence","form":"evidence","meaning_en":"facts or objects that help show the truth","meaning":"증거"},{"word_id":"v2615","headword":"suspect","story_form":"suspect","form":"suspect","meaning_en":"someone thought to have committed a crime","meaning":"용의자"},{"word_id":"v1419","headword":"innocent","story_form":"innocent","form":"innocent","meaning_en":"not having done anything wrong","meaning":"무고한"},{"word_id":"v0029","headword":"accuse","story_form":"accuse","form":"accuse","meaning_en":"say that someone has done something wrong","meaning":"비난하다"},{"word_id":"v2799","headword":"truth","story_form":"truth","form":"truth","meaning_en":"what really happened or is true","meaning":"진실"}],"english":["An **officer** comes to **investigate** a **crime** near our school.","Someone saw a **thief** **steal** a bike, but no one saw the face clearly.","A boy becomes a **suspect**, although he says he is **innocent**.","We should not **accuse** him without **evidence**.","The **officer** finds a video, and we finally learn the **truth**."],"korean":["경찰관이 학교 근처에서 일어난 범죄를 수사하러 온다.","누군가 도둑이 자전거를 훔치는 것을 보았지만, 얼굴을 똑똑히 본 사람은 없다.","한 소년이 용의자가 되지만 그는 자신이 무고하다고 말한다.","우리는 증거 없이 그를 비난해서는 안 된다.","경찰관이 영상을 찾고, 우리는 마침내 진실을 알게 된다."]},{"id":"C048","title":"법정 견학","targets":[{"word_id":"v1494","headword":"justice","story_form":"justice","form":"justice","meaning_en":"fair treatment under the law","meaning":"정의"},{"word_id":"v1488","headword":"judge","story_form":"judge","form":"judge","meaning_en":"a person who decides cases in court","meaning":"판사"},{"word_id":"v1537","headword":"lawyer","story_form":"lawyer","form":"lawyer","meaning_en":"a person trained to give legal help","meaning":"변호사"},{"word_id":"v1535","headword":"law","story_form":"law","form":"law","meaning_en":"rules that people in a country must follow","meaning":"법"},{"word_id":"v1553","headword":"legal","story_form":"legal","form":"legal","meaning_en":"related to the law","meaning":"법률의"},{"word_id":"v0155","headword":"arrest","story_form":"arrest","form":"arrest","meaning_en":"take someone into police custody","meaning":"체포하다"},{"word_id":"v2056","headword":"prison","story_form":"prison","form":"prison","meaning_en":"a place where criminals are kept","meaning":"감옥"},{"word_id":"v2102","headword":"punish","story_form":"punish","form":"punish","meaning_en":"make someone suffer for doing wrong","meaning":"처벌하다"},{"word_id":"v1260","headword":"guilt","story_form":"guilt","form":"guilt","meaning_en":"a bad feeling about something you did","meaning":"죄책감"},{"word_id":"v0046","headword":"admit","story_form":"admit","form":"admit","meaning_en":"agree that something is true","meaning":"인정하다"}],"english":["On a school trip, we watch a **judge** and a **lawyer** discuss a **legal** case.","The man says the police had reason to **arrest** him, and he is ready to **admit** what he did.","He speaks of his **guilt** and his fear of **prison**.","The **judge** explains that the **law** must protect **justice**, not simply **punish** people in anger."],"korean":["학교 견학에서 우리는 판사와 변호사가 법률 사건을 논의하는 모습을 본다.","그 남자는 경찰이 자신을 체포할 이유가 있었으며 자신이 한 일을 인정할 준비가 되었다고 말한다.","그는 죄책감과 감옥에 대한 두려움을 이야기한다.","판사는 법이 단순히 분노로 사람을 처벌하는 것이 아니라 정의를 지켜야 한다고 설명한다."]},{"id":"C049","title":"친구와 다툰 뒤","targets":[{"word_id":"v0149","headword":"argue","story_form":"argue","form":"argue","meaning_en":"speak angrily because you disagree","meaning":"다투다"},{"word_id":"v0119","headword":"anger","story_form":"anger","form":"anger","meaning_en":"a strong feeling of being upset or mad","meaning":"분노"},{"word_id":"v0291","headword":"blame","story_form":"blame","form":"blame","meaning_en":"say someone caused a problem","meaning":"탓하다"},{"word_id":"v2276","headword":"rude","story_form":"rude","form":"rude","meaning_en":"not polite","meaning":"무례한"},{"word_id":"v2368","headword":"shame","story_form":"shame","form":"shame","meaning_en":"a painful feeling about doing something wrong","meaning":"부끄러움"},{"word_id":"v1127","headword":"forgive","story_form":"forgive","form":"forgive","meaning_en":"stop being angry about someone's wrong action","meaning":"용서하다"},{"word_id":"v0019","headword":"accept","story_form":"accept","form":"accept","meaning_en":"agree to take or receive something","meaning":"받아들이다"},{"word_id":"v0984","headword":"excuse","story_form":"excuse","form":"excuse","meaning_en":"a reason given to explain wrong behavior","meaning":"변명"},{"word_id":"v0312","headword":"bond","story_form":"bond","form":"bond","meaning_en":"a close connection between people","meaning":"유대"},{"word_id":"v2798","headword":"trust","story_form":"trust","form":"trust","meaning_en":"belief that someone is honest and reliable","meaning":"신뢰"}],"english":["I **argue** with my best friend and **blame** him for a broken game.","My words are **rude**, and his face shows **anger**.","Later, I feel **shame** and offer no **excuse** for what I said.","He chooses to **forgive** me and **accept** my words: “I am sorry.”","We know our **bond** matters, but we will need time to build **trust** again."],"korean":["나는 가장 친한 친구와 다투며 게임기가 고장 난 것을 그의 탓으로 돌린다.","내 말은 무례하고, 그의 얼굴에는 분노가 드러난다.","나중에 나는 부끄러움을 느끼며 내가 한 말에 대해 변명하지 않는다.","그는 나를 용서하고 “미안해.”라는 내 말을 받아들이기로 한다.","우리는 우리의 유대가 중요하다는 것을 알지만, 다시 신뢰를 쌓으려면 시간이 필요할 것이다."]},{"id":"C050","title":"힘든 친구 곁에서","targets":[{"word_id":"v0920","headword":"emotion","story_form":"emotion","form":"emotion","meaning_en":"a feeling such as joy or sadness","meaning":"감정"},{"word_id":"v1720","headword":"mood","story_form":"mood","form":"mood","meaning_en":"the way you feel at a certain time","meaning":"기분"},{"word_id":"v0767","headword":"depress","story_form":"depress","form":"depress","meaning_en":"make someone feel very sad","meaning":"우울하게 하다"},{"word_id":"v0813","headword":"disappoint","story_form":"disappoint","form":"disappoint","meaning_en":"make someone feel let down","meaning":"실망시키다"},{"word_id":"v1667","headword":"mental","story_form":"mental","form":"mental","meaning_en":"related to the mind","meaning":"정신의"},{"word_id":"v0628","headword":"cope","story_form":"cope","form":"cope","meaning_en":"deal with a difficult situation","meaning":"대처하다"},{"word_id":"v2186","headword":"rely","story_form":"rely","form":"rely","meaning_en":"depend on someone for help","meaning":"의지하다"},{"word_id":"v1352","headword":"hug","story_form":"hug","form":"hug","meaning_en":"hold someone closely in your arms","meaning":"안아 주다"},{"word_id":"v2370","headword":"share","story_form":"share","form":"share","meaning_en":"let someone have part of something","meaning":"나누다"},{"word_id":"v0569","headword":"concern","story_form":"concern","form":"concern","meaning_en":"a feeling of worry","meaning":"걱정"}],"english":["Bad news can **depress** us and **disappoint** us at the same time.","When my friend is in a low **mood**, I listen as she names each **emotion**.","I **share** my **concern** and give her a **hug** when she asks for one.","“You can **rely** on me,” I say. “We can find ways to **cope** together.”","We also talk to a teacher about getting **mental** health support."],"korean":["나쁜 소식은 우리를 우울하게 하면서 동시에 실망시킬 수 있다.","친구가 기분이 가라앉아 있을 때, 나는 친구가 자신의 감정을 하나씩 말하는 것을 듣는다.","나는 걱정하는 마음을 전하고 친구가 안아 달라고 하면 안아 준다.","나는 “나에게 의지해도 돼. 함께 대처할 방법을 찾을 수 있어.”라고 말한다.","우리는 정신 건강에 관한 도움을 받는 일에 대해 선생님과도 이야기한다."]},{"id":"C051","title":"동생의 생일 준비","targets":[{"word_id":"v0154","headword":"arrange","story_form":"arrange","form":"arrange","meaning_en":"make plans and preparations","meaning":"준비하다"},{"word_id":"v0735","headword":"decorate","story_form":"decorate","form":"decorate","meaning_en":"make something look more beautiful","meaning":"장식하다"},{"word_id":"v0217","headword":"balloon","story_form":"balloon","form":"balloon","meaning_en":"a thin rubber bag filled with air","meaning":"풍선"},{"word_id":"v1204","headword":"gift","story_form":"gift","form":"gift","meaning_en":"something you give to someone","meaning":"선물"},{"word_id":"v2610","headword":"surprise","story_form":"surprise","form":"surprise","meaning_en":"make someone feel something was unexpected","meaning":"놀라게 하다"},{"word_id":"v0753","headword":"delight","story_form":"delight","form":"delight","meaning_en":"a feeling of great pleasure","meaning":"기쁨"},{"word_id":"v0365","headword":"bunch","story_form":"bunch","form":"bunch","meaning_en":"things held or tied together","meaning":"다발"},{"word_id":"v0328","headword":"bow","story_form":"bow","form":"bow","meaning_en":"a knot with two loops","meaning":"리본 매듭"},{"word_id":"v1820","headword":"occasion","story_form":"occasion","form":"occasion","meaning_en":"a special event","meaning":"행사"},{"word_id":"v0125","headword":"annual","story_form":"annual","form":"annual","meaning_en":"happening once every year","meaning":"매년의"}],"english":["We **arrange** a small party for my sister’s birthday, our favorite **annual** **occasion**.","I **decorate** the room with a **balloon** and a **bunch** of flowers.","Mom ties a **bow** around the **gift**, and we hide to **surprise** my sister.","Her face fills with **delight** when she opens the door."],"korean":["우리는 여동생의 생일을 위해 작은 파티를 준비한다. 생일은 우리가 가장 좋아하는 연례행사다.","나는 풍선 하나와 꽃다발로 방을 장식한다.","엄마는 선물에 리본 매듭을 묶으시고, 우리는 동생을 놀라게 하려고 숨는다.","동생이 문을 열자 얼굴에 기쁨이 가득해진다."]},{"id":"C052","title":"가족의 새 출발","targets":[{"word_id":"v2029","headword":"pregnant","story_form":"pregnant","form":"pregnant","meaning_en":"having a baby growing inside the body","meaning":"임신한"},{"word_id":"v1057","headword":"female","story_form":"female","form":"female","meaning_en":"a girl or woman","meaning":"여자아이, 여성"},{"word_id":"v1621","headword":"male","story_form":"male","form":"male","meaning_en":"a boy or man","meaning":"남자아이, 남성"},{"word_id":"v2362","headword":"sex","story_form":"sex","form":"sex","meaning_en":"being male or female","meaning":"성별"},{"word_id":"v0993","headword":"expect","story_form":"expect","form":"expect","meaning_en":"think something will happen","meaning":"예상하다"},{"word_id":"v2812","headword":"twin","story_form":"twin","form":"twin","meaning_en":"one of two babies born together","meaning":"쌍둥이"},{"word_id":"v0846","headword":"domestic","story_form":"domestic","form":"domestic","meaning_en":"related to the home and family","meaning":"가정의"},{"word_id":"v0340","headword":"breast","story_form":"breast","form":"breast","meaning_en":"the front part of the upper body","meaning":"가슴"},{"word_id":"v0715","headword":"darling","story_form":"darling","form":"darling","meaning_en":"a person you love very much","meaning":"사랑하는 사람"},{"word_id":"v0296","headword":"bless","story_form":"bless","form":"bless","meaning_en":"ask for God's care and goodness","meaning":"축복하다"}],"english":["My aunt is **pregnant**, and we **expect** two babies, a **male** and a **female**.","The nurse writes the **sex** of each **twin** on a form.","After they are born, Aunt May holds one baby against her **breast** and whispers, “My **darling**.”","Our family comes to **bless** the babies and help with **domestic** work."],"korean":["이모가 임신 중이고, 우리는 남자아이와 여자아이 두 아기의 탄생을 기다린다.","간호사는 쌍둥이 각각의 성별을 서류에 적는다.","아기들이 태어난 뒤 메이 이모는 한 아기를 가슴에 안고 “내 사랑.”이라고 속삭인다.","가족들은 아기들을 축복하고 집안일을 도우러 온다."]},{"id":"C053","title":"할아버지의 은퇴","targets":[{"word_id":"v2228","headword":"retire","story_form":"retire","form":"retire","meaning_en":"stop working because of age","meaning":"은퇴하다"},{"word_id":"v2344","headword":"senior","story_form":"senior","form":"senior","meaning_en":"older or more experienced","meaning":"연장자의, 선배의"},{"word_id":"v1491","headword":"junior","story_form":"junior","form":"junior","meaning_en":"younger or less experienced","meaning":"후배의"},{"word_id":"v2066","headword":"profession","story_form":"profession","form":"profession","meaning_en":"a job needing special training","meaning":"직업"},{"word_id":"v1512","headword":"knowledge","story_form":"knowledge","form":"knowledge","meaning_en":"things you know or understand","meaning":"지식"},{"word_id":"v0055","headword":"advice","story_form":"advice","form":"advice","meaning_en":"ideas about what someone should do","meaning":"조언"},{"word_id":"v0056","headword":"advise","story_form":"advise","form":"advise","meaning_en":"tell someone what you think they should do","meaning":"조언하다"},{"word_id":"v2215","headword":"respect","story_form":"respect","form":"respect","meaning_en":"treat someone as important and valuable","meaning":"존중하다"},{"word_id":"v2964","headword":"wise","story_form":"wise","form":"wise","meaning_en":"able to make good decisions","meaning":"현명한"},{"word_id":"v2852","headword":"value","story_form":"value","form":"value","meaning_en":"think someone or something is important","meaning":"소중히 여기다"}],"en **county**.","Our new **neighbor** helps us **locate** the shops in the **district**.","Nothing feels **familiar** at first, but she invites us for tea.","As we **settle** into our home, we learn the name of every street.","Our old **flat** was smaller, but I still miss it sometimes."],"korean":["우리는 조용한 군에 있는 마을에서 작은 집을 빌린다.","새 이웃이 우리 구역의 가게들이 어디 있는지 찾도록 도와준다.","처음에는 아무것도 익숙하지 않지만, 그녀가 차를 마시러 오라고 초대한다.","새집에 정착하면서 우리는 거리 이름을 하나씩 익힌다.","예전에 살던 아파트는 더 작았지만, 나는 아직도 가끔 그곳이 그립다."]},{"id":"C055","title":"모르는 사람에게 온 메일","targets":[{"word_id":"v1369","headword":"identity","story_form":"identity","form":"identity","meaning_en":"who a person is","meaning":"신원"},{"word_id":"v2058","headword":"private","story_form":"private","form":"private","meaning_en":"belonging to one person","meaning":"개인적인"},{"word_id":"v2057","headword":"privacy","story_form":"privacy","form":"privacy","meaning_en":"freedom from others knowing your personal life","meaning":"사생활"},{"word_id":"v2330","headword":"secret","story_form":"secret","form":"secret","meaning_en":"kept hidden from others","meaning":"비밀의"},{"word_id":"v0020","headword":"access","story_form":"access","form":"access","meaning_en":"the ability to enter or use something","meaning":"접근"},{"word_id":"v2203","headword":"request","story_form":"request","form":"request","meaning_en":"an act of asking for something","meaning":"요청"},{"word_id":"v1004","headword":"expose","story_form":"expose","form":"expose","meaning_en":"show something that should stay hidden","meaning":"노출하다"},{"word_id":"v1372","headword":"ignore","story_form":"ignore","form":"ignore","meaning_en":"pay no attention to something","meaning":"무시하다"},{"word_id":"v0299","headword":"block","story_form":"block","form":"block","meaning_en":"stop someone from reaching or contacting you","meaning":"차단하다"},{"word_id":"v0203","headword":"aware","story_form":"aware","form":"aware","meaning_en":"knowing about something","meaning":"알고 있는"}],"english":["A stranger asks for **access** to my **private** account and my **secret** number.","I do not know his **identity**, so I **ignore** the message and **block** him.","I am **aware** that sharing too much can **expose** my family to trouble.","I tell Dad because our **privacy** matters.","Dad reads the **request** and helps me check my settings."],"korean":["낯선 사람이 내 개인 계정에 대한 접근 권한과 비밀 번호를 요구한다.","나는 그의 신원을 모르므로 메시지를 무시하고 그를 차단한다.","나는 정보를 너무 많이 공유하면 가족이 곤란한 일을 겪게 될 수 있다는 것을 알고 있다.","우리의 사생활은 중요하기 때문에 나는 아빠에게 말씀드린다.","아빠는 그 요청을 읽고 내 설정을 확인하도록 도와주신다."]},{"id":"C056","title":"학급 신문 편집","targets":[{"word_id":"v0894","headword":"edit","story_form":"edit","form":"edit","meaning_en":"change writing to improve it","meaning":"편집하다"},{"word_id":"v0954","headword":"essay","story_form":"essay","form":"essay","meaning_en":"a short piece of writing about a subject","meaning":"에세이"},{"word_id":"v0536","headword":"comment","story_form":"comment","form":"comment","meaning_en":"something you say to give your opinion","meaning":"의견"},{"word_id":"v0347","headword":"brief","story_form":"brief","form":"brief","meaning_en":"short in length or time","meaning":"짧은"},{"word_id":"v0786","headword":"detail","story_form":"detail","form":"detail","meaning_en":"a small piece of information","meaning":"세부 사항"},{"word_id":"v0604","headword":"content","story_form":"content","form":"content","meaning_en":"the information in a piece of writing","meaning":"내용"},{"word_id":"v1395","headword":"include","story_form":"include","form":"include","meaning_en":"have something as a part","meaning":"포함하다"},{"word_id":"v2340","headword":"select","story_form":"select","form":"select","meaning_en":"choose from a group","meaning":"선택하다"},{"word_id":"v2038","headword":"press","story_form":"press","form":"press","meaning_en":"newspapers and the people who report news","meaning":"언론"},{"word_id":"v2863","headword":"version","story_form":"version","form":"version","meaning_en":"a particular form of a piece of work","meaning":"판본"}],"english":["We **edit** an **essay** for our class paper and ask for a **brief** **comment** from the teacher.","She likes the **content** but asks us to check one **detail**.","We **select** a picture to **include** in the final **version**.","Our paper is small, but working on it teaches us why the **press** must check facts."],"korean":["우리는 학급 신문에 실을 에세이를 편집하고 선생님께 짧은 의견을 부탁한다.","선생님은 내용을 좋아하시지만 세부 사항 하나를 확인해 보라고 하신다.","우리는 최종 판본에 넣을 사진을 선택한다.","우리 신문은 작지만, 제작하면서 언론이 왜 사실을 확인해야 하는지 배운다."]},{"id":"C057","title":"영화관에서","targets":[{"word_id":"v0478","headword":"cinema","story_form":"cinema","form":"cinema","meaning_en":"a place where people watch films","meaning":"영화관"},{"word_id":"v0532","headword":"comedy","story_form":"comedy","form":"comedy","meaning_en":"a funny film or play","meaning":"코미디"},{"word_id":"v2309","headword":"scene","story_form":"scene","form":"scene","meaning_en":"one part of a film or play","meaning":"장면"},{"word_id":"v0415","headword":"cast","story_form":"cast","form":"cast","meaning_en":"all the actors in a film or play","meaning":"출연진"},{"word_id":"v1355","headword":"humor","story_form":"humor","form":"humor","meaning_en":"the ability to see or show what is funny","meaning":"유머"},{"word_id":"v1484","headword":"joke","story_form":"joke","form":"joke","meaning_en":"something said to make people laugh","meaning":"농담"},{"word_id":"v0112","headword":"amuse","story_form":"amuse","form":"amuse","meaning_en":"make someone smile or laugh","meaning":"즐겁게 하다"},{"word_id":"v0319","headword":"bore","story_form":"bore","form":"bore","meaning_en":"make someone lose interest","meaning":"지루하게 하다"},{"word_id":"v1532","headword":"laugh","story_form":"laugh","form":"laugh","meaning_en":"make sounds because something is funny","meaning":"웃다"},{"word_id":"v1036","headword":"fantastic","story_form":"fantastic","form":"fantastic","meaning_en":"extremely good or exciting","meaning":"환상적인"}],"english":["We go to the **cinema** to watch a **comedy** with a **fantastic** **cast**.","In the first **scene**, a man tells a **joke** that makes everyone **laugh**.","His gentle **humor** can **amuse** both children and adults.","Even the long parts do not **bore** us, and we talk about the film all the way home."],"korean":["우리는 훌륭한 출연진이 나오는 코미디를 보러 영화관에 간다.","첫 장면에서 한 남자가 모두를 웃게 하는 농담을 한다.","그의 부드러운 유머는 아이와 어른을 모두 즐겁게 할 수 있다.","긴 부분도 지루하지 않아서 우리는 집에 가는 내내 영화 이야기를 한다."]},{"id":"C058","title":"밤에 들린 소리","targets":[{"word_id":"v0164","headword":"asleep","story_form":"asleep","form":"asleep","meaning_en":"sleeping","meaning":"잠든"},{"word_id":"v0201","headword":"awake","story_form":"awake","form":"awake","meaning_en":"not sleeping","meaning":"깨어 있는"},{"word_id":"v0082","headword":"alarm","story_form":"alarm","form":"alarm","meaning_en":"a sound warning you about something","meaning":"경보음"},{"word_id":"v2586","headword":"sudden","story_form":"sudden","form":"sudden","meaning_en":"happening quickly and unexpectedly","meaning":"갑작스러운"},{"word_id":"v1789","headword":"noise","story_form":"noise","form":"noise","meaning_en":"a loud or unwanted sound","meaning":"소음"},{"word_id":"v2364","headword":"shadow","story_form":"shadow","form":"shadow","meaning_en":"a dark shape made by blocked light","meaning":"그림자"},{"word_id":"v1151","headword":"fright","story_form":"fright","form":"fright","meaning_en":"a sudden feeling of fear","meaning":"놀람"},{"word_id":"v2320","headword":"scream","story_form":"scream","form":"scream","meaning_en":"cry out loudly in fear","meaning":"비명을 지르다"},{"word_id":"v1202","headword":"ghost","story_form":"ghost","form":"ghost","meaning_en":"the spirit of a dead person","meaning":"유령"},{"word_id":"v2148","headword":"real","story_form":"real","form":"real","meaning_en":"actually existing","meaning":"진짜의"}],"english":["Everyone is **asleep**, but I am still **awake** when a **sudden** **noise** sounds like an **alarm**.","A tall **shadow** moves across the wall and gives me a **fright**.","I almost **scream** because I think it is a **ghost**.","Then Dad turns on the light: the **real** cause is our cat knocking over a coat stand."],"korean":["모두가 잠들었지만, 갑작스러운 소음이 경보처럼 들릴 때 나는 아직 깨어 있다.","키 큰 그림자가 벽을 가로질러 움직여 나는 깜짝 놀란다.","나는 유령이라고 생각해서 하마터면 비명을 지를 뻔한다.","그때 아빠가 불을 켜신다. 진짜 원인은 옷걸이를 넘어뜨린 우리 고양이다."]},{"id":"C059","title":"우주 전시관","targets":[{"word_id":"v1975","headword":"planet","story_form":"planet","form":"planet","meaning_en":"a large round object moving around a star","meaning":"행성"},{"word_id":"v2258","headword":"rocket","story_form":"rocket","form":"rocket","meaning_en":"a vehicle that travels into space","meaning":"로켓"},{"word_id":"v1701","headword":"mission","story_form":"mission","form":"mission","meaning_en":"an important job to be done","meaning":"임무"},{"word_id":"v2884","headword":"vision","story_form":"vision","form":"vision","meaning_en":"an idea of what the future could be","meaning":"미래상"},{"word_id":"v1486","headword":"journey","story_form":"journey","form":"journey","meaning_en":"a trip from one place to another","meaning":"여행"},{"word_id":"v1353","headword":"huge","story_form":"huge","form":"huge","meaning_en":"very large","meaning":"거대한"},{"word_id":"v2657","headword":"technology","story_form":"technology","form":"technology","meaning_en":"knowledge and tools used to solve practical problems","meaning":"기술"},{"word_id":"v1120","headword":"force","story_form":"force","form":"force","meaning_en":"a push or pull on something","meaning":"힘"},{"word_id":"v2608","headword":"surface","story_form":"surface","form":"surface","meaning_en":"the outside or top layer of something","meaning":"표면"},{"word_id":"v2270","headword":"round","story_form":"round","form":"round","meaning_en":"shaped like a circle or ball","meaning":"둥근"}],"english":["At the science center, we stand beside a **huge** **rocket**.","A film takes us on a **journey** to a **round** **planet** with a red **surface**.","The space team has a **mission** to bring back rocks.","We learn how a strong **force** lifts the **rocket** from the ground *analysis** helps us see why one hot day does not tell the whole story."],"korean":["우리는 산간 마을의 기후를 공부하고 평균 기온 도표를 그린다.","그래프는 강이 언제 얼고 얼음이 언제 녹을 수 있는지 보여 준다.","우리는 극심한 홍수와 대기의 변화에 관해서도 읽는다.","분석을 통해 우리는 더운 날 하루만으로는 전체 상황을 알 수 없는 이유를 이해한다."]},{"id":"C061","title":"기부 행사","targets":[{"word_id":"v0848","headword":"donate","story_form":"donate","form":"donate","meaning_en":"give money or goods to help others","meaning":"기부하다"},{"word_id":"v1165","headword":"fund","story_form":"fund","form":"fund","meaning_en":"money saved for a special purpose","meaning":"기금"},{"word_id":"v0269","headword":"benefit","story_form":"benefit","form":"benefit","meaning_en":"an event that raises money to help others","meaning":"자선 행사"},{"word_id":"v0613","headword":"contribute","story_form":"contribute","form":"contribute","meaning_en":"give help toward a shared result","meaning":"기여하다"},{"word_id":"v2499","headword":"sponsor","story_form":"sponsor","form":"sponsor","meaning_en":"support an event with money or goods","meaning":"후원하다"},{"word_id":"v1053","headword":"fee","story_form":"fee","form":"fee","meaning_en":"money paid for a service","meaning":"요금"},{"word_id":"v0648","headword":"count","story_form":"count","form":"count","meaning_en":"find how many there are","meaning":"세다"},{"word_id":"v2092","headword":"provide","story_form":"provide","form":"provide","meaning_en":"give someone what they need","meaning":"제공하다"},{"word_id":"v2108","headword":"purpose","story_form":"purpose","form":"purpose","meaning_en":"the reason for doing something","meaning":"목적"},{"word_id":"v2452","headword":"society","story_form":"society","form":"society","meaning_en":"people living together in an organized way","meaning":"사회"}],"english":["Our club holds a **benefit** to build a **fund** for children who need books.","A local shop agrees to **sponsor** the event and **provide** food.","There is no entrance **fee**, but people can **donate** money if they wish.","We **count** the money and talk about our **p ldiers who fight on land","meaning":"육군"},{"word_id":"v1758","headword":"navy","story_form":"navy","form":"navy","meaning_en":"a country's forces that fight at sea","meaning":"해군"},{"word_id":"v1685","headword":"military","story_form":"military","form":"military","meaning_en":"related to armed forces","meaning":"군사의"},{"word_id":"v2458","headword":"soldier","story_form":"soldier","form":"soldier","meaning_en":"a person serving in an army","meaning":"군인"},{"word_id":"v0929","headword":"enemy","story_form":"enemy","form":"enemy","meaning_en":"a person or group fighting against you","meaning":"적"},{"word_id":"v0237","headword":"battle","story_form":"battle","form":"battle","meaning_en":"a fight between armed forces","meaning":"전투"},{"word_id":"v0183","headword":"attack","story_form":"attack","form":"attack","meaning_en":"try to hurt or defeat someone","meaning":"공격하다"},{"word_id":"v0741","headword":"defense","story_form":"defense","form":"defense","meaning_en":"action taken to protect against attack","meaning":"방어"},{"word_id":"v2917","headword":"weapon","story_form":"weapon","form":"weapon","meaning_en":"something used to hurt or fight","meaning":"무기"},{"word_id":"v1921","headword":"peace","story_form":"peace","form":"peace","meaning_en":"a time without war or fighting","meaning":"평화"}],"english":["Our teacher shows us letters from a **soldier** who served in the **army**.","One letter describes a **battle** and help from the **navy**.","Another says that a **weapon** cannot bring lasting **peace** on its own.","We discuss why **military** leaders may choose **defense** rather than **attack** an **enemy**."],"korean":["선생님은 육군에서 복무했던 한 군인의 편지들을 보여 주신다.","한 편지에는 전투와 해군의 도움이 묘사되어 있다.","다른 편지에는 무기만으로는 오래가는 평화를 가져올 수 없다고 쓰여 있다.","우리는 군 지휘관들이 적을 공격하기보다 방어를 선택할 수 있는 이유를 논의한다."]},{"id":"C070","title":"비밀 요원의 임무","targets":[{"word_id":"v2507","headword":"spy","story_form":"spy","form":"spy","meaning_en":"a person who secretly gathers information","meaning":"첩보원"},{"word_id":"
