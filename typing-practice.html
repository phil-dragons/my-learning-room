const workbooks={"common":[{"id":"C001","title":"버스에서 찾은 가방","targets":[{"word_id":"v1802","headword":"notice","story_form":"notice","form":"notice","meaning_en":"see and become aware of something","meaning":"알아차리다"},{"word_id":"v0131","headword":"anxious","story_form":"anxious","form":"anxious","meaning_en":"worried about what may happen","meaning":"불안한"},{"word_id":"v2326","headword":"search","story_form":"search","form":"search","meaning_en":"try to find something","meaning":"찾다"},{"word_id":"v0771","headword":"describe","story_form":"describe","form":"describe","meaning_en":"say what something is like","meaning":"묘사하다"},{"word_id":"v2182","headword":"relief","story_form":"relief","form":"relief","meaning_en":"feeling better when worry ends","meaning":"안도감"},{"word_id":"v1994","headword":"polite","story_form":"polite","form":"polite","meaning_en":"showing good manners","meaning":"예의 바른"},{"word_id":"v2198","headword":"reply","story_form":"reply","form":"reply","meaning_en":"an answer to someone","meaning":"대답"},{"word_id":"v2156","headword":"recognize","story_form":"recognize","form":"recognize","meaning_en":"know something from seeing it before","meaning":"알아보다"},{"word_id":"v1877","headword":"own","story_form":"own","form":"own","meaning_en":"belonging to that person","meaning":"자신의"},{"word_id":"v2076","headword":"promise","story_form":"promise","form":"promise","meaning_en":"say you will do something","meaning":"약속하다"}],"english":["I **notice** a bag on the bus and see an **anxious** boy looking under a seat.","“Can you **describe** your bag?” I ask as we **search** together.","He gives a **polite** **reply**: “It is blue, with a white cat on it.”","I **recognize** the cat and show him the bag.","He holds his **own** bag with **relief** and says, “I **promise** to be more careful!”"],"korean":["나는 버스에서 가방 하나를 발견하고, 불안한 표정의 소년이 좌석 아래를 살피는 모습을 본다.","우리가 함께 찾는 동안 나는 “네 가방이 어떻게 생겼는지 말해 줄래?”라고 묻는다.","그는 “파란색이고, 하얀 고양이가 그려져 있어요.”라고 예의 바르게 대답한다.","나는 그 고양이 그림을 알아보고 그에게 가방을 보여 준다.","그는 안도하며 자기 가방을 들고 “앞으로 더 조심할게요!”라고 말한다."]},{"id":"C002","title":"첫 비행","targets":[{"word_id":"v0081","headword":"airport","story_form":"airport","form":"airport","meaning_en":"a place where planes take off","meaning":"공항"},{"word_id":"v0079","headword":"airline","story_form":"airline","form":"airline","meaning_en":"a company that runs flights","meaning":"항공사"},{"word_id":"v1097","headword":"flight","story_form":"flight","form":"flight","meaning_en":"a trip made by a plane","meaning":"항공편"},{"word_id":"v1185","headword":"gate","story_form":"gate","form":"gate","meaning_en":"the place to board a plane","meaning":"탑승구"},{"word_id":"v0747","headword":"delay","story_form":"delay","form":"delay","meaning_en":"a wait longer than planned","meaning":"지연"},{"word_id":"v0123","headword":"announce","story_form":"announce","form":"announce","meaning_en":"tell people something clearly","meaning":"알리다"},{"word_id":"v1696","headword":"minute","story_form":"minute","form":"minute","meaning_en":"sixty seconds","meaning":"분"},{"word_id":"v1916","headword":"patient","story_form":"patient","form":"patient","meaning_en":"able to wait without getting upset","meaning":"참을성 있는"},{"word_id":"v2179","headword":"relax","story_form":"relax","form":"relax","meaning_en":"become less worried or tense","meaning":"긴장을 풀다"},{"word_id":"v2328","headword":"seat","story_form":"seat","form":"seat","meaning_en":"a place to sit","meaning":"좌석"}],"english":["At the **airport**, I check the name of our **airline** and our **flight** number.","We find the **gate**, but there is a **delay**.","A worker comes to **announce** that we will have to wait.","Dad asks me to be **patient**, and we talk for a **minute**.","At last, we get on the plane, and I **relax** in my **seat** by a window."],"korean":["공항에서 나는 우리가 이용할 항공사의 이름과 항공편 번호를 확인한다.","우리는 탑승구를 찾지만, 비행기가 지연된다.","직원이 와서 우리가 기다려야 한다고 알린다.","아빠는 나에게 참을성 있게 기다려 달라고 하시고, 우리는 잠시 이야기를 나눈다.","마침내 우리는 비행기에 타고, 나는 창문 옆 내 좌석에 앉아 긴장을 푼다."]},{"id":"C003","title":"호텔의 작은 문제","targets":[{"word_id":"v1346","headword":"hotel","story_form":"hotel","form":"hotel","meaning_en":"a place to pay and stay overnight","meaning":"호텔"},{"word_id":"v2208","headword":"reserve","story_form":"reserve","form":"reserve","meaning_en":"arrange to keep something for later","meaning":"예약하다"},{"word_id":"v0494","headword":"clerk","story_form":"clerk","form":"clerk","meaning_en":"a person who helps customers","meaning":"직원"},{"word_id":"v1257","headword":"guest","story_form":"guest","form":"guest","meaning_en":"a person staying at a hotel","meaning":"투숙객"},{"word_id":"v1592","headword":"lock","story_form":"lock","form":"lock","meaning_en":"a device that keeps a door closed","meaning":"잠금장치"},{"word_id":"v1509","headword":"knock","story_form":"knock","form":"knock","meaning_en":"hit a door to ask for entry","meaning":"문을 두드리다"},{"word_id":"v0173","headword":"assist","story_form":"assist","form":"assist","meaning_en":"help someone","meaning":"돕다"},{"word_id":"v2197","headword":"replace","story_form":"replace","form":"replace","meaning_en":"put a new thing in its place","meaning":"교체하다"},{"word_id":"v0533","headword":"comfort","story_form":"comfort","form":"comfort","meaning_en":"a pleasant feeling of ease","meaning":"편안함"},{"word_id":"v0142","headword":"appreciate","story_form":"appreciate","form":"appreciate","meaning_en":"feel thankful for something","meaning":"고맙게 여기다"}],"english":["We **reserve** a room at a **hotel** by the sea.","The **clerk** gives each **guest** a warm smile.","Our door will not open because the **lock** is broken, so I **knock** on the office door.","A worker comes to **assist** us and **replace** the **lock**.","We **appreciate** his help and spend the evening in **comfort**."],"korean":["우리는 바닷가 호텔에 방을 예약한다.","직원은 투숙객마다 따뜻한 미소를 보낸다.","잠금장치가 고장 나서 우리 방 문이 열리지 않아, 나는 사무실 문을 두드린다.","직원이 우리를 돕고 잠금장치를 교체하러 온다.","우리는 그의 도움을 고맙게 여기며 저녁을 편안하게 보낸다."]},{"id":"C004","title":"길을 잘못 든 날","targets":[{"word_id":"v2271","headword":"route","story_form":"route","form":"route","meaning_en":"a way from one place to another","meaning":"경로"},{"word_id":"v0811","headword":"direct","story_form":"direct","form":"direct","meaning_en":"tell someone which way to go","meaning":"길을 안내하다"},{"word_id":"v1590","headword":"local","story_form":"local","form":"local","meaning_en":"from the nearby area","meaning":"지역의"},{"word_id":"v0826","headword":"distance","story_form":"distance","form":"distance","meaning_en":"how far apart things are","meaning":"거리"},{"word_id":"v0274","headword":"beyond","story_form":"beyond","form":"beyond","meaning_en":"on the far side of something","meaning":"너머에"},{"word_id":"v2129","headword":"rail","story_form":"rail","form":"rail","meaning_en":"a bar along an edge for safety","meaning":"난간"},{"word_id":"v2756","headword":"toward","story_form":"toward","form":"toward","meaning_en":"in the direction of something","meaning":"~쪽으로"},{"word_id":"v2144","headword":"reach","story_form":"reach","form":"reach","meaning_en":"arrive at a place","meaning":"도착하다"},{"word_id":"v1258","headword":"guide","story_form":"guide","form":"guide","meaning_en":"show someone the way","meaning":"안내하다"},{"word_id":"v1134","headword":"fortunate","story_form":"fortunate","form":"fortunate","meaning_en":"having good luck","meaning":"운 좋은"}],"english":["We choose a new **route** to the lake, but soon we do not know where we are.","A **local** woman offers to **direct** us and says the **distance** is not great.","“Look **beyond** that **rail**, **toward** the old house,” she says.","She walks with us to **guide** us along the path.","We feel **fortunate** when we **reach** the lake before lunch."],"korean":["우리는 호수로 가는 새로운 경로를 선택하지만, 곧 우리가 어디에 있는지 알 수 없게 된다.","한 지역 주민이 길을 안내해 주겠다고 하며 거리가 멀지 않다고 말한다.","그녀는 “저 난간 너머, 오래된 집 쪽을 보세요.”라고 말한다.","그녀는 길을 안내하려고 우리와 함께 걷는다.","점심 전에 호수에 도착하자 우리는 운이 좋다고 느낀다."]},{"id":"C005","title":"바닷가 소풍","targets":[{"word_id":"v0513","headword":"coast","story_form":"coast","form":"coast","meaning_en":"land beside the sea","meaning":"해안"},{"word_id":"v1954","headword":"picnic","story_form":"picnic","form":"picnic","meaning_en":"a meal eaten outdoors","meaning":"소풍"},{"word_id":"v0293","headword":"blanket","story_form":"blanket","form":"blanket","meaning_en":"a thick cloth used for warmth","meaning":"담요"},{"word_id":"v0329","headword":"bowl","story_form":"bowl","form":"bowl","meaning_en":"a deep round dish","meaning":"그릇"},{"word_id":"v2442","headword":"snack","story_form":"snack","form":"snack","meaning_en":"a small amount of food between meals","meaning":"간식"},{"word_id":"v1558","headword":"lemon","story_form":"lemon","form":"lemon","meaning_en":"a yellow fruit with a sour taste","meaning":"레몬"},{"word_id":"v2363","headword":"shade","story_form":"shade","form":"shade","meaning_en":"a place out of direct sunlight","meaning":"그늘"},{"word_id":"v1195","headword":"gentle","story_form":"gentle","form":"gentle","meaning_en":"soft and not strong","meaning":"부드러운"},{"word_id":"v2912","headword":"wave","story_form":"wave","form":"wave","meaning_en":"water rising and moving toward land","meaning":"파도"},{"word_id":"v2387","headword":"shore","story_form":"shore","form":"shore","meaning_en":"land at the edge of water","meaning":"물가"}],"english":["We go to the **coast** for a **picnic** and put a **blanket** in the **shade**.","I set out a **bowl** of fruit and a small **snack** for everyone.","Dad puts a piece of **lemon** in my water.","We watch a **gentle** **wave** come up to the **shore**.","After lunch, we walk by the water and look for shells."],"korean":["우리는 소풍을 가려고 해안에 가서 그늘에 담요를 편다.","나는 과일 한 그릇과 모두가 먹을 작은 간식을 준비한다.","아빠는 내 물에 레몬 한 조각을 넣어 주신다.","우리는 잔잔한 파도가 물가로 밀려오는 것을 바라본다.","점심을 먹고 나서 우리는 물가를 걸으며 조개껍데기를 찾는다."]},{"id":"C006","title":"야영지의 폭풍","targets":[{"word_id":"v2548","headword":"storm","story_form":"storm","form":"storm","meaning_en":"very bad weather with strong wind","meaning":"폭풍"},{"word_id":"v2378","headword":"shelter","story_form":"shelter","form":"shelter","meaning_en":"a place that keeps you safe","meaning":"대피처"},{"word_id":"v1090","headword":"flash","story_form":"flash","form":"flash","meaning_en":"a sudden bright light","meaning":"번쩍임"},{"word_id":"v1050","headword":"fear","story_form":"fear","form":"fear","meaning_en":"a feeling that something bad may happen","meaning":"두려움"},{"word_id":"v0388","headword":"calm","story_form":"calm","form":"calm","meaning_en":"not upset or worried","meaning":"침착한"},{"word_id":"v2087","headword":"protect","story_form":"protect","form":"protect","meaning_en":"keep someone safe from harm","meaning":"보호하다"},{"word_id":"v2614","headword":"survive","story_form":"survive","form":"survive","meaning_en":"stay alive through danger","meaning":"살아남다"},{"word_id":"v2480","headword":"spare","story_form":"spare","form":"spare","meaning_en":"extra and ready if needed","meaning":"여분의"},{"word_id":"v2334","headword":"secure","story_form":"secure","form":"secure","meaning_en":"safely closed or protected","meaning":"안전한"},{"word_id":"v2754","headword":"tough","story_form":"tough","form":"tough","meaning_en":"difficult to get through","meaning":"힘든"}],"english":["A **storm** comes while we are at camp, and a **flash** of light fills the sky.","I feel **fear**, but our teacher stays **calm** and leads us to a **shelter**.","The thick walls **protect** us, and the door is **secure**.","She gives me a **spare** shirt because mine is wet.","We **survive** the **tough** night and see the sun in the morning."],"korean":["우리가 야영을 하는 동안 폭풍이 오고, 번쩍이는 빛이 하늘을 채운다.","나는 두려움을 느끼지만, 선생님은 침착하게 우리를 대피처로 데려가신다.","두꺼운 벽이 우리를 보호하고, 문도 안전하게 닫혀 있다.","내 셔츠가 젖어서 선생님은 여분의 셔츠를 주신다.","우리는 힘든 밤을 무사히 넘기고 아침에 해를 본다."]},{"id":"C007","title":"정원의 첫 열매","targets":[{"word_id":"v2336","headword":"seed","story_form":"seed","form":"seed","meaning_en":"a small thing a plant grows from","meaning":"씨앗"},{"word_id":"v2457","headword":"soil","story_form":"soil","form":"soil","meaning_en":"earth in which plants grow","meaning":"흙"},{"word_id":"v1976","headword":"plant","story_form":"plant","form":"plant","meaning_en":"put a seed in the ground","meaning":"심다"},{"word_id":"v2265","headword":"root","story_form":"root","form":"root","meaning_en":"the plant part growing under the ground","meaning":"뿌리"},{"word_id":"v1541","headword":"leaf","story_form":"leaf","form":"leaf","meaning_en":"a flat green part of a plant","meaning":"잎"},{"word_id":"v0302","headword":"bloom","story_form":"bloom","form":"bloom","meaning_en":"produce flowers","meaning":"꽃을 피우다"},{"word_id":"v2555","headword":"strawberry","story_form":"strawberry","form":"strawberry","meaning_en":"a small red fruit with tiny seeds","meaning":"딸기"},{"word_id":"v2623","headword":"sweet","story_form":"sweet","form":"sweet","meaning_en":"tasting like sugar","meaning":"달콤한"},{"word_id":"v2132","headword":"raise","story_form":"raise","form":"raise","meaning_en":"grow and care for something","meaning":"기르다"},{"word_id":"v2174","headword":"regular","story_form":"regular","form":"regular","meaning_en":"happening at set times","meaning":"규칙적인"}],"english":["I want to **raise** strawberries, so I **plant** a **seed** in good **soil**.","I give it water at **regular** times and wait for a **leaf** to appear.","Dad tells me that the **root** takes in water under the ground.","Weeks later, I see it **bloom**.","At last, I pick a **sweet** **strawberry** and share it with Dad."],"korean":["나는 딸기를 기르고 싶어서 좋은 흙에 씨앗을 심는다.","나는 규칙적으로 물을 주며 잎이 나오기를 기다린다.","아빠는 땅속에서 뿌리가 물을 빨아들인다고 말씀하신다.","몇 주 뒤, 나는 그 식물에 꽃이 피는 것을 본다.","마침내 나는 달콤한 딸기를 따서 아빠와 나누어 먹는다."]},{"id":"C008","title":"수프를 만드는 날","targets":[{"word_id":"v2155","headword":"recipe","story_form":"recipe","form":"recipe","meaning_en":"instructions for making food","meaning":"조리법"},{"word_id":"v0473","headword":"chop","story_form":"chop","form":"chop","meaning_en":"cut into small pieces","meaning":"잘게 썰다"},{"word_id":"v1742","headword":"mushroom","story_form":"mushroom","form":"mushroom","meaning_en":"a soft growth often shaped like an umbrella","meaning":"버섯"},{"word_id":"v0309","headword":"boil","story_form":"boil","form":"boil","meaning_en":"heat water until it bubbles","meaning":"끓이다"},{"word_id":"v2541","headword":"stir","story_form":"stir","form":"stir","meaning_en":"mix by moving a spoon around","meaning":"젓다"},{"word_id":"v2016","headword":"pour","story_form":"pour","form":"pour","meaning_en":"make liquid flow into something","meaning":"붓다"},{"word_id":"v1931","headword":"pepper","story_form":"pepper","form":"pepper","meaning_en":"a spice that adds a hot taste","meaning":"후추"},{"word_id":"v2299","headword":"sauce","story_form":"sauce","form":"sauce","meaning_en":"liquid added to food for flavor","meaning":"소스"},{"word_id":"v2013","headword":"pot","story_form":"pot","form":"pot","meaning_en":"a deep container for cooking","meaning":"냄비"},{"word_id":"v1649","headword":"meal","story_form":"meal","form":"meal","meaning_en":"food eaten at breakfast or dinner","meaning":"식사"}],"english":["We find a soup **recipe** for our evening **meal**.","I **chop** a **mushroom** while Mom puts water in a **pot**.","We **boil** the water, add the food, and **stir** the soup.","I **pour** in a little **sauce** and add some **pepper**.","The kitchen smells good, and everyone comes to the table."],"korean":["우리는 저녁 식사로 먹을 수프 조리법을 찾는다.","엄마가 냄비에 물을 넣는 동안 나는 버섯을 잘게 썬다.","우리는 물을 끓이고 재료를 넣어 수프를 젓는다.","나는 소스를 조금 붓고 후추를 넣는다.","부엌에서 좋은 냄새가 나자 모두가 식탁으로 온다."]},{"id":"C009","title":"아침 식사 도우미","targets":[{"word_id":"v0210","headword":"bacon","story_form":"bacon","form":"bacon","meaning_en":"thin pieces of salted pig meat","meaning":"베이컨"},{"word_id":"v1159","headword":"fry","story_form":"fry","form":"fry","meaning_en":"cook in hot oil in a pan","meaning":"프라이팬에 굽다"},{"word_id":"v1888","headword":"pan","story_form":"pan","form":"pan","meaning_en":"a flat container used for cooking","meaning":"프라이팬"},{"word_id":"v2735","headword":"toast","story_form":"toast","form":"toast","meaning_en":"bread made brown by heat","meaning":"토스트"},{"word_id":"v1335","headword":"honey","story_form":"honey","form":"honey","meaning_en":"sweet food made by bees","meaning":"꿀"},{"word_id":"v0242","headword":"bean","story_form":"bean","form":"bean","meaning_en":"a seed eaten as food","meaning":"콩"},{"word_id":"v0821","headword":"dish","story_form":"dish","form":"dish","meaning_en":"a container for serving food","meaning":"접시"},{"word_id":"v2779","headword":"tray","story_form":"tray","form":"tray","meaning_en":"a flat object for carrying dishes","meaning":"쟁반"},{"word_id":"v2353","headword":"serve","story_form":"serve","form":"serve","meaning_en":"give food to someone","meaning":"차려 주다"},{"word_id":"v2602","headword":"supper","story_form":"supper","form":"supper","meaning_en":"the meal eaten in the evening","meaning":"저녁 식사"}],"english":["Dad and I **fry** **bacon** in a **pan** for breakfast.","I put **honey** on my **toast** and one cooked **bean** on my little brother’s **dish** for him to try.","We carry the food on a **tray** and **serve** Mom in bed.","She smiles and says, “Thank you! I will make **supper** tonight.”"],"korean":["아빠와 나는 아침 식사로 먹을 베이컨을 프라이팬에 굽는다.","나는 내 토스트에 꿀을 바르고, 남동생이 맛보도록 그의 접시에 익힌 콩 한 알을 놓는다.","우리는 쟁반에 음식을 담아 침대에 있는 엄마에게 차려 드린다.","엄마는 웃으며 “고마워! 오늘 저녁은 내가 만들게.”라고 말씀하신다."]},{"id":"C010","title":"시장 장보기","targets":[{"word_id":"v1248","headword":"grocery","story_form":"grocery","form":"grocery","meaning_en":"a shop that sells food","meaning":"식료품점"},{"word_id":"v2046","headword":"price","story_form":"price","form":"price","meaning_en":"the money something costs","meaning":"가격"},{"word_id":"v0547","headword":"compare","story_form":"compare","form":"compare","meaning_en":"look at things to find differences","meaning":"비교하다"},{"word_id":"v2105","headword":"purchase","story_form":"purchase","form":"purchase","meaning_en":"buy something","meaning":"구입하다"},{"word_id":"v1923","headword":"pear","story_form":"pear","form":"pear","meaning_en":"a fruit with a narrow top","meaning":"배"},{"word_id":"v1663","headword":"melon","story_form":"melon","form":"melon","meaning_en":"a large round fruit with thick skin","meaning":"멜론"},{"word_id":"v2004","headword":"pork","story_form":"pork","form":"pork","meaning_en":"meat from a pig","meaning":"돼지고기"},{"word_id":"v0856","headword":"dozen","story_form":"dozen","form":"dozen","meaning_en":"a group of twelve","meaning":"열두 개"},{"word_id":"v0111","headword":"amount","story_form":"amount","form":"amount","meaning_en":"how much there is","meaning":"양"},{"word_id":"v0358","headword":"budget","story_form":"budget","form":"budget","meaning_en":"a plan for spending money","meaning":"예산"}],"english":["We take a small **budget** to the **grocery** store.","I **compare** the **price** of a **pear** with the **price** of a **melon**.","Mom decides to **purchase** the **pear**, some **pork**, and a **dozen** eggs.","We check the **amount** of food in our bag before going home.","There is enough for dinner, and we still have some money left."],"korean":["우리는 적은 예산으로 식료품점에 간다.","나는 배 한 개의 가격과 멜론 한 개의 가격을 비교한다.","엄마는 배와 돼지고기, 달걀 열두 개를 사기로 하신다.","우리는 집에 가기 전에 가방에 든 음식의 양을 확인한다.","저녁 식사로 먹기에 충분하고, 돈도 조금 남아 있다."]},{"id":"C011","title":"식당에서의 주문","targets":[{"word_id":"v1669","headword":"menu","story_form":"menu","form":"menu","meaning_en":"a list of available food","meaning":"메뉴"},{"word_id":"v1852","headword":"order","story_form":"order","form":"order","meaning_en":"ask for food at a restaurant","meaning":"주문하다"},{"word_id":"v2028","headword":"prefer","story_form":"prefer","form":"prefer","meaning_en":"like one thing more than another","meaning":"더 좋아하다"},{"word_id":"v2240","headword":"rice","story_form":"rice","form":"rice","meaning_en":"small white grains cooked as food","meaning":"쌀밥"},{"word_id":"v1956","headword":"pie","story_form":"pie","form":"pie","meaning_en":"food baked inside or under pastry","meaning":"파이"},{"word_id":"v2651","headword":"tea","story_form":"tea","form":"tea","meaning_en":"a drink made with leaves and water","meaning":"차"},{"word_id":"v2730","headword":"tip","story_form":"tip","form":"tip","meaning_en":"extra money for someone who serves you","meaning":"팁"},{"word_id":"v0448","headword":"charge","story_form":"charge","form":"charge","meaning_en":"ask someone to pay a price","meaning":"청구하다"},{"word_id":"v2752","headword":"total","story_form":"total","form":"total","meaning_en":"the full amount added together","meaning":"총액"},{"word_id":"v2298","headword":"satisfy","story_form":"satisfy","form":"satisfy","meaning_en":"give someone enough to feel pleased","meaning":"만족시키다"}],"english":["At a small restaurant, we read the **menu** and **order** **rice** with fish.","I **prefer** **tea** to coffee, and Dad asks for a piece of **pie**.","“Will this **satisfy** everyone?” Mom asks, and we all smile.","They **charge** us twenty dollars for the food.","Dad adds a **tip** and checks the **total** before we leave."],"korean":["작은 식당에서 우리는 메뉴를 읽고 생선을 곁들인 밥을 주문한다.","나는 커피보다 차를 좋아하고, 아빠는 파이 한 조각을 달라고 하신다.","엄마가 “이 정도면 모두 만족하겠니?”라고 물으시자 우리는 모두 웃는다.","식당에서는 음식값으로 우리에게 20달러를 청구한다.","아빠는 팁을 더하고 총액을 확인한 뒤에 식당을 나서신다."]},{"id":"C012","title":"새 학급의 첫날","targets":[{"word_id":"v1245","headword":"greet","story_form":"greet","form":"greet","meaning_en":"say hello to someone","meaning":"인사하다"},{"word_id":"v1641","headword":"mate","story_form":"mate","form":"mate","meaning_en":"a friend","meaning":"친구"},{"word_id":"v0206","headword":"awkward","story_form":"awkward","form":"awkward","meaning_en":"not feeling relaxed or comfortable","meaning":"어색한"},{"word_id":"v1525","headword":"language","story_form":"language","form":"language","meaning_en":"words people use to communicate","meaning":"언어"},{"word_id":"v0018","headword":"accent","story_form":"accent","form":"accent","meaning_en":"a particular way of saying words","meaning":"억양"},{"word_id":"v0097","headword":"aloud","story_form":"aloud","form":"aloud","meaning_en":"so that others can hear","meaning":"소리 내어"},{"word_id":"v2347","headword":"sentence","story_form":"sentence","form":"sentence","meaning_en":"a group of words expressing an idea","meaning":"문장"},{"word_id":"v2196","headword":"repeat","story_form":"repeat","form":"repeat","meaning_en":"say or do something again","meaning":"반복하다"},{"word_id":"v1056","headword":"fellow","story_form":"fellow","form":"fellow","meaning_en":"a man or person","meaning":"남자, 사람"},{"word_id":"v0263","headword":"belong","story_form":"belong","form":"belong","meaning_en":"feel accepted as part of a group","meaning":"소속감을 느끼다"}],"english":["On my first day, I **greet** the teacher, a kind **fellow** with a warm smile.","I feel **awkward** because I am still learning the **language** and have a different **accent**.","He asks me to read one **sentence** **aloud** and then **repeat** it with him.","My new **mate** helps me find the right page.","By the end of the lesson, I feel that I **belong** here."],"korean":["첫날, 나는 따뜻한 미소를 띤 친절한 분인 선생님께 인사한다.","나는 아직 언어를 배우는 중이고 억양도 달라서 어색함을 느낀다.","선생님은 문장 하나를 소리 내어 읽은 다음 함께 다시 읽자고 하신다.","새 반 친구가 내가 올바른 쪽을 찾도록 도와준다.","수업이 끝날 무렵, 나는 이곳의 일원이라는 느낌이 든다."]},{"id":"C013","title":"시험 준비","targets":[{"word_id":"v2310","headword":"schedule","story_form":"schedule","form":"schedule","meaning_en":"a plan showing when things happen","meaning":"일정"},{"word_id":"v2032","headword":"prepare","story_form":"prepare","form":"prepare","meaning_en":"get ready for something","meaning":"준비하다"},{"word_id":"v2164","headword":"refer","story_form":"refer","form":"refer","meaning_en":"look at something for information","meaning":"참고하다"},{"word_id":"v0798","headword":"dictionary","story_form":"dictionary","form":"dictionary","meaning_en":"a book that explains words","meaning":"사전"},{"word_id":"v0744","headword":"define","story_form":"define","form":"define","meaning_en":"state what a word means","meaning":"뜻을 정의하다"},{"word_id":"v2489","headword":"spell","story_form":"spell","form":"spell","meaning_en":"say the letters of a word","meaning":"철자를 말하다"},{"word_id":"v2079","headword":"pronounce","story_form":"pronounce","form":"pronounce","meaning_en":"say the sounds of a word","meaning":"발음하다"},{"word_id":"v0636","headword":"correct","story_form":"correct","form":"correct","meaning_en":"make something right","meaning":"고치다"},{"word_id":"v2020","headword":"practice","story_form":"practice","form":"practice","meaning_en":"do something repeatedly to learn it","meaning":"연습하다"},{"word_id":"v1390","headword":"improve","story_form":"improve","form":"improve","meaning_en":"make something better","meaning":"향상시키다"}],"english":["I make a study **schedule** and **prepare** for our English test.","I **refer** to a **dictionary** to **define** new words and learn how to **pronounce** them.","My sister asks me to **spell** each word, and we **correct** my mistakes together.","I **practice** for a short time every day to **improve** my English.","On test day, the words feel much easier."],"korean":["나는 학습 일정을 세우고 영어 시험을 준비한다.","새 단어의 뜻을 알아보고 발음하는 법을 배우기 위해 사전을 참고한다.","언니는 나에게 단어마다 철자를 말해 보라고 하고, 우리는 틀린 부분을 함께 고친다.","나는 영어 실력을 높이려고 매일 짧은 시간 동안 연습한다.","시험 날이 되자 단어들이 훨씬 쉽게 느껴진다."]},{"id":"C014","title":"도서관의 단서","targets":[{"word_id":"v0159","headword":"article","story_form":"article","form":"article","meaning_en":"a piece of writing in a publication","meaning":"글"},{"word_id":"v1612","headword":"magazine","story_form":"magazine","form":"magazine","meaning_en":"a publication with articles and pictures","meaning":"잡지"},{"word_id":"v2733","headword":"title","story_form":"title","form":"title","meaning_en":"the name of a piece of writing","meaning":"제목"},{"word_id":"v2683","headword":"text","story_form":"text","form":"text","meaning_en":"written words","meaning":"글"},{"word_id":"v2573","headword":"subject","story_form":"subject","form":"subject","meaning_en":"what something is about","meaning":"주제"},{"word_id":"v1894","headword":"paragraph","story_form":"paragraph","form":"paragraph","meaning_en":"a group of sentences about one idea","meaning":"문단"},{"word_id":"v2124","headword":"quote","story_form":"quote","form":"quote","meaning_en":"use someone's exact words","meaning":"인용하다"},{"word_id":"v0629","headword":"copy","story_form":"copy","form":"copy","meaning_en":"write the same words again","meaning":"베껴 쓰다"},{"word_id":"v2475","headword":"source","story_form":"source","form":"source","meaning_en":"where information comes from","meaning":"출처"},{"word_id":"v2199","headword":"report","story_form":"report","form":"report","meaning_en":"a piece of writing giving information","meaning":"보고서"}],"english":["I find an **article** in a **magazine** with the **title** “Life in the Sea.”","Its **subject** is sea animals, and one **paragraph** is about a very small fish.","I **copy** a short line to **quote** in my school **report** and write down the **source**.","The teacher reads my **text** and asks to put it in our class book.","I cannot wait to show mine to my family."],"korean":["나는 잡지에서 「바다에서의 삶」이라는 제목의 글을 찾는다.","주제는 바다 동물이고, 한 문단은 아주 작은 물고기에 관한 내용이다.","나는 학교 보고서에 인용할 짧은 문장을 베껴 쓰고 출처를 적는다.","선생님은 내 글을 읽으시고 학급 문집에 넣어도 되는지 물으신다.","나는 내 글을 가족에게 빨리 보여 주고 싶다."]},{"id":"C015","title":"과학 실험","targets":[{"word_id":"v1515","headword":"laboratory","story_form":"laboratory","form":"laboratory","meaning_en":"a room for scientific work","meaning":"실험실"},{"word_id":"v0996","headword":"experiment","story_form":"experiment","form":"experiment","meaning_en":"a test to find out something","meaning":"실험"},{"word_id":"v1652","headword":"measure","story_form":"measure","form":"measure","meaning_en":"find the size or amount","meaning":"측정하다"},{"word_id":"v2663","headword":"temperature","story_form":"temperature","form":"temperature","meaning_en":"how hot or cold something is","meaning":"온도"},{"word_id":"v1816","headword":"observe","story_form":"observe","form":"observe","meaning_en":"watch something carefully","meaning":"관찰하다"},{"word_id":"v2158","headword":"record","story_form":"record","form":"record","meaning_en":"write information to keep it","meaning":"기록하다"},{"word_id":"v2224","headword":"result","story_form":"result","form":"result","meaning_en":"what happens because of an action","meaning":"결과"},{"word_id":"v0999","headword":"explain","story_form":"explain","form":"explain","meaning_en":"make something clear with words","meaning":"설명하다"},{"word_id":"v0896","headword":"effect","story_form":"effect","form":"effect","meaning_en":"a change caused by something","meaning":"영향"},{"word_id":"v0746","headword":"degree","story_form":"degree","form":"degree","meaning_en":"a unit for measuring temperature","meaning":"도"}],"english":["In the **laboratory**, we do an **experiment** with ice and warm water.","We **measure** the **temperature** and **record** every change of one **degree**.","I **observe** the ice while my friend watches the clock.","Our teacher asks us to **explain** the **effect** of warm water on the ice.","We draw a picture to show the **result**."],"korean":["실험실에서 우리는 얼음과 따뜻한 물로 실험을 한다.","우리는 온도를 측정하고 1도씩 변할 때마다 기록한다.","친구가 시계를 보는 동안 나는 얼음을 관찰한다.","선생님은 따뜻한 물이 얼음에 어떤 영향을 주는지 설명해 보라고 하신다.","우리는 결과를 보여 주는 그림을 그린다."]},{"id":"C016","title":"학급 발표","targets":[{"word_id":"v2749","headword":"topic","story_form":"topic","form":"topic","meaning_en":"what a talk is about","meaning":"주제"},{"word_id":"v2487","headword":"speech","story_form":"speech","form":"speech","meaning_en":"a talk given to a group","meaning":"발표"},{"word_id":"v0191","headword":"audience","story_form":"audience","form":"audience","meaning_en":"people listening to a talk","meaning":"청중"},{"word_id":"v0186","headword":"attention","story_form":"attention","form":"attention","meaning_en":"careful listening or watching","meaning":"주의"},{"word_id":"v1005","headword":"express","story_form":"express","form":"express","meaning_en":"show a thought or feeling","meaning":"표현하다"},{"word_id":"v1842","headword":"opinion","story_form":"opinion","form":"opinion","meaning_en":"what someone thinks about something","meaning":"의견"},{"word_id":"v0922","headword":"emphasize","story_form":"emphasize","form":"emphasize","meaning_en":"show that something is important","meaning":"강조하다"},{"word_id":"v1918","headword":"pause","story_form":"pause","form":"pause","meaning_en":"stop for a short time","meaning":"잠시 멈추다"},{"word_id":"v0003","headword":"able","story_form":"able","form":"able","meaning_en":"having the skill or power to do something","meaning":"~할 수 있는"},{"word_id":"v0341","headword":"breath","story_form":"breath","form":"breath","meaning_en":"air taken into or out of the body","meaning":"숨"}],"english":["My **speech** has a simple **topic**: helping animals.","Before I begin, I take a deep **breath** and look at the **audience**.","I am **able** to **express** my **opinion** clearly because I have practiced.","I **pause** to get everyone’s **attention**, then **emphasize** that even small acts can help.","When I finish, my friends cheer and ask questions."],"korean":["내 발표의 주제는 동물 돕기라는 간단한 내용이다.","시작하기 전에 나는 숨을 깊게 쉬고 청중을 바라본다.","나는 연습을 했기 때문에 내 의견을 분명하게 표현할 수 있다.","모두의 주의를 끌려고 잠시 멈춘 다음, 작은 행동도 도움이 될 수 있다는 점을 강조한다.","발표가 끝나자 친구들은 환호하며 질문을 한다."]},{"id":"C017","title":"함께 푸는 수학 문제","targets":[{"word_id":"v0385","headword":"calculate","story_form":"calculate","form":"calculate","meaning_en":"find an answer using numbers","meaning":"계산하다"},{"word_id":"v2594","headword":"sum","story_form":"sum","form":"sum","meaning_en":"the amount after adding numbers","meaning":"합계"},{"word_id":"v0836","headword":"divide","story_form":"divide","form":"divide","meaning_en":"separate into parts","meaning":"나누다"},{"word_id":"v0946","headword":"equal","story_form":"equal","form":"equal","meaning_en":"the same in size or amount","meaning":"같은"},{"word_id":"v2115","headword":"quarter","story_form":"quarter","form":"quarter","meaning_en":"one of four equal parts","meaning":"4분의 1"},{"word_id":"v1270","headword":"half","story_form":"half","form":"half","meaning_en":"one of two equal parts","meaning":"절반"},{"word_id":"v1069","headword":"figure","story_form":"figure","form":"figure","meaning_en":"a number showing an amount","meaning":"수치"},{"word_id":"v0973","headword":"exact","story_form":"exact","form":"exact","meaning_en":"completely correct","meaning":"정확한"},{"word_id":"v2461","headword":"solve","story_form":"solve","form":"solve","meaning_en":"find the answer to a problem","meaning":"풀다"},{"word_id":"v1677","headword":"method","story_form":"method","form":"method","meaning_en":"a way of doing something","meaning":"방법"}],"english":["We need to **divide** a long cake into **equal** parts for a class party.","**Half** is for our class, and a **quarter** is for the teachers.","We **calculate** how much is left and write down the **exact** **figure**.","To check our work, we find the **sum** of all the parts.","Our teacher likes the **method** we use to **solve** the problem."],"korean":["우리는 학급 파티를 위해 긴 케이크를 같은 크기로 나누어야 한다.","절반은 우리 반 몫이고, 4분의 1은 선생님들 몫이다.","우리는 얼마나 남는지 계산하고 정확한 수치를 적는다.","계산이 맞는지 확인하려고 모든 조각의 몫을 더한다.","선생님은 우리가 문제를 푸는 데 사용한 방법을 좋아하신다."]},{"id":"C018","title":"학교 연극","targets":[{"word_id":"v0860","headword":"drama","story_form":"drama","form":"drama","meaning_en":"a story acted on a stage","meaning":"연극"},{"word_id":"v2513","headword":"stage","story_form":"stage","form":"stage","meaning_en":"the place where actors perform","meaning":"무대"},{"word_id":"v2260","headword":"role","story_form":"role","form":"role","meaning_en":"the part an actor plays","meaning":"역할"},{"word_id":"v0446","headword":"character","story_form":"character","form":"character","meaning_en":"a person in a story","meaning":"등장인물"},{"word_id":"v1637","headword":"mask","story_form":"mask","form":"mask","meaning_en":"a covering worn over the face","meaning":"가면"},{"word_id":"v2040","headword":"pretend","story_form":"pretend","form":"pretend","meaning_en":"act as if something is true","meaning":"~인 척하다"},{"word_id":"v1935","headword":"perform","story_form":"perform","form":"perform","meaning_en":"act or play for other people","meaning":"공연하다"},{"word_id":"v0939","headword":"entertain","story_form":"entertain","form":"entertain","meaning_en":"make people enjoy themselves","meaning":"즐겁게 하다"},{"word_id":"v0680","headword":"crowd","story_form":"crowd","form":"crowd","meaning_en":"a large group gathered together","meaning":"관객 무리"},{"word_id":"v2421","headword":"skill","story_form":"skill","form":"skill","meaning_en":"an ability learned through practice","meaning":"기술"}],"english":["Our class puts on a **drama**, and my **role** is a funny old king.","I make a **mask** for my **character** and practice the **skill** of speaking slowly.","On the **stage**, I **pretend** to lose my crown.","We **perform** for a big **crowd** and try to **entertain** everyone.","When the king finds his crown in a shoe, the children laugh."],"korean":["우리 반은 연극을 올리고, 내 역할은 우스운 늙은 왕이다.","나는 내 등장인물의 가면을 만들고 천천히 말하는 기술을 연습한다.","무대에서 나는 왕관을 잃어버린 척한다.","우리는 많은 관객 앞에서 공연하며 모두를 즐겁게 해 주려고 한다.","왕이 신발 속에서 왕관을 찾자 아이들이 웃는다."]},{"id":"C019","title":"밴드의 첫 공연","targets":[{"word_id":"v0220","headword":"band","story_form":"band","form":"band","meaning_en":"a group that plays music","meaning":"밴드"},{"word_id":"v1437","headword":"instrument","story_form":"instrument","form":"instrument","meaning_en":"an object used to make music","meaning":"악기"},{"word_id":"v2802","headword":"tune","story_form":"tune","form":"tune","meaning_en":"a series of musical notes","meaning":"곡"},{"word_id":"v0246","headword":"beat","story_form":"beat","form":"beat","meaning_en":"the regular pulse in music","meaning":"박자"},{"word_id":"v0570","headword":"concert","story_form":"concert","form":"concert","meaning_en":"an event where people play music","meaning":"공연"},{"word_id":"v1602","headword":"loud","story_form":"loud","form":"loud","meaning_en":"making a strong sound","meaning":"소리가 큰"},{"word_id":"v2892","headword":"volume","story_form":"volume","form":"volume","meaning_en":"how loud a sound is","meaning":"음량"},{"word_id":"v2742","headword":"tone","story_form":"tone","form":"tone","meaning_en":"the particular quality of a sound","meaning":"음색"},{"word_id":"v0457","headword":"cheer","story_form":"cheer","form":"cheer","meaning_en":"shout to show happiness or support","meaning":"환호하다"},{"word_id":"v1487","headword":"joy","story_form":"joy","form":"joy","meaning_en":"great happiness","meaning":"기쁨"}],"english":["Our **band** learns a new **tune** for a school **concert**.","I play a small **instrument** and follow the **beat** of the drum.","The music is too **loud**, so we turn down the **volume**.","Now we can hear the warm **tone** of the guitar.","Our families **cheer** at the end, and we go home full of **joy**."],"korean":["우리 밴드는 학교 공연을 위해 새 곡을 배운다.","나는 작은 악기를 연주하며 북의 박자를 따라간다.","음악이 너무 커서 우리는 음량을 낮춘다.","이제 기타의 따뜻한 음색을 들을 수 있다.","마지막에 가족들이 환호해 주고, 우리는 기쁨에 차서 집으로 돌아간다."]},{"id":"C020","title":"미술 전시 준비","targets":[{"word_id":"v0823","headword":"display","story_form":"display","form":"display","meaning_en":"show something for people to see","meaning":"전시하다"},{"word_id":"v1143","headword":"frame","story_form":"frame","form":"frame","meaning_en":"a border holding a picture","meaning":"액자"},{"word_id":"v1948","headword":"photograph","story_form":"photograph","form":"photograph","meaning_en":"a picture made with a camera","meaning":"사진"},{"word_id":"v1917","headword":"pattern","story_form":"pattern","form":"pattern","meaning_en":"a repeated design","meaning":"무늬"},{"word_id":"v2369","headword":"shape","story_form":"shape","form":"shape","meaning_en":"the outer form of something","meaning":"모양"},{"word_id":"v2107","headword":"purple","story_form":"purple","form":"purple","meaning_en":"having a color mixing red and blue","meaning":"보라색의"},{"word_id":"v2403","headword":"silver","story_form":"silver","form":"silver","meaning_en":"having the color of shiny gray metal","meaning":"은색의"},{"word_id":"v1513","headword":"label","story_form":"label","form":"label","meaning_en":"a small sign naming something","meaning":"이름표"},{"word_id":"v0668","headword":"create","story_form":"create","form":"create","meaning_en":"make something new","meaning":"만들다"},{"word_id":"v0045","headword":"admire","story_form":"admire","form":"admire","meaning_en":"look at something with pleasure and respect","meaning":"감탄하며 보다"}],"english":["We plan to **display** our art in the school hall.","I put a **photograph** in a **silver** **frame** and paint a **purple** **pattern** around it.","My friend uses paper to **create** the **shape** of a bird.","We **admire** each other’s work and put a **label** under every piece.","By noon, our little show is ready."],"korean":["우리는 학교 홀에 미술 작품을 전시할 계획이다.","나는 사진을 은색 액자에 넣고 그 둘레에 보라색 무늬를 그린다.","친구는 종이로 새 모양을 만든다.","우리는 서로의 작품을 감탄하며 보고, 작품마다 아래에 이름표를 붙인다.","정오가 되자 우리의 작은 전시가 준비된다."]},{"id":"C021","title":"운동회의 결승전","targets":[{"word_id":"v0511","headword":"coach","story_form":"coach","form":"coach","meaning_en":"a person who trains a sports team","meaning":"코치"},{"word_id":"v1542","headword":"league","story_form":"league","form":"league","meaning_en":"teams that compete against each other","meaning":"리그"},{"word_id":"v0441","headword":"champion","story_form":"champion","form":"champion","meaning_en":"the winner of a competition","meaning":"우승자"},{"word_id":"v1640","headword":"match","story_form":"match","form":"match","meaning_en":"a game between players or teams","meaning":"경기"},{"word_id":"v1074","headword":"final","story_form":"final","form":"final","meaning_en":"coming last","meaning":"마지막의"},{"word_id":"v0605","headword":"contest","story_form":"contest","form":"contest","meaning_en":"an event where people try to win","meaning":"대회"},{"word_id":"v2060","headword":"prize","story_form":"prize","form":"prize","meaning_en":"something given to a winner","meaning":"상"},{"word_id":"v0898","headword":"effort","story_form":"effort","form":"effort","meaning_en":"hard work toward a goal","meaning":"노력"},{"word_id":"v2090","headword":"proud","story_form":"proud","form":"proud","meaning_en":"pleased about what someone has done","meaning":"자랑스러운"},{"word_id":"v0031","headword":"achieve","story_form":"achieve","form":"achieve","meaning_en":"successfully reach a goal","meaning":"이루다"}],"english":["Our **coach** takes us to the **final** **match** of the school **league**.","The winner of this **contest** will be the **champion** and receive a small **prize**.","We put all our **effort** into the game and **achieve** our goal of playing as a team.","We do not win, but our families are **proud** of us."],"korean":["코치는 우리를 학교 리그의 마지막 경기에 데려간다.","이 대회에서 이기면 우승자가 되어 작은 상을 받는다.","우리는 경기에 모든 노력을 쏟으며 한 팀으로 경기하자는 목표를 이룬다.","우리는 이기지 못하지만, 가족들은 우리를 자랑스러워한다."]},{"id":"C022","title":"달리기 연습","targets":[{"word_id":"v1740","headword":"muscle","story_form":"muscle","form":"muscle","meaning_en":"body tissue that helps you move","meaning":"근육"},{"word_id":"v2559","headword":"stretch","story_form":"stretch","form":"stretch","meaning_en":"extend your body to loosen it","meaning":"스트레칭하다"},{"word_id":"v0342","headword":"breathe","story_form":"breathe","form":"breathe","meaning_en":"take air in and out","meaning":"호흡하다"},{"word_id":"v2529","headword":"steady","story_form":"steady","form":"steady","meaning_en":"continuing without sudden changes","meaning":"꾸준한"},{"word_id":"v2140","headword":"rate","story_form":"rate","form":"rate","meaning_en":"how fast something happens","meaning":"속도"},{"word_id":"v1950","headword":"physical","story_form":"physical","form":"physical","meaning_en":"related to the body","meaning":"신체의"},{"word_id":"v1297","headword":"health","story_form":"health","form":"health","meaning_en":"the condition of your body","meaning":"건강"},{"word_id":"v1085","headword":"fit","story_form":"fit","form":"fit","meaning_en":"strong and healthy","meaning":"건강한"},{"word_id":"v2218","headword":"rest","story_form":"rest","form":"rest","meaning_en":"time spent relaxing without work","meaning":"휴식"},{"word_id":"v1175","headword":"gain","story_form":"gain","form":"gain","meaning_en":"get more of something","meaning":"얻다"}],"english":["I want to stay **fit** and take care of my **health**, so I begin to run.","Before each run, I **stretch** every **muscle** in my legs.","I **breathe** slowly and run at a **steady** **rate** instead of going too fast.","This **physical** activity helps me **gain** strength, but I also need **rest**."],"korean":["나는 건강한 몸을 유지하고 건강을 돌보고 싶어서 달리기를 시작한다.","달리기 전에 나는 다리의 모든 근육을 스트레칭한다.","너무 빨리 달리는 대신 천천히 호흡하며 꾸준한 속도로 달린다.","이 신체 활동은 내가 힘을 기르는 데 도움이 되지만, 휴식도 필요하다."]},{"id":"C023","title":"수영장에서","targets":[{"word_id":"v1999","headword":"pool","story_form":"pool","form":"pool","meaning_en":"a place built for swimming","meaning":"수영장"},{"word_id":"v0834","headword":"dive","story_form":"dive","form":"dive","meaning_en":"jump into water head first","meaning":"물속으로 뛰어들다"},{"word_id":"v1099","headword":"float","story_form":"float","form":"float","meaning_en":"stay on top of water","meaning":"뜨다"},{"word_id":"v2412","headword":"sink","story_form":"sink","form":"sink","meaning_en":"go down below the water","meaning":"가라앉다"},{"word_id":"v0893","headword":"edge","story_form":"edge","form":"edge","meaning_en":"the outer boundary of something","meaning":"가장자리"},{"word_id":"v1773","headword":"net","story_form":"net","form":"net","meaning_en":"material with holes for catching things","meaning":"그물"},{"word_id":"v1436","headword":"instruct","story_form":"instruct","form":"instruct","meaning_en":"teach someone how to do something","meaning":"가르치다"},{"word_id":"v1112","headword":"follow","story_form":"follow","form":"follow","meaning_en":"do what instructions say","meaning":"따르다"},{"word_id":"v2278","headword":"rule","story_form":"rule","form":"rule","meaning_en":"something you are expected to obey","meaning":"규칙"},{"word_id":"v0199","headword":"avoid","story_form":"avoid","form":"avoid","meaning_en":"keep away from something","meaning":"피하다"}],"english":["At the **pool**, our teacher will **instruct** us in safe swimming.","We **follow** the first **rule**: never **dive** where the water is not deep enough.","I hold a board to **float** near the **edge** and **avoid** going into deep water.","When my toy begins to **sink**, the teacher uses a **net** to get it."],"korean":["수영장에서 선생님은 우리에게 안전하게 수영하는 법을 가르쳐 주실 것이다.","우리는 물이 충분히 깊지 않은 곳에서는 절대 뛰어들지 않는다는 첫 번째 규칙을 따른다.","나는 가장자리 근처에서 물에 뜨려고 보드를 잡고 깊은 물로 가지 않는다.","내 장난감이 가라앉기 시작하자 선생님은 그물로 그것을 건져 주신다."]},{"id":"C024","title":"자전거 수리","targets":[{"word_id":"v0333","headword":"brake","story_form":"brake","form":"brake","meaning_en":"a device that slows a vehicle","meaning":"브레이크"},{"word_id":"v2937","headword":"wheel","story_form":"wheel","form":"wheel","meaning_en":"a round part that turns","meaning":"바퀴"},{"word_id":"v1188","headword":"gear","story_form":"gear","form":"gear","meaning_en":"a toothed part that changes movement","meaning":"기어"},{"word_id":"v0436","headword":"chain","story_form":"chain","form":"chain","meaning_en":"connected metal links","meaning":"체인"},{"word_id":"v1598","headword":"loose","story_form":"loose","form":"loose","meaning_en":"not held firmly","meaning":"느슨한"},{"word_id":"v2724","headword":"tight","story_form":"tight","form":"tight","meaning_en":"firmly held in place","meaning":"단단한"},{"word_id":"v2746","headword":"tool","story_form":"tool","form":"tool","meaning_en":"an object used to do a job","meaning":"도구"},{"word_id":"v2195","headword":"repair","story_form":"repair","form":"repair","meaning_en":"fix something broken","meaning":"수리하다"},{"word_id":"v2493","headword":"spin","story_form":"spin","form":"spin","meaning_en":"turn something around quickly","meaning":"돌리다"},{"word_id":"v2243","headword":"ride","story_form":"ride","form":"ride","meaning_en":"travel on a bike or animal","meaning":"타다"}],"english":["I cannot **ride** my bike because the **chain** is **loose** and the **brake** does not work.","Dad brings a **tool** to **repair** it and checks each **gear**.","We make sure every part is **tight**, then **spin** the back **wheel**.","The bike works again, so we go for a short trip together."],"korean":["체인이 느슨하고 브레이크가 작동하지 않아서 나는 자전거를 탈 수 없다.","아빠는 수리할 도구를 가져와 기어를 하나씩 확인하신다.","우리는 모든 부품이 단단히 고정되었는지 확인한 다음 뒷바퀴를 돌린다.","자전거가 다시 움직여서 우리는 함께 짧은 나들이를 간다."]},{"id":"C025","title":"길에서 일어난 사고","targets":[{"word_id":"v0021","headword":"accident","story_form":"accident","form":"accident","meaning_en":"an unexpected event causing harm","meaning":"사고"},{"word_id":"v0663","headword":"crash","story_form":"crash","form":"crash","meaning_en":"hit something with great force","meaning":"충돌하다"},{"word_id":"v1417","headword":"injure","story_form":"injure","form":"injure","meaning_en":"hurt someone's body","meaning":"다치게 하다"},{"word_id":"v2871","headword":"victim","story_form":"victim","form":"victim","meaning_en":"a person harmed by an event","meaning":"사고를 당한 사람"},{"word_id":"v0109","headword":"ambulance","story_form":"ambulance","form":"ambulance","meaning_en":"a vehicle taking sick people to hospital","meaning":"구급차"},{"word_id":"v1379","headword":"immediate","story_form":"immediate","form":"immediate","meaning_en":"happening right away","meaning":"즉각적인"},{"word_id":"v0076","headword":"aid","story_form":"aid","form":"aid","meaning_en":"help given to someone","meaning":"도움"},{"word_id":"v2983","headword":"wound","story_form":"wound","form":"wound","meaning_en":"an injury to the body","meaning":"상처"},{"word_id":"v0589","headword":"conscious","story_form":"conscious","form":"conscious","meaning_en":"awake and aware of things","meaning":"의식이 있는"},{"word_id":"v2159","headword":"recover","story_form":"recover","form":"recover","meaning_en":"get well again","meaning":"회복하다"}],"english":["We see two cars **crash**, but we stay safely away from the **accident**.","One **victim** is **conscious** and asks for **immediate** **aid**.","A driver says, “Broken glass can **injure** you,” so we do not touch anything.","An **ambulance** arrives, and a worker covers the man’s **wound**.","Later, we hear that he will **recover**."],"korean":["우리는 자동차 두 대가 충돌하는 것을 보지만, 사고 현장에서 안전하게 떨어져 있는다.","사고를 당한 한 남자는 의식이 있으며 즉시 도와 달라고 한다.","운전자가 “깨진 유리에 다칠 수 있어요.”라고 말해서 우리는 아무것도 만지지 않는다.","구급차가 도착하고 구급대원이 남자의 상처를 덮는다.","나중에 우리는 그가 회복할 것이라는 소식을 듣는다."]},{"id":"C026","title":"몸이 아픈 아침","targets":[{"word_id":"v1373","headword":"ill","story_form":"ill","form":"ill","meaning_en":"not well","meaning":"아픈"},{"word_id":"v1062","headword":"fever","story_form":"fever","form":"fever","meaning_en":"a body temperature above normal","meaning":"열"},{"word_id":"v0644","headword":"cough","story_form":"cough","form":"cough","meaning_en":"a sudden sound clearing the throat","meaning":"기침"},{"word_id":"v2468","headword":"sore","story_form":"sore","form":"sore","meaning_en":"hurting or painful","meaning":"아픈"},{"word_id":"v2714","headword":"throat","story_form":"throat","form":"throat","meaning_en":"the passage behind your mouth","meaning":"목구멍"},{"word_id":"v1659","headword":"medicine","story_form":"medicine","form":"medicine","meaning_en":"something taken to treat illness","meaning":"약"},{"word_id":"v1658","headword":"medical","story_form":"medical","form":"medical","meaning_en":"related to treating illness","meaning":"의료의"},{"word_id":"v0691","headword":"cure","story_form":"cure","form":"cure","meaning_en":"make an illness go away","meaning":"치료하다"},{"word_id":"v2587","headword":"suffer","story_form":"suffer","form":"suffer","meaning_en":"experience pain or difficulty","meaning":"겪다"},{"word_id":"v2352","headword":"serious","story_form":"serious","form":"serious","meaning_en":"bad enough to cause worry","meaning":"심각한"}],"english":["I feel **ill** and have a **fever**, a **cough**, and a **sore** **throat**.","Mom takes me to get **medical** help because she worries it might be **serious**.","The doctor says I will not **suffer** for long and gives me some **medicine**.","“Can you **cure** it today?” I ask, but she says my body needs time and sleep."],"korean":["나는 몸이 아프고 열과 기침이 나며 목도 아프다.","엄마는 심각한 병일까 걱정되어 나를 데리고 진료를 받으러 가신다.","의사는 내가 오래 고생하지는 않을 것이라고 말하며 약을 준다.","내가 “오늘 치료해 주실 수 있나요?”라고 묻자, 의사는 몸이 회복할 시간과 잠이 필요하다고 말한다."]},{"id":"C027","title":"치과에 가는 날","targets":[{"word_id":"v0761","headword":"dentist","story_form":"dentist","form":"dentist","meaning_en":"a person who treats teeth","meaning":"치과 의사"},{"word_id":"v1882","headword":"pain","story_form":"pain","form":"pain","meaning_en":"an unpleasant feeling in the body","meaning":"통증"},{"word_id":"v1478","headword":"jaw","story_form":"jaw","form":"jaw","meaning_en":"the bones around your mouth","meaning":"턱"},{"word_id":"v0456","headword":"cheek","story_form":"cheek","form":"cheek","meaning_en":"the side of your face","meaning":"뺨"},{"word_id":"v0288","headword":"bite","story_form":"bite","form":"bite","meaning_en":"press down with your teeth","meaning":"깨물다"},{"word_id":"v0462","headword":"chew","story_form":"chew","form":"chew","meaning_en":"break food up with your teeth","meaning":"씹다"},{"word_id":"v0975","headword":"examine","story_form":"examine","form":"examine","meaning_en":"look at something carefully","meaning":"검사하다"},{"word_id":"v2043","headword":"prevent","story_form":"prevent","form":"prevent","meaning_en":"stop something before it happens","meaning":"예방하다"},{"word_id":"v2430","headword":"slight","story_form":"slight","form":"slight","meaning_en":"small in amount","meaning":"약간의"},{"word_id":"v1360","headword":"hurt","story_form":"hurt","form":"hurt","meaning_en":"feel pain","meaning":"아프다"}],"english":["There is a **slight** **pain** in my **jaw**, and it hurts when I **chew**.","The **dentist** asks to **examine** my teeth and gently touches my **cheek**.","She tells me to **bite** slowly and asks, “Does it **hurt** here?”","After helping me, she explains how to **prevent** the same problem."],"korean":["턱에 약간의 통증이 있고 씹을 때 아프다.","치과 의사는 내 치아를 검사하겠다며 뺨을 부드럽게 만진다.","그녀는 천천히 깨물어 보라고 한 뒤 “여기가 아프니?”라고 묻는다.","치료를 해 준 뒤, 그녀는 같은 문제를 예방하는 방법을 설명한다."]},{"id":"C028","title":"새 옷 고르기","targets":[{"word_id":"v1479","headword":"jeans","story_form":"jeans","form":"jeans","meaning_en":"strong cotton trousers","meaning":"청바지"},{"word_id":"v2621","headword":"sweater","story_form":"sweater","form":"sweater","meaning_en":"warm clothing for the upper body","meaning":"스웨터"},{"word_id":"v2307","headword":"scarf","story_form":"scarf","form":"scarf","meaning_en":"cloth worn around the neck","meaning":"목도리"},{"word_id":"v0643","headword":"cotton","story_form":"cotton","form":"cotton","meaning_en":"cloth made from a soft plant fiber","meaning":"면"},{"word_id":"v2975","headword":"wool","story_form":"wool","form":"wool","meaning_en":"soft material from a sheep","meaning":"양모"},{"word_id":"v1041","headword":"fashion","story_form":"fashion","form":"fashion","meaning_en":"popular styles of clothing","meaning":"패션"},{"word_id":"v0335","headword":"brand","story_form":"brand","form":"brand","meaning_en":"a name identifying a maker's products","meaning":"상표"},{"word_id":"v1884","headword":"pair","story_form":"pair","form":"pair","meaning_en":"one item made of two joined parts","meaning":"한 벌"},{"word_id":"v2592","headword":"suit","story_form":"suit","form":"suit","meaning_en":"look good on someone","meaning":"어울리다"},{"word_id":"v1035","headword":"fancy","story_form":"fancy","form":"fancy","meaning_en":"with many decorative details","meaning":"화려한"}],"english":["I need a **pair** of **jeans** and a **sweater** for the cold months.","At the shop, I touch soft **cotton** shirts and a warm **wool** **scarf**.","My sister likes **fashion** and points to a **fancy** coat with a famous **brand** name.","I choose simple clothes that **suit** me, and we both leave happy."],"korean":["나는 추운 계절에 입을 청바지 한 벌과 스웨터가 필요하다.","가게에서 나는 부드러운 면 셔츠들과 따뜻한 양모 목도리를 만져 본다.","언니는 패션을 좋아해서 유명 상표가 붙은 화려한 코트를 가리킨다.","나는 나에게 어울리는 단순한 옷을 고르고, 우리는 둘 다 기분 좋게 가게를 나선다."]},{"id":"C029","title":"방 정리","targets":[{"word_id":"v2376","headword":"shelf","story_form":"shelf","form":"shelf","meaning_en":"a board for holding things","meaning":"선반"},{"word_id":"v1959","headword":"pile","story_form":"pile","form":"pile","meaning_en":"things placed on top of each other","meaning":"더미"},{"word_id":"v2470","headword":"sort","story_form":"sort","form":"sort","meaning_en":"put things into groups","meaning":"분류하다"},{"word_id":"v1110","headword":"fold","story_form":"fold","form":"fold","meaning_en":"bend one part over another","meaning":"접다"},{"word_id":"v0879","headword":"dust","story_form":"dust","form":"dust","meaning_en":"fine dry dirt","meaning":"먼지"},{"word_id":"v2962","headword":"wipe","story_form":"wipe","form":"wipe","meaning_en":"clean by rubbing with a cloth","meaning":"닦다"},{"word_id":"v2622","headword":"sweep","story_form":"sweep","form":"sweep","meaning_en":"clean with a broom","meaning":"쓸다"},{"word_id":"v1760","headword":"neat","story_form":"neat","form":"neat","meaning_en":"clean and in good order","meaning":"깔끔한"},{"word_id":"v1170","headword":"furniture","story_form":"furniture","form":"furniture","meaning_en":"things such as tables and chairs","meaning":"가구"},{"word_id":"v1587","headword":"livingroom","story_form":"living room","form":"living room","meaning_en":"a room for sitting and relaxing","meaning":"거실"}],"english":["Our **living room** is full of **dust**, and a **pile** of clothes sits on a chair.","We **sort** the clothes, **fold** them, and put books on the **shelf**.","I **wipe** the **furniture** while Dad helps me **sweep** the floor.","Soon the room is **neat**, and we can sit down together."],"korean":["거실에는 먼지가 가득하고 의자 위에는 옷더미가 놓여 있다.","우리는 옷을 분류해 접고 책들을 선반에 놓는다.","내가 가구를 닦는 동안 아빠는 바닥을 쓰는 일을 도와주신다.","곧 방이 깔끔해져서 우리는 함께 앉아 쉴 수 있다."]},{"id":"C030","title":"작은 책장 만들기","targets":[{"word_id":"v1812","headword":"oak","story_form":"oak","form":"oak","meaning_en":"a tree with strong hard wood","meaning":"참나무"},{"word_id":"v1748","headword":"nail","story_form":"nail","form":"nail","meaning_en":"a pointed metal pin for joining things","meaning":"못"},{"word_id":"v1676","headword":"metal","story_form":"metal","form":"metal","meaning_en":"a hard material such as iron","meaning":"금속"},{"word_id":"v2533","headword":"steel","story_form":"steel","form":"steel","meaning_en":"a strong metal made mostly from iron","meaning":"강철"},{"word_id":"v0281","headword":"bind","story_form":"bind","form":"bind","meaning_en":"tie things together","meaning":"묶다"},{"word_id":"v1216","headword":"glue","story_form":"glue","form":"glue","meaning_en":"a sticky substance for joining things","meaning":"접착제"},{"word_id":"v0182","headword":"attach","story_form":"attach","form":"attach","meaning_en":"join one thing to another","meaning":"붙이다"},{"word_id":"v2567","headword":"structure","story_form":"structure","form":"structure","meaning_en":"something built from connected parts","meaning":"구조물"},{"word_id":"v2460","headword":"solid","story_form":"solid","form":"solid","meaning_en":"strong and not easily broken","meaning":"튼튼한"},{"word_id":"v2562","headword":"string","story_form":"string","form":"string","meaning_en":"a thin cord used for tying","meaning":"끈"}],"english":["We use **oak** boards to make a small shelf.","Dad brings a **steel** **nail** and a **metal** tool, while I get the **glue**.","We **attach** the sides and **bind** them with **string** while the **glue** dries.","The finished **structure** feels **solid** and has room for all my books."],"korean":["우리는 참나무 판자로 작은 책장을 만든다.","아빠는 강철 못 한 개와 금속 도구를 가져오시고, 나는 접착제를 준비한다.","우리는 옆면을 붙이고 접착제가 마르는 동안 끈으로 묶어 둔다.","완성된 구조물은 튼튼하고 내 책을 모두 놓을 공간이 있다."]},{"id":"C031","title":"휴대 전화가 꺼졌다","targets":[{"word_id":"v0236","headword":"battery","story_form":"battery","form":"battery","meaning_en":"a device that stores electrical energy","meaning":"배터리"},{"word_id":"v0382","headword":"cable","story_form":"cable","form":"cable","meaning_en":"a thick wire joining devices","meaning":"케이블"},{"word_id":"v0587","headword":"connect","story_form":"connect","form":"connect","meaning_en":"join things together","meaning":"연결하다"},{"word_id":"v0904","headword":"electric","story_form":"electric","form":"electric","meaning_en":"using or carrying electricity","meaning":"전기의"},{"word_id":"v2604","headword":"supply","story_form":"supply","form":"supply","meaning_en":"a device that provides power","meaning":"공급 장치"},{"word_id":"v2628","headword":"switch","story_form":"switch","form":"switch","meaning_en":"a control that turns something on or off","meaning":"스위치"},{"word_id":"v2321","headword":"screen","story_form":"screen","form":"screen","meaning_en":"the part that shows pictures and text","meaning":"화면"},{"word_id":"v0496","headword":"click","story_form":"click","form":"click","meaning_en":"press a mouse button","meaning":"클릭하다"},{"word_id":"v1675","headword":"message","story_form":"message","form":"message","meaning_en":"words sent to another person","meaning":"메시지"},{"word_id":"v0600","headword":"contact","story_form":"contact","form":"contact","meaning_en":"get in touch with someone","meaning":"연락하다"}],"english":["My phone is dead, so I cannot **contact** Mom or read her **message**.","I **connect** a **cable** to charge the **battery** from an **electric** power **supply**.","Then I press the **switch**, and the **screen** lights up.","I **click** on Mom’s name and tell her I am on my way home."],"korean":["휴대 전화가 꺼져서 나는 엄마에게 연락하거나 엄마의 메시지를 읽을 수 없다.","나는 전원 공급 장치에서 배터리를 충전하려고 케이블을 연결한다.","그런 다음 스위치를 누르자 화면에 불이 들어온다.","나는 엄마의 이름을 클릭하고 집에 가는 길이라고 말씀드린다."]},{"id":"C032","title":"학교 컴퓨터 수업","targets":[{"word_id":"v0515","headword":"code","story_form":"code","form":"code","meaning_en":"instructions written for a computer","meaning":"코드"},{"word_id":"v2633","headword":"system","story_form":"system","form":"system","meaning_en":"parts working together as a whole","meaning":"시스템"},{"word_id":"v0535","headword":"command","story_form":"command","form":"command","meaning_en":"an instruction telling a computer what to do","meaning":"명령"},{"word_id":"v1164","h aning_en":"give food to an animal","meaning":"먹이를 주다"},{"word_id":"v1168","headword":"fur","story_form":"fur","form":"fur","meaning_en":"the soft hair covering an animal","meaning":"털"},{"word_id":"v0227","headword":"bark","story_form":"bark","form":"bark","meaning_en":"make the loud sound of a dog","meaning":"짖다"},{"word_id":"v0705","headword":"cute","story_form":"cute","form":"cute","meaning_en":"pretty and easy to love","meaning":"귀여운"},{"word_id":"v2893","headword":"volunteer","story_form":"volunteer","form":"volunteer","meaning_en":"help without being paid","meaning":"자원봉사하다"},{"word_id":"v2217","headword":"responsible","story_form":"responsible","form":"responsible","meaning_en":"able to be trusted to do your duty","meaning":"책임감 있는"},{"word_id":"v2781","headword":"treat","story_form":"treat","form":"treat","meaning_en":"behave toward someone in a particular way","meaning":"대하다"}],"english":["I **volunteer** at a home for animals and **feed** a little dog in a **cage**.","It has brown **fur** and a **cute** face, but it likes to **bark** at new people.","I want to **adopt** it as a **pet**.","The worker asks if I can be **responsible** and **treat** it well every day.","I talk with my family before we decide."],"korean":["나는 동물 보호소에서 자원봉사를 하며 우리 안의 작은 개에게 먹이를 준다.","그 개는 갈색 털과 귀여운 얼굴을 가졌지만 낯선 사람을 보고 짖곤 한다.","나는 그 개를 반려동물로 입양하고 싶다.","직원은 내가 책임감을 갖고 매일 잘 대해 줄 수 있는지 묻는다.","우리는 결정하기 전에 가족끼리 이야기를 나눈다."]},{"id":"C034","title":"동물원 관찰","targets":[{"word_id":"v1205","headword":"giraffe","story_form":"giraffe","form":"giraffe","meaning_en":"a tall animal with a very long neck","meaning":"기린"},{"word_id":"v2997","headword":"zebra","story_form":"zebra","form":"zebra","meaning_en":"an animal with black and white stripes","meaning":"얼룩말"},{"word_id":"v0844","headword":"dolphin","story_form":"dolphin","form":"dolphin","meaning_en":"a clever sea animal with a long nose","meaning":"돌고래"},{"word_id":"v2934","headword":"whale","story_form":"whale","form":"whale","meaning_en":"a
