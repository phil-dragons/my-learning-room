eadword":"crucial","story_form":"crucial","form":"crucial","meaning_en":"extremely important to a result","meaning":"중대한"},{"word_id":"v2887","headword":"vital","story_form":"vital","form":"vital","meaning_en":"necessary for something to continue","meaning":"필수적인"},{"word_id":"v0955","headword":"essence","story_form":"essential","form":"essential","meaning_en":"completely necessary","meaning":"필수의"},{"word_id":"v1171","headword":"furthermore","story_form":"furthermore","form":"furthermore","meaning_en":"in addition to what was said","meaning":"게다가"},{"word_id":"v1311","headword":"hence","story_form":"hence","form":"hence","meaning_en":"for this reason","meaning":"그러므로"}],"english":["Our presentation's **theme** is saving water, and I prepare an **outline**.","“What should we **highlight**?” Mina asks.","“Clean water is **essential**, and access to it is **vital** for health,” I say.","We put **emphasis** on one **fundamental** idea: waste affects others too.","“Checking for leaks is **crucial**; **furthermore**, we can change daily habits.”","“**Hence**, small actions deserve a place in our plan,” Mina adds.","We shorten the slides and show one action the class can try today."],"korean":["우리 발표의 주제는 물 절약이고, 나는 개요를 준비한다.","“무엇을 강조해야 할까?” 미나가 묻는다.","“깨끗한 물은 꼭 필요하고 물을 이용할 수 있어야 건강을 지킬 수 있어.” 내가 말한다.","우리는 낭비가 다른 사람에게도 영향을 준다는 근본적인 생각 하나를 강조한다.","“누수를 확인하는 것은 중요해. 게다가 일상 습관도 바꿀 수 있어.”","“그러므로 작은 행동도 우리 계획에 넣을 가치가 있어.” 미나가 덧붙인다.","우리는 슬라이드를 줄이고 반 친구들이 오늘 시도할 행동 하나를 보여 준다."]},{"id":"O073","title":"새 계획을 설명하기","targets":[{"word_id":"v1000","headword":"explicit","story_form":"explicit","form":"explicit","meaning_en":"stated clearly and directly","meaning":"명시적인"},{"word_id":"v2849","headword":"vague","story_form":"vague","form":"vague","meaning_en":"not clear or detailed","meaning":"모호한"},{"word_id":"v0902","headword":"elaborate","story_form":"elaborate","form":"elaborate","meaning_en":"explain with more detail","meaning":"상세히 설명하다"},{"word_id":"v2316","headword":"scope","story_form":"scope","form":"scope","meaning_en":"the range of things included","meaning":"범위"},{"word_id":"v1007","headword":"extent","story_form":"extent","form":"extent","meaning_en":"how much or how far something goes","meaning":"정도"},{"word_id":"v0165","headword":"aspect","story_form":"aspect","form":"aspect","meaning_en":"one part or feature of something","meaning":"측면"},{"word_id":"v0632","headword":"core","story_form":"core","form":"core","meaning_en":"the central and most important part","meaning":"핵심"},{"word_id":"v0596","headword":"constrain","story_form":"constrain","form":"constrain","meaning_en":"limit what can be done","meaning":"제약하다"},{"word_id":"v0598","headword":"consult","story_form":"consult","form":"consult","meaning_en":"ask someone for advice","meaning":"상의하다"},{"word_id":"v2575","headword":"submit","story_form":"submit","form":"submit","meaning_en":"give work to someone for consideration","meaning":"제출하다"}],"english":["Our garden proposal is too **vague**, so we **consult** a teacher.","“Please **elaborate** on this **aspect**,” she says, pointing to the budget.","We make the costs **explicit** and reduce the **scope** of the project.","“Does the small space **constrain** us too much?” I ask.","“To some **extent**, but the **core** idea can still work,” she replies.","We draw three planting boxes instead of a whole field.","When we **submit** the new plan, everyone can see exactly what we want to build."],"korean":["정원 제안서가 너무 모호해서 우리는 선생님과 상의한다.","“이 측면을 좀 더 자세히 설명해 봐.” 선생님이 예산을 가리키며 말한다.","우리는 비용을 명시하고 사업의 범위를 줄인다.","“좁은 공간이 우리에게 너무 큰 제약인가요?” 내가 묻는다.","“어느 정도는 그렇지만 핵심 생각은 여전히 실현할 수 있어.” 선생님이 대답한다.","우리는 넓은 밭 대신 재배 상자 세 개를 그린다.","새 계획서를 제출하자 모두가 우리가 무엇을 만들려는지 정확히 알 수 있다."]},{"id":"O074","title":"일정이 바뀐 날","targets":[{"word_id":"v0129","headword":"anticipate","story_form":"anticipate","form":"anticipate","meaning_en":"expect something before it happens","meaning":"예상하다"},{"word_id":"v0150","headword":"arise","story_form":"arise","form":"arise","meaning_en":"begin to happen or exist","meaning":"발생하다"},{"word_id":"v0825","headword":"disrupt","story_form":"disrupt","form":"disrupt","meaning_en":"interrupt the normal progress of something","meaning":"차질을 주다"},{"word_id":"v0393","headword":"cancel","story_form":"cancel","form":"cancel","meaning_en":"decide that a planned event will not happen","meaning":"취소하다"},{"word_id":"v2665","headword":"temporary","story_form":"temporary","form":"temporary","meaning_en":"lasting for a limited time","meaning":"일시적인"},{"word_id":"v2616","headword":"suspend","story_form":"suspend","form":"suspend","meaning_en":"stop something for a time","meaning":"일시 중단하다"},{"word_id":"v2225","headword":"resume","story_form":"resume","form":"resume","meaning_en":"start again after a pause","meaning":"재개하다"},{"word_id":"v2676","headword":"terminate","story_form":"terminate","form":"terminate","meaning_en":"bring something to an end","meaning":"종료하다"},{"word_id":"v2773","headword":"transition","story_form":"transition","form":"transition","meaning_en":"a change from one state to another","meaning":"전환"},{"word_id":"v1945","headword":"phase","story_form":"phase","form":"phase","meaning_en":"one stage of a process","meaning":"단계"}],"english":["We **anticipate** rain, but a new problem begins to **arise** before the fair.","A broken pipe will **disrupt** work in the main hall.","“Must we **cancel** everything?” I ask.","“We can **suspend** the indoor games and use a **temporary** space,” our teacher says.","We **terminate** the old room booking and plan a careful **transition** to the gym.","“Then we can **resume** the next **phase** of preparation,” Mina says.","We move the signs, and the fair opens with only a short delay."],"korean":["우리는 비를 예상하지만 축제 전에 새로운 문제가 생기기 시작한다.","터진 수도관이 강당 작업에 차질을 줄 예정이다.","“모든 것을 취소해야 하나요?” 내가 묻는다.","“실내 게임을 잠시 중단하고 임시 공간을 쓸 수 있어.” 선생님이 말한다.","우리는 기존 방 예약을 종료하고 체육관으로의 신중한 전환을 계획한다.","“그러면 준비의 다음 단계를 재개할 수 있겠네.” 미나가 말한다.","우리는 표지판을 옮기고 축제는 잠깐 늦어진 뒤 열린다."]},{"id":"O075","title":"의견을 전하는 연습","targets":[{"word_id":"v0057","headword":"advocate","story_form":"advocate","form":"advocate","meaning_en":"publicly support an idea","meaning":"지지하다"},{"word_id":"v0176","headword":"assure","story_form":"assure","form":"assure","meaning_en":"tell someone confidently to remove doubt","meaning":"확언하다"},{"word_id":"v1943","headword":"persuade","story_form":"persuade","form":"persuade","meaning_en":"help someone agree by giving reasons","meaning":"설득하다"},{"word_id":"v0549","headword":"compel","story_form":"compel","form":"compel","meaning_en":"force someone to do something","meaning":"강요하다"},{"word_id":"v2842","headword":"urge","story_form":"urge","form":"urge","meaning_en":"strongly encourage someone to act","meaning":"촉구하다"},{"word_id":"v2078","headword":"prompt","story_form":"prompt","form":"prompt","meaning_en":"cause someone to act or think","meaning":"자극하다, 유도하다"},{"word_id":"v2177","headword":"reject","story_form":"reject","form":"reject","meaning_en":"refuse to accept something","meaning":"거절하다"},{"word_id":"v0145","headword":"approve","story_form":"approve","form":"approve","meaning_en":"officially accept a plan","meaning":"승인하다"},{"word_id":"v0733","headword":"declare","story_form":"declare","form":"declare","meaning_en":"state something clearly or officially","meaning":"선언하다"},{"word_id":"v2845","headword":"utter","story_form":"utter","form":"utter","meaning_en":"say something aloud","meaning":"말을 입 밖에 내다"}],"english":["I **advocate** a quiet reading corner for our classroom.","Pictures of crowded desks **prompt** my classmates to think about change.","“How will you **persuade** people without trying to **compel** them?” our teacher asks.","“I will **urge** them to try it and **assure** them we can review it later.”","At first, I can hardly **utter** a word in front of everyone.","“We won't **reject** an idea without listening,” Mina says, and the class votes to **approve** a trial.","I happily **declare** the corner open after we move two chairs."],"korean":["나는 교실에 조용한 독서 공간을 만들자고 지지한다.","책상이 빽빽한 사진이 친구들에게 변화를 생각하게 한다.","“강요하지 않고 사람들을 어떻게 설득할 거니?” 선생님이 묻는다.","“시도해 보자고 권하고 나중에 다시 검토할 수 있다고 확언할 거예요.”","처음에는 모두 앞에서 말을 거의 꺼내지 못한다.","“듣지도 않고 거절하지는 않을 거야.” 미나가 말하고 반은 시험 운영을 승인한다.","의자 두 개를 옮긴 뒤 나는 기쁘게 독서 공간의 시작을 선언한다."]},{"id":"O076","title":"물건을 나누는 날","targets":[{"word_id":"v0449","headword":"charity","story_form":"charity","form":"charity","meaning_en":"an organization helping people in need","meaning":"자선 단체"},{"word_id":"v0831","headword":"distribute","story_form":"distribute","form":"distribute","meaning_en":"give things among several people","meaning":"나누어 주다"},{"word_id":"v0550","headword":"compensate","story_form":"compensate","form":"compensate","meaning_en":"give something to make up for loss","meaning":"보상하다"},{"word_id":"v0768","headword":"deprive","story_form":"deprive","form":"deprive","meaning_en":"take something needed away from someone","meaning":"빼앗다"},{"word_id":"v2227","headword":"retain","story_form":"retain","form":"retain","meaning_en":"keep something","meaning":"유지하다, 보유하다"},{"word_id":"v1876","headword":"owe","story_form":"owe","form":"owe","meaning_en":"have a duty to pay or give something","meaning":"빚지다"},{"word_id":"v2916","headword":"wealth","story_form":"wealth","form":"wealth","meaning_en":"a large amount of money or property","meaning":"재산"},{"word_id":"v2031","headword":"premium","story_form":"premium","form":"premium","meaning_en":"an extra amount above the usual price","meaning":"추가금"},{"word_id":"v0766","headword":"deposit","story_form":"deposit","form":"deposit","meaning_en":"money paid in advance","meaning":"계약금"},{"word_id":"v0190","headword":"auction","story_form":"auction","form":"auction","meaning_en":"a sale where the highest offer wins","meaning":"경매"}],"english":["A local **charity** holds an **auction** of donated furniture.","The money will help families **retain** their homes.","“Do buyers **owe** a **premium** above the winning price?” I ask.","“No, and any **deposit** becomes part of the final payment,” a worker explains.","They plan to **distribute** the funds and **compensate** families for some storm losses.","“Losing **wealth** must not **deprive** anyone of respect,” the worker adds.","We help label the chairs and keep the payment records clear."],"korean":["지역 자선 단체가 기증받은 가구의 경매를 연다.","수익금은 가족들이 집을 유지하도록 도울 예정이다.","“낙찰가 외에 추가금을 내야 하나요?” 내가 묻는다.","“아니요. 미리 낸 계약금은 최종 대금에 포함돼요.” 직원이 설명한다.","단체는 기금을 나누어 폭풍 피해 일부를 보상할 계획이다.","“재산을 잃었다고 존중까지 빼앗겨서는 안 돼요.” 직원이 덧붙인다.","우리는 의자에 표지를 붙이고 대금 기록을 분명하게 정리하는 일을 돕는다."]},{"id":"O077","title":"자연의 작은 소리","targets":[{"word_id":"v0380","headword":"buzz","story_form":"buzz","form":"buzz","meaning_en":"a continuous low sound made by insects","meaning":"윙윙거림"},{"word_id":"v2253","headword":"roar","story_form":"roar","form":"roar","meaning_en":"a very loud deep sound","meaning":"우렁찬 소리"},{"word_id":"v0466","headword":"chill","story_form":"chill","form":"chill","meaning_en":"a feeling of cold or fear","meaning":"한기, 오싹함"},{"word_id":"v1156","headword":"frown","story_form":"frown","form":"frown","meaning_en":"bring your eyebrows together in displeasure","meaning":"눈살을 찌푸리다"},{"word_id":"v1210","headword":"glare","story_form":"glare","form":"glare","meaning_en":"look angrily at someone","meaning":"노려보다"},{"word_id":"v1015","headword":"eyebrow","story_form":"eyebrow","form":"eyebrow","meaning_en":"the line of hair above an eye","meaning":"눈썹"},{"word_id":"v1122","headword":"forehead","story_form":"forehead","form":"forehead","meaning_en":"the part of the face above the eyes","meaning":"이마"},{"word_id":"v0467","headword":"chin","story_form":"chin","form":"chin","meaning_en":"the lower part of the face","meaning":"턱"},{"word_id":"v0244","headword":"beard","story_form":"beard","form":"beard","meaning_en":"hair growing on the chin and cheeks","meaning":"턱수염"},{"word_id":"v0671","headword":"creep","story_form":"creep","form":"creep","meaning_en":"move slowly and quietly","meaning":"살금살금 움직이다"}],"english":["A **buzz** near our tent wakes me, followed by a distant **roar**.","I feel a **chill** and **creep** toward Dad.","He rubs his **forehead** and lifts one **eyebrow**.","“Was that a bear?” I ask, beginning to **frown**.","“A truck on the road,” he says, scratching his **chin** through his **beard**.","My sister wakes and gives us a sleepy **glare**.","We whisper our explanation, and soon all three of us are laughing quietly."],"korean":["텐트 근처의 윙윙거림에 내가 깨고, 이어 멀리서 우렁찬 소리가 들린다.","나는 오싹함을 느끼고 아빠 쪽으로 살금살금 간다.","아빠는 이마를 문지르고 한쪽 눈썹을 올린다.","“곰이었나요?” 내가 눈살을 찌푸리며 묻는다.","“도로의 트럭이야.” 아빠가 수염 사이로 턱을 긁으며 말한다.","여동생이 깨어 졸린 눈으로 우리를 노려본다.","우리는 소곤소곤 설명하고 곧 셋 다 조용히 웃는다."]},{"id":"O078","title":"마당에서의 사고","targets":[{"word_id":"v0362","headword":"bull","story_form":"bull","form":"bull","meaning_en":"an adult male of the cattle family","meaning":"황소"},{"word_id":"v1219","headword":"goat","story_form":"goat","form":"goat","meaning_en":"a farm animal often kept for milk","meaning":"염소"},{"word_id":"v1337","headword":"hook","story_form":"hook","form":"hook","meaning_en":"a curved object used for hanging things","meaning":"갈고리"},{"word_id":"v2944","headword":"whip","story_form":"whip","form":"whip","meaning_en":"a flexible object traditionally used to strike animals","meaning":"채찍"},{"word_id":"v2495","headword":"spit","story_form":"spit","form":"spit","meaning_en":"send liquid out of the mouth","meaning":"침을 뱉다"},{"word_id":"v2585","headword":"suck","story_form":"suck","form":"suck","meaning_en":"pull liquid into the mouth","meaning":"빨다"},{"word_id":"v1750","headword":"naked","story_form":"naked","form":"naked","meaning_en":"not covered by clothing","meaning":"옷으로 덮이지 않은"},{"word_id":"v1887","headword":"palm","story_form":"palm","form":"palm","meaning_en":"the inner surface of the hand","meaning":"손바닥"},{"word_id":"v2717","headword":"thumb","story_form":"thumb","form":"thumb","meaning_en":"the short thick digit of the hand","meaning":"엄지"},{"word_id":"v2624","headword":"swell","story_form":"swell","form":"swell","meaning_en":"become larger because of an injury","meaning":"붓다"}],"english":["At a farm, a **goat** tries to **suck** milk from a bottle while a **bull** watches behind a fence.","An old **whip** hangs from a **hook** in a display nearby.","“Do you still use that?” I ask the farmer.","“No, that one is only for the history display,” she replies.","Some milk lands on my **naked** arm, and I nearly **spit** out my juice in surprise.","I move back and scrape my **thumb**, then open my **palm** to show Mom.","“Is it starting to **swell**?” she asks, taking me to a worker for help.","I rest for a while, then finish the visit more carefully."],"korean":["농장에서 염소가 병의 우유를 빨아 먹으려 하고 황소는 울타리 너머에서 바라본다.","근처 전시물에는 오래된 채찍이 갈고리에 걸려 있다.","“아직도 저걸 쓰시나요?” 내가 농부에게 묻는다.","“아니, 저건 역사 전시용일 뿐이야.” 농부가 대답한다.","우유가 맨팔에 조금 튀자 나는 놀라 주스를 뱉을 뻔한다.","나는 뒤로 물러나다 엄지가 긁혀 엄마에게 손바닥을 펴 보인다.","“붓기 시작하니?” 엄마는 도움을 받으러 직원에게 나를 데려가며 묻는다.","나는 잠시 쉬고 더 조심스럽게 나머지 관람을 마친다."]},{"id":"O079","title":"나들이 사진","targets":[{"word_id":"v1139","headword":"fountain","story_form":"fountain","form":"fountain","meaning_en":"a structure that sends water into the air","meaning":"분수"},{"word_id":"v2677","headword":"terrace","story_form":"terrace","form":"terrace","meaning_en":"an open flat area beside a building","meaning":"테라스"},{"word_id":"v1998","headword":"pond","story_form":"pond","form":"pond","meaning_en":"a small area of still water","meaning":"연못"},{"word_id":"v2367","headword":"shallow","story_form":"shallow","form":"shallow","meaning_en":"not deep","meaning":"얕은"},{"word_id":"v0851","headword":"dot","story_form":"dot","form":"dot","meaning_en":"a small round mark","meaning":"점"},{"word_id":"v1913","headword":"patch","story_form":"patch","form":"patch","meaning_en":"a small area different from its surroundings","meaning":"작은 부분"},{"word_id":"v1098","headword":"flip","story_form":"flip","form":"flip","meaning_en":"turn something over quickly","meaning":"뒤집다"},{"word_id":"v2636","headword":"tag","story_form":"tag","form":"tag","meaning_en":"a label attached to something","meaning":"꼬리표"},{"word_id":"v2886","headword":"visual","story_form":"visual","form":"visual","meaning_en":"related to seeing","meaning":"시각적인"},{"word_id":"v2888","headword":"vivid","story_form":"vivid","form":"vivid","meaning_en":"very clear and bright","meaning":"생생한"}],"english":["From a garden **terrace**, we photograph a **fountain** beside a **shallow** **pond**.","A **patch** of red flowers makes the picture **vivid**.","“What is that black **dot**?” my sister asks.","“A bird; **flip** the camera screen toward me,” I say.","We read the plant's **tag** before writing our notes.","“This will be a good **visual** record of our trip,” Dad says.","At home, the photograph helps us remember even the sound of the water."],"korean":["정원 테라스에서 우리는 얕은 연못 옆 분수를 촬영한다.","붉은 꽃이 핀 작은 부분이 사진을 생생하게 만든다.","“저 검은 점은 뭐야?” 여동생이 묻는다.","“새야. 카메라 화면을 내 쪽으로 돌려 봐.” 내가 말한다.","우리는 메모하기 전에 식물의 꼬리표를 읽는다.","“여행의 좋은 시각 자료가 되겠네.” 아빠가 말한다.","집에서 사진을 보자 물소리까지 떠오른다."]},{"id":"O080","title":"길을 찾는 두 사람","targets":[{"word_id":"v0638","headword":"corridor","story_form":"corridor","form":"corridor","meaning_en":"a passage inside a building","meaning":"복도"},{"word_id":"v2803","headword":"tunnel","story_form":"tunnel","form":"tunnel","meaning_en":"a passage through or under something","meaning":"터널"},{"word_id":"v1979","headword":"platform","story_form":"platform","form":"platform","meaning_en":"the place where passengers board a train","meaning":"승강장"},{"word_id":"v0318","headword":"border","story_form":"border","form":"border","meaning_en":"a line separating two areas","meaning":"경계"},{"word_id":"v2999","headword":"zone","story_form":"zone","form":"zone","meaning_en":"an area with a particular use","meaning":"구역"},{"word_id":"v2680","headword":"territory","story_form":"territory","form":"territory","meaning_en":"an area controlled by a group","meaning":"영역"},{"word_id":"v1855","headword":"orient","story_form":"orient","form":"orient","meaning_en":"help someone understand their position","meaning":"방향을 잡게 하다"},{"word_id":"v2869","headword":"via","story_form":"via","form":"via","meaning_en":"by way of a place","meaning":"~을 거쳐"},{"word_id":"v0942","headword":"entry","story_form":"entry","form":"entry","meaning_en":"the act or place of going in","meaning":"입장, 입구"},{"word_id":"v0157","headword":"arrow","story_form":"arrow","form":"arrow","meaning_en":"a pointed sign showing direction","meaning":"화살표"}],"english":["At a large station, we follow an **arrow** down a **corridor**.","A **tunnel** leads to the wrong **platform**.","“Can this map **orient** us?” I ask.","Dad points to the **border** of the paid **zone**.","“We need **entry** on the other side, **via** the main hall,” he says.","I feel like an explorer in unknown **territory**, but we ask a worker for help.","She shows us the way, and we reach our train without running."],"korean":["큰 역에서 우리는 화살표를 따라 복도를 내려간다.","터널은 다른 승강장으로 이어진다.","“이 지도로 방향을 잡을 수 있을까요?” 내가 묻는다.","아빠는 유료 구역의 경계를 가리킨다.","“중앙 홀을 거쳐 반대편으로 들어가야 해.” 아빠가 말한다.","나는 미지의 영역에 온 탐험가 같지만, 우리는 직원에게 도움을 구한다.","직원이 길을 알려 줘서 우리는 뛰지 않고 기차에 도착한다."]},{"id":"O081","title":"옛 항구의 변화","targets":[{"word_id":"v0728","headword":"decade","story_form":"decade","form":"decade","meaning_en":"a period of ten years","meaning":"십 년"},{"word_id":"v0602","headword":"contemporary","story_form":"contemporary","form":"contemporary","meaning_en":"belonging to the present time","meaning":"현대의"},{"word_id":"v1131","headword":"former","story_form":"former","form":"former","meaning_en":"belonging to an earlier time","meaning":"이전의"},{"word_id":"v1531","headword":"latter","story_form":"latter","form":"latter","meaning_en":"the second of two things mentioned","meaning":"후자의"},{"word_id":"v1651","headword":"meanwhile","story_form":"meanwhile","form":"meanwhile","meaning_en":"at the same time","meaning":"그동안"},{"word_id":"v1777","headword":"nevertheless","story_form":"nevertheless","form":"nevertheless","meaning_en":"despite what was just said","meaning":"그럼에도 불구하고"},{"word_id":"v1792","headword":"nonetheless","story_form":"nonetheless","form":"nonetheless","meaning_en":"in spite of that","meaning":"그럼에도"},{"word_id":"v2940","headword":"whereas","story_form":"whereas","form":"whereas","meaning_en":"while, showing a difference","meaning":"반면에"},{"word_id":"v1574","headword":"likewise","story_form":"likewise","form":"likewise","meaning_en":"in a similar way","meaning":"마찬가지로"},{"word_id":"v1003","headword":"export","story_form":"export","form":"export","meaning_en":"send goods to another country for sale","meaning":"수출하다"}],"english":["One **decade** ago, our town used to **export** fish from this harbor.","Its **former** market is now a **contemporary** art center.","“Do you prefer the old building or the new one?” Dad asks, and I choose the **latter**.","He remembers busy boats, **whereas** I enjoy the pictures.","“The jobs have changed; **nevertheless**, the harbor still brings people together,” he says.","**Meanwhile**, Grandma buys fish at a smaller shop and says it is **nonetheless** excellent.","I taste some, and Dad does **likewise**; we all find something to enjoy."],"korean":["십 년 전 우리 마을은 이 항구에서 생선을 수출하곤 했다.","이전 시장 건물은 이제 현대 미술관이다.","“옛 건물과 새 건물 중 어느 쪽이 좋니?” 아빠가 묻고 나는 후자를 고른다.","아빠는 분주한 배들을 기억하는 반면 나는 그림을 즐긴다.","“일자리는 변했지만 그럼에도 항구는 여전히 사람들을 모아 주지.” 아빠가 말한다.","그동안 할머니는 더 작은 가게에서 생선을 사시며 그래도 훌륭하다고 하신다.","나는 조금 맛보고 아빠도 마찬가지로 맛보신다. 우리 모두 즐길 거리를 찾는다."]},{"id":"O082","title":"선택의 순간","targets":[{"word_id":"v0102","headword":"alternate","story_form":"alternative","form":"alternative","meaning_en":"another possible choice","meaning":"대안"},{"word_id":"v1845","headword":"opt","story_form":"option","form":"option","meaning_en":"something you may choose","meaning":"선택지"},{"word_id":"v2459","headword":"sole","story_form":"sole","form":"sole","meaning_en":"the only one","meaning":"유일한"},{"word_id":"v0873","headword":"dual","story_form":"dual","form":"dual","meaning_en":"having two parts or purposes","meaning":"이중의"},{"word_id":"v1738","headword":"multiple","story_form":"multiple","form":"multiple","meaning_en":"more than one","meaning":"여러 개의"},{"word_id":"v1809","headword":"numerous","story_form":"numerous","form":"numerous","meaning_en":"many in number","meaning":"수많은"},{"word_id":"v0197","headword":"avail","story_form":"available","form":"available","meaning_en":"ready to be used","meaning":"이용 가능한"},{"word_id":"v0042","headword":"adequate","story_form":"adequate","form":"adequate","meaning_en":"enough for a particular need","meaning":"충분한"},{"word_id":"v2588","headword":"suffice","story_form":"suffice","form":"suffice","meaning_en":"be enough","meaning":"충분하다"},{"word_id":"v1161","headword":"fulfil","story_form":"fulfil","form":"fulfil","meaning_en":"do what was promised or required","meaning":"이행하다"}],"english":["Our club has **numerous** ideas but only one room **available**.","“Is that our **sole** **option**?” I ask.","“An outdoor meeting is an **alternative**, if the weather is good,” Mina says.","We need **adequate** space for **multiple** activities.","“Could the room serve a **dual** purpose?” our teacher asks.","Two folding tables will **suffice**, leaving room for reading and drawing.","We arrange the room and **fulfil** our promise to welcome everyone."],"korean":["우리 동아리에는 아이디어가 많지만 이용할 수 있는 방은 하나뿐이다.","“그게 유일한 선택지인가요?” 내가 묻는다.","“날씨가 좋다면 야외 모임이 대안이야.” 미나가 말한다.","우리는 여러 활동을 위한 충분한 공간이 필요하다.","“방을 두 가지 목적으로 쓸 수 있을까?” 선생님이 묻는다.","접이식 탁자 두 개면 충분해서 읽기와 그림 그리기 공간이 남는다.","우리는 방을 정리하고 모두를 환영하겠다는 약속을 이행한다."]},{"id":"O083","title":"생각을 이어 가는 말","targets":[{"word_id":"v0611","headword":"contrary","story_form":"contrary","form":"contrary","meaning_en":"opposite to what was expected or said","meaning":"반대되는"},{"word_id":"v0801","headword":"differ","story_form":"differ","form":"differ","meaning_en":"be unlike each other","meaning":"다르다"},{"word_id":"v1368","headword":"identical","story_form":"identical","form":"identical","meaning_en":"exactly the same","meaning":"동일한"},{"word_id":"v1671","headword":"mere","story_form":"mere","form":"mere","meaning_en":"only and nothing more","meaning":"단지 ~에 불과한"},{"word_id":"v1467","headword":"irony","story_form":"irony","form":"irony","meaning_en":"a result opposite to what was expected","meaning":"아이러니"},{"word_id":"v0014","headword":"absurd","story_form":"absurd","form":"absurd","meaning_en":"clearly unreasonable or ridiculous","meaning":"터무니없는"},{"word_id":"v1765","headword":"negate","story_form":"negate","form":"negate","meaning_en":"make a statement or effect no longer valid","meaning":"부정하다"},{"word_id":"v2864","headword":"versus","story_form":"versus","form":"versus","meaning_en":"in contrast or competition with","meaning":"~ 대"},{"word_id":"v2009","headword":"posit","story_form":"posit","form":"posit","meaning_en":"suggest an idea as a starting point","meaning":"가정하다"},{"word_id":"v1624","headword":"manifest","story_form":"manifest","form":"manifest","meaning_en":"clear and easy to see","meaning":"명백한"}],"english":["Our teacher writes “appearance **versus** reality” above two **identical** boxes.","“I **posit** that they hold the same thing,” Jun says, using a new word.","“Their contents may **differ**,” I reply.","**Contrary** to his guess, one holds a **mere** button and the other holds a watch.","“One example can **negate** a claim that they must always match,” our teacher explains.","Jun laughs at the **irony**: the box marked “valuable” has the button.","The difference is now **manifest**, and we agree that guessing by labels alone can be **absurd**."],"korean":["선생님은 똑같은 상자 두 개 위에 ‘겉모습 대 실제’라고 쓴다.","“내용물도 같다고 가정합니다.” 준이 새 단어를 사용해 말한다.","“내용물은 다를 수 있어.” 내가 대답한다.","준의 추측과 반대로 하나에는 단추 하나만, 다른 하나에는 시계가 들어 있다.","“반드시 언제나 같다는 주장은 예시 하나로도 부정할 수 있어.” 선생님이 설명한다.","준은 ‘귀중품’이라고 적힌 상자에 단추가 있는 아이러니에 웃는다.","이제 차이가 명백해져 우리는 표지만 보고 판단하는 것이 터무니없을 수 있다고 동의한다."]},{"id":"O084","title":"빠르게 움직이는 팀","targets":[{"word_id":"v2625","headword":"swift","story_form":"swift","form":"swift","meaning_en":"moving very quickly","meaning":"재빠른"},{"word_id":"v0716","headword":"dash","story_form":"dash","form":"dash","meaning_en":"run somewhere suddenly and quickly","meaning":"급히 달리다"},{"word_id":"v2318","headword":"scramble","story_form":"scramble","form":"scramble","meaning_en":"move hurriedly and awkwardly","meaning":"허둥지둥 움직이다"},{"word_id":"v2308","headword":"scatter","story_form":"scatter","form":"scatter","meaning_en":"spread things in different directions","meaning":"흩뜨리다"},{"word_id":"v2497","headword":"split","story_form":"split","form":"split","meaning_en":"divide into parts or groups","meaning":"나누다"},{"word_id":"v2511","headword":"stack","story_form":"stack","form":"stack","meaning_en":"put things in a neat pile","meaning":"쌓다"},{"word_id":"v0785","headword":"detach","story_form":"detach","form":"detach","meaning_en":"separate something from what holds it","meaning":"떼어 내다"},{"word_id":"v1871","headword":"overlap","story_form":"overlap","form":"overlap","meaning_en":"partly cover the same space","meaning":"겹치다"},{"word_id":"v0518","headword":"coincide","story_form":"coincide","form":"coincide","meaning_en":"happen at the same time","meaning":"동시에 일어나다"},{"word_id":"v2407","headword":"simultaneous","story_form":"simultaneous","form":"simultaneous","meaning_en":"happening at the same time","meaning":"동시의"}],"english":["A **swift** wind begins to **scatter** papers at our outdoor fair.","Two **simultaneous** games **coincide** with the sudden change in weather.","“Don't **dash** across the road!” our teacher calls as we **scramble** to collect things.","“Let's **split** into two groups,” Mina says.","I **detach** a sign while Jun begins to **stack** the chairs.","“Make sure our work areas don't **overlap** too much,” he suggests.","We finish safely, then carry the games into the hall."],"korean":["재빠른 바람이 야외 축제의 종이를 흩뜨리기 시작한다.","두 게임이 동시에 진행되는 중에 날씨가 갑자기 바뀐다.","우리가 물건을 모으느라 허둥대자 선생님이 “도로를 가로질러 뛰지 마!”라고 외친다.","“두 모둠으로 나누자.” 미나가 말한다.","내가 표지판을 떼어 내는 동안 준은 의자를 쌓기 시작한다.","“서로 작업하는 공간이 너무 겹치지 않게 하자.” 준이 제안한다.","우리는 안전하게 정리를 마친 뒤 게임 도구를 강당으로 옮긴다."]},{"id":"O085","title":"끝까지 읽은 책","targets":[{"word_id":"v2070","headword":"profound","story_form":"profound","form":"profound","meaning_en":"showing deep understanding or feeling","meaning":"깊이 있는"},{"word_id":"v2075","headword":"prominent","story_form":"prominent","form":"prominent","meaning_en":"well-known and important","meaning":"저명한"},{"word_id":"v2600","headword":"superior","story_form":"superior","form":"superior","meaning_en":"better in quality","meaning":"더 우수한"},{"word_id":"v2599","headword":"superb","story_form":"superb","form":"superb","meaning_en":"extremely good","meaning":"최고의"},{"word_id":"v2679","headword":"terrific","story_form":"terrific","form":"terrific","meaning_en":"very good or enjoyable","meaning":"아주 멋진"},{"word_id":"v1194","headword":"genius","story_form":"genius","form":"genius","meaning_en":"a person with exceptional creative ability","meaning":"천재"},{"word_id":"v0906","headword":"elegant","story_form":"elegant","form":"elegant","meaning_en":"graceful and simple in style","meaning":"우아한"},{"word_id":"v0751","headword":"delicate","story_form":"delicate","form":"delicate","meaning_en":"needing care because of sensitivity","meaning":"섬세한"},{"word_id":"v2670","headword":"tender","story_form":"tender","form":"tender","meaning_en":"gentle and loving","meaning":"다정한"},{"word_id":"v2262","headword":"romantic","story_form":"romantic","form":"romantic","meaning_en":"related to love and affection","meaning":"낭만적인"}],"english":["I finish a novel by a **prominent** writer whom reviewers call a **genius**.","The language is **elegant**, and one **tender** scene makes me cry.","“Was it a **romantic** story?” my sister asks.","“Yes, but it also handles a **delicate** family problem,” I say.","I think the ending is **profound**, while she calls the cover **terrific**.","“Is it **superior** to your last book?” she asks.","I lend it to her instead of deciding; we may find different reasons to call it **superb**."],"korean":["나는 평론가들이 천재라고 부르는 저명한 작가의 소설을 다 읽는다.","문체는 우아하고 다정한 장면 하나는 나를 울린다.","“낭만적인 이야기였어?” 언니가 묻는다.","“응, 하지만 섬세하게 다뤄야 할 가족 문제도 나와.” 내가 말한다.","나는 결말이 깊이 있다고 생각하고 언니는 표지가 아주 멋지다고 한다.","“지난번 책보다 더 좋아?” 언니가 묻는다.","나는 결론을 내리는 대신 책을 빌려준다. 우리는 서로 다른 이유로 최고의 책이라고 느낄 수 있다."]},{"id":"O086","title":"다시 보는 역사","targets":[{"word_id":"v1031","headword":"fame","story_form":"famous","form":"famous","meaning_en":"known by many people","meaning":"유명한"},{"word_id":"v1966","headword":"pioneer","story_form":"pioneer","form":"pioneer","meaning_en":"a person among the first to do something","meaning":"개척자"},{"word_id":"v2024","headword":"precede","story_form":"precede","form":"precede","meaning_en":"come before something else","meaning":"앞서다"},{"word_id":"v1660","headword":"medieval","story_form":"medieval","form":"medieval","meaning_en":"related to the European Middle Ages","meaning":"중세의"},{"word_id":"v0912","headword":"elite","story_form":"elite","form":"elite","meaning_en":"a small group with power or advantages","meaning":"엘리트층"},{"word_id":"v2059","headword":"privilege","story_form":"privilege","form":"privilege","meaning_en":"a special advantage given to some people","meaning":"특권"},{"word_id":"v0810","headword":"diplomat","story_form":"diplomat","form":"diplomat","meaning_en":"a person representing a country abroad","meaning":"외교관"},{"word_id":"v0107","headword":"ambassador","story_form":"ambassador","form":"ambassador","meaning_en":"a country's highest representative in another country","meaning":"대사"},{"word_id":"v1605","headword":"loyal","story_form":"loyal","form":"loyal","meaning_en":"faithful to a person or cause","meaning":"충실한"},{"word_id":"v0310","headword":"bold","story_form":"bold","form":"bold","meaning_en":"brave and willing to take risks","meaning":"대담한"}],"english":["For a history project, we compare a **medieval** messenger with a modern **ambassador**.","A **famous** **pioneer** of travel appears in another student's report.","“Does a messenger always **precede** a visiting ruler?” I ask.","“Not always; check the particular event,” our teacher says.","We discuss how an **elite** group may have the **privilege** of meeting leaders.","“A **diplomat** may be **loyal** to a country while offering **bold** advice,” Mina adds.","We revise our reports to show differences instead of treating every period as the same."],"korean":["역사 과제에서 우리는 중세 전령과 현대 대사를 비교한다.","다른 학생의 보고서에는 유명한 여행 개척자가 등장한다.","“전령은 언제나 방문하는 통치자보다 먼저 오나요?” 내가 묻는다.","“늘 그렇지는 않아. 구체적인 사건을 확인해 봐.” 선생님이 말한다.","우리는 엘리트 집단이 지도자를 만날 특권을 가질 수 있다는 점을 논의한다.","“외교관은 나라에 충실하면서도 대담한 조언을 할 수 있어.” 미나가 덧붙인다.","우리는 모든 시대를 같게 보지 않고 차이를 보여 주도록 보고서를 고친다."]},{"id":"O087","title":"새로운 기술의 영향","targets":[{"word_id":"v1383","headword":"impact","story_form":"impact","form":"impact","meaning_en":"a strong effect on something","meaning":"영향"},{"word_id":"v2085","headword":"prospect","story_form":"prospect","form":"prospect","meaning_en":"a possibility that may happen","meaning":"전망"},{"word_id":"v0934","headword":"enhance","story_form":"enhance","form":"enhance","meaning_en":"improve the quality of something","meaning":"향상하다"},{"word_id":"v0911","headword":"eliminate","story_form":"eliminate","form":"eliminate","meaning_en":"remove completely","meaning":"제거하다"},{"word_id":"v0618","headword":"convert","story_form":"convert","form":"convert","meaning_en":"change into a different form","meaning":"전환하다"},{"word_id":"v2772","headword":"transform","story_form":"transform","form":"transform","meaning_en":"change greatly","meaning":"변화시키다"},{"word_id":"v2844","headword":"utilize","story_form":"utilize","form":"utilize","meaning_en":"make practical use of something","meaning":"활용하다"},{"word_id":"v1387","headword":"import","story_form":"import","form":"import","meaning_en":"bring goods from another country","meaning":"수입하다"},{"word_id":"v1392","headword":"incentive","story_form":"incentive","form":"incentive","meaning_en":"something that encourages action","meaning":"장려책"},{"word_id":"v1192","headword":"generate","story_form":"generate","form":"generate","meaning_en":"produce or create something","meaning":"생산하다"}],"english":["Our town studies the **prospect** of using sunlight to **generate** power.","A new **incentive** may help homes **utilize** clean energy.","“Must we **import** all the equipment?” I ask at a public meeting.","“Some parts, but local workers can **convert** suitable buildings,” an engineer says.","We discuss the **impact** and how the plan could **enhance** daily life.","“It won't **eliminate** every problem, but it could **transform** how we use energy.”","I bring home a balanced report listing both hopes and unanswered questions."],"korean":["우리 마을은 햇빛으로 전기를 생산할 전망을 검토한다.","새 장려책이 가정에서 청정에너지를 활용하는 데 도움이 될 수 있다.","“장비를 모두 수입해야 하나요?” 내가 주민 회의에서 묻는다.","“일부 부품은 그렇지만 현지 인력이 적합한 건물을 전환할 수 있어요.” 공학자가 말한다.","우리는 그 영향과 계획이 생활을 어떻게 향상할지 논의한다.","“모든 문제를 없애지는 못해도 에너지 사용 방식을 크게 바꿀 수 있어요.”","나는 기대와 아직 답이 없는 질문을 함께 적은 균형 잡힌 보고서를 가져온다."]},{"id":"O088","title":"마지막 도전","targets":[{"word_id":"v2825","headword":"undertake","story_form":"undertake","form":"undertake","meaning_en":"agree to take responsibility for a job","meaning":"맡다"},{"word_id":"v0793","headword":"devote","story_form":"devote","form":"devote","meaning_en":"give time or effort to something","meaning":"바치다"},{"word_id":"v0737","headword":"dedicate","story_form":"dedicate","form":"dedicate","meaning_en":"give something to honor someone","meaning":"헌정하다"},{"word_id":"v2647","headword":"task","story_form":"task","form":"task","meaning_en":"a piece of work to be done","meaning":"과제"},{"word_id":"v2817","headword":"ultimate","story_form":"ultimate","form":"ultimate","meaning_en":"final or most important","meaning":"궁극적인"},{"word_id":"v1429","headword":"inspire","story_form":"inspire","form":"inspire","meaning_en":"make someone want to act or create","meaning":"영감을 주다"},{"word_id":"v2021","headword":"praise","story_form":"praise","form":"praise","meaning_en":"express approval or admiration","meaning":"칭찬하다"},{"word_id":"v0978","headword":"excel","story_form":"excel","form":"excel","meaning_en":"do something extremely well","meaning":"뛰어나다"},{"word_id":"v0538","headword":"commit","story_form":"commit","form":"commit","meaning_en":"promise to give time or effort","meaning":"전념하다"},{"word_id":"v2635","headword":"tackle","story_form":"tackle","form":"tackle","meaning_en":"begin dealing with a difficult problem","meaning":"해결에 나서다"}],"english":["I **undertake** the **task** of making a class storybook.","“Will you **devote** some time to it every day?” our teacher asks.","“I will **commit** to that and **tackle** one page at a time,” I reply.","My classmates **inspire** me with drawings, and I **praise** their careful work.","“You don't need to **excel** at everything,” Mina reminds me.","Our **ultimate** goal is a book everyone helped create.","When we finish, we **dedicate** it to the teacher who encouraged our first stories."],"korean":["나는 학급 이야기책을 만드는 과제를 맡는다.","“매일 시간을 좀 들일 수 있겠니?” 선생님이 묻는다.","“그 일에 전념하고 한 번에 한 쪽씩 해 볼게요.” 내가 대답한다.","친구들의 그림이 영감을 주고, 나는 친구들의 정성스러운 작업을 칭찬한다.","“모든 것을 아주 잘할 필요는 없어.” 미나가 알려 준다.","우리의 궁극적인 목표는 모두가 함께 만든 책이다.","완성한 뒤 우리는 첫 이야기를 격려해 준 선생님께 책을 헌정한다."]},{"id":"O089","title":"발사 실험을 멈춘 이유","targets":[{"word_id":"v0005","headword":"abort","story_form":"abort","form":"abort","meaning_en":"stop a planned activity before it finishes","meaning":"중단하다"},{"word_id":"v1533","headword":"launch","story_form":"launch","form":"launch","meaning_en":"send something into the air or begin a project","meaning":"발사하다"},{"word_id":"v0294","headword":"blast","story_form":"blast","form":"blast","meaning_en":"a sudden strong burst of air or sound","meaning":"강한 폭발음, 돌풍"},{"word_id":"v1001","headword":"explode","story_form":"explode","form":"explode","meaning_en":"burst apart suddenly and violently","meaning":"폭발하다"},{"word_id":"v2406","headword":"simulate","story_form":"simulate","form":"simulate","meaning_en":"copy a situation for practice or study","meaning":"모의실험하다"},{"word_id":"v2789","headword":"trigger","story_form":"trigger","form":"trigger","meaning_en":"cause something to start","meaning":"촉발하다"},{"word_id":"v2775","headword":"transmit","story_form":"transmit","form":"transmit","meaning_en":"send a signal or information","meaning":"전송하다"},{"word_id":"v2659","headword":"telegraph","story_form":"telegraph","form":"telegraph","meaning_en":"an old system sending messages through wires","meaning":"전신"},{"word_id":"v1703","headword":"mobile","story_form":"mobile","form":"mobile","meaning_en":"able to be moved easily","meaning":"이동 가능한"},{"word_id":"v1504","headword":"kit","story_form":"kit","form":"kit","meaning_en":"a set of tools for one purpose","meaning":"도구 세트"}],"english":["At a science center, we use a **mobile** training **kit** to **simulate** a space mission.","“Will we really **launch** anything?” I ask.","“Only on the screen; no object will **explode** or make a real **blast**,” the guide says.","A warning light can **trigger** an instruction to **abort** the mission.","“Then **transmit** a message to your partner,” she adds.","We compare the modern signals with an old **telegraph** display.","When the warning appears, we stop the simulation and explain our choice."],"korean":["과학관에서 우리는 이동식 교육 도구 세트로 우주 임무를 모의실험한다.","“정말 무언가를 발사하나요?” 내가 묻는다.","“화면에서만 할 거야. 실제로 폭발하거나 폭발음을 내는 물체는 없어.” 안내자가 말한다.","경고등은 임무 중단 지시를 촉발할 수 있다.","“그다음 짝에게 메시지를 보내렴.” 안내자가 덧붙인다.","우리는 현대 신호를 오래된 전신 전시물과 비교한다.","경고가 나타나자 우리는 모의실험을 멈추고 선택한 이유를 설명한다."]},{"id":"O090","title":"안전 훈련의 날","targets":[{"word_id":"v0865","headword":"drill","story_form":"drill","form":"drill","meaning_en":"a practice for a particular situation","meaning":"훈련"},{"word_id":"v0947","headword":"equip","story_form":"equip","form":"equip","meaning_en":"provide the things needed for a task","meaning":"장비를 갖추다"},{"word_id":"v2601","headword":"supervise","story_form":"supervise","form":"supervise","meaning_en":"watch and guide an activity","meaning":"감독하다"},{"word_id":"v1019","headword":"facility","story_form":"facility","form":"facility","meaning_en":"a place built for a particular purpose","meaning":"시설"},{"word_id":"v0228","headword":"barrier","story_form":"barrier","form":"barrier","meaning_en":"something that blocks a path","meaning":"차단물"},{"word_id":"v0218","headword":"ban","story_form":"ban","form":"ban","meaning_en":"an official rule saying something is not allowed","meaning":"금지령"},{"word_id":"v0579","headword":"confine","story_form":"confine","form":"confine","meaning_en":"keep someone within a limited area","meaning":"가두다"},{"word_id":"v0426","headword":"cease","story_form":"cease","form":"cease","meaning_en":"stop happening or doing something","meaning":"중단하다"},{"word_id":"v2968","headword":"withdraw","story_form":"withdraw","form":"withdraw","meaning_en":"move back or leave a place","meaning":"물러나다"},{"word_id":"v1094","headword":"flee","story_form":"flee","form":"flee","meaning_en":"leave quickly to escape danger","meaning":"피하다"}],"english":["Our school holds a safety **drill** in the sports **facility**.","Staff **equip** each group with a map and **supervise** the practice.","“Could that **barrier** **confine** us inside?” I ask.","“That is why we check every exit,” our teacher says.","We learn about the **ban** on leaving bags in doorways.","“**Cease** your activity and **withdraw** by the marked route; don't **flee** in a panic.”","Outside, we wait while the teacher checks that everyone has arrived."],"korean":["학교는 체육 시설에서 안전 훈련을 한다.","직원들은 각 모둠에 지도를 갖춰 주고 훈련을 감독한다.","“저 차단물이 우리를 안에 가둘 수 있나요?” 내가 묻는다.","“그래서 출구를 모두 확인하는 거야.” 선생님이 말한다.","우리는 출입구에 가방을 두는 것이 금지되어 있음을 배운다.","“활동을 멈추고 표시된 길로 이동해. 당황해서 마구 도망치지는 마.”","밖에서 우리는 선생님이 모두 도착했는지 확인할 때까지 기다린다."]},{"id":"O091","title":"겁먹은 개를 만나다","targets":[{"word_id":"v2868","headword":"veterinarian","story_form":"veterinarian","form":"veterinarian","meaning_en":"a doctor who treats animals","meaning":"수의사"},{"word_id":"v0522","headword":"collar","story_form":"collar","form":"collar","meaning_en":"a band worn around an animal's neck","meaning":"목줄, 목걸이"},{"word_id":"v0501","headword":"cling","story_form":"cling","form":"cling","meaning_en":"hold tightly to someone or something","meaning":"꼭 붙잡다"},{"word_id":"v2522","headword":"starve","story_form":"starve","form":"starve","meaning_en":"suffer greatly from too little food","meaning":"굶주리다"},{"word_id":"v1470","headword":"isolate","story_form":"isolate","form":"isolate","meaning_en":"keep apart from others","meaning":"격리하다"},{"word_id":"v1286","headword":"harsh","story_form":"harsh","form":"harsh","meaning_en":"unkind or very severe","meaning":"가혹한"},{"word_id":"v0356","headword":"brute","story_form":"brute","form":"brute","meaning_en":"a person who behaves cruelly","meaning":"야수 같은 사람"},{"word_id":"v2750","headword":"torture","story_form":"torture","form":"torture","meaning_en":"deliberately cause severe suffering","meaning":"고문하다, 심하게 괴롭히다"},{"word_id":"v1137","headword":"foster","story_form":"foster","form":"foster","meaning_en":"care for someone temporarily","meaning":"임시로 돌보다"},{"word_id":"v0258","headword":"behave","story_form":"behave","form":"behave","meaning_en":"act in a particular way","meaning":"행동하다"}],"english":["We bring a frightened dog with a broken **collar** to a **veterinarian**.","It begins to **cling** to the blanket we put beside it.","“Did someone let it **starve** or **torture** it?” I ask.","“We don't know yet, so don't call anyone a **brute** without facts,” she replies.","She explains that **harsh** treatment can affect how animals **behave**.","“We will **isolate** it briefly for checks, then look for someone to **foster** it.”","We leave our contact details and later hear that the dog is resting safely."],"korean":["우리는 목줄이 끊어진 겁먹은 개를 수의사에게 데려간다.","개는 옆에 둔 담요에 바짝 붙기 시작한다.","“누군가 굶기거나 심하게 괴롭힌 건가요?” 내가 묻는다.","“아직 모르니 사실을 모른 채 누군가를 잔인한 사람이라고 부르지는 말자.” 수의사가 대답한다.","수의사는 가혹한 대우가 동물의 행동에 영향을 줄 수 있다고 설명한다.","“검사를 위해 잠시 격리한 뒤 임시로 돌봐 줄 사람을 찾을 거야.”","우리는 연락처를 남기고 나중에 개가 안전하게 쉬고 있다는 소식을 듣는다."]},{"id":"O092","title":"새로운 요리 수업","targets":[{"word_id":"v0376","headword":"butcher","story_form":"butcher","form":"butcher","meaning_en":"a person who prepares and sells meat","meaning":"정육점 주인"},{"word_id":"v0991","headword":"exotic","story_form":"exotic","form":"exotic","meaning_en":"unusual because it comes from a distant place","meaning":"이국적인"},{"word_id":"v0295","headword":"blend","story_form":"blend","form":"blend","meaning_en":"mix things smoothly together","meaning":"섞다"},{"word_id":"v0809","headword":"dip","story_form":"dip","form":"dip","meaning_en":"put something briefly into liquid","meaning":"담그다"},{"word_id":"v0685","headword":"crush","story_form":"crush","form":"crush","meaning_en":"press something into small pieces","meaning":"으깨다"},{"word_id":"v2751","headword":"toss","story_form":"toss","form":"toss","meaning_en":"mix food by lifting and turning it lightly","meaning":"가볍게 버무리다"},{"word_id":"v2578","headword":"substitute","story_form":"substitute","form":"substitute","meaning_en":"use something in place of another thing","meaning":"대신 사용하다"},{"word_id":"v2790","headword":"trim","story_form":"trim","form":"trim","meaning_en":"cut away an unwanted part","meaning":"다듬다"},{"word_id":"v0730","headword":"decent","story_form":"decent","form":"decent","meaning_en":"good enough for the purpose","meaning":"괜찮은"},{"word_id":"v0554","headword":"complement","story_form":"complement","form":"complement","meaning_en":"go well with something else","meaning":"잘 어울리다"}],"english":["A **butcher** shows our cooking class how to **trim** a piece of meat.","On another table, we **crush** soft beans and **blend** them with herbs.","“Can we **substitute** beans for the meat?” I ask.","“Yes, and this **exotic** fruit sauce will **complement** either version,” our teacher says.","We **toss** a salad and **dip** a clean spoon into the sauce to taste it.","“That's a **decent** first attempt,” my partner says.","We write down both versions so everyone can choose the one they prefer."],"korean":["정육점 주인이 요리 수업에서 고기를 다듬는 방법을 보여 준다.","다른 탁자에서 우리는 부드러운 콩을 으깨 허브와 섞는다.","“고기 대신 콩을 써도 되나요?” 내가 묻는다.","“그래. 이 이국적인 과일 소스는 어느 쪽과도 잘 어울릴 거야.” 선생님이 말한다.","우리는 샐러드를 버무리고 깨끗한 숟가락을 소스에 담가 맛본다.","“첫 시도로는 괜찮네.” 짝이 말한다.","우리는 모두가 선호하는 것을 고를 수 있게 두 가지 방법을 적는다."]},{"id":"O093","title":"그림을 다시 고치다","targets":[{"word_id":"v0662","headword":"craft","story_form":"craft","form":"craft","meaning_en":"an activity making things skillfully by hand","meaning":"공예"},{"word_id":"v0700","headword":"curve","story_form":"curve","form":"curve","meaning_en":"a smoothly bending line","meaning":"곡선"},{"word_id":"v1993","headword":"polish","story_form":"polish","form":"polish","meaning_en":"make a surface smooth and shiny","meaning":"윤을 내다"},{"word_id":"v2565","headword":"stroke","story_form":"stroke","form":"stroke","meaning_en":"one movement of a brush or pen","meaning":"붓질"},{"word_id":"v2514","headword":"stain","story_form":"stain","form":"stain","meaning_en":"an unwanted colored mark","meaning":"얼룩"},{"word_id":"v1880","headword":"pad","story_form":"pad","form":"pad","meaning_en":"a group of paper sheets joined together","meaning":"메모장, 화첩"},{"word_id":"v0949","headword":"erase","story_form":"erase","form":"erase","meaning_en":"remove a mark or writing","meaning":"지우다"},{"word_id":"v1024","headword":"fade","story_form":"fade","form":"fade","meaning_en":"lose color or strength gradually","meaning":"희미해지다"},{"word_id":"v2165","headword":"refine","story_form":"refine","form":"refine","meaning_en":"improve by making small changes","meaning":"다듬다"},{"word_id":"v0677","headword":"critic","story_form":"critic","form":"critic","meaning_en":"a person who judges and comments on art","meaning":"비평가"}],"english":["At a **craft** class, I paint a wooden box using ideas from my drawing **pad**.","One careless **stroke** leaves a dark **stain** beside a **curve**.","“Can I **erase** it?” I ask.","“Not like pencil, but you can **refine** the design,” the teacher says.","I turn the mark into a leaf, then **polish** the unpainted edge.","“Keep it out of strong sun so the colors do not **fade** quickly,” she adds.","My brother acts as a **critic**, but even he likes the new leaf."],"korean":["공예 수업에서 나는 화첩의 아이디어를 바탕으로 나무 상자에 그림을 그린다.","부주의한 붓질 한 번이 곡선 옆에 짙은 얼룩을 남긴다.","“지울 수 있을까요?” 내가 묻는다.","“연필처럼 지울 수는 없지만 무늬를 다듬을 수 있어.” 선생님이 말한다.","나는 얼룩을 잎으로 바꾸고 칠하지 않은 가장자리에 윤을 낸다.","“색이 빨리 바래지 않게 강한 햇빛을 피해 두렴.” 선생님이 덧붙인다.","동생은 비평가처럼 평가하지만 새로 그린 잎은 동생도 좋아한다."]},{"id":"O094","title":"무대에 다시 선 배우","targets":[{"word_id":"v0429","headword":"celebrity","story_form":"celebrity","form":"celebrity","meaning_en":"a person widely known by the public","meaning":"유명인"},{"word_id":"v0666","headword":"craze","story_form":"craze","form":"craze","meaning_en":"a short period of very strong popularity","meaning":"열풍"},{"word_id":"v2202","headword":"reputation","story_form":"reputation","form":"reputation","meaning_en":"what people generally think of someone","meaning":"평판"},{"word_id":"v0847","headword":"dominate","story_form":"dominate","form":"dominate","meaning_en":"have more influence or attention than others","meaning":"지배하다, 압도하다"},{"word_id":"v0822","headword":"dismiss","story_form":"dismiss","form":"dismiss","meaning_en":"decide something is not worth attention","meaning":"일축하다"},{"word_id":"v1442","headword":"intelligent","story_form":"intelligent","form":"intelligent","meaning_en":"able to understand and learn well","meaning":"지적인"},{"word_id":"v2966","headword":"wit","story_form":"wit","form":"wit","meaning_en":"the ability to say clever funny things","meaning":"재치"},{"word_id":"v0876","headword":"dull","story_form":"dull","form":"dull","meaning_en":"not interesting or exciting","meaning":"지루한"},{"word_id":"v2401","headword":"silent","story_form":"silent","form":"silent","meaning_en":"making no sound","meaning":"조용한"},{"word_id":"v0917","headword":"emerge","story_form":"emerge","form":"emerge","meaning_en":"come into view or become known","meaning":"나타나다"}],"english":["A former **celebrity** visits our theater after the **craze** for his show has ended.","His **reputation** for **wit** makes us expect constant jokes.","“Will this serious play be **dull**?” I ask.","“Don't **dismiss** a story before you hear it,” he says.","He lets a younger actor **dominate** the first scene while he stays **silent**.","An **intelligent**, gentle character begins to **emerge** from his small gestures.","When the play ends, I remember the quiet moments most clearly."],"korean":["방송 열풍이 끝난 뒤 한때 유명했던 배우가 우리 극장을 방문한다.","재치 있다는 평판 때문에 우리는 계속 농담을 할 것이라 기대한다.","“이 진지한 연극은 지루하지 않을까요?” 내가 묻는다.","“듣기도 전에 이야기를 일축하지 마.” 배우가 말한다.","그는 첫 장면에서 젊은 배우가 중심이 되게 하고 자신은 조용히 있는다.","그의 작은 몸짓에서 지적이고 다정한 인물이 드러나기 시작한다.","연극이 끝나자 나는 조용했던 순간들을 가장 선명하게 기억한다."]},{"id":"O095","title":"비 오는 날의 행사 계획","targets":[{"word_id":"v1121","headword":"forecast","story_form":"forecast","form":"forecast","meaning_en":"a statement about likely future weather","meaning":"일기 예보"},{"word_id":"v0053","headword":"adverse","story_form":"adverse","form":"adverse","meaning_en":"unfavorable or harmful","meaning":"불리한"},{"word_id":"v0970","headword":"evitable","story_form":"inevitable","form":"inevitable","meaning_en":"certain to happen and impossible to avoid","meaning":"피할 수 없는"},{"word_id":"v0897","headword":"efficient","story_form":"efficient","form":"efficient","meaning_en":"working well without wasting time or effort","meaning":"효율적인"},{"word_id":"v1132","headword":"formula","story_form":"formula","form":"formula","meaning_en":"a method thought to produce a result","meaning":"공식, 방법"},{"word_id":"v1631","headword":"margin","story_form":"margin","form":"margin","meaning_en":"extra space or time allowed for safety","meaning":"여유"},{"word_id":"v1692","headword":"minimal","story_form":"minimal","form":"minimal","meaning_en":"very small in amount","meaning":"최소한의"},{"word_id":"v1872","headword":"overlook","story_form":"overlook","form":"overlook","meaning_en":"fail to notice something","meaning":"간과하다"},{"word_id":"v2311","headword":"scheme","story_form":"scheme","form":"scheme","meaning_en":"an organized plan","meaning":"계획"},{"word_id":"v2707","headword":"thorough","story_form":"thorough","form":"thorough","meaning_en":"careful and complete","meaning":"철저한"}],"english":["The **forecast** warns of **adverse** weather on the day of our picnic.","“Is cancellation **inevitable**?” I ask.","“Not yet; we need a **thorough** review of our backup **scheme**,” our teacher says.","We look for an **efficient** way to move the activities indoors.","“There is no magic **formula**, and we must not **overlook** transport,” Mina reminds us.","We leave a **margin** of extra time and keep new costs **minimal**.","The rain comes, but our indoor games give everyone a happy afternoon."],"korean":["일기 예보는 소풍 날 날씨가 좋지 않을 것이라고 경고한다.","“취소가 불가피한가요?” 내가 묻는다.","“아직은 아니야. 대체 계획을 철저하게 검토해야 해.” 선생님이 말한다.","우리는 활동을 실내로 옮길 효율적인 방법을 찾는다.","“마법 같은 공식은 없어. 교통편도 간과하면 안 돼.” 미나가 알려 준다.","우리는 시간 여유를 두고 추가 비용을 최소한으로 유지한다.","비가 내리지만 실내 게임 덕분에 모두 즐거운 오후를 보낸다."]},{"id":"O096","title":"동아리 가입 안내","targets":[{"word_id":"v0435","headword":"certificate","story_form":"certificate","form":"certificate","meaning_en":"an official document recording an achievement or fact","meaning":"증명서"},{"word_id":"v0490","headword":"clause","story_form":"clause","form":"clause","meaning_en":"one section of a written agreement","meaning":"조항"},{"word_id":"v0775","headword":"designate","story_form":"designate","form":"designate","meaning_en":"officially choose someone for a role","meaning":"지정하다"},{"word_id":"v0797","headword":"dictate","story_form":"dictate","form":"dictate","meaning_en":"say words for someone to write down","meaning":"받아쓰게 하다"},{"word_id":"v0562","headword":"comprise","story_form":"comprise","form":"comprise","meaning_en":"include as its parts","meaning":"구성되다"},{"word_id":"v0593","headword":"consist","story_form":"consist","form":"consist","meaning_en":"be made up of particular parts","meaning":"구성되다"},{"word_id":"v0595","headword":"constitute","story_form":"constitute","form":"constitute","meaning_en":"form or make up something","meaning":"구성하다"},{"word_id":"v2103","headword":"pupil","story_form":"pupil","form":"pupil","meaning_en":"a student at school","meaning":"학생"},{"word_id":"v2576","headword":"subscribe","story_form":"subscribe","form":"subscribe","meaning_en":"sign up to receive something regularly","meaning":"구독하다"},{"word_id":"v2527","headword":"status","story_form":"status","form":"status","meaning_en":"a person's current official position or condition","meaning":"상태, 신분"}],"english":["Our club members will receive a **certificate** after completing the course.","The teacher asks a **pupil** to write while she begins to **dictate** the rules.","“What does this **clause** mean?” I ask.","“We **designate** a helper each week, but that does not change anyone's membership **status**.”","The course will **comprise** three projects, and each will **consist** of two activities.","“These six activities **constitute** the full course; you can **subscribe** to our newsletter for dates.”","We add a simple calendar so new members can understand the plan at a glance."],"korean":["우리 동아리 회원들은 과정을 마치면 증명서를 받을 예정이다.","선생님은 규칙을 읽어 주기 시작하면서 학생 한 명에게 받아쓰라고 한다.","“이 조항은 무슨 뜻인가요?” 내가 묻는다.","“매주 도우미를 지정하지만 그것이 누구의 회원 자격을 바꾸지는 않아.”","과정은 세 프로젝트로 구성되고 각각은 두 활동으로 이루어진다.","“이 여섯 활동이 전체 과정이야. 날짜는 소식지를 구독해 확인할 수 있어.”","우리는 신입 회원이 계획을 한눈에 이해하도록 간단한 달력을 넣는다."]},{"id":"O097","title":"혼자 두지 않는 마을","targets":[{"word_id":"v2591","headword":"suicide","story_form":"suicide","form":"suicide","meaning_en":"the act of intentionally ending one's own life","meaning":"자살"},{"word_id":"v2767","headword":"tragic","story_form":"tragic","form":"tragic","meaning_en":"causing great sadness and loss","meaning":"비극적인"},{"word_id":"v2133","headword":"rally","story_form":"rally","form":"rally","meaning_en":"come together to support a cause","meaning":"힘을 모으다"},{"word_id":"v2161","headword":"recruit","story_form":"recruit","form":"recruit","meaning_en":"find people to join a group","meaning":"모집하다"},{"word_id":"v0520","headword":"collaborate","story_form":"collaborate","form":"collaborate","meaning_en":"work together on a shared project","meaning":"협업하다"},{"word_id":"v2042","headword":"prevail","story_form":"prevail","form":"prevail","meaning_en":"become stronger or more successful","meaning":"우세해지다"},{"word_id":"v2827","headword":"unify","story_form":"unify","form":"unify","meaning_en":"bring people together","meaning":"하나로 모으다"},{"word_id":"v2823","headword":"undermine","story_form":"undermine","form":"undermine","meaning_en":"gradually weaken something","meaning":"약화하다"},{"word_id":"v2235","headword":"revive","story_form":"revive","form":"revive","meaning_en":"bring back strength or hope","meaning":"되살리다"},{"word_id":"v1697","headword":"miracle","story_form":"miracle","form":"miracle","meaning_en":"an extraordinary event seeming beyond explanation","meaning":"기적"}],"english":["A **tragic** report about **suicide** leads our town to discuss better support.","Residents **rally** to help, and trained workers **recruit** adult volunteers.","“How can our school **collaborate**?” a teacher asks.","“Help people reach support, and do not let shame **undermine** their willingness to ask,” a counselor says.","The project aims to **unify** neighbors and let care **prevail** over silence.","“There is no single **miracle**, but steady support can help **revive** hope.”","We make a clear list of trusted adults and support services students can contact."],"korean":["자살에 관한 비극적인 보도를 계기로 마을은 더 나은 지원을 논의한다.","주민들이 힘을 모으고 훈련받은 직원들이 성인 자원봉사자를 모집한다.","“우리 학교는 어떻게 협력할 수 있을까요?” 선생님이 묻는다.","“도움을 받을 수 있도록 연결하고, 수치심 때문에 도움을 구할 마음이 약해지지 않게 해 주세요.” 상담사가 말한다.","사업은 이웃을 하나로 모으고 침묵보다 돌봄이 앞서게 하려 한다.","“단 하나의 기적 같은 해결책은 없지만 꾸준한 지원은 희망을 되살리는 데 도움이 될 수 있어요.”","우리는 학생들이 연락할 믿을 만한 어른들과 지원 기관의 목록을 분명하게 만든다."]},{"id":"O098","title":"조용한 휴가 마을","targets":[{"word_id":"v2846","headword":"vacate","story_form":"vacation","form":"vacation","meaning_en":"time away from usual work or school","meaning":"휴가"},{"word_id":"v2213","headword":"resort","story_form":"resort","form":"resort","meaning_en":"a place people visit for holidays","meaning":"휴양지"},{"word_id":"v2780","headword":"treasure","story_form":"treasure","form":"treasure","meaning_en":"something valued very highly","meaning":"보물"},{"word_id":"v2880","headword":"virgin","story_form":"virgin","form":"virgin","meaning_en":"still in its natural, untouched state","meaning":"훼손되지 않은"},{"word_id":"v1919","headword":"pave","story_form":"pave","form":"pave","meaning_en":"cover a path with a firm surface","meaning":"포장하다"},{"word_id":"v0510","headword":"cluster","story_form":"cluster","form":"cluster","meaning_en":"a small group close together","meaning":"무리"},{"word_id":"v0881","headword":"dwell","story_form":"dwell","form":"dwell","meaning_en":"live in a place","meaning":"살다"},{"word_id":"v0909","headword":"elevate","story_form":"elevator","form":"elevator","meaning_en":"a machine carrying people between floors","meaning":"승강기"},{"word_id":"v2784","headword":"tremendous","story_form":"tremendous","form":"tremendous","meaning_en":"very great in size or amount","meaning":"엄청난"},{"word_id":"v1367","headword":"ideal","story_form":"ideal","form":"ideal","meaning_en":"as good as possible for a purpose","meaning":"이상적인"}],"english":["On **vacation**, we stay at a small mountain **resort**.","A **cluster** of homes stands beside a **virgin** forest that villagers call a **treasure**.","“Do people **dwell** here all winter?” I ask.","“Yes, and we want to **pave** only the path near the station,” our host says.","A new **elevator** gives older visitors access to the upper viewing deck.","“The view is **tremendous**, but an **ideal** holiday should respect the place,” Mom says.","We stay on the marked paths and leave the quiet forest as we found it."],"korean":["휴가에 우리는 작은 산속 휴양지에 머문다.","집들이 모여 있는 곳 옆에 주민들이 보물이라 부르는 훼손되지 않은 숲이 있다.","“사람들은 겨울 내내 여기 사나요?” 내가 묻는다.","“그래. 우리는 역 근처 길만 포장하려고 해.” 주인이 말한다.","새 승강기가 나이 든 방문객도 위쪽 전망대에 갈 수 있게 한다.","“경치가 정말 대단하지만 이상적인 휴가는 그 장소를 존중해야 해.” 엄마가 말한다.","우리는 표시된 길로만 다니고 조용한 숲을 처음 모습 그대로 남겨 둔다."]},{"id":"O099","title":"우리 마을의 물가 조사","targets":[{"word_id":"v0027","headword":"accumulate","story_form":"accumulate","form":"accumulate","meaning_en":"collect gradually over time","meaning":"축적하다"},{"word_id":"v0440","headword":"chamber","story_form":"chamber","form":"chamber","meaning_en":"a room used for formal meetings","meaning":"회의실"},{"word_id":"v0734","headword":"decline","story_form":"decline","form":"decline","meaning_en":"become lower or weaker","meaning":"감소하다"},{"word_id":"v1180","headword":"gap","story_form":"gap","form":"gap","meaning_en":"a difference between two amounts or groups","meaning":"격차"},{"word_id":"v1408","headword":"inflate","story_form":"inflate","form":"inflate","meaning_en":"make a price or amount larger","meaning":"부풀리다"},{"word_id":"v2008","headword":"pose","story_form":"pose","form":"pose","meaning_en":"present a problem or question","meaning":"제기하다"},{"word_id":"v2453","headword":"sociology","story_form":"sociology","form":"sociology","meaning_en":"the study of society and social behavior","meaning":"사회학"},{"word_id":"v2467","headword":"sophisticate","story_form":"sophisticated","form":"sophisticated","meaning_en":"complex and carefully developed","meaning":"정교한"},{"word_id":"v1148","headword":"frequent","story_form":"frequent","form":"frequent","meaning_en":"happening often","meaning":"빈번한"},{"word_id":"v2719","headword":"tick","story_form":"tick","form":"tick","meaning_en":"a short repeated sound made by a clock","meaning":"째깍거림"}],"english":["For a **sociology** project, we **accumulate** local price records.","We present them in the town **chamber**, where a clock's **tick** fills the silence.","“Does the income **gap** **decline** when prices fall?” I ask.","“That question needs more information,” a researcher says.","**Frequent** price changes **pose** a problem for families planning their spending.","“A **sophisticated** chart can still mislead if you **inflate** the numbers,” she warns.","We check our records again and separate what we measured from what we only guessed."],"korean":["사회학 과제를 위해 우리는 지역 물가 기록을 모은다.","우리는 시청 회의실에서 발표하고, 시계의 째깍거림이 침묵을 채운다.","“물가가 내려가면 소득 격차도 줄어드나요?” 내가 묻는다.","“그 질문에는 정보가 더 필요해.” 연구자가 말한다.","잦은 가격 변동은 지출을 계획하는 가족들에게 문제를 일으킨다.","“정교한 도표도 수치를 부풀리면 오해를 낳을 수 있어요.” 연구자가 주의를 준다.","우리는 기록을 다시 확인하고 측정한 것과 추측만 한 것을 구분한다."]},{"id":"O100","title":"엉망이 된 보드게임","targets":[{"word_id":"v0445","headword":"chaos","story_form":"chaos","form":"chaos","meaning_en":"a state of complete confusion","meaning":"혼란"},{"word_id":"v1067","headword":"fierce","story_form":"fierce","form":"fierce","meaning_en":"very strong or intense","meaning":"치열한"},{"word_id":"v1468","headword":"irritate","story_form":"irritate","form":"irritate","meaning_en":"make someone feel annoyed","meaning":"짜증 나게 하다"},{"word_id":"v2233","headword":"reverse","story_form":"reverse","form":"reverse","meaning_en":"change something to the opposite direction","meaning":"되돌리다"},{"word_id":"v2242","headword":"rid","story_form":"rid","form":"rid","meaning_en":"get free of something unwanted","meaning":"없애다"},{"word_id":"v2350","headword":"sequence","story_form":"sequence","form":"sequence","meaning_en":"the order in which things happen","meaning":"순서"},{"word_id":"v2423","headword":"skip","story_form":"skip","form":"skip","meaning_en":"leave out a step or turn","meaning":"건너뛰다"},{"word_id":"v2431","headword":"slim","story_form":"slim","form":"slim","meaning_en":"very small in chance or amount","meaning":"희박한"},{"word_id":"v2445","headword":"sneak","story_form":"sneak","form":"sneak","meaning_en":"move secretly to avoid being noticed","meaning":"몰래 움직이다"},{"word_id":"v2619","headword":"swear","story_form":"swear","form":"swear","meaning_en":"make a strong promise","meaning":"맹세하다"}],"english":["Our friendly board game turns into **chaos** during a **fierce** final round.","Jun tries to **sneak** an extra move, and the arguments begin to **irritate** everyone.","“I **swear** I misunderstood the **sequence**,” he says.","“Then let's **reverse** that move, not **skip** your next turn,” Mina suggests.","My chance of winning is **slim**, but I agree.","“Let's get **rid** of the confusion by reading the rule together,” I say.","We finish the game with the same rules and start laughing together again."],"korean":["친근한 보드게임은 치열한 마지막 판에서 혼란에 빠진다.","준이 몰래 한 번 더 움직이려 하고 논쟁이 모두를 짜증 나게 한다.","“맹세코 순서를 잘못 이해했어.” 준이 말한다.","“그럼 다음 차례를 건너뛰는 대신 그 움직임을 되돌리자.” 미나가 제안한다.","내가 이길 가능성은 희박하지만 나는 동의한다.","“규칙을 함께 읽어서 혼란을 없애자.” 내가 말한다.","우리는 같은 규칙으로 게임을 마치고 다시 함께 웃기 시작한다."]}]};
const shortDefaults=[{name:'기본 · 마음을 여는 문장',lines:['오늘의 작은 연습이 내일의 나를 바꿉니다.','서두르지 않아도 괜찮아요. 나만의 속도로 걸어가세요.','창문을 열자 기분 좋은 바람이 방 안으로 들어왔다.','좋아하는 일을 꾸준히 하는 마음이 가장 큰 힘입니다.','조용한 아침, 따뜻한 차 한 잔으로 하루를 시작합니다.','실수해도 괜찮습니다. 다시 한번 천천히 해 보세요.','책장을 넘길 때마다 새로운 세상이 펼쳐집니다.','하늘은 높고 바람은 부드럽게 나뭇잎을 흔든다.','지금 이 순간에 집중하면 한 걸음 더 나아갈 수 있어요.','오늘도 나를 위한 시간을 만들어 주어 고맙습니다.']},{name:'기본 · 일상 속 문장',lines:['내일 오후 두 시에 도서관 앞에서 만나요.','비가 올 것 같으니 우산을 챙겨 가세요.','이번 주말에는 가까운 공원으로 산책을 가려고 합니다.','필요한 내용을 정리한 뒤 파일로 저장했습니다.','새로운 취미를 시작하는 일은 언제나 설렙니다.','잠시 눈을 감고 어깨의 힘을 풀어 주세요.','좋은 생각이 떠오르면 잊기 전에 메모해 둡니다.','함께 웃을 수 있는 사람이 있다는 것은 행복한 일입니다.']},{name:'기본 · English',lines:['Every small step makes a difference.','Take your time and enjoy the journey.','A quiet morning is a fresh beginning.','Practice makes progress, one sentence at a time.','The best ideas often begin with a simple question.','Open the window and let the fresh air in.','Keep learning, keep growing, and keep going.','There is something beautiful in every ordinary day.']}];
const longDefaults=[
{name:'기본 · 아침 산책',lines:['아직 도시가 완전히 깨어나기 전, 나는 운동화 끈을 묶고 집을 나섰다.','골목 끝 작은 빵집에서는 갓 구운 빵 냄새가 흘러나왔다.','어제까지 내리던 비는 그치고, 나뭇잎에는 투명한 물방울이 남아 있었다.','공원 입구에 도착하자 참새 몇 마리가 길 위를 가볍게 뛰어다녔다.','나는 발걸음을 늦추고 주변의 소리에 귀를 기울였다.','바람이 잎을 스치는 소리와 멀리서 들려오는 자전거 벨 소리가 어우러졌다.','늘 지나던 길이었지만 천천히 걸으니 처음 보는 풍경처럼 느껴졌다.','벤치에 잠시 앉아 숨을 고르며 오늘 해야 할 일을 떠올렸다.','모든 일을 서둘러 끝낼 필요는 없었다. 하나씩 차근차근 해 나가면 되었다.','집으로 돌아오는 길, 아침 햇살이 젖은 보도 위에서 반짝이고 있었다.']},
{name:'기본 · 작은 도서관',lines:['우리 동네에는 오래된 나무 문이 달린 작은 도서관이 있다.','문을 열면 종이 냄새와 함께 조용하고 아늑한 공기가 나를 맞이한다.','창가에는 두 사람이 나란히 앉을 수 있는 긴 책상이 놓여 있다.','나는 그곳에 앉아 평소라면 고르지 않았을 책 한 권을 펼쳤다.','책 속에는 낯선 마을을 여행하는 사람의 이야기가 담겨 있었다.','몇 장을 읽는 동안 나는 어느새 그 마을의 좁은 골목을 걷고 있었다.','좋은 이야기는 멀리 떠나지 않고도 새로운 풍경을 만나게 해 준다.','마지막 장을 덮었을 때 창밖의 햇빛은 조금 더 부드러워져 있었다.','나는 다음에 읽을 책을 골라 가방에 넣고 조용히 문을 나섰다.']},
{name:'기본 · A quiet afternoon',lines:['The rain began just as I arrived at the little cafe.','I chose a seat beside the window and ordered a cup of tea.','Outside, people opened their umbrellas and hurried along the street.','Inside, everything seemed to move at a slower pace.','I took a notebook from my bag and turned to an empty page.','At first, I did not know what to write.','Then I began with the simple things I could see and hear.','Before long, the page was full of small observations.','When the rain stopped, I closed the notebook and smiled.','Sometimes a quiet afternoon is exactly what we need.']}];

let mode='short',collections=shortDefaults;

function splitLong(line){const chars=Array.from(line);const rows=[];while(chars.length>65){let cut=chars.slice(0,65).lastIndexOf(' ');if(cut<25)cut=65;rows.push(chars.splice(0,cut).join(''));while(chars[0]===' ')chars.shift()}if(chars.length)rows.push(chars.join(''));return rows}
function convertLines(lines,kind){if(kind==='word')return lines.flatMap(line=>line.match(/[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu)||[]);if(kind==='long')return lines.flatMap(splitLong);return lines.slice()}
function cleanStudyText(text){return text.replace(/\*\*/g,'').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/\s+/g,' ').trim().normalize('NFC')}
function targetCharacterMask(raw){
const marked=raw.replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/\s+/g,' ').trim().normalize('NFC');
const mask=Array.from(cleanStudyText(raw),()=>false);

}
function makeWorkbookCollection(story){
const lines=[],help=[];const language=$('study-language').value==='korean'?'korean':'english';

else{story[language].forEach((text,i)=>{const clean=cleanStudyText(text),mask=language==='english'?targetCharacterMask(text):[];let offset=0;for(const line of mode==='long'?splitLong(clean):[clean]){const start=clean.indexOf(line,offset),charStart=Array.from(clean.slice(0,start)).length;lines.push(line);help.push({translation:story[language==='english'?'korean':'english'][i],sentenceIndex:i,targetMask:mask.slice(charStart,charStart+Array.from(line).length)});offset=start+line.length}})}

}
function buildCollections(){

}
function updateStudyControls(){const workbook=!!workbooks[$('book').value];$('language-field').hidden=!workbook||mode==='word';$('form-field').hidden=!workbook||mode!=='word';if(workbook)$('collection-label').textContent='학습 세트';}

function renderStudyHelp(){const c=collections[+$('collection').value],h=c.help?.[queue[cursor]];const word=mode==='word';$('study-help').hidden=!h;$('card-gloss').hidden=!h||!word;if(!h)return;$('gloss-divider').hidden=!$('gloss-ko').checked||!$('gloss-en').checked;$('card-gloss').hidden=!word||(!$('gloss-ko').checked&&!$('gloss-en').checked);$('gloss-controls').hidden=!word;$('translation').hidden=word;$('gloss-ko-text').hidden=!word||!$('gloss-ko').checked;$('gloss-en-text').hidden=!word||!$('gloss-en').checked;$('word-forms').hidden=!word;if(word){$('gloss-ko-text').textContent=h.meaning;$('gloss-en-text').textContent=h.meaning_en;$('word-forms').textContent=h.headword===h.form?'대표형 · '+h.headword:'대표형 '+h.headword+' · 이야기 속 형태 '+h.form}else{$('translation-label').textContent=c.language==='english'?'한국어 해석 보기':'영어 원문 보기';$('translation-text').textContent=cleanStudyText(h.translation)}}
function switchMode(kind){const previousSet=+$('collection').value||0;mode=kind;$('typing').rows=kind==='word'?1:2;document.body.dataset.mode=kind;for(const k of ['short','long','word'])$('mode-'+k).setAttribute('aria-pressed',String(k===kind));$('mode-title').textContent={short:'단문 연습',long:'장문 연습',word:'낱말 연습'}[kind];$('done-label').textContent='완료 '+units[kind];$('collection-label').textContent=kind==='long'?'연습할 글':kind==='word'?'낱말 모음':'문장 모음';$('sentence-label').textContent=kind==='long'?'시작할 줄':kind==='word'?'연습할 낱말':'연습할 문장';$('next-label').textContent='다음 '+units[kind];$('mode-note').textContent={short:'짧은 문장을 하나씩 연습합니다.',long:'하나의 글을 순서대로 이어 씁니다. 각 줄을 완성하면 Enter 또는 스페이스바를 누르세요.',word:'낱말을 완성하면 Enter 또는 스페이스바를 누르세요. 불러온 글은 낱말로 나눠집니다.'}[kind];$('passage').hidden=kind!=='long';buildCollections();refreshCollections();$('collection').value=String(workbooks[$('book').value]?Math.min(previousSet,collections.length-1):0);updateStudyControls();reset();}
let queue=[],cursor=0,started=0,elapsed=0,done=0,totalChars=0,totalCorrect=0,totalStrokes=0,composing=false,finished=false;
let soundEnabled=false,soundContext=null,activeSounds=[];

function playTypingSound(completed=false){
if(!soundEnabled||!soundContext||soundContext.state!=='running')return;
const start=soundContext.currentTime;
const notes=completed?[660,880]:[260];

}
$('sound-toggle').onclick=async()=>{
if(soundEnabled){soundEnabled=false;muteTypingSound()}else{try{soundContext??=new AudioEngine();await soundContext.resume();soundEnabled=soundContext.state==='running'}catch{soundEnabled=false;$('notice').textContent='타자 소리를 사용할 수 없는 브라우저입니다.'}}

};

$('typing').addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.repeat&&(e.key.length===1||e.key==='Backspace'||e.keyCode===229))playTypingSound()});
const speechAvailable=typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined';
let voiceEnabled=false,speechVersion=0;
function stopVoice(){speechVersion++;if(speechAvailable)speechSynthesis.cancel()}
function speakCurrent(){
stopVoice();if(!speechAvailable||!voiceEnabled||finished)return;
const text=target();if(!text)return;
const version=speechVersion;
const utterance=new SpeechSynthesisUtterance(text);
utterance.lang=/[\u1100-\u11ff\u3130-\u318f\uac00-\ud7af]/u.test(text)?'ko-KR':'en-US';
const language=utterance.lang.slice(0,2);
const voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith(language));

if(chosen)utterance.voice=chosen;

utterance.onerror=e=>{if(version!==speechVersion||e.error==='canceled'||e.error==='interrupted')return;$('voice-status').textContent='음성을 재생하지 못했어요. 다시 듣기를 누르거나 기기의 한국어·영어 음성을 확인해 주세요.'};

$('voice-toggle').onclick=()=>{voiceEnabled=!voiceEnabled;$('voice-toggle').setAttribute('aria-pressed',String(voiceEnabled));$('voice-toggle').textContent=voiceEnabled?'🔊 음성 끄기':'🔇 음성 켜기';$('voice-replay').disabled=!voiceEnabled;$('voice-status').textContent=voiceEnabled?'':'';if(voiceEnabled)speakCurrent();else stopVoice();};
$('voice-replay').onclick=speakCurrent;
if(!speechAvailable){$('voice-toggle').disabled=true;$('voice-status').textContent='이 브라우저는 음성 읽기를 지원하지 않습니다.'}
function option(text,value){const o=document.createElement('option');o.textContent=text;o.value=value;return o}
function refreshCollections(){ $('collection').replaceChildren(...collections.map((c,i)=>option(c.name,i))) }
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function reset(){composing=false;queue=collections[+$('collection').value].lines.map((_,i)=>i);cursor=0;started=0;elapsed=0;done=0;totalChars=0;totalCorrect=0;totalStrokes=0;finished=false;$('complete').hidden=true;$('typing').disabled=false;$('skip').disabled=false;show();stats()}
function target(){return collections[+$('collection').value].lines[queue[cursor]]||''}
function show(slide=false){const c=collections[+$('collection').value];$('sentence').replaceChildren(...c.lines.map((s,i)=>option(`${i+1}. ${s.length>65?s.slice(0,65)+'…':s}`,i)));$('sentence').value=queue[cursor];$('source').textContent=c.name;$('passage-text').textContent=c.lines.join('\n');$('position').textContent=`${cursor+1} / ${queue.length}`;$('typing').value='';$('hint').textContent='입력하면 시작 · 완성 후 Enter 또는 스페이스바';$('upcoming').replaceChildren(...queue.slice(cursor+1,cursor+4).map(i=>{const d=document.createElement('div');d.textContent=c.lines[i];return d}));if(cursor===queue.length-1){const d=document.createElement('div');d.textContent='마지막 '+units[mode]+'입니다. 끝까지 천천히 입력해 보세요.';$('upcoming').append(d)}renderStudyHelp();renderWordPreview(slide);paint();$('bar').style.width=`${cursor/queue.length*100}%`;speakCurrent()}
function renderWordPreview(slide){
const preview=$('word-preview');preview.replaceChildren();
if(mode!=='word')return;

const distance=preview.getBoundingClientRect().left-$('prompt').getBoundingClientRect().left;
for(const element of [$('prompt-text'),preview]){element.getAnimations().forEach(a=>a.cancel());element.animate([{transform:`translateX(${distance}px)`,opacity:.35},{transform:'translateX(0)',opacity:1}],{duration:280,easing:'cubic-bezier(.22,.7,.3,1)'});}

}
// Keep the Korean character immediately before the caret neutral until typing moves on.
function characterClass(expected,value,index,activeIndex,reveal){
if(index===activeIndex&&!reveal)return 'cursor';
return index<value.length?(expected===value[index]?'correct':'wrong'):(index===value.length?'cursor':'');
}
function paint(reveal=false){const input=$('typing'),text=Array.from(target()),value=Array.from(input.value);const caret=Array.from(input.value.slice(0,input.selectionStart)).length;const activeIndex=caret>0&&(composing||/[\u1100-\u11ff\u3130-\u318f\uac00-\ud7af]/u.test(value[caret-1]||''))?caret-1:-1;const frag=document.createDocumentFragment();text.forEach((c,i)=>{const span=document.createElement('span');span.textContent=c;span.className=characterClass(c,value,i,activeIndex,reveal)+(mode!=='word'&&collections[+$('collection').value].help?.[queue[cursor]]?.targetMask?.[i]?' target-word':'');frag.append(span)});$('prompt-text').replaceChildren(frag)}
function measures(){const t=Array.from(target()),v=Array.from($('typing').value);let correct=0,strokes=0;v.forEach((c,i)=>{if(c===t[i]){correct++;strokes+=c.normalize('NFD').length}});return {length:v.length,correct,strokes}}
function stats(){if(started&&!finished)elapsed=performance.now()-started;const sec=Math.floor(elapsed/1000);$('time').textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;const m=finished?{length:0,correct:0,strokes:0}:measures();$('speed').textContent=elapsed>=1000?Math.round((totalStrokes+m.strokes)/(elapsed/60000)):0;$('accuracy').textContent=totalChars+m.length?((totalCorrect+m.correct)/(totalChars+m.length)*100).toFixed(1):'100';$('done').textContent=done}
function next(success){if(finished)return;if(success)playTypingSound(true);const m=measures();totalChars+=m.length;totalCorrect+=m.correct;totalStrokes+=m.strokes;if(success)done++;if(cursor===queue.length-1){if(started)elapsed=performance.now()-started;finished=true;stopVoice();$('typing').value='';stats();$('typing').disabled=true;$('skip').disabled=true;$('bar').style.width='100%';$('complete').hidden=false;$('complete').textContent=`연습 끝! ${queue.length}개 중 ${done}개 ${units[mode]} 완료 · ${$('speed').textContent}타/분 · 정확도 ${$('accuracy').textContent}%`;$('hint').textContent='다시 시작을 누르면 같은 모음을 새로 연습합니다.';stats();return}cursor++;show(true);stats();$('typing').focus()}
$('typing').addEventListener('compositionstart',()=>{composing=true;paint()});

$('typing').addEventListener('keydown',e=>{
if((e.key!=='Enter'&&e.key!==' ')||e.isComposing||composing||e.keyCode===229||e.repeat)return;

});
$('collection').onchange=reset;$('reset').onclick=()=>{reset();$('typing').focus()};$('skip').onclick=()=>next(false);$('sentence').onchange=()=>{const selected=+$('sentence').value;reset();cursor=queue.indexOf(selected);show();$('typing').focus()};$('upload').onclick=()=>$('files').click();
function extract(text,isHTML){if(isHTML){const doc=new DOMParser().parseFromString(text,'text/html');doc.querySelectorAll('script,style,noscript,template,iframe,object,embed,svg,canvas,nav,header,footer,form,button,[hidden],[aria-hidden="true"]').forEach(n=>n.remove());doc.querySelectorAll('br').forEach(n=>n.replaceWith('\n'));doc.querySelectorAll('p,div,section,article,li,h1,h2,h3,h4,h5,h6,tr,blockquote,pre').forEach(n=>{n.before(doc.createTextNode('\n'));n.after(doc.createTextNode('\n'))});text=doc.body.textContent||''}return text.replace(/^\uFEFF/,'').split(/\r\n|\r|\n/).map(s=>s.replace(/\s+/g,' ').trim().normalize('NFC')).filter(Boolean).flatMap(s=>{if(s.length<=300)return[s];const a=[];while(s.length>300){let cut=s.lastIndexOf(' ',300);if(cut<100)cut=300;if(/[\uD800-\uDBFF]/.test(s[cut-1]))cut--;a.push(s.slice(0,cut));s=s.slice(cut).trim()}if(s)a.push(s);return a})}
$('files').onchange=async e=>{const files=Array.from(e.target.files);if(!files.length)return;const notes=[];let last=-1;for(const file of files){if(!/\.(txt|html?)$/i.test(file.name)){notes.push(`${file.name}: TXT·HTML 파일만 지원합니다.`);continue}if(file.size>5*1024*1024){notes.push(`${file.name}: 5MB 이하 파일을 선택해 주세요.`);continue}try{const buffer=await file.arrayBuffer();let text;try{text=new TextDecoder('utf-8',{fatal:true}).decode(buffer)}catch{text=new TextDecoder('euc-kr').decode(buffer)}const lines=extract(text,/\.html?$/i.test(file.name));if(!lines.length){notes.push(`${file.name}: 가져올 문장이 없습니다.`);continue}if(lines.length>10000){notes.push(`${file.name}: 문장이 너무 많아요. 10,000개 이하로 나눠 주세요.`);continue}uploads.push({name:file.name,lines});if(!Array.from($('book').options).some(o=>o.value==='files'))$('book').append(option('불러온 파일','files'));$('book').value='files';updateStudyControls();buildCollections();last=collections.length-1;notes.push(`${file.name}: ${lines.length}개 문장 추가`)}catch{notes.push(`${file.name}: 파일을 읽지 못했습니다.`)}}if(last>=0){refreshCollections();$('collection').value=last;reset()}$('notice').textContent=notes.join(' / ')+' · 불러온 문장은 창을 닫거나 새로고침하면 사라집니다.';e.target.value=''};
$('book').onchange=()=>rebuildStudy(false);$('study-language').onchange=()=>rebuildStudy();$('word-form').onchange=()=>rebuildStudy();$('gloss-ko').onchange=renderStudyHelp;$('gloss-en').onchange=renderStudyHelp;
