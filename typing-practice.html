rd_id":"v0755","headword":"demand","story_form":"demand","form":"demand","meaning_en":"ask strongly for something","meaning":"요구하다"},{"word_id":"v0762","headword":"deny","story_form":"deny","form":"deny","meaning_en":"say that something is not true","meaning":"부인하다"},{"word_id":"v0981","headword":"exchange","story_form":"exchange","form":"exchange","meaning_en":"giving something back to get something else","meaning":"교환"},{"word_id":"v1253","headword":"guarantee","story_form":"guarantee","form":"guarantee","meaning_en":"promise that something will work or be fixed","meaning":"보증하다"},{"word_id":"v2081","headword":"proper","story_form":"proper","form":"proper","meaning_en":"right for the situation","meaning":"적절한"},{"word_id":"v2216","headword":"respond","story_form":"respond","form":"respond","meaning_en":"answer or react to someone","meaning":"응답하다"},{"word_id":"v1277","headword":"handle","story_form":"handle","form":"handle","meaning_en":"deal with a problem or task","meaning":"처리하다"},{"word_id":"v0144","headword":"appropriate","story_form":"appropriate","form":"appropriate","meaning_en":"suitable for the situation","meaning":"적절한"}],"english":["A **client** calls to **complain** about a broken lamp and **demand** help.","The shop does not **deny** the problem and tries to **respond** in an **appropriate** way.","“We **guarantee** a working product,” the worker says, “so an **exchange** is **proper**.”","She knows how to **handle** the problem, and the **client** thanks her."],"korean":["고객이 고장 난 램프에 대해 불평하고 도움을 요구하려고 전화를 한다.","가게는 문제를 부인하지 않고 적절한 방식으로 응답하려고 한다.","직원은 “저희는 정상 작동하는 제품을 보증하므로 교환해 드리는 것이 맞습니다.”라고 말한다.","그녀는 문제를 처리하는 방법을 알고 있고, 고객은 그녀에게 고마워한다."]},{"id":"C072","title":"새 상품 광고","targets":[{"word_id":"v0054","headword":"advertize","story_form":"advertise","form":"advertise","meaning_en":"tell people about a product to sell it","meaning":"광고하다"},{"word_id":"v0418","headword":"catalogue","story_form":"catalogue","form":"catalogue","meaning_en":"a list of products with details","meaning":"상품 목록"},{"word_id":"v1051","headword":"feature","story_form":"feature","form":"feature","meaning_en":"an important part or quality of something","meaning":"특징"},{"word_id":"v0188","headword":"attract","story_form":"attract","form":"attract","meaning_en":"make someone interested in something","meaning":"끌다"},{"word_id":"v1389","headword":"impress","story_form":"impress","form":"impress","meaning_en":"make someone admire something","meaning":"깊은 인상을 주다"},{"word_id":"v2002","headword":"popular","story_form":"popular","form":"popular","meaning_en":"liked by many people","meaning":"인기 있는"},{"word_id":"v2077","headword":"promote","story_form":"promote","form":"promote","meaning_en":"help people know about a product","meaning":"홍보하다"},{"word_id":"v2294","headword":"sample","story_form":"sample","form":"sample","meaning_en":"a small amount used to show a product","meaning":"견본"},{"word_id":"v0470","headword":"choice","story_form":"choice","form":"choice","meaning_en":"the act of choosing something","meaning":"선택"},{"word_id":"v1853","headword":"ordinary","story_form":"ordinary","form":"ordinary","meaning_en":"normal and not special","meaning":"보통의"}],"english":["Our shop wants to **advertise** a new bag and **promote** it in a **catalogue**.","Its best **feature** is a pocket that holds a water bottle.","We put a **sample** by the door to **attract** people and **impress** them with its light weight.","It becomes a **popular** **choice** because it costs no more than an **ordinary** bag."],"korean":["우리 가게는 새 가방을 광고하고 상품 목록에서 홍보하고 싶어 한다.","가장 좋은 특징은 물병을 넣는 주머니다.","우리는 사람들의 관심을 끌고 가벼운 무게로 좋은 인상을 주려고 문 옆에 견본을 놓는다.","일반 가방보다 비싸지 않아서 인기 있는 선택이 된다."]},{"id":"C073","title":"새로운 발명","targets":[{"word_id":"v1461","headword":"invent","story_form":"invent","form":"invent","meaning_en":"create something that did not exist before","meaning":"발명하다"},{"word_id":"v0933","headword":"engineer","story_form":"engineer","form":"engineer","meaning_en":"a person who designs machines or structures","meaning":"공학자"},{"word_id":"v0789","headword":"develop","story_form":"develop","form":"develop","meaning_en":"create and improve something","meaning":"개발하다"},{"word_id":"v0568","headword":"concept","story_form":"concept","form":"concept","meaning_en":"a general idea","meaning":"개념"},{"word_id":"v0530","headword":"combine","story_form":"combine","form":"combine","meaning_en":"join things together","meaning":"결합하다"},{"word_id":"v2019","headword":"practical","story_form":"practical","form":"practical","meaning_en":"useful in real situations","meaning":"실용적인"},{"word_id":"v2015","headword":"potential","story_form":"potential","form":"potential","meaning_en":"the ability to become good or successful","meaning":"잠재력"},{"word_id":"v0051","headword":"advantage","story_form":"advantage","form":"advantage","meaning_en":"something that makes one thing better","meaning":"장점"},{"word_id":"v0050","headword":"advance","story_form":"advance","form":"advance","meaning_en":"an improvement or step forward","meaning":"발전"},{"word_id":"v0349","headword":"brilliant","story_form":"brilliant","form":"brilliant","meaning_en":"very clever or impressive","meaning":"훌륭한"}],"english":["An **engineer** visits our class and asks us to **invent** something useful.","We **develop** a **concept** for a bag with a seat and **combine** our best ideas.","The design is **practical**, and its main **advantage** is that tired walkers can sit down.","She calls it a **brilliant** idea with **potential** for further **advance**."],"korean":["공학자가 우리 반에 와서 유용한 것을 발명해 보라고 한다.","우리는 의자가 달린 가방이라는 개념을 발전시키고 가장 좋은 생각들을 결합한다.","설계는 실용적이며, 가장 큰 장점은 지친 보행자가 앉을 수 있다는 것이다.","그녀는 더 발전할 잠재력을 가진 훌륭한 생각이라고 말한다."]},{"id":"C074","title":"실수에서 배우기","targets":[{"word_id":"v0584","headword":"confuse","story_form":"confuse","form":"confuse","meaning_en":"mix things up in your mind","meaning":"혼동하다"},{"word_id":"v1158","headword":"frustrate","story_form":"frustrate","form":"frustrate","meaning_en":"make someone upset by blocking their efforts","meaning":"좌절시키다"},{"word_id":"v2121","headword":"quit","story_form":"quit","form":"quit","meaning_en":"stop doing something","meaning":"그만두다"},{"word_id":"v0788","headword":"determine","story_form":"determine","form":"determine","meaning_en":"decide firmly to do something","meaning":"결정하다"},{"word_id":"v0608","headword":"continue","story_form":"continue","form":"continue","meaning_en":"keep doing something","meaning":"계속하다"},{"word_id":"v2072","headword":"progress","story_form":"progress","form":"progress","meaning_en":"movement toward a better result","meaning":"발전"},{"word_id":"v2583","headword":"success","story_form":"success","form":"success","meaning_en":"achieving what you wanted","meaning":"성공"},{"word_id":"v0816","headword":"discipline","story_form":"discipline","form":"discipline","meaning_en":"the ability to control your own behavior","meaning":"자기 관리"},{"word_id":"v0567","headword":"concentrate","story_form":"concentrate","form":"concentrate","meaning_en":"give all your attention to something","meaning":"집중하다"},{"word_id":"v1639","headword":"master","story_form":"master","form":"master","meaning_en":"learn to do something very well","meaning":"완전히 익히다"}],"english":["Two similar dance steps **confuse** me, and repeated mistakes **frustrate** me.","I want to **quit**, but I **determine** my next goal: **master** just one step today.","I **concentrate** on it and use **discipline** to **continue** practicing each morning.","My **progress** is slow, but my first small **success** makes me smile."],"korean":["비슷한 춤 동작 두 개가 헷갈리고, 반복되는 실수 때문에 좌절한다.","나는 그만두고 싶지만 오늘은 동작 하나만 완전히 익히자는 다음 목표를 정한다.","나는 그 동작에 집중하고 자기 관리를 하며 매일 아침 연습을 이어 간다.","발전은 느리지만 첫 작은 성공에 미소가 난다."]},{"id":"C075","title":"우리 반 설문 조사","targets":[{"word_id":"v2613","headword":"survey","story_form":"survey","form":"survey","meaning_en":"questions used to collect people's opinions","meaning":"설문 조사"},{"word_id":"v2206","headword":"research","story_form":"research","form":"research","meaning_en":"careful study to discover information","meaning":"연구"},{"word_id":"v1582","headword":"list","story_form":"list","form":"list","meaning_en":"items written one after another","meaning":"목록"},{"word_id":"v0958","headword":"estimate","story_form":"estimate","form":"estimate","meaning_en":"make a careful guess about an amount","meaning":"추정하다"},{"word_id":"v2302","headword":"scale","story_form":"scale","form":"scale","meaning_en":"a set of numbers used to rate something","meaning":"점수 척도"},{"word_id":"v2135","headword":"range","story_form":"range","form":"range","meaning_en":"the distance between the lowest and highest values","meaning":"범위"},{"word_id":"v0420","headword":"category","story_form":"category","form":"category","meaning_en":"a group of similar things","meaning":"범주"},{"word_id":"v2484","headword":"specific","story_form":"specific","form":"specific","meaning_en":"clear and exact","meaning":"구체적인"},{"word_id":"v1401","headword":"indicate","story_form":"indicate","form":"indicate","meaning_en":"show or point to something","meaning":"나타내다"},{"word_id":"v1191","headword":"general","story_form":"general","form":"general","meaning_en":"true in most cases","meaning":"일반적인"}],"english":["We do **research** on reading habits with a class **survey**.","Each student rates a book on a **scale** from one to five and chooses a **category**.","We **estimate** the **range** of time students spend reading and ask for one **specific** example.","The answers **indicate** a **general** interest in funny stories.","We put the favorite books on a **list** for the library."],"korean":["우리는 학급 설문 조사로 독서 습관을 연구한다.","학생들은 책에 1점부터 5점까지 점수를 주고 범주를 선택한다.","우리는 학생들의 독서 시간 범위를 추정하고 구체적인 예 하나를 요청한다.","응답은 재미있는 이야기에 대한 전반적인 관심을 보여 준다.","우리는 도서관에 줄 인기 도서 목록을 만든다."]},{"id":"C076","title":"나무 심기 계획","targets":[{"word_id":"v2554","headword":"strategy","story_form":"strategy","form":"strategy","meaning_en":"a plan for reaching a goal","meaning":"전략"},{"word_id":"v0170","headword":"assess","story_form":"assess","form":"assess","meaning_en":"judge how good or useful something is","meaning":"평가하다"},{"word_id":"v0592","headword":"consider","story_form":"consider","form":"consider","meaning_en":"think carefully about something","meaning":"고려하다"},{"word_id":"v1021","headword":"factor","story_form":"factor","form":"factor","meaning_en":"something that affects a result","meaning":"요인"},{"word_id":"v0231","headword":"basis","story_form":"basis","form":"basis","meaning_en":"the facts or ideas supporting a decision","meaning":"근거"},{"word_id":"v0956","headword":"establish","story_form":"establish","form":"establish","meaning_en":"set up or create something","meaning":"수립하다"},{"word_id":"v0172","headword":"assign","story_form":"assign","form":"assign","meaning_en":"give someone a task","meaning":"배정하다"},{"word_id":"v1623","headword":"manage","story_form":"manage","form":"manage","meaning_en":"organize and control work","meaning":"관리하다"},{"word_id":"v0555","headword":"complete","story_form":"complete","form":"complete","meaning_en":"finish doing something","meaning":"완료하다"},{"word_id":"v1868","headword":"overall","story_form":"overall","form":"overall","meaning_en":"including everything","meaning":"전체의"}],"english":["We need a **strategy** for planting trees around our school.","First, we **assess** the ground and **consider** water as an important **factor**.","On this **basis**, we **establish** a plan and **assign** a job to each team.","Two teachers **manage** the work, and we **complete** the **overall** project in a week."],"korean":["우리는 학교 주변에 나무를 심을 전략이 필요하다.","먼저 땅을 평가하고 물을 중요한 요인으로 고려한다.","이를 근거로 계획을 세우고 팀마다 일을 배정한다.","선생님 두 분이 작업을 관리하고, 우리는 일주일 만에 전체 프로젝트를 완료한다."]},{"id":"C077","title":"새로운 언어 배우기","targets":[{"word_id":"v1123","headword":"foreign","story_form":"foreign","form":"foreign","meaning_en":"from another country","meaning":"외국의"},{"word_id":"v1111","headword":"folk","story_form":"folk","form":"folk","meaning_en":"related to a people's traditional culture","meaning":"민속의"},{"word_id":"v2765","headword":"tradition","story_form":"tradition","form":"tradition","meaning_en":"a custom passed down over time","meaning":"전통"},{"word_id":"v0617","headword":"converse","story_form":"converse","form":"converse","meaning_en":"talk with someone","meaning":"대화하다"},{"word_id":"v2178","headword":"relate","story_form":"relate","form":"relate","meaning_en":"show a connection between things","meaning":"관련짓다"},{"word_id":"v0174","headword":"associate","story_form":"associate","form":"associate","meaning_en":"connect things in your mind","meaning":"연관 짓다"},{"word_id":"v0606","headword":"context","story_form":"context","form":"context","meaning_en":"the situation that helps explain a meaning","meaning":"맥락"},{"word_id":"v1650","headword":"mean","story_form":"mean","form":"mean","meaning_en":"have a particular meaning","meaning":"뜻하다"},{"word_id":"v2345","headword":"sense","story_form":"sense","form":"sense","meaning_en":"a meaning that is clear and reasonable","meaning":"의미"},{"word_id":"v1375","headword":"illustrate","story_form":"illustrate","form":"illustrate","meaning_en":"make something clear with an example","meaning":"설명하다"}],"english":["In a **foreign** language class, we listen to a **folk** song about an old **tradition**.","Our teacher uses pictures to **illustrate** what the words **mean** in this **context**.","We **associate** the song with a family meal and **relate** it to our own lives.","Soon the whole song makes **sense** to us.","We then **converse** in pairs about meals at home."],"korean":["외국어 수업에서 우리는 오래된 전통에 관한 민요를 듣는다.","선생님은 그림을 이용해 이 맥락에서 단어들이 무엇을 뜻하는지 설명한다.","우리는 그 노래를 가족 식사와 연관 짓고 우리의 삶과 연결한다.","곧 우리는 노래 전체의 의미를 이해하게 된다.","그런 다음 우리는 짝을 지어 집에서 먹는 식사에 관해 대화한다."]},{"id":"C078","title":"작은 오해 풀기","targets":[{"word_id":"v0175","headword":"assume","story_form":"assume","form":"assume","meaning_en":"think something is true without being sure","meaning":"추측하다"},{"word_id":"v0853","headword":"doubt","story_form":"doubt","form":"doubt","meaning_en":"a feeling of not being certain","meaning":"의심"},{"word_id":"v2150","headword":"reason","story_form":"reason","form":"reason","meaning_en":"why something happens or is done","meaning":"이유"},{"word_id":"v1819","headword":"obvious","story_form":"obvious","form":"obvious","meaning_en":"easy to see or understand","meaning":"명백한"},{"word_id":"v2338","headword":"seem","story_form":"seem","form":"seem","meaning_en":"appear to be a certain way","meaning":"~처럼 보이다"},{"word_id":"v2091","headword":"prove","story_form":"prove","form":"prove","meaning_en":"show that something is true","meaning":"증명하다"},{"word_id":"v0481","headword":"circumstance","story_form":"circumstances","form":"circumstances","meaning_en":"a fact or condition affecting a situation","meaning":"상황"},{"word_id":"v1427","headword":"insist","story_form":"insist","form":"insist","meaning_en":"say something firmly even when others disagree","meaning":"주장하다"},{"word_id":"v0621","headword":"convince","story_form":"convince","form":"convince","meaning_en":"make someone believe something","meaning":"납득시키다"},{"word_id":"v2188","headword":"remark","story_form":"remark","form":"remark","meaning_en":"something someone says","meaning":"말"}],"english":["My friend is late, and I **assume** she has forgotten our meeting.","Her **reason** does not **seem** **obvious**, so I have some **doubt**.","She shows me a bus notice to **prove** that the road was closed.","“I **insist** that I left early,” she says, and her **remark** helps **convince** me.","I decide to ask about the **circumstances** before judging next time."],"korean":["친구가 늦어서 나는 친구가 약속을 잊었다고 추측한다.","이유가 분명해 보이지 않아 나는 약간 의심한다.","친구는 도로가 막혔다는 것을 증명하려고 버스 안내문을 보여 준다.","친구는 “나는 분명 일찍 출발했어.”라고 주장하고, 그 말에 나는 납득하게 된다.","나는 다음에는 판단하기 전에 상황을 물어보기로 한다."]},{"id":"C079","title":"가족 여행 의논","targets":[{"word_id":"v2590","headword":"suggest","story_form":"suggest","form":"suggest","meaning_en":"put forward an idea","meaning":"제안하다"},{"word_id":"v1443","headword":"intend","story_form":"intend","form":"intend","meaning_en":"plan to do something","meaning":"~할 생각이다"},{"word_id":"v0776","headword":"desire","story_form":"desire","form":"desire","meaning_en":"a strong wish for something","meaning":"바람"},{"word_id":"v1936","headword":"perhaps","story_form":"perhaps","form":"perhaps","meaning_en":"maybe","meaning":"어쩌면"},{"word_id":"v2011","headword":"possible","story_form":"possible","form":"possible","meaning_en":"able to happen or be done","meaning":"가능한"},{"word_id":"v1761","headword":"necessary","story_form":"necessary","form":"necessary","meaning_en":"needed for a purpose","meaning":"필요한"},{"word_id":"v0091","headword":"allow","story_form":"allow","form":"allow","meaning_en":"let someone do something","meaning":"허락하다"},{"word_id":"v0764","headword":"depend","story_form":"depend","form":"depend","meaning_en":"be decided by something else","meaning":"달려 있다"},{"word_id":"v1858","headword":"otherwise","story_form":"otherwise","form":"otherwise","meaning_en":"if that does not happen","meaning":"그렇지 않으면"},{"word_id":"v2833","headword":"unless","story_form":"unless","form":"unless","meaning_en":"except if","meaning":"~하지 않는 한"}],"english":["I **suggest** a trip to the sea because my sister has a strong **desire** to swim.","We **intend** to go on Saturday, but the trip will **depend** on the weather.","“**Perhaps** it is **possible**,” Dad says, “but warm clothes are **necessary**.”","Mom will **allow** us to go **unless** a storm comes; **otherwise**, we will stay home."],"korean":["여동생이 수영을 몹시 하고 싶어 해서 나는 바다 여행을 제안한다.","우리는 토요일에 갈 생각이지만, 여행은 날씨에 달려 있다.","아빠는 “갈 수 있을지도 모르겠구나. 하지만 따뜻한 옷은 필요해.”라고 말씀하신다.","폭풍이 오지 않는다면 엄마는 가도 된다고 하실 것이고, 그렇지 않으면 우리는 집에 있을 것이다."]},{"id":"C080","title":"새 팀의 문제 해결","targets":[{"word_id":"v0581","headword":"conflict","story_form":"conflict","form":"conflict","meaning_en":"a serious disagreement","meaning":"갈등"},{"word_id":"v0187","headword":"attitude","story_form":"attitude","form":"attitude","meaning_en":"the way you think or feel about something","meaning":"태도"},{"word_id":"v1402","headword":"individual","story_form":"individual","form":"individual","meaning_en":"one person","meaning":"개인, 한 사람"},{"word_id":"v0541","headword":"common","story_form":"common","form":"common","meaning_en":"shared by two or more people","meaning":"공통의"},{"word_id":"v2830","headword":"unite","story_form":"unite","form":"unite","meaning_en":"bring people together as one group","meaning":"하나로 모으다"},{"word_id":"v2355","headword":"session","story_form":"session","form":"session","meaning_en":"a period spent meeting or working together","meaning":"회의 시간"},{"word_id":"v1618","headword":"maintain","story_form":"maintain","form":"maintain","meaning_en":"keep something at the same level","meaning":"유지하다"},{"word_id":"v0038","headword":"adapt","story_form":"adapt","form":"adapt","meaning_en":"change to fit a new situation","meaning":"적응하다"},{"word_id":"v0101","headword":"alter","story_form":"alter","form":"alter","meaning_en":"make something different","meaning":"바꾸다"},{"word_id":"v2053","headword":"principle","story_form":"principle","form":"principle","meaning_en":"a basic rule guiding your actions","meaning":"원칙"}],"english":["Our new team has a **conflict** because every **individual** has a different idea.","We change our **attitude** and look for a **common** goal to **unite** us.","We agree on a **principle**: listen before speaking.","To **maintain** this rule, we **adapt** each **session** and **alter** the order of speakers."],"korean":["새 팀에는 사람마다 생각이 달라 갈등이 있다.","우리는 태도를 바꾸고 우리를 하나로 모을 공통의 목표를 찾는다.","우리는 말하기 전에 듣는다는 원칙에 동의한다.","이 규칙을 유지하려고 매 회의 방식을 조정하고 발언 순서를 바꾼다."]},{"id":"C081","title":"거울 앞에서","targets":[{"word_id":"v1698","headword":"mirror","story_form":"mirror","form":"mirror","meaning_en":"a surface in which you see yourself","meaning":"거울"},{"word_id":"v2166","headword":"reflect","story_form":"reflect","form":"reflect","meaning_en":"send back an image","meaning":"비추다"},{"word_id":"v0300","headword":"blonde","story_form":"blonde","form":"blonde","meaning_en":"having light yellow hair","meaning":"금발의"},{"word_id":"v1278","headword":"handsome","story_form":"handsome","form":"handsome","meaning_en":"good-looking, usually describing a man","meaning":"잘생긴"},{"word_id":"v1225","headword":"gorgeous","story_form":"gorgeous","form":"gorgeous","meaning_en":"very beautiful or attractive","meaning":"아주 멋진"},{"word_id":"v0693","headword":"curl","story_form":"curl","form":"curl","meaning_en":"a piece of hair shaped like a ring","meaning":"곱슬머리"},{"word_id":"v2372","headword":"shave","story_form":"shave","form":"shave","meaning_en":"remove hair with a razor","meaning":"면도하다"},{"word_id":"v2441","headword":"smooth","story_form":"smooth","form":"smooth","meaning_en":"make something neat and flat","meaning":"매끈하게 정리하다"},{"word_id":"v2047","headword":"pride","story_form":"pride","form":"pride","meaning_en":"a pleased feeling about yourself or your work","meaning":"자부심"},{"word_id":"v2399","headword":"sight","story_form":"sight","form":"sight","meaning_en":"something you can see","meaning":"모습"}],"english":["A **mirror** can **reflect** a face, but it cannot show all of a person’s life.","Dad begins to **shave** while I try to **smooth** one **blonde** **curl**.","“You look **handsome**,” I say, and he calls my hair **gorgeous**.","We laugh at the **sight** of our wet faces and take **pride** in getting ready on time."],"korean":["거울은 얼굴을 비출 수 있지만 한 사람의 삶 전체를 보여 주지는 못한다.","내가 금발 곱슬머리 한 가닥을 정리하는 동안 아빠는 면도를 시작하신다.","내가 “잘생기셨어요.”라고 말하자 아빠는 내 머리가 아주 멋지다고 하신다.","우리는 젖은 얼굴의 모습을 보고 웃으며 제시간에 준비한 것을 뿌듯해한다."]},{"id":"C082","title":"잃어버린 도시 이야기","targets":[{"word_id":"v0772","headword":"desert","story_form":"desert","form":"desert","meaning_en":"a very dry area with little rain","meaning":"사막"},{"word_id":"v0803","headword":"dig","story_form":"dig","form":"dig","meaning_en":"make a hole in the ground","meaning":"파다"},{"word_id":"v0370","headword":"bury","story_form":"bury","form":"bury","meaning_en":"put something under the ground","meaning":"묻다"},{"word_id":"v0812","headword":"dirt","story_form":"dirt","form":"dirt","meaning_en":"loose earth or soil","meaning":"흙"},{"word_id":"v2277","headword":"ruin","story_form":"ruin","form":"ruin","meaning_en":"the remains of an old building","meaning":"유적"},{"word_id":"v0345","headword":"brick","story_form":"brick","form":"brick","meaning_en":"a hard rectangular block used for building","meaning":"벽돌"},{"word_id":"v2758","headword":"tower","story_form":"tower","form":"tower","meaning_en":"a tall narrow building","meaning":"탑"},{"word_id":"v1304","headword":"height","story_form":"height","form":"height","meaning_en":"how tall something is","meaning":"높이"},{"word_id":"v2415","headword":"site","story_form":"site","form":"site","meaning_en":"a place where something is located","meaning":"장소"},{"word_id":"v0989","headword":"exist","story_form":"exist","form":"exist","meaning_en":"be real or present","meaning":"존재하다"}],"english":["In a story, we visit a **desert** **site** where an old city used to **exist**.","We **dig** through **dirt** beside a **brick** **tower** of great **height**.","Sand can **bury** a whole town, so each **ruin** takes time to find.","At sunset, we draw the lost city as we imagine it once looked."],"korean":["이야기 속에서 우리는 옛 도시가 존재했던 사막의 장소를 방문한다.","우리는 높이 솟은 벽돌 탑 옆에서 흙을 파낸다.","모래는 마을 전체를 묻을 수 있어서 유적 하나하나를 찾는 데 시간이 걸린다.","해 질 무렵, 우리는 그 도시의 옛 모습을 상상해 그린다."]},{"id":"C083","title":"마술 쇼","targets":[{"word_id":"v1613","headword":"magic","story_form":"magic","form":"magic","meaning_en":"the art of doing seemingly impossible things","meaning":"마술"},{"word_id":"v2788","headword":"trick","story_form":"trick","form":"trick","meaning_en":"a clever act meant to entertain","meaning":"묘기"},{"word_id":"v0106","headword":"amaze","story_form":"amaze","form":"amaze","meaning_en":"surprise someone very much","meaning":"놀라게 하다"},{"word_id":"v1636","headword":"marvel","story_form":"marvel","form":"marvel","meaning_en":"a feeling of great surprise and admiration","meaning":"경이로움"},{"word_id":"v1040","headword":"fascinate","story_form":"fascinate","form":"fascinate","meaning_en":"hold someone's interest strongly","meaning":"매료하다"},{"word_id":"v0517","headword":"coin","story_form":"coin","form":"coin","meaning_en":"a small flat piece of metal money","meaning":"동전"},{"word_id":"v1985","headword":"pocket","story_form":"pocket","form":"pocket","meaning_en":"a small cloth bag sewn into clothing","meaning":"주머니"},{"word_id":"v0925","headword":"empty","story_form":"empty","form":"empty","meaning_en":"having nothing inside","meaning":"빈"},{"word_id":"v2973","headword":"wonder","story_form":"wonder","form":"wonder","meaning_en":"want to know something","meaning":"궁금해하다"},{"word_id":"v1323","headword":"hint","story_form":"hint","form":"hint","meaning_en":"a small piece of helpful information","meaning":"실마리"}],"english":["A little **magic** show can **amaze** me and **fascinate** my brother.","The performer puts a **coin** in his **pocket** and then shows us that it is **empty**.","We **wonder** how the **trick** works, but he gives us only one **hint**: “Watch my hands.”","The whole show is a **marvel**, and we cheer loudly."],"korean":["작은 마술 쇼도 나를 놀라게 하고 남동생을 매료할 수 있다.","공연자는 동전을 주머니에 넣은 다음 주머니가 비었다는 것을 보여 준다.","우리는 묘기의 원리가 궁금하지만, 그는 “내 손을 보세요.”라는 실마리 하나만 준다.","공연 전체가 경이로워서 우리는 크게 환호한다."]},{"id":"C084","title":"꿈속의 왕국","targets":[{"word_id":"v0118","headword":"angel","story_form":"angel","form":"angel","meaning_en":"a good spirit often shown with wings","meaning":"천사"},{"word_id":"v1301","headword":"heaven","story_form":"heaven","form":"heaven","meaning_en":"a place of happiness with God after death","meaning":"천국"},{"word_id":"v1307","headword":"hell","story_form":"hell","form":"hell","meaning_en":"a place of punishment after death","meaning":"지옥"},{"word_id":"v0969","headword":"evil","story_form":"evil","form":"evil","meaning_en":"very bad or harmful","meaning":"악한"},{"word_id":"v2471","headword":"soul","story_form":"soul","form":"soul","meaning_en":"a person, described in a literary way","meaning":"사람(문학적 표현)"},{"word_id":"v2494","headword":"spirit","story_form":"spirit","form":"spirit","meaning_en":"a person's inner strength or attitude","meaning":"정신"},{"word_id":"v1028","headword":"faith","story_form":"faith","form":"faith","meaning_en":"strong trust in someone or something","meaning":"믿음"},{"word_id":"v0260","headword":"belief","story_form":"belief","form":"belief","meaning_en":"an idea you accept as true","meaning":"신념"},{"word_id":"v2022","headword":"pray","story_form":"pray","form":"pray","meaning_en":"speak to God","meaning":"기도하다"},{"word_id":"v1125","headword":"forever","story_form":"forever","form":"forever","meaning_en":"for all time","meaning":"영원히"}],"english":["In my dream, an **angel** tells a story about **heaven** and **hell**.","An **evil** king thinks he can rule **forever**, but one brave **soul** will not follow his orders.","The child has **faith** that kindness can win and a strong **belief** in helping others.","People **pray** for peace, and their hopeful **spirit** changes the kingdom."],"korean":["꿈속에서 천사가 천국과 지옥에 관한 이야기를 들려준다.","악한 왕은 영원히 다스릴 수 있다고 생각하지만 용감한 한 사람은 그의 명령을 따르지 않는다.","그 아이는 친절함이 이길 수 있다는 믿음과 다른 사람을 도와야 한다는 강한 신념을 지니고 있다.","사람들은 평화를 기도하고, 희망에 찬 정신이 왕국을 바꾼다."]},{"id":"C085","title":"건강한 선택","targets":[{"word_id":"v0800","headword":"diet","story_form":"diet","form":"diet","meaning_en":"the food you usually eat","meaning":"식단"},{"word_id":"v0599","headword":"consume","story_form":"consume","form":"consume","meaning_en":"eat or drink something","meaning":"섭취하다"},{"word_id":"v1357","headword":"hunger","story_form":"hunger","form":"hunger","meaning_en":"the feeling of needing food","meaning":"배고픔"},{"word_id":"v2544","headword":"stomach","story_form":"stomach","form":"stomach","meaning_en":"the organ that holds food after eating","meaning":"위"},{"word_id":"v0289","headword":"bitter","story_form":"bitter","form":"bitter","meaning_en":"having a strong sharp taste like black coffee","meaning":"쓴"},{"word_id":"v2474","headword":"sour","story_form":"sour","form":"sour","meaning_en":"having a sharp taste like a lemon","meaning":"신"},{"word_id":"v0675","headword":"crisp","story_form":"crisp","form":"crisp","meaning_en":"firm and crunchy when eaten","meaning":"아삭한"},{"word_id":"v1811","headword":"nut","story_form":"nuts","form":"nuts","meaning_en":"a seed with a hard shell","meaning":"견과"},{"word_id":"v2106","headword":"pure","story_form":"pure","form":"pure","meaning_en":"not mixed with anything else","meaning":"순수한"},{"word_id":"v1702","headword":"mix","story_form":"mix","form":"mix","meaning_en":"put different things together","meaning":"섞다"}],"english":["For a school project, I look at my **diet** and the food I **consume**.","When **hunger** comes, I **mix** **nuts** with **crisp** apple pieces instead of taking more cake.","A **sour** orange and a **bitter** piece of dark chocolate taste different, so I try just a little of each.","I drink **pure** water and stop eating when my **stomach** feels full."],"korean":["학교 과제를 위해 나는 내 식단과 먹는 음식을 살펴본다.","배가 고프면 케이크를 더 먹는 대신 견과류를 아삭한 사과 조각들과 섞는다.","신 오렌지와 쓴 다크초콜릿은 맛이 달라서 각각 조금씩만 먹어 본다.","나는 깨끗한 물을 마시고 배가 부르면 먹는 것을 멈춘다."]},{"id":"C086","title":"술과 담배에 관한 수업","targets":[{"word_id":"v0084","headword":"alcohol","story_form":"alcohol","form":"alcohol","meaning_en":"a substance in drinks that can make you drunk","meaning":"알코올"},{"word_id":"v0253","headword":"beer","story_form":"beer","form":"beer","meaning_en":"an alcoholic drink made from grain","meaning":"맥주"},{"word_id":"v2096","headword":"pub","story_form":"pub","form":"pub","meaning_en":"a place where people buy alcoholic drinks","meaning":"술집"},{"word_id":"v0224","headword":"bar","story_form":"bar","form":"bar","meaning_en":"a place that serves alcoholic drinks","meaning":"술집"},{"word_id":"v0477","headword":"cigarette","story_form":"cigarette","form":"cigarette","meaning_en":"a small paper tube of tobacco for smoking","meaning":"담배"},{"word_id":"v0870","headword":"drug","story_form":"drug","form":"drug","meaning_en":"a substance that changes how the body works","meaning":"약물"},{"word_id":"v1989","headword":"poison","story_form":"poison","form":"poison","meaning_en":"a substance that can harm or kill","meaning":"독"},{"word_id":"v2169","headword":"refuse","story_form":"refuse","form":"refuse","meaning_en":"say you will not do or take something","meaning":"거절하다"},{"word_id":"v1409","headword":"influence","story_form":"influence","form":"influence","meaning_en":"the power to change someone's actions","meaning":"영향"},{"word_id":"v2658","headword":"teenage","story_form":"teenage","form":"teenage","meaning_en":"related to ages thirteen through nineteen","meaning":"십 대의"}],"english":["In a **teenage** health class, we talk about **alcohol**, a **drug** found in **beer**.","A picture shows a **pub** and a **bar**, but our lesson is about making safe choices.","We learn that **cigarette** smoke contains **poison** and that friends can have a strong **influence**.","We practice how to **refuse** something we do not want."],"korean":["십 대 건강 수업에서 우리는 맥주에 들어 있는 약물인 알코올에 관해 이야기한다.","사진에는 술집들이 나오지만, 수업의 주제는 안전한 선택을 하는 것이다.","우리는 담배 연기에 독성 물질이 들어 있고 친구들의 영향력이 클 수 있다는 점을 배운다.","우리는 원하지 않는 것을 거절하는 방법을 연습한다."]},{"id":"C087","title":"너무 바쁜 하루","targets":[{"word_id":"v0386","headword":"calendar","story_form":"calendar","form":"calendar","meaning_en":"a chart showing days, weeks, and months","meaning":"달력"},{"word_id":"v0185","headword":"attend","story_form":"attend","form":"attend","meaning_en":"go to a meeting or event","meaning":"참석하다"},{"word_id":"v0965","headword":"event","story_form":"event","form":"event","meaning_en":"a planned activity or occasion","meaning":"행사"},{"word_id":"v1793","headword":"noon","story_form":"noon","form":"noon","meaning_en":"twelve o'clock in the daytime","meaning":"정오"},{"word_id":"v1937","headword":"period","story_form":"period","form":"period","meaning_en":"a length of time","meaning":"기간, 시간"},{"word_id":"v1713","headword":"moment","story_form":"moment","form":"moment","meaning_en":"a very short time","meaning":"순간"},{"word_id":"v1453","headword":"interrupt","story_form":"interrupt","form":"interrupt","meaning_en":"stop someone while they are speaking or working","meaning":"방해하다"},{"word_id":"v0833","headword":"disturb","story_form":"disturb","form":"disturb","meaning_en":"bother someone who is busy or resting","meaning":"방해하다"},{"word_id":"v2558","headword":"stress","story_form":"stress","form":"stress","meaning_en":"worry caused by difficult demands","meaning":"스트레스"},{"word_id":"v0889","headword":"ease","story_form":"ease","form":"ease","meaning_en":"make something less painful or difficult","meaning":"덜다"}],"english":["My **calendar** shows a school **event** to **attend** at **noon** and another meeting after lunch.","I have only a short **period** to eat, and the busy day causes **stress**.","I ask my friends not to **interrupt** me for a **moment** while I sit quietly.","They do not **disturb** me, and a few slow breaths **ease** my worries."],"korean":["달력에는 정오에 참석할 학교 행사와 점심 이후의 다른 모임이 적혀 있다.","먹을 시간이 짧고 바쁜 하루 때문에 스트레스를 받는다.","나는 잠시 조용히 앉아 있는 동안 친구들에게 방해하지 말아 달라고 부탁한다.","친구들은 나를 방해하지 않고, 몇 차례 천천히 숨을 쉬자 걱정이 줄어든다."]},{"id":"C088","title":"어려운 소식","targets":[{"word_id":"v0059","headword":"affair","story_form":"affair","form":"affair","meaning_en":"a matter or situation","meaning":"일"},{"word_id":"v0674","headword":"crisis","story_form":"crisis","form":"crisis","meaning_en":"a very serious and difficult situation","meaning":"위기"},{"word_id":"v1600","headword":"loss","story_form":"loss","form":"loss","meaning_en":"no longer having someone or something","meaning":"상실"},{"word_id":"v0838","headword":"divorce","story_form":"divorce","form":"divorce","meaning_en":"the legal ending of a marriage","meaning":"이혼"},{"word_id":"v0060","headword":"affect","story_form":"affect","form":"affect","meaning_en":"make a change to something","meaning":"영향을 미치다"},{"word_id":"v1444","headword":"intense","story_form":"intense","form":"intense","meaning_en":"very strong","meaning":"강렬한"},{"word_id":"v2654","headword":"tear","story_form":"tear","form":"tear","meaning_en":"a drop of liquid from your eye","meaning":"눈물"},{"word_id":"v2839","headword":"upset","story_form":"upset","form":"upset","meaning_en":"unhappy or worried","meaning":"속상한"},{"word_id":"v1769","headword":"neither","story_form":"neither","form":"neither","meaning_en":"not one of two things","meaning":"~도 아닌"},{"word_id":"v1794","headword":"nor","story_form":"nor","form":"nor","meaning_en":"and not the other thing","meaning":"~도 아닌"}],"english":["A family **affair** becomes a **crisis** when my friend hears about his parents’ **divorce**.","The news can **affect** him deeply, and his sense of **loss** is **intense**.","He looks **upset**, and a **tear** runs down his face.","I remind him that it is **neither** his fault **nor** his job to fix it, and I stay beside him."],"korean":["친구가 부모님의 이혼 소식을 듣자 집안일이 위기로 다가온다.","그 소식은 그에게 깊은 영향을 줄 수 있고 상실감도 강렬하다.","그는 속상해 보이고 눈물 한 방울이 얼굴을 타고 흐른다.","나는 그것이 그의 잘못도, 그가 해결할 일도 아니라고 상기시켜 주며 곁에 머문다."]},{"id":"C089","title":"학교에서 지켜야 할 것","targets":[{"word_id":"v2826","headword":"uniform","story_form":"uniform","form":"uniform","meaning_en":"special clothes worn by members of a school","meaning":"교복"},{"word_id":"v1567","headword":"license","story_form":"license","form":"license","meaning_en":"an official document giving permission","meaning":"허가증"},{"word_id":"v2172","headword":"register","story_form":"register","form":"register","meaning_en":"put your name on an official list","meaning":"등록하다"},{"word_id":"v2204","headword":"require","story_form":"require","form":"require","meaning_en":"say that something is needed","meaning":"요구하다"},{"word_id":"v1859","headword":"ought","story_form":"ought","form":"ought","meaning_en":"should do something","meaning":"~해야 한다"},{"word_id":"v2366","headword":"shall","story_form":"shall","form":"shall","meaning_en":"will do something","meaning":"~하겠다"},{"word_id":"v1234","headword":"grant","story_form":"grant","form":"grant","meaning_en":"officially give permission","meaning":"허가하다"},{"word_id":"v2089","headword":"protest","story_form":"protest","form":"protest","meaning_en":"say that you strongly disagree","meaning":"항의하다"},{"word_id":"v0485","headword":"civil","story_form":"civil","form":"civil","meaning_en":"polite and respectful","meaning":"예의 바른"},{"word_id":"v1995","headword":"politics","story_form":"politics","form":"politics","meaning_en":"activities involving government and public decisions","meaning":"정치"}],"english":["At our school, club leaders **register** new members and wear a special **uniform** at events.","The town may **require** a **license** for a big show and **grant** it after checking the plan.","“We **shall** follow the rules,” our leader says, “but we **ought** to ask questions too.”","In a lesson about **politics**, we learn that people can **protest** in a **civil** way."],"korean":["우리 학교에서는 동아리 대표들이 새 회원을 등록하고 행사에서 특별한 단체복을 입는다.","마을에서는 큰 공연에 허가증을 요구하고 계획을 확인한 뒤 허가할 수 있다.","대표는 “우리는 규칙을 따르겠지만, 질문도 해야 합니다.”라고 말한다.","정치에 관한 수업에서 우리는 사람들이 예의 바르게 항의할 수 있다는 점을 배운다."]},{"id":"C090","title":"공장에서 바뀐 하루","targets":[{"word_id":"v2379","headword":"shift","story_form":"shift","form":"shift","meaning_en":"a group working during a set period","meaning":"근무조"},{"word_id":"v1514","headword":"labor","story_form":"labor","form":"labor","meaning_en":"physical work","meaning":"노동"},{"word_id":"v2895","headword":"wage","story_form":"wage","form":"wage","meaning_en":"money paid for work","meaning":"임금"},{"word_id":"v1687","headword":"mill","story_form":"mill","form":"mill","meaning_en":"a factory that makes or processes material","meaning":"공장"},{"word_id":"v0512","headword":"coal","story_form":"coal","form":"coal","meaning_en":"a black rock burned for fuel","meaning":"석탄"},{"word_id":"v2532","headword":"steam","story_form":"steam","form":"steam","meaning_en":"water in the form of hot gas","meaning":"증기"},{"word_id":"v1466","headword":"iron","story_form":"iron","form":"iron","meaning_en":"a strong metal used to make steel","meaning":"철"},{"word_id":"v1709","headword":"modern","story_form":"modern","form":"modern","meaning_en":"related to the present time","meaning":"현대의"},{"word_id":"v0892","headword":"economy","story_form":"economy","form":"economy","meaning_en":"the way a society makes and uses money","meaning":"경제"},{"word_id":"v1396","headword":"income","story_form":"income","form":"income","meaning_en":"money you receive from work or other sources","meaning":"소득"}],"english":["Grandma tells me about a **shift** she worked at a **mill** long ago.","**Coal** made **steam** to run machines, and heavy **iron** parts required hard **labor**.","Her **wage** was small, but it was important **income** for the family.","She says the **modern** **economy** has changed many jobs, though workers still need fair pay."],"korean":["할머니는 오래전에 공장에서 일하셨던 근무조에 관해 말씀해 주신다.","석탄으로 만든 증기가 기계를 돌렸고, 무거운 철 부품을 다루는 일에는 고된 노동이 필요했다.","임금은 적었지만 가족에게는 중요한 소득이었다.","할머니는 현대 경제가 많은 직업을 바꾸었지만 노동자들에게는 여전히 공정한 보수가 필요하다고 말씀하신다."]},{"id":"C091","title":"밤의 소음 실험","targets":[{"word_id":"v0221","headword":"bang","story_form":"bang","form":"bang","meaning_en":"a sudden loud noise","meaning":"쾅 하는 소리"},{"word_id":"v0315","headword":"boom","story_form":"boom","form":"boom","meaning_en":"a deep loud sound","meaning":"쿵 하는 소리"},{"word_id":"v2001","headword":"pop","story_form":"pop","form":"pop","meaning_en":"a short sharp bursting sound","meaning":"펑 하는 소리"},{"word_id":"v2444","headword":"snap","story_form":"snap","form":"snap","meaning_en":"a short sharp cracking sound","meaning":"딱 하는 소리"},{"word_id":"v0369","headword":"burst","story_form":"burst","form":"burst","meaning_en":"break open suddenly","meaning":"터지다"},{"word_id":"v0304","headword":"blow","story_form":"blow","form":"blow","meaning_en":"send air out of your mouth","meaning":"불다"},{"word_id":"v2946","headword":"whistle","story_form":"whistle","form":"whistle","meaning_en":"a small tool that makes a high sound","meaning":"호루라기"},{"word_id":"v2989","headword":"yell","story_form":"yell","form":"yell","meaning_en":"a loud cry","meaning":"외침"},{"word_id":"v2391","headword":"shout","story_form":"shout","form":"shout","meaning_en":"a loud call","meaning":"외침"},{"word_id":"v2945","headword":"whisper","story_form":"whisper","form":"whisper","meaning_en":"very quiet speech","meaning":"속삭임"}],"english":["For our sound show, I **blow** a **whistle** while my friend makes a **bang** with a drum.","A bigger drum makes a **boom**, and a thin stick breaks with a **snap**.","A balloon can **burst** with a **pop**, so we warn everyone first.","We compare a **yell** with a **shout**, then end with a **whisper** so the room becomes quiet."],"korean":["소리 공연을 위해 내가 호루라기를 부는 동안 친구는 북으로 쾅 하는 소리를 낸다.","더 큰 북은 쿵 하는 소리를 내고, 가는 막대기는 딱 소리를 내며 부러진다.","풍선은 펑 소리를 내며 터질 수 있어서 먼저 모두에게 알려 준다.","우리는 두 가지 크게 외치는 소리를 비교한 다음, 방이 조용해지도록 속삭임으로 끝낸다."]},{"id":"C092","title":"청소하다 생긴 일","targets":[{"word_id":"v1674","headword":"mess","story_form":"mess","form":"mess","meaning_en":"a dirty or untidy state","meaning":"어질러진 상태"},{"word_id":"v0877","headword":"dump","story_form":"dump","form":"dump","meaning_en":"put something down carelessly","meaning":"내려놓다"},{"word_id":"v2571","headword":"stuff","story_form":"stuff","form":"stuff","meaning_en":"things whose names are not specified","meaning":"물건들"},{"word_id":"v0858","headword":"drag","story_form":"drag","form":"drag","meaning_en":"pull something along the ground","meaning":"끌다"},{"word_id":"v0364","headword":"bump","story_form":"bump","form":"bump","meaning_en":"hit something by accident","meaning":"부딪치다"},{"word_id":"v2437","headword":"smash","story_form":"smash","form":"smash","meaning_en":"break something into many pieces","meaning":"산산조각 내다"},{"word_id":"v2371","headword":"sharp","story_form":"sharp","form":"sharp","meaning_en":"having an edge that can cut","meaning":"날카로운"},{"word_id":"v1957","headword":"piece","story_form":"piece","form":"piece","meaning_en":"a part broken off something","meaning":"조각"},{"word_id":"v0820","headword":"disgust","story_form":"disgust","form":"disgust","meaning_en":"a strong feeling of dislike","meaning":"혐오감"},{"word_id":"v2383","headword":"shock","story_form":"shock","form":"shock","meaning_en":"a strong feeling of unpleasant surprise","meaning":"충격"}],"english":["My room is a **mess**, so I **dump** my old **stuff** into a box and **drag** it to the door.","I **bump** into a table and **smash** a glass plate.","One **sharp** **piece** falls to the floor, giving me a **shock**.","Dad looks at the old food in the box with **disgust** and brings a brush to help."],"korean":["방이 어질러져 있어서 나는 낡은 물건들을 상자에 내려놓고 문 쪽으로 끈다.","나는 탁자에 부딪쳐 유리 접시를 깨뜨린다.","날카로운 조각 하나가 바닥에 떨어져 나는 깜짝 놀란다.","아빠는 상자 안의 오래된 음식을 보고 질색하며 도우려고 솔을 가져오신다."]},{"id":"C093","title":"촬영 동아리","targets":[{"word_id":"v2569","headword":"studio","story_form":"studio","form":"studio","meaning_en":"a room where films or recordings are made","meaning":"스튜디오"},{"word_id":"v0209","headword":"background","story_form":"background","form":"background","meaning_en":"what is behind the main subject","meaning":"배경"},{"word_id":"v2385","headword":"shoot","story_form":"shoot","form":"shoot","meaning_en":"make a film or take photographs","meaning":"촬영하다"},{"word_id":"v0503","headword":"clip","story_form":"clip","form":"clip","meaning_en":"a short part of a video","meaning":"짧은 영상"},{"word_id":"v0815","headword":"disc","story_form":"disc","form":"disc","meaning_en":"a flat round object storing sound or data","meaning":"디스크"},{"word_id":"v0444","headword":"channel","story_form":"channel","form":"channel","meaning_en":"a service that shows videos or programs","meaning":"채널"},{"word_id":"v1715","headword":"monitor","story_form":"monitor","form":"monitor","meaning_en":"watch and check something carefully","meaning":"확인하다"},{"word_id":"v1727","headword":"motion","story_form":"motion","form":"motion","meaning_en":"movement","meaning":"움직임"},{"word_id":"v2656","headword":"technique","story_form":"technique","form":"technique","meaning_en":"a special way of doing something","meaning":"기법"},{"word_id":"v2874","headword":"view","story_form":"view","form":"view","meaning_en":"watch or look at something","meaning":"보다"}],"english":["In the **studio**, we paint a **background** and **shoot** a short **clip** of a toy car.","Our teacher shows us a **technique** for making its **motion** look smooth.","We **monitor** the light and **view** the film on our class **channel**.","Then we save a copy on a **disc** for the school show."],"korean":["스튜디오에서 우리는 배경을 칠하고 장난감 자동차의 짧은 영상을 촬영한다.","선생님은 움직임을 매끄럽게 보이게 하는 기법을 알려 주신다.","우리는 빛을 확인하고 학급 채널에서 영상을 본다.","그런 다음 학교 행사에 쓸 복사본을 디스크에 저장한다."]},{"id":"C094","title":"시를 쓰는 오후","targets":[{"word_id":"v1986","headword":"poem","story_form":"poem","form":"poem","meaning_en":"writing arranged in lines to express feelings","meaning":"시"},{"word_id":"v1987","headword":"poet","story_form":"poet","form":"poet","meaning_en":"a person who writes poems","meaning":"시인"},{"word_id":"v0796","headword":"diary","story_form":"diary","form":"diary","meaning_en":"a book for writing daily experiences","meaning":"일기장"},{"word_id":"v0292","headword":"blank","story_form":"blank","form":"blank","meaning_en":"having no writing on it","meaning":"빈"},{"word_id":"v2375","headword":"sheet","story_form":"sheet","form":"sheet","meaning_en":"one piece of paper","meaning":"종이 한 장"},{"word_id":"v1633","headword":"mark","story_form":"mark","form":"mark","meaning_en":"a visible line or spot","meaning":"자국"},{"word_id":"v2463","headword":"somewhat","story_form":"somewhat","form":"somewhat","meaning_en":"to a small degree","meaning":"다소"},{"word_id":"v1228","headword":"grace","story_form":"grace","form":"grace","meaning_en":"beauty in movement or style","meaning":"우아함"},{"word_id":"v0450","headword":"charm","story_form":"charm","form":"charm","meaning_en":"a quality that makes something pleasing","meaning":"매력"},{"word_id":"v1972","headword":"plain","story_form":"plain","form":"plain","meaning_en":"simple and easy to understand","meaning":"평이한"}],"english":["I open my **diary** and place a **blank** **sheet** beside it to write a **poem**.","At first, there is only one pencil **mark**, but I keep trying to think like a **poet**.","I use **plain** words to describe the **grace** of a bird and the **charm** of our garden.","I feel **somewhat** unsure, but my sister says the simple words have their own beauty."],"korean":["나는 시를 쓰려고 일기장을 펴고 옆에 빈 종이 한 장을 놓는다.","처음에는 연필 자국 하나뿐이지만, 나는 계속 시인처럼 생각해 보려고 한다.","나는 평이한 단어로 새의 우아함과 우리 정원의 매력을 묘사한다.","나는 다소 자신이 없지만, 언니는 그 단순한 단어들만의 아름다움이 있다고 말한다."]},{"id":"C095","title":"운동장에 그린 도형","targets":[{"word_id":"v2508","headword":"square","story_form":"square","form":"square","meaning_en":"a shape with four equal sides and right angles","meaning":"정사각형"},{"word_id":"v2786","headword":"triangle","story_form":"triangle","form":"triangle","meaning_en":"a shape with three sides","meaning":"삼각형"},{"word_id":"v2536","headword":"step","story_form":"step","form":"step","meaning_en":"one movement of your foot when walking","meaning":"걸음"},{"word_id":"v2829","headword":"unit","story_form":"unit","form":"unit","meaning_en":"a fixed amount used for measuring","meaning":"단위"},{"word_id":"v1563","headword":"level","story_form":"level","form":"level","meaning_en":"flat and not sloping","meaning":"수평인"},{"word_id":"v2952","headword":"wide","story_form":"wide","form":"wide","meaning_en":"measuring a large distance from side to side","meaning":"넓은"},{"word_id":"v0351","headword":"broad","story_form":"broad","form":"broad","meaning_en":"wide from side to side","meaning":"넓은"},{"word_id":"v2699","headword":"thin","story_form":"thin","form":"thin","meaning_en":"having a small distance across","meaning":"가는"},{"word_id":"v2697","headword":"thick","story_form":"thick","form":"thick","meaning_en":"having a large distance across","meaning":"굵은"},{"word_id":"v2551","headword":"straight","story_form":"straight","form":"straight","meaning_en":"not bent or curved","meaning":"곧은"}],"english":["We draw a **square** and a **triangle** on a **level** part of the playground.","A meter is our **unit**, and the first shape is two meters **wide**.","We use **thin** chalk for the lines and a **thick** piece to make one **straight** path.","The **broad** path leads from one shape to the other.","We take one **step** at a time to check its length."],"korean":["우리는 운동장의 평평한 곳에 정사각형과 삼각형을 그린다.","단위는 미터이고, 첫 번째 도형의 너비는 2미터다.","선은 가는 분필로 그리고, 굵은 분필 조각으로 곧은 길 하나를 만든다.","넓은 길은 한 도형에서 다른 도형으로 이어진다.","우리는 길이를 확인하려고 한 걸음씩 걷는다."]},{"id":"C096","title":"크기를 비교하는 수업","targets":[{"word_id":"v1638","headword":"mass","story_form":"mass","form":"mass","meaning_en":"the amount of matter in an object","meaning":"질량"},{"word_id":"v1645","headword":"maximum","story_form":"maximum","form":"maximum","meaning_en":"the largest possible","meaning":"최대의"},{"word_id":"v1575","headword":"limit","story_form":"limit","form":"limit","meaning_en":"the greatest amount allowed","meaning":"한도"},{"word_id":"v1398","headword":"increase","story_form":"increase","form":"increase","meaning_en":"make something greater","meaning":"늘리다"},{"word_id":"v0992","headword":"expand","story_form":"expand","form":"expand","meaning_en":"make something larger","meaning":"확장하다"},{"word_id":"v1006","headword":"extend","story_form":"extend","form":"extend","meaning_en":"make something longer","meaning":"연장하다"},{"word_id":"v0935","headword":"enormous","story_form":"enormous","form":"enormous","meaning_en":"very large","meaning":"거대한"},{"word_id":"v0279","headword":"billion","story_form":"billion","form":"billion","meaning_en":"one thousand million","meaning":"십억"},{"word_id":"v2709","headword":"thousand","story_form":"thousand","form":"thousand","meaning_en":"ten hundreds","meaning":"천"},{"word_id":"v2998","headword":"zero","story_form":"zero","form":"zero","meaning_en":"the number meaning nothing","meaning":"영"}],"english":["Our class builds a paper bridge and tests the **maximum** **mass** it can hold.","We start at **zero** and **increase** the weight toward a **limit** of a **thousand** grams.","To make it stronger, we **expand** the base and **extend** the supports.","“A real bridge might cost a **billion** dollars,” Dad says, “but yours does not need an **enormous** budget.”"],"korean":["우리 반은 종이 다리를 만들고 버틸 수 있는 최대 질량을 시험한다.","우리는 영에서 시작해 천 그램이라는 한도를 향해 무게를 늘린다.","더 튼튼하게 하려고 밑부분을 넓히고 지지대를 연장한다.","아빠는 “실제 다리는 십억 달러가 들 수도 있겠지만, 너희 다리에 거대한 예산은 필요 없겠지.”라고 말씀하신다."]},{"id":"C097","title":"공구를 빌리다","targets":[{"word_id":"v1181","headword":"garage","story_form":"garage","form":"garage","meaning_en":"a building for keeping a car","meaning":"차고"},{"word_id":"v1214","headword":"glove","story_form":"glove","form":"glove","meaning_en":"a covering for your hand with separate fingers","meaning":"장갑"},{"word_id":"v1571","headword":"lift","story_form":"lift","form":"lift","meaning_en":"move something upward","meaning":"들어 올리다"},{"word_id":"v1544","headword":"lean","story_form":"lean","form":"lean","meaning_en":"rest against something","meaning":"기대다"},{"word_id":"v1538","headword":"lay","story_form":"lay","form":"lay","meaning_en":"put something down carefully","meaning":"놓다"},{"word_id":"v1568","headword":"lid","story_form":"lid","form":"lid","meaning_en":"a cover for a container","meaning":"뚜껑"},{"word_id":"v2728","headword":"tin","story_form":"tin","form":"tin","meaning_en":"a metal container","meaning":"금속 통"},{"word_id":"v2644","headword":"tap","story_form":"tap","form":"tap","meaning_en":"hit something lightly","meaning":"가볍게 두드리다"},{"word_id":"v2275","headword":"rub","story_form":"rub","form":"rub","meaning_en":"move your hand back and forth over something","meaning":"문지르다"},{"word_id":"v2537","headword":"stick","story_form":"stick","form":"stick","meaning_en":"attach something to a surface","meaning":"붙이다"}],"english":["In the **garage**, I put on a **glove** and **lift** a small **tin** from a shelf.","Dad asks me to **lay** it on the table, not **lean** it against the wall.","We **tap** the **lid** until it opens and **rub** dust off the inside.","Then we **stick** a new label on it and put our tools away."],"korean":["차고에서 나는 장갑을 끼고 선반에서 작은 금속 통을 들어 올린다.","아빠는 통을 벽에 기대지 말고 탁자에 놓으라고 하신다.","우리는 뚜껑이 열릴 때까지 가볍게 두드리고 안쪽의 먼지를 문질러 닦는다.","그런 다음 새 이름표를 붙이고 도구들을 정리한다."]},{"id":"C098","title":"봄맞이 옷 수선","targets":[{"word_id":"v2361","headword":"sew","story_form":"sew","form":"sew","meaning_en":"join cloth using a needle and thread","meaning":"바느질하다"},{"word_id":"v2722","headword":"tie","story_form":"tie","form":"tie","meaning_en":"fasten something with a knot","meaning":"묶다"},{"word_id":"v1329","headword":"hole","story_form":"hole","form":"hole","meaning_en":"an opening in something","meaning":"구멍"},{"word_id":"v2838","headword":"upper","story_form":"upper","form":"upper","meaning_en":"closer to the top","meaning":"위쪽의"},{"word_id":"v0317","headword":"boot","story_form":"boot","form":"boot","meaning_en":"a shoe that covers the ankle or leg","meaning":"장화"},{"word_id":"v0225","headword":"bare","story_form":"bare","form":"bare","meaning_en":"not covered by clothing","meaning":"맨"},{"word_id":"v2390","headword":"shoulder","story_form":"shoulder","form":"shoulder","meaning_en":"the body part between your neck and arm","meaning":"어깨"},{"word_id":"v2737","headword":"toe","story_form":"toe","form":"toe","meaning_en":"one of the five digits on your foot","meaning":"발가락"},{"word_id":"v2757","headword":"towel","story_form":"towel","form":"towel","meaning_en":"a cloth used for drying","meaning":"수건"},{"word_id":"v2393","headword":"shower","story_form":"shower","form":"shower","meaning_en":"washing under falling water","meaning":"샤워"}],"english":["After a wet walk, I take off a **boot** and dry each **bare** **toe** with a **towel**.","I have a **shower**, then look at a **hole** in the **upper** part of my coat, near the **shoulder**.","Mom can **sew** it for me, and I help **tie** the thin string at the end.","Now the coat is ready for another walk."],"korean":["비에 젖은 산책을 마치고 나는 장화를 벗어 드러난 발가락을 수건으로 하나씩 닦는다.","샤워를 한 뒤 코트 위쪽, 어깨 근처에 난 구멍을 살펴본다.","엄마가 바느질해 주실 수 있어서 나는 끝에 가는 실을 묶는 일을 돕는다.","이제 코트가 다음 산책을 위해 준비되었다."]},{"id":"C099","title":"작은 실수의 큰 결과","targets":[{"word_id":"v0423","headword":"cause","story_form":"cause","form":"cause","meaning_en":"what makes something happen","meaning":"원인"},{"word_id":"v1695","headword":"minor","story_form":"minor","form":"minor","meaning_en":"small or not very serious","meaning":"작은"},{"word_id":"v1619","headword":"major","story_form":"major","form":"major","meaning_en":"large or important","meaning":"큰"},{"word_id":"v2794","headword":"trouble","story_form":"trouble","form":"trouble","meaning_en":"a problem or difficulty","meaning":"문제"},{"word_id":"v0557","headword":"complicate","story_form":"complicate","form":"complicate","meaning_en":"make something harder to deal with","meaning":"복잡하게 하다"},{"word_id":"v2405","headword":"simple","story_form":"simple","form":"simple","meaning_en":"easy to understand or do","meaning":"간단한"},{"word_id":"v0556","headword":"complex","story_form":"complex","form":"complex","meaning_en":"having many connected parts","meaning":"복잡한"},{"word_id":"v1617","headword":"main","story_form":"main","form":"main","meaning_en":"most important","meaning":"주요한"},{"word_id":"v1643","headword":"matter","story_form":"matter","form":"matter","meaning_en":"a subject or problem to deal with","meaning":"문제"},{"word_id":"v1399","headword":"indeed","story_form":"indeed","form":"indeed","meaning_en":"really or truly","meaning":"정말로"}],"english":["The **cause** of our computer **trouble** is a **minor** mistake in one name.","We fear a **major** problem and begin to **complicate** a **simple** **matter**.","Our teacher asks us to check the **main** computer before trying a **complex** repair.","She asks us to check the name, and the whole problem disappears.","It is **indeed** a much easier fix than we expected."],"korean":["컴퓨터 문제의 원인은 이름 하나에 있는 작은 실수다.","우리는 큰 문제일까 걱정하며 간단한 일을 복잡하게 만들기 시작한다.","선생님은 복잡한 수리를 시도하기 전에 주 컴퓨터를 확인하라고 하신다.","선생님이 이름을 확인하라고 하시자 문제가 모두 해결된다.","정말로 우리가 예상한 것보다 훨씬 쉬운 해결이었다."]},{"id":"C100","title":"새벽의 산책","targets":[{"word_id":"v0721","headword":"dawn","story_form":"dawn","form":"dawn","meaning_en":"the time when daylight first appears","meaning":"새벽"},{"word_id":"v2248","headword":"rise","story_form":"rise","form":"rise","meaning_en":"move up into the sky","meaning":"뜨다"},{"word_id":"v2380","headword":"shine","story_form":"shine","form":"shine","meaning_en":"give out light","meaning":"빛나다"},{"word_id":"v2131","headword":"rainbow","story_form":"rainbow","form":"rainbow","meaning_en":"colored bands seen in the sky after rain","meaning":"무지개"},{"word_id":"v1298","headword":"hear","story_form":"hear","form":"hear","meaning_en":"notice a sound with your ears","meaning":"듣다"},{"word_id":"v1593","headword":"log","story_form":"log","form":"log","meaning_en":"a thick piece of a tree trunk","meaning":"통나무"},{"word_id":"v0266","headword":"bench","story_form":"bench","form":"bench","meaning_en":"a long seat for several people","meaning":"벤치"},{"word_id":"v2273","headword":"row","story_form":"row","form":"row","meaning_en":"things arranged in a straight line","meaning":"줄"},{"word_id":"v2949","headword":"whole","story_form":"whole","form":"whole","meaning_en":"all of something","meaning":"전체의"},{"word_id":"v2960","headword":"wing","story_form":"wing","form":"wing","meaning_en":"a body part a bird uses to fly","meaning":"날개"}],"english":["At **dawn**, we watch the sun **rise** and **shine** through the trees.","After a short rain, a **rainbow** appears above a **row** of houses.","We sit on a **bench** beside an old **log** and see a bird lift one **wing**.","We **hear** water nearby, and the **whole** morning feels quiet and new."],"korean":["새벽에 우리는 해가 떠서 나무 사이로 빛나는 모습을 본다.","짧은 비가 지나간 뒤 집들이 늘어선 줄 위로 무지개가 나타난다.","우리는 오래된 통나무 옆 벤치에 앉아 새가 한쪽 날개를 드는 것을 본다.","근처에서 물소리가 들리고, 아침 전체가 조용하고 새롭게 느껴진다."]},{"id":"C101","title":"망토 속의 지도","targets":[{"word_id":"v0052","headword":"adventure","story_form":"adventure","form":"adventure","meaning_en":"an exciting and sometimes risky experience","meaning":"모험"},{"word_id":"v0400","headword":"cape","story_form":"cape","form":"cape","meaning_en":"a loose piece of clothing over the shoulders","meaning":"망토"},{"word_id":"v0461","headword":"chest","story_form":"chest","form":"chest","meaning_en":"a large strong box","meaning":"상자"},{"word_id":"v1135","headword":"fortune","story_form":"fortune","form":"fortune","meaning_en":"a large amount of money or property","meaning":"재산"},{"word_id":"v2639","headword":"tale","story_form":"tale","form":"tale","meaning_en":"a story","meaning":"이야기"},{"word_id":"v2813","headword":"twist","story_form":"twist","form":"twist","meaning_en":"an unexpected change in a story","meaning":"뜻밖의 전개"},{"word_id":"v1722","headword":"moral","story_form":"moral","form":"moral","meaning_en":"a lesson about right and wrong","meaning":"교훈"},{"word_id":"v1377","headword":"imagine","story_form":"imagine","form":"imagine","meaning_en":"form a picture in your mind","meaning":"상상하다"},{"word_id":"v2553","headword":"strange","story_form":"strange","form":"strange","meaning_en":"unusual or surprising","meaning":"이상한"},{"word_id":"v1824","headword":"odd","story_form":"odd","form":"odd","meaning_en":"different from what is usual","meaning":"특이한"}],"english":["I **imagine** an **adventure** about a girl with a map inside her **cape**.","She finds a **strange** **chest** and thinks it holds a **fortune**.","The **tale** has an **odd** **twist**: the **chest** contains only letters ":"chat","meaning_en":"talk in a friendly informal way","meaning":"잡담하다"},{"word_id":"v0124","headword":"annoy","story_form":"annoy","form":"annoy","meaning_en":"make someone feel irritated","meaning":"짜증 나게 하다"},{"word_id":"v1668","headword":"mention","story_form":"mention","form":"mention","meaning_en":"say something briefly","meaning":"언급하다"},{"word_id":"v1410","headword":"inform","story_form":"inform","form":"inform","meaning_en":"give someone information","meaning":"알리다"},{"word_id":"v2331","headword":"secretary","story_form":"secretary","form":"secretary","meaning_en":"a person who keeps a meeting's records","meaning":"서기"},{"word_id":"v2191","headword":"remind","story_form":"remind","form":"remind","meaning_en":"help someone remember","meaning":"상기시키다"},{"word_id":"v2044","headword":"previous","story_form":"previous","form":"previous","meaning_en":"happening before the present one","meaning":"이전의"},{"word_id":"v2674","headword":"term","story_form":"term","form":"term","meaning_en":"one part of a school year","meaning":"학기"},{"word_id":"v0594","headword":"constant","story_form":"constant","form":"constant","meaning_en":"happening again and again","meaning":"끊임없는"},{"word_id":"v1516","headword":"lack","story_form":"lack","form":"lack","meaning_en":"not having enough of something","meaning":"부족"}],"english":["I **chat** with friends and forget a club meeting, so the **secretary** comes to **remind** me.","She says she did **inform** us and **mention** the time in her message.","My **constant** lateness may **annoy** the others, especially after the same problem in the **previous** **term**.","I admit my **lack** of planning and put the next meeting in my calendar."],"korean":["나는 친구들과 잡담하다가 동아리 회의를 잊어버려서 서기가 상기시켜 주러 온다.","그녀는 우리에게 분명 알렸고 메시지에서 시간을 언급했다고 말한다.","이전 학기에도 같은 문제가 있었으므로 내가 계속 늦으면 다른 사람들이 짜증 날 수 있다.","나는 계획이 부족했음을 인정하고 다음 회의를 달력에 적는다."]},{"id":"C110","title":"게임을 멈출 시간","targets":[{"word_id":"v0271","headword":"bet","story_form":"bet","form":"bet","meaning_en":"feel sure that something is true","meaning":"확신하다"},{"word_id":"v0255","headword":"beg","story_form":"beg","form":"beg","meaning_en":"ask very strongly for something","meaning":"간청하다"},{"word_id":"v1048","headword":"favor","story_form":"favor","form":"favor","meaning_en":"a helpful thing done for someone","meaning":"부탁"},{"word_id":"v1561","headword":"let","story_form":"let","form":"let","meaning_en":"allow someone to do something","meaning":"허락하다"},{"word_id":"v2211","headword":"resist","story_form":"resist","form":"resist","meaning_en":"stop yourself from doing something","meaning":"참다"},{"word_id":"v1445","headword":"intent","story_form":"intent","form":"intent","meaning_en":"what someone plans to do","meaning":"의도"},{"word_id":"v2341","headword":"self","story_form":"self","form":"self","meaning_en":"the person you are","meaning":"자기 자신"},{"word_id":"v1599","headword":"lose","story_form":"lose","form":"lose","meaning_en":"no longer have something","meaning":"잃다"},{"word_id":"v2981","headword":"worth","story_form":"worth","form":"worth","meaning_en":"valuable enough to do or have","meaning":"~할 가치가 있는"},{"word_id":"v1433","headword":"instead","story_form":"instead","form":"instead","meaning_en":"in place of something else","meaning":"대신에"}],"english":["“I **bet** I can win the next game,” I say, but I might **lose** more time.","I **beg** Dad to **let** me play again and ask for one small **favor**.","His **intent** is not to be mean; he wants me to **resist** the wish to keep playing.","I think of my future **self** and decide to stop for today.","A short walk is **worth** trying **instead**."],"korean":["나는 “다음 게임에서는 분명 이길 수 있어.”라고 말하지만 시간을 더 잃을 수도 있다.","나는 아빠께 한 번 더 하게 해 달라고 간청하며 작은 부탁을 드린다.","아빠의 의도는 심술을 부리는 것이 아니라 내가 계속 하고 싶은 충동을 참도록 하는 것이다.","나는 미래의 나를 생각하며 오늘은 그만하기로 한다.","대신 짧게 산책해 볼 만하다."]},{"id":"C111","title":"휴가용 집 살펴보기","targets":[{"word_id":"v2876","headword":"villa","story_form":"villa","form":"villa","meaning_en":"a house used for holidays","meaning":"휴가용 집"},{"word_id":"v0427","headword":"ceiling","story_form":"ceiling","form":"ceiling","meaning_en":"the inside top surface of a room","meaning":"천장"},{"word_id":"v1521","headword":"lamp","story_form":"lamp","form":"lamp","meaning_en":"a device that gives light","meaning":"등"},{"word_id":"v2739","headword":"toilet","story_form":"toilet","form":"toilet","meaning_en":"a room with a toilet in it","meaning":"화장실"},{"word_id":"v2797","headword":"trunk","story_form":"trunk","form":"trunk","meaning_en":"a large box for carrying belongings","meaning":"큰 짐 상자"},{"word_id":"v2416","headword":"situate","story_form":"situate","form":"situate","meaning_en":"put something in a particular place","meaning":"위치시키다, 배치하다"},{"word_id":"v2332","headword":"section","story_form":"section","form":"section","meaning_en":"one part of a larger area","meaning":"구역"},{"word_id":"v2349","headword":"separate","story_form":"separate","form":"separate","meaning_en":"not joined to another part","meaning":"분리된"},{"word_id":"v0133","headword":"apart","story_form":"apart","form":"apart","meaning_en":"away from each other","meaning":"떨어져"},{"word_id":"v2411","headword":"single","story_form":"single","form":"single","meaning_en":"only one","meaning":"단 하나의"}],"english":["We plan to **situate** our model **villa** beside a paper lake.","Inside, a **lamp** hangs from the **ceiling**, and the **toilet** is in a **separate** **section**.","Two beds stand far **apart**, with an old **trunk** between them.","We draw every room carefully, making sure each has a **single** door."],"korean":["우리는 모형 휴가용 집을 종이 호수 옆에 배치할 계획이다.","안에는 등이 천장에 매달려 있고, 화장실은 분리된 구역에 있다.","침대 두 개는 서로 멀리 떨어져 있으며 사이에 오래된 짐 상자가 있다.","우리는 방마다 문이 하나씩 있는지 확인하며 세심하게 그린다."]},{"id":"C112","title":"무늬의 비밀","targets":[{"word_id":"v2112","headword":"puzzle","story_form":"puzzle","form":"puzzle","meaning_en":"a game or problem that tests your thinking","meaning":"퍼즐"},{"word_id":"v2436","headword":"smart","story_form":"smart","form":"smart","meaning_en":"clever and quick to learn","meaning":"똑똑한"},{"word_id":"v2692","headword":"theory","story_form":"theory","form":"theory","meaning_en":"an idea that may explain something","meaning":"가설"},{"word_id":"v0759","headword":"demonstrate","story_form":"demonstrate","form":"demonstrate","meaning_en":"show how something works","meaning":"보여 주다"},{"word_id":"v0907","headword":"element","story_form":"element","form":"element","meaning_en":"one part of a whole","meaning":"요소"},{"word_id":"v1578","headword":"link","story_form":"link","form":"link","meaning_en":"connect things together","meaning":"연결하다"},{"word_id":"v1431","headword":"instance","story_form":"instance","form":"instance","meaning_en":"an example of something","meaning":"사례"},{"word_id":"v0447","headword":"characteristic","story_form":"characteristic","form":"characteristic","meaning_en":"a feature that helps identify something","meaning":"특징"},{"word_id":"v2404","headword":"similar","story_form":"similar","form":"similar","meaning_en":"almost the same","meaning":"비슷한"},{"word_id":"v2351","headword":"series","story_form":"series","form":"series","meaning_en":"a group of related things in order","meaning":"연속된 묶음"}],"english":["My friend has a **theory** about a **puzzle** with colored shapes.","She finds a **similar** **characteristic** in each **element** and tries to **link** the matching pieces.","To **demonstrate**, she shows one **instance** where two red edges fit together.","“That is **smart**,” I say, and we finish the last row together.","This is the first in a **series** of puzzles we want to try."],"korean":["친구는 색깔 도형 퍼즐에 관한 가설을 가지고 있다.","친구는 각 요소에서 비슷한 특징을 찾아 맞는 조각들을 연결하려고 한다.","그것을 보여 주려고 빨간 가장자리 두 개가 서로 맞는 사례 하나를 보여 준다.","나는 “똑똑한 생각이네.”라고 말하고, 우리는 마지막 줄을 함께 완성한다.","이것은 우리가 해 보고 싶은 일련의 퍼즐 중 첫 번째다."]},{"id":"C113","title":"마을 퍼레이드","targets":[{"word_id":"v1893","headword":"parade","story_form":"parade","form":"parade","meaning_en":"a public march with music or decorated vehicles","meaning":"퍼레이드"},{"word_id":"v2451","headword":"social","story_form":"social","form":"social","meaning_en":"related to meeting and enjoying other people","meaning":"사교의"},{"word_id":"v1465","headword":"involve","story_form":"involve","form":"involve","meaning_en":"make someone part of an activity","meaning":"참여시키다"},{"word_id":"v0931","headword":"engage","story_form":"engage","form":"engage","meaning_en":"take part in something","meaning":"참여하다"},{"word_id":"v0110","headword":"among","story_form":"among","form":"among","meaning_en":"in the middle of a group","meaning":"~사이에"},{"word_id":"v2855","headword":"various","story_form":"various","form":"various","meaning_en":"of different kinds","meaning":"다양한"},{"word_id":"v2359","headword":"several","story_form":"several","form":"several","meaning_en":"more than two but not many","meaning":"여러"},{"word_id":"v0883","headword":"each","story_form":"each","form":"each","meaning_en":"every one considered separately","meaning":"각각의"},{"word_id":"v2505","headword":"spread","story_form":"spread","form":"spread","meaning_en":"make something reach more people or places","meaning":"퍼뜨리다"},{"word_id":"v0104","headword":"altogether","story_form":"altogether","form":"altogether","meaning_en":"with everything counted together","meaning":"모두 합쳐"}],"english":["Our town plans a **parade** to help people **engage** in a **social** activity.","We **involve** **several** clubs, and **each** brings **various** flags and songs.","I walk **among** the singers as we **spread** smiles along the street.","There are fifty of us **altogether**, and no one has to walk alone."],"korean":["우리 마을은 사람들이 사교 활동에 참여하도록 퍼레이드를 계획한다.","우리는 여러 동아리를 참여시키고, 각 동아리는 다양한 깃발과 노래를 준비한다.","나는 노래하는 사람들 사이에서 걸으며 거리에 미소를 퍼뜨린다.","우리는 모두 합쳐 50명이고, 누구도 혼자 걸을 필요가 없다."]},{"id":"C114","title":"완벽하지 않아도 괜찮아","targets":[{"word_id":"v2568","headword":"struggle","story_form":"struggle","form":"struggle","meaning_en":"try hard to do something difficult","meaning":"애쓰다"},{"word_id":"v0011","headword":"absolute","story_form":"absolute","form":"absolute","meaning_en":"complete and without limits","meaning":"절대적인"},{"word_id":"v0745","headword":"definite","story_form":"definite","form":"definite","meaning_en":"clear and certain","meaning":"확실한"},{"word_id":"v1934","headword":"perfect","story_form":"perfect","form":"perfect","meaning_en":"as good as it can possibly be","meaning":"완벽한"},{"word_id":"v2061","headword":"probable","story_form":"probable","form":"probable","meaning_en":"likely to happen","meaning":"가능성이 큰"},{"word_id":"v1647","headword":"maybe","story_form":"maybe","form":"maybe","meaning_en":"perhaps","meaning":"어쩌면"},{"word_id":"v2606","headword":"suppose","story_form":"suppose","form":"suppose","meaning_en":"think that something is true","meaning":"생각하다"},{"word_id":"v2941","headword":"whether","story_form":"whether","form":"whether","meaning_en":"if something is true or not","meaning":"~인지"},{"word_id":"v2942","headword":"which","story_form":"which","form":"which","meaning_en":"what one out of a group","meaning":"어느"},{"word_id":"v0901","headword":"either","story_form":"either","form":"either","meaning_en":"one or the other of two","meaning":"어느 쪽이든"}],"english":["I **struggle** to decide **which** picture to enter and **whether** **either** is good enough.","I **suppose** the winner must be **perfect**, but my teacher says there is no **absolute** rule.","“Is this one a **probable** winner?” I ask.","“I cannot give you a **definite** answer,” she says. “**Maybe** you should choose the one you love.”"],"korean":["나는 어느 그림을 출품할지, 둘 중 어느 하나라도 충분히 좋은지 고민한다.","나는 우승작이 완벽해야 한다고 생각하지만, 선생님은 절대적인 규칙은 없다고 하신다.","나는 “이 그림이 유력한 우승작인가요?”라고 묻는다.","선생님은 “확실한 답을 줄 수는 없구나. 네가 좋아하는 그림을 고르면 좋을지도 모르겠다.”라고 말씀하신다."]},{"id":"C115","title":"달라진 아침 습관","targets":[{"word_id":"v1805","headword":"nowadays","story_form":"nowadays","form":"nowadays","meaning_en":"at the present time","meaning":"요즘"},{"word_id":"v2669","headword":"tend","story_form":"tend","form":"te ,"form":"operate","meaning_en":"run a transport service","meaning":"운항하다"},{"word_id":"v1932","headword":"per","story_form":"per","form":"per","meaning_en":"for each","meaning":"~당"},{"word_id":"v1984","headword":"plus","story_form":"plus","form":"plus","meaning_en":"with something added","meaning":"더하여"},{"word_id":"v1063","headword":"few","story_form":"few","form":"few","meaning_en":"a small number of","meaning":"몇몇의"},{"word_id":"v1601","headword":"lot","story_form":"lot","form":"lot","meaning_en":"a large amount of","meaning":"많은 양"},{"word_id":"v2982","headword":"would","story_form":"would","form":"would","meaning_en":"used to describe an expected or imagined situation","meaning":"~일 것이다"},{"word_id":"v2856","headword":"vary","story_form":"vary","form":"vary","meaning_en":"be different in different situations","meaning":"달라지다"}],"english":["Only one small **plane** can **operate** between these islands, and only a **few** seats are left for the **tour**.","It costs fifty dollars **per** person, **plus** ten for lunch.","That is a **lot** for us, but the price includes a boat ride as well.","After checking our money, we decide to **proceed** with the booking.","Prices **vary** by day, so a weekday **would** be cheaper."],"korean":["이 섬들 사이에서는 작은 비행기 한 대만 운항할 수 있고, 여행 상품에 남은 좌석은 몇 개뿐이다.","1인당 50달러에 점심값 10달러가 더 든다.","우리에게는 큰돈이지만 보트 타기도 가격에 포함되어 있다.","돈을 확인한 뒤 우리는 예약을 진행하기로 한다.","가격은 요일에 따라 달라져서 평일이 더 저렴할 것이다."]},{"id":"C118","title":"자유를 향한 발걸음","targets":[{"word_id":"v0162","headword":"aside","story_form":"aside","form":"aside","meaning_en":"to one side","meaning":"옆으로"},{"word_id":"v1136","headword":"forward","story_form":"forward","form":"forward","meaning_en":"toward the front","meaning":"앞으로"},{"word_id":"v1133","headword":"forth","story_form":"forth","form":"forth","meaning_en":"out or away","meaning":"밖으로"},{"word_id":"v2837","headword":"upon","story_form":"upon","form":"upon","meaning_en":"immediately after something happens","meaning":"~하자마자"},{"word_id":"v2337","headword":"seek","story_form":"seek","form":"seek","meaning_en":"try to find something","meaning":"찾다"},{"word_id":"v2426","headword":"slave","story_form":"slave","form":"slave","meaning_en":"a person forced to work and treated as property","meaning":"노예"},{"word_id":"v0103","headword":"although","story_form":"although","form":"although","meaning_en":"even though","meaning":"비록 ~이지만"},{"word_id":"v0780","headword":"despite","story_form":"despite","form":"despite","meaning_en":"without being stopped by something","meaning":"~에도 불구하고"},{"word_id":"v0963","headword":"even","story_form":"even","form":"even","meaning_en":"used to emphasize something surprising","meaning":"심지어"},{"word_id":"v1791","headword":"none","story_form":"none","form":"none","meaning_en":"not one person or thing","meaning":"아무도 ~않다"}],"english":["In an old tale, a young man held as a **slave** decides to **seek** freedom.","**Although** he is afraid, he moves **forward** **despite** the danger.","**Upon** hearing a guard, he steps **aside** behind a tree and does not **even** breathe loudly.","When the road is clear, he sets **forth** toward a town where people will help him.","**None** of his new friends will send him back."],"korean":["옛이야기에서 노예로 붙잡혀 있던 젊은 남자가 자유를 찾아 나서기로 한다.","그는 두렵지만 위험에도 불구하고 앞으로 나아간다.","경비의 소리를 듣자마자 나무 뒤로 비켜서서 숨소리조차 크게 내지 않는다.","길이 조용해지자 그는 자신을 도와줄 사람들이 있는 마을을 향해 길을 나선다.","새 친구들 중 누구도 그를 돌려보내지 않을 것이다."]},{"id":"C119","title":"바다 모양 파티","targets":[{"word_id":"v0982","headword":"excite","story_form":"excite","form":"excite","meaning_en":"make someone feel eager and happy","meaning":"신나게 하다"},{"word_id":"v0953","headword":"especial","story_form":"especially","form":"especially","meaning_en":"particularly or more than usual, in especially","meaning":"특별한 → especially: 특히"},{"word_id":"v0979","headword":"except","story_form":"except","form":"except","meaning_en":"not including","meaning":"~을 제외하고"},{"word_id":"v0913","headword":"else","story_form":"else","form":"else","meaning_en":"in addition or different","meaning":"그 밖의"},{"word_id":"v2598","headword":"super","story_form":"super","form":"super","meaning_en":"very good","meaning":"멋진"},{"word_id":"v2101","headword":"punch","story_form":"punch","form":"punch","meaning_en":"a drink made by mixing fruit juices","meaning":"과일 음료"},{"word_id":"v0287","headword":"bit","story_form":"bit","form":"bit","meaning_en":"a small amount","meaning":"조금"},{"word_id":"v2377","headword":"shell","story_form":"shell","form":"shell","meaning_en":"the hard outer covering of something","meaning":"껍데기"},{"word_id":"v1432","headword":"instant","story_form":"instant","form":"instant","meaning_en":"ready very quickly","meaning":"즉석의"},{"word_id":"v2584","headword":"such","story_form":"such","form":"such","meaning_en":"of that kind or degree","meaning":"그렇게 ~한"}],"english":["A sea party will **excite** my brother, **especially** if there is a cake with a chocolate **shell**.","We use an **instant** drink mix to make fruit **punch** and add a **bit** of fresh juice.","Everything is ready **except** the music, so I ask, “What **else** do we need?”","“Nothing! This is **super**!” he says. “I have never seen **such** a blue table!”"],"korean":["바다를 주제로 한 파티는 남동생을 신나게 할 것이고, 특히 초콜릿 껍데기가 있는 케이크가 있다면 더욱 그럴 것이다.","우리는 즉석 음료 가루로 과일 음료를 만들고 신선한 주스를 조금 더한다.","음악을 제외한 모든 것이 준비되어서 나는 “그 밖에 뭐가 필요하지?”라고 묻는다.","동생은 “아무것도 없어! 정말 멋져! 이렇게 파란 식탁은 처음 봐!”라고 말한다."]},{"id":"C120","title":"꾸준히 공부한 뒤의 작은 변화","targets":[{"word_id":"v1145","headword":"frankly","story_form":"frankly","form":"frankly","meaning_en":"in an honest and direct way","meaning":"솔직히"},{"word_id":"v1723","headword":"moreover","story_form":"moreover","form":"moreover","meaning_en":"also, adding another point","meaning":"게다가"},{"word_id":"v2695","headword":"therefore","story_form":"therefore","form":"therefore","meaning_en":"for that reason","meaning":"그러므로"},{"word_id":"v2708","headword":"though","story_form":"though","form":"though","meaning_en":"although","meaning":"~이지만"},{"word_id":"v2718","headword":"thus","story_form":"thus","form":"thus","meaning_en":"in this way","meaning":"이렇게 하여"},{"word_id":"v2943","headword":"while","story_form":"while","form":"while","meaning_en":"during the time that","meaning":"~하는 동안"},{"word_id":"v2691","headword":"then","story_form":"then","form":"then","meaning_en":"after that","meaning":"그다음에"},{"word_id":"v0966","headword":"ever","story_form":"ever","form":"ever","meaning_en":"at any time up to now","meaning":"지금까지 어느 때라도"},{"word_id":"v1806","headword":"nowhere","story_form":"nowhere","form":"nowhere","meaning_en":"making no progress, in get nowhere","meaning":"아무 데도 아닌 곳; 여기서는 진전이 없는 상태"},{"word_id":"v2402","headword":"silly","story_form":"silly","form":"silly","meaning_en":"showing little thought or good sense","meaning":"바보 같은"}],"english":["**Frankly**, I did not think I could finish this reading plan.","**Though** some days were hard, I read **while** my sister did her homework, and **then** we talked about our stories.","**Moreover**, we tested each other, and **therefore** I began to remember more words.","I no longer felt **silly** or thought I was going **nowhere** with English.","I enjoyed studying more than **ever**.","**Thus**, a small daily habit became something we could enjoy together."],"korean":["솔직히 나는 이 읽기 계획을 끝낼 수 있을 것이라고 생각하지 않았다.","힘든 날도 있었지만, 나는 여동생이 숙제하는 동안 책을 읽고 그다음 함께 이야기 내용을 나누었다.","게다가 우리는 서로 문제를 냈고, 그러므로 나는 더 많은 단어를 기억하기 시작했다.","나는 더 이상 내가 바보 같다고 느끼거나 영어 공부가 전혀 나아가지 않는다고 생각하지 않았다.","나는 그 어느 때보다 공부를 즐겼다.","이렇게 작은 매일의 습관이 함께 즐길 수 있는 일이 되었다."]}],"other":[{"id":"O001","title":"혼자 하려던 조별 과제","targets":[{"word_id":"v2185","headword":"reluctant","story_form":"reluctant","form":"reluctant","meaning_en":"not willing to do something","meaning":"내키지 않는"},{"word_id":"v0367","headword":"burden","story_form":"burden","form":"burden","meaning_en":"something difficult to deal with","meaning":"부담"},{"word_id":"v0002","headword":"abandon","story_form":"abandon","form":"abandon
