async function loadDocument(name,push=true){
 
 if(!allowed.has(name))name='elementary-stories-80.md';
 $('document-select').querySelector('[data-local]')?.remove();$('document-select').value=name;
 const id=++requestNumber;$('status').textContent='문서를 불러오는 중입니다…';$('article').replaceChildren();$('print').disabled=true;$('toc').disabled=true;$('download').hidden=true;
 if(push){const url=new URL(location.href);url.search='?doc='+encodeURIComponent(name);url.hash='';history.pushState(null,'',url)}
 try{const response=await fetch('./'+(standaloneBooks[name]||'sources/'+name),{cache:'no-cache'});if(!response.ok)throw new Error('HTTP '+response.status);const text=await response.text();if(id!==requestNumber)return;if(standaloneBooks[name])showHTML(text,name);else showDocument(text,name)}catch(error){if(id!==requestNumber)return;$('status').textContent=location.protocol==='file:'?'로컬 파일 접근이 제한되었습니다. 상단의 “MD 열기”로 sources 폴더의 파일을 선택하세요.':'문서를 불러오지 못했습니다. sources 폴더가 HTML과 함께 업로드되었는지 확인해 주세요.'}
}

(()=>{
let sections=[];const dialog=document.getElementById('print-dialog'),select=document.getElementById('print-set'),toggle=document.getElementById('print-images'),output=document.getElementById('print-output'),preview=document.getElementById('print-preview'),confirm=document.getElementById('print-confirm');
let includeImages=false,prepared=false,generation=0;
document.addEventListener('library-ready',()=>{sections=[...document.querySelectorAll('#article > section[data-print-set]')];select.replaceChildren();sections.forEach((s,i)=>select.add(new Option(s.querySelector('h2').textContent,String(i))));document.getElementById('print').disabled=!sections.length;prepared=false});
function currentSet(){let index=0;const boundary=24;for(let i=0;i<sections.length;i++){if(sections[i].getBoundingClientRect().top<=boundary)index=i;else break}return index}
function content(){const box=document.createElement('div');for(const n of sections[Number(select.value)||0].children)box.append(n.cloneNode(true));box.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));if(!includeImages)box.querySelectorAll('img').forEach(n=>n.remove());box.querySelectorAll('p').forEach(n=>{if(!n.textContent.trim()&&!n.querySelector('img'))n.remove()});box.querySelectorAll('img').forEach(n=>n.loading='eager');return box}
function paginate(box){output.replaceChildren();let page,body;
function next(){page=document.createElement('div');page.className='print-page';body=document.createElement('div');body.className='print-page-body';page.append(body);output.append(page)}
function over(){return body.scrollHeight>body.clientHeight+1}
function add(node){body.append(node);if(!over())return;if(body.children.length>1&&!node.matches('.table-scroll')){node.remove();next();body.append(node)}if(!over())return;
 if(node.matches('.table-scroll')){const table=node.querySelector('table'),rows=[...table.querySelectorAll('tbody tr')];node.remove();let shell;
 const newTable=()=>{shell=node.cloneNode(true);shell.querySelector('tbody').replaceChildren();body.append(shell)};newTable();for(const row of rows){shell.querySelector('tbody').append(row);if(over()&&shell.querySelector('tbody').children.length>1){row.remove();next();newTable();shell.querySelector('tbody').append(row)}}
 }else if(node.matches('p')&&!node.querySelector('img')&&node.children.length===0){const words=node.textContent.split(/\s+/);node.remove();while(words.length){const p=node.cloneNode(false);body.append(p);let lo=1,hi=words.length,best=1;while(lo<=hi){const mid=(lo+hi)>>1;p.textContent=words.slice(0,mid).join(' ');if(over())hi=mid-1;else{best=mid;lo=mid+1}}p.textContent=words.splice(0,best).join(' ');if(words.length)next()}}
}
next();for(const node of [...box.children]){if(node.matches('span')&&!node.textContent)continue;add(node)}
[...output.children].forEach((p,i)=>{const num=document.createElement('div');num.className='print-page-number';num.textContent=(i+1)+' / '+output.children.length;p.append(num)});prepared=true;
}
function fit(){const scale=Math.min(1,(preview.clientWidth-32)/794);output.style.zoom=Math.max(.2,scale)}
async function refresh(){const token=++generation;confirm.disabled=true;const box=content();await Promise.all([...box.querySelectorAll('img')].map(im=>im.decode().catch(()=>{})));if(token!==generation)return;output.style.zoom=1;paginate(box);fit();preview.scrollTop=0;document.getElementById('print-count').textContent=output.children.length+'장';confirm.disabled=false}
document.getElementById('print').onclick=()=>{if(!sections.length)return;select.value=String(currentSet());toggle.closest('.print-image-row').hidden=!document.querySelector('#article img');includeImages=false;toggle.setAttribute('aria-checked','false');toggle.textContent='OFF';dialog.showModal();refresh()};
select.onchange=refresh;toggle.onclick=()=>{includeImages=!includeImages;toggle.setAttribute('aria-checked',String(includeImages));toggle.textContent=includeImages?'ON':'OFF';refresh()};
document.getElementById('print-close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>{generation++;prepared=false});
confirm.onclick=()=>window.print();window.addEventListener('resize',()=>{if(dialog.open)fit()});
window.addEventListener('beforeprint',()=>{if(!sections.length)return;const index=currentSet();document.body.append(output);if(!prepared){select.value=String(index);includeImages=false;output.style.zoom=1;paginate(content())}});
window.addEventListener('afterprint',()=>{preview.append(output);if(dialog.open)fit();else{prepared=false;output.replaceChildren()}});
})();


</script></body></html>
