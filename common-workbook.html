merce","form":"commerce","meaning_en":"the buying and selling of goods","meaning":"상업"},{"word_id":"v1082","headword":"firm","story_form":"firm","form":"firm","meaning_en":"a business or company","meaning":"회사"},{"word_id":"v0401","headword":"capital","story_form":"capital","form":"capital","meaning_en":"money used to start or run a business","meaning":"자본"},{"word_id":"v1462","headword":"invest","story_form":"invest","form":"invest","meaning_en":"put money into something to gain more","meaning":"투자하다"},{"word_id":"v2069","headword":"profit","story_form":"profit","form":"profit","meaning_en":"money left after paying business costs","meaning":"이익"},{"word_id":"v0994","headword":"expense","story_form":"expense","form":"expense","meaning_en":"money you need to spend","meaning":"비용"},{"word_id":"v1075","headword":"finance","story_form":"finance","form":"finance","meaning_en":"provide money for something","meaning":"자금을 대다"},{"word_id":"v0061","headword":"afford","story_form":"afford","form":"afford","meaning_en":"have enough money to pay for something","meaning":"여유가 있다"},{"word_id":"v2249","headword":"risk","story_form":"risk","form":"risk","meaning_en":"the chance that something bad may happen","meaning":"위험"},{"word_id":"v0724","headword":"deal","story_form":"deal","form":"deal","meaning_en":"an agreement in business","meaning":"거래"}],"english":["Two friends want to start a small **firm** and learn about **commerce**.","They save **capital** and **invest** their own money to **finance** the shop.","Before making a **deal** for new shelves, they check every **expense**.","They cannot **afford** a big **risk**, so they begin with only a few things to sell.","After a month, they make a small **profit**."],"korean":["두 친구는 작은 회사를 세우고 상업에 관해 배우고 싶어 한다.","그들은 자본을 모으고 자신의 돈을 투자해 가게에 자금을 댄다.","새 선반을 사는 거래를 하기 전에 모든 비용을 확인한다.","그들은 큰 위험을 감당할 여유가 없어서 팔 물건을 조금만 준비해 시작한다.","한 달 뒤, 그들은 작은 이익을 낸다."]},{"id":"C043","title":"은행에서의 약속","title_en":"A Promise at the Bank","targets":[{"word_id":"v0026","headword":"account","story_form":"account","form":"account","meaning_en":"a place where a bank keeps your money","meaning":"계좌"},{"word_id":"v1589","headword":"loan","story_form":"loan","form":"loan","meaning_en":"money borrowed and paid back later","meaning":"대출"},{"word_id":"v0727","headword":"debt","story_form":"debt","form":"debt","meaning_en":"money that you owe","meaning":"빚"},{"word_id":"v1446","headword":"interest","story_form":"interest","form":"interest","meaning_en":"extra money paid for borrowing money","meaning":"이자"},{"word_id":"v0670","headword":"credit","story_form":"credit","form":"credit","meaning_en":"trust that you will pay money back","meaning":"신용"},{"word_id":"v0841","headword":"document","story_form":"document","form":"document","meaning_en":"a paper containing official information","meaning":"문서"},{"word_id":"v1559","headword":"lend","story_form":"lend","form":"lend","meaning_en":"let someone use something and return it later","meaning":"빌려주다"},{"word_id":"v0609","headword":"contract","story_form":"contract","form":"contract","meaning_en":"a formal agreement","meaning":"계약"},{"word_id":"v0875","headword":"due","story_form":"due","form":"due","meaning_en":"needing to be paid at a certain time","meaning":"기한이 된"},{"word_id":"v2400","headword":"sign","story_form":"sign","form":"sign","meaning_en":"write your name to show agreement","meaning":"서명하다"}],"english":["Mom opens an **account** and asks the bank for a small **loan**.","The bank checks her **credit** before agreeing to **lend** her money.","She reads the **contract** to see the **interest** rate and when the money is **due**.","Before she can **sign**, she makes a plan to pay back the **debt**.","She asks for a **document** with all the details."],"korean":["엄마는 계좌를 만들고 은행에 소액 대출을 신청하신다.","은행은 돈을 빌려주기로 하기 전에 엄마의 신용을 확인한다.","엄마는 이자율과 상환 기한을 알아보려고 계약서를 읽으신다.","서명하기 전에 엄마는 빚을 갚을 계획을 세우신다.","엄마는 모든 세부 사항이 담긴 문서를 요청하신다."]},{"id":"C044","title":"공장 견학","title_en":"A Visit to a Factory","targets":[{"word_id":"v1022","headword":"factory","story_form":"factory","form":"factory","meaning_en":"a building where goods are made","meaning":"공장"},{"word_id":"v1627","headword":"manufacture","story_form":"manufacture","form":"manufacture","meaning_en":"make goods in large numbers","meaning":"제조하다"},{"word_id":"v2065","headword":"produce","story_form":"produce","form":"produce","meaning_en":"make or create something","meaning":"생산하다"},{"word_id":"v1610","headword":"machine","story_form":"machine","form":"machine","meaning_en":"a device with parts that do work","meaning":"기계"},{"word_id":"v0932","headword":"engine","story_form":"engine","form":"engine","meaning_en":"a machine that makes a vehicle move","meaning":"엔진"},{"word_id":"v1729","headword":"motor","story_form":"motor","form":"motor","meaning_en":"a machine that changes energy into movement","meaning":"모터"},{"word_id":"v1404","headword":"industry","story_form":"industry","form":"industry","meaning_en":"businesses that make a particular kind of goods","meaning":"산업"},{"word_id":"v2113","headword":"quality","story_form":"quality","form":"quality","meaning_en":"how good something is","meaning":"품질"},{"word_id":"v1428","headword":"inspect","story_form":"inspect","form":"inspect","meaning_en":"look at something carefully to check it","meaning":"검사하다"},{"word_id":"v2518","headword":"standard","story_form":"standard","form":"standard","meaning_en":"a level used to judge something","meaning":"기준"}],"english":["We visit a **factory** where workers **manufacture** small cars.","A large **machine** helps them **produce** parts for an **engine** and a **motor**.","Before a car leaves, workers **inspect** it to make sure its **quality** meets the **standard**.","Our guide explains how this **industry** gives jobs to many people."],"korean":["우리는 직원들이 작은 자동차를 제조하는 공장을 방문한다.","큰 기계가 엔진과 모터의 부품 생산을 돕는다.","자동차가 출고되기 전에 직원들은 품질이 기준에 맞는지 검사한다.","안내원은 이 산업이 어떻게 많은 사람에게 일자리를 제공하는지 설명한다."]},{"id":"C045","title":"마을 회의","title_en":"A Town Meeting","targets":[{"word_id":"v0646","headword":"council","story_form":"council","form":"council","meaning_en":"a group elected to make local decisions","meaning":"의회"},{"word_id":"v0539","headword":"committee","story_form":"committee","form":"committee","meaning_en":"a group chosen to do a particular job","meaning":"위원회"},{"word_id":"v0438","headword":"chairman","story_form":"chairman","form":"chairman","meaning_en":"the person leading a committee","meaning":"위원장"},{"word_id":"v0483","headword":"citizen","story_form":"citizen","form":"citizen","meaning_en":"a person who belongs to a country","meaning":"시민"},{"word_id":"v2097","headword":"public","story_form":"public","form":"public","meaning_en":"provided for everyone to use","meaning":"공공의"},{"word_id":"v2084","headword":"propose","story_form":"propose","form":"propose","meaning_en":"suggest a plan or idea","meaning":"제안하다"},{"word_id":"v0726","headword":"debate","story_form":"debate","form":"debate","meaning_en":"discuss different sides of a question","meaning":"토론하다"},{"word_id":"v2894","headword":"vote","story_form":"vote","form":"vote","meaning_en":"choose by marking or saying your choice","meaning":"투표하다"},{"word_id":"v1992","headword":"policy","story_form":"policy","form":"policy","meaning_en":"a plan or rule for making decisions","meaning":"정책"},{"word_id":"v0544","headword":"community","story_form":"community","form":"community","meaning_en":"people living in the same area","meaning":"지역 사회"}],"english":["A **citizen** asks for a new **public** park in our **community**.","The **council** forms a **committee**, and its **chairman** opens a meeting.","We **propose** a plan and **debate** how to pay for it.","At the end, we **vote** to support a **policy** that keeps part of the land green."],"korean":["한 시민이 우리 지역 사회에 새 공원을 만들어 달라고 요청한다.","의회는 위원회를 구성하고, 위원장이 회의를 연다.","우리는 계획을 제안하고 비용을 어떻게 마련할지 토론한다.","마지막에 우리는 그 땅의 일부를 녹지로 유지하는 정책을 지지하는 데 표를 던진다."]},{"id":"C046","title":"학교 회장 선거","title_en":"The School Election","targets":[{"word_id":"v0903","headword":"elect","story_form":"elect","form":"elect","meaning_en":"choose someone by voting","meaning":"선출하다"},{"word_id":"v0464","headword":"chief","story_form":"chief","form":"chief","meaning_en":"the person leading a group","meaning":"대표"},{"word_id":"v2200","headword":"represent","story_form":"represent","form":"represent","meaning_en":"speak or act for others","meaning":"대표하다"},{"word_id":"v0486","headword":"claim","story_form":"claim","form":"claim","meaning_en":"say that something is true","meaning":"주장하다"},{"word_id":"v0137","headword":"appeal","story_form":"appeal","form":"appeal","meaning_en":"ask strongly for help or agreement","meaning":"호소하다"},{"word_id":"v2605","headword":"support","story_form":"support","form":"support","meaning_en":"help or agreement given to someone","meaning":"지지"},{"word_id":"v1844","headword":"oppose","story_form":"oppose","form":"oppose","meaning_en":"disagree with or act against something","meaning":"반대하다"},{"word_id":"v1027","headword":"fair","story_form":"fair","form":"fair","meaning_en":"treating people equally and honestly","meaning":"공정한"},{"word_id":"v1336","headword":"honor","story_form":"honor","form":"honor","meaning_en":"the respect people give you","meaning":"명예"},{"word_id":"v1540","headword":"lead","story_form":"lead","form":"lead","meaning_en":"guide a person or group","meaning":"이끌다"}],"english":["Our club will **elect** a new **chief** to **represent** us.","Two students **claim** that they can **lead** the club well and **appeal** for our **support**.","We listen to both and ask **fair** questions instead of trying to **oppose** every idea.","The winner says it is an **honor** to work for everyone."],"korean":["우리 동아리는 우리를 대표할 새 대표를 선출할 것이다.","두 학생은 동아리를 잘 이끌 수 있다고 주장하며 우리의 지지를 호소한다.","우리는 모든 생각에 반대하려 들기보다 두 사람의 말을 듣고 공정한 질문을 한다.","당선자는 모두를 위해 일하게 되어 영광이라고 말한다."]},{"id":"C047","title":"사라진 자전거","title_en":"The Missing Bike","targets":[{"word_id":"v0673","headword":"crime","story_form":"crime","form":"crime","meaning_en":"an action that breaks the law","meaning":"범죄"},{"word_id":"v2698","headword":"thief","story_form":"thief","form":"thief","meaning_en":"a person who takes things without permission","meaning":"도둑"},{"word_id":"v2531","headword":"steal","story_form":"steal","form":"steal","meaning_en":"take something that belongs to someone else","meaning":"훔치다"},{"word_id":"v1830","headword":"officer","story_form":"officer","form":"officer","meaning_en":"a member of the police","meaning":"경찰관"},{"word_id":"v1463","headword":"investigate","story_form":"investigate","form":"investigate","meaning_en":"try to find out what happened","meaning":"수사하다"},{"word_id":"v0968","headword":"evidence","story_form":"evidence","form":"evidence","meaning_en":"facts or objects that help show the truth","meaning":"증거"},{"word_id":"v2615","headword":"suspect","story_form":"suspect","form":"suspect","meaning_en":"someone thought to have committed a crime","meaning":"용의자"},{"word_id":"v1419","headword":"innocent","story_form":"innocent","form":"innocent","meaning_en":"not having done anything wrong","meaning":"무고한"},{"word_id":"v0029","headword":"accuse","story_form":"accuse","form":"accuse","meaning_en":"say that someone has done something wrong","meaning":"비난하다"},{"word_id":"v2799","headword":"truth","story_form":"truth","form":"truth","meaning_en":"what really happened or is true","meaning":"진실"}],"english":["An **officer** comes to **investigate** a **crime** near our school.","Someone saw a **thief** **steal** a bike, but no one saw the face clearly.","A boy becomes a **suspect**, although he says he is **innocent**.","We should not **accuse** him without **evidence**.","The **officer** finds a video, and we finally learn the **truth**."],"korean":["경찰관이 학교 근처에서 일어난 범죄를 수사하러 온다.","누군가 도둑이 자전거를 훔치는 것을 보았지만, 얼굴을 똑똑히 본 사람은 없다.","한 소년이 용의자가 되지만 그는 자신이 무고하다고 말한다.","우리는 증거 없이 그를 비난해서는 안 된다.","경찰관이 영상을 찾고, 우리는 마침내 진실을 알게 된다."]},{"id":"C048","title":"법정 견학","title_en":"A Visit to a Courtroom","targets":[{"word_id":"v1494","headword":"justice","story_form":"justice","form":"justice","meaning_en":"fair treatment under the law","meaning":"정의"},{"word_id":"v1488","headword":"judge","story_form":"judge","form":"judge","meaning_en":"a person who decides cases in court","meaning":"판사"},{"word_id":"v1537","headword":"lawyer","story_form":"lawyer","form":"lawyer","meaning_en":"a person trained to give legal help","meaning":"변호사"},{"word_id":"v1535","headword":"law","story_form":"law","form":"law","meaning_en":"rules that people in a country must follow","meaning":"법"},{"word_id":"v1553","headword":"legal","story_form":"legal","form":"legal","meaning_en":"related to the law","meaning":"법률의"},{"word_id":"v0155","headword":"arrest","story_form":"arrest","form":"arrest","meaning_en":"take someone into police custody","meaning":"체포하다"},{"word_id":"v2056","headword":"prison","story_form":"prison","form":"prison","meaning_en":"a place where criminals are kept","meaning":"감옥"},{"word_id":"v2102","headword":"punish","story_form":"punish","form":"punish","meaning_en":"make someone suffer for doing wrong","meaning":"처벌하다"},{"word_id":"v1260","headword":"guilt","story_form":"guilt","form":"guilt","meaning_en":"a bad feeling about something you did","meaning":"죄책감"},{"word_id":"v0046","headword":"admit","story_form":"admit","form":"admit","meaning_en":"agree that something is true","meaning":"인정하다"}],"english":["On a school trip, we watch a **judge** and a **lawyer** discuss a **legal** case.","The man says the police had reason to **arrest** him, and he is ready to **admit** what he did.","He speaks of his **guilt** and his fear of **prison**.","The **judge** explains that the **law** must protect **justice**, not simply **punish** people in anger."],"korean":["학교 견학에서 우리는 판사와 변호사가 법률 사건을 논의하는 모습을 본다.","그 남자는 경찰이 자신을 체포할 이유가 있었으며 자신이 한 일을 인정할 준비가 되었다고 말한다.","그는 죄책감과 감옥에 대한 두려움을 이야기한다.","판사는 법이 단순히 분노로 사람을 처벌하는 것이 아니라 정의를 지켜야 한다고 설명한다."]},{"id":"C049","title":"친구와 다툰 뒤","title_en":"After an Argument with a Friend","targets":[{"word_id":"v0149","headword":"argue","story_form":"argue","form":"argue","meaning_en":"speak angrily because you disagree","meaning":"다투다"},{"word_id":"v0119","headword":"anger","story_form":"anger","form":"anger","meaning_en":"a strong feeling of being upset or mad","meaning":"분노"},{"word_id":"v0291","headword":"blame","story_form":"blame","form":"blame","meaning_en":"say someone caused a problem","meaning":"탓하다"},{"word_id":"v2276","headword":"rude","story_form":"rude","form":"rude","meaning_en":"not polite","meaning":"무례한"},{"word_id":"v2368","headword":"shame","story_form":"shame","form":"shame","meaning_en":"a painful feeling about doing something wrong","meaning":"부끄러움"},{"word_id":"v1127","headword":"forgive","story_form":"forgive","form":"forgive","meaning_en":"stop being angry about someone's wrong action","meaning":"용서하다"},{"word_id":"v0019","headword":"accept","story_form":"accept","form":"accept","meaning_en":"agree to take or receive something","meaning":"받아들이다"},{"word_id":"v0984","headword":"excuse","story_form":"excuse","form":"excuse","meaning_en":"a reason given to explain wrong behavior","meaning":"변명"},{"word_id":"v0312","headword":"bond","story_form":"bond","form":"bond","meaning_en":"a close connection between people","meaning":"유대"},{"word_id":"v2798","headword":"trust","story_form":"trust","form":"trust","meaning_en":"belief that someone is honest and reliable","meaning":"신뢰"}],"english":["I **argue** with my best friend and **blame** him for a broken game.","My words are **rude**, and his face shows **anger**.","Later, I feel **shame** and offer no **excuse** for what I said.","He chooses to **forgive** me and **accept** my words: “I am sorry.”","We know our **bond** matters, but we will need time to build **trust** again."],"korean":["나는 가장 친한 친구와 다투며 게임기가 고장 난 것을 그의 탓으로 돌린다.","내 말은 무례하고, 그의 얼굴에는 분노가 드러난다.","나중에 나는 부끄러움을 느끼며 내가 한 말에 대해 변명하지 않는다.","그는 나를 용서하고 “미안해.”라는 내 말을 받아들이기로 한다.","우리는 우리의 유대가 중요하다는 것을 알지만, 다시 신뢰를 쌓으려면 시간이 필요할 것이다."]},{"id":"C050","title":"힘든 친구 곁에서","title_en":"Being There for a Friend","targets":[{"word_id":"v0920","headword":"emotion","story_form":"emotion","form":"emotion","meaning_en":"a feeling such as joy or sadness","meaning":"감정"},{"word_id":"v1720","headword":"mood","story_form":"mood","form":"mood","meaning_en":"the way you feel at a certain time","meaning":"기분"},{"word_id":"v0767","headword":"depress","story_form":"depress","form":"depress","meaning_en":"make someone feel very sad","meaning":"우울하게 하다"},{"word_id":"v0813","headword":"disappoint","story_form":"disappoint","form":"disappoint","meaning_en":"make someone feel let down","meaning":"실망시키다"},{"word_id":"v1667","headword":"mental","story_form":"mental","form":"mental","meaning_en":"related to the mind","meaning":"정신의"},{"word_id":"v0628","headword":"cope","story_form":"cope","form":"cope","meaning_en":"deal with a difficult situation","meaning":"대처하다"},{"word_id":"v2186","headword":"rely","story_form":"rely","form":"rely","meaning_en":"depend on someone for help","meaning":"의지하다"},{"word_id":"v1352","headword":"hug","story_form":"hug","form":"hug","meaning_en":"hold someone closely in your arms","meaning":"안아 주다"},{"word_id":"v2370","headword":"share","story_form":"share","form":"share","meaning_en":"let someone have part of something","meaning":"나누다"},{"word_id":"v0569","headword":"concern","story_form":"concern","form":"concern","meaning_en":"a feeling of worry","meaning":"걱정"}],"english":["Bad news can **depress** us and **disappoint** us at the same time.","When my friend is in a low **mood**, I listen as she names each **emotion**.","I **share** my **concern** and give her a **hug** when she asks for one.","“You can **rely** on me,” I say. “We can find ways to **cope** together.”","We also talk to a teacher about getting **mental** health support."],"korean":["나쁜 소식은 우리를 우울하게 하면서 동시에 실망시킬 수 있다.","친구가 기분이 가라앉아 있을 때, 나는 친구가 자신의 감정을 하나씩 말하는 것을 듣는다.","나는 걱정하는 마음을 전하고 친구가 안아 달라고 하면 안아 준다.","나는 “나에게 의지해도 돼. 함께 대처할 방법을 찾을 수 있어.”라고 말한다.","우리는 정신 건강에 관한 도움을 받는 일에 대해 선생님과도 이야기한다."]},{"id":"C051","title":"동생의 생일 준비","title_en":"Getting Ready for a Birthday","targets":[{"word_id":"v0154","headword":"arrange","story_form":"arrange","form":"arrange","meaning_en":"make plans and preparations","meaning":"준비하다"},{"word_id":"v0735","headword":"decorate","story_form":"decorate","form":"decorate","meaning_en":"make something look more beautiful","meaning":"장식하다"},{"word_id":"v0217","headword":"balloon","story_form":"balloon","form":"balloon","meaning_en":"a thin rubber bag filled with air","meaning":"풍선"},{"word_id":"v1204","headword":"gift","story_form":"gift","form":"gift","meaning_en":"something you give to someone","meaning":"선물"},{"word_id":"v2610","headword":"surprise","story_form":"surprise","form":"surprise","meaning_en":"make someone feel something was unexpected","meaning":"놀라게 하다"},{"word_id":"v0753","headword":"delight","story_form":"delight","form":"delight","meaning_en":"a feeling of great pleasure","meaning":"기쁨"},{"word_id":"v0365","headword":"bunch","story_form":"bunch","form":"bunch","meaning_en":"things held or tied together","meaning":"다발"},{"word_id":"v0328","headword":"bow","story_form":"bow","form":"bow","meaning_en":"a knot with two loops","meaning":"리본 매듭"},{"word_id":"v1820","headword":"occasion","story_form":"occasion","form":"occasion","meaning_en":"a special event","meaning":"행사"},{"word_id":"v0125","headword":"annual","story_form":"annual","form":"annual","meaning_en":"happening once every year","meaning":"매년의"}],"english":["We **arrange** a small party for my sister’s birthday, our favorite **annual** **occasion**.","I **decorate** the room with a **balloon** and a **bunch** of flowers.","Mom ties a **bow** around the **gift**, and we hide to **surprise** my sister.","Her face fills with **delight** when she opens the door."],"korean":["우리는 여동생의 생일을 위해 작은 파티를 준비한다. 생일은 우리가 가장 좋아하는 연례행사다.","나는 풍선 하나와 꽃다발로 방을 장식한다.","엄마는 선물에 리본 매듭을 묶으시고, 우리는 동생을 놀라게 하려고 숨는다.","동생이 문을 열자 얼굴에 기쁨이 가득해진다."]},{"id":"C052","title":"가족의 새 출발","title_en":"A New Beginning for Our Family","targets":[{"word_id":"v2029","headword":"pregnant","story_form":"pregnant","form":"pregnant","meaning_en":"having a baby growing inside the body","meaning":"임신한"},{"word_id":"v1057","headword":"female","story_form":"female","form":"female","meaning_en":"a girl or woman","meaning":"여자아이, 여성"},{"word_id":"v1621","headword":"male","story_form":"male","form":"male","meaning_en":"a boy or man","meaning":"남자아이, 남성"},{"word_id":"v2362","headword":"sex","story_form":"sex","form":"sex","meaning_en":"being male or female","meaning":"성별"},{"word_id":"v0993","headword":"expect","story_form":"expect","form":"expect","meaning_en":"think something will happen","meaning":"예상하다"},{"word_id":"v2812","headword":"twin","story_form":"twin","form":"twin","meaning_en":"one of two babies born together","meaning":"쌍둥이"},{"word_id":"v0846","headword":"domestic","story_form":"domestic","form":"domestic","meaning_en":"related to the home and family","meaning":"가정의"},{"word_id":"v0340","headword":"breast","story_form":"breast","form":"breast","meaning_en":"the front part of the upper body","meaning":"가슴"},{"word_id":"v0715","headword":"darling","story_form":"darling","form":"darling","meaning_en":"a person you love very much","meaning":"사랑하는 사람"},{"word_id":"v0296","headword":"bless","story_form":"bless","form":"bless","meaning_en":"ask for God's care and goodness","meaning":"축복하다"}],"english":["My aunt is **pregnant**, and we **expect** two babies, a **male** and a **female**.","The nurse writes the **sex** of each **twin** on a form.","After they are born, Aunt May holds one baby against her **breast** and whispers, “My **darling**.”","Our family comes to **bless** the babies and help with **domestic** work."],"korean":["이모가 임신 중이고, 우리는 남자아이와 여자아이 두 아기의 탄생을 기다린다.","간호사는 쌍둥이 각각의 성별을 서류에 적는다.","아기들이 태어난 뒤 메이 이모는 한 아기를 가슴에 안고 “내 사랑.”이라고 속삭인다.","가족들은 아기들을 축복하고 집안일을 도우러 온다."]},{"id":"C053","title":"할아버지의 은퇴","title_en":"Grandpa's Retirement","targets":[{"word_id":"v2228","headword":"retire","story_form":"retire","form":"retire","meaning_en":"stop working because of age","meaning":"은퇴하다"},{"word_id":"v2344","headword":"senior","story_form":"senior","form":"senior","meaning_en":"older or more experienced","meaning":"연장자의, 선배의"},{"word_id":"v1491","headword":"junior","story_form":"junior","form":"junior","meaning_en":"younger or less experienced","meaning":"후배의"},{"word_id":"v2066","headword":"profession","story_form":"profession","form":"profession","meaning_en":"a job needing special training","meaning":"직업"},{"word_id":"v1512","headword":"knowledge","story_form":"knowledge","form":"knowledge","meaning_en":"things you know or understand","meaning":"지식"},{"word_id":"v0055","headword":"advice","story_form":"advice","form":"advice","meaning_en":"ideas about what someone should do","meaning":"조언"},{"word_id":"v0056","headword":"advise","story_form":"advise","form":"advise","meaning_en":"tell someone what you think they should do","meaning":"조언하다"},{"word_id":"v2215","headword":"respect","story_form":"respect","form":"respect","meaning_en":"treat someone as important and valuable","meaning":"존중하다"},{"word_id":"v2964","headword":"wise","story_form":"wise","form":"wise","meaning_en":"able to make good decisions","meaning":"현명한"},{"word_id":"v2852","headword":"value","story_form":"value","form":"value","meaning_en":"think someone or something is important","meaning":"소중히 여기다"}],"english":["Grandpa will **retire** from his **profession** as a teacher this year.","The **junior** teachers ask him to **advise** them, and they **value** his **knowledge**.","At a party for **senior** teachers, he gives one piece of **advice**: “Always **respect** your students.”","Everyone thinks these are **wise** words."],"korean":["할아버지는 올해 교직에서 은퇴하실 것이다.","후배 교사들은 할아버지께 조언을 구하고 그분의 지식을 소중히 여긴다.","원로 교사들을 위한 파티에서 할아버지는 “언제나 학생들을 존중하세요.”라는 조언을 하신다.","모두가 그것을 현명한 말이라고 생각한다."]},{"id":"C054","title":"새 동네로 이사","title_en":"Moving to a New Neighborhood","targets":[{"word_id":"v1768","headword":"neighbor","story_form":"neighbor","form":"neighbor","meaning_en":"a person living near you","meaning":"이웃"},{"word_id":"v0832","headword":"district","story_form":"district","form":"district","meaning_en":"an area of a town or country","meaning":"구역"},{"word_id":"v0652","headword":"county","story_form":"county","form":"county","meaning_en":"an area with its own local government","meaning":"군"},{"word_id":"v2877","headword":"village","story_form":"village","form":"village","meaning_en":"a small place where people live","meaning":"마을"},{"word_id":"v0642","headword":"cottage","story_form":"cottage","form":"cottage","meaning_en":"a small house, often in the country","meaning":"작은 집"},{"word_id":"v2194","headword":"rent","story_form":"rent","form":"rent","meaning_en":"pay to use someone else's property","meaning":"빌리다"},{"word_id":"v1591","headword":"locate","story_form":"locate","form":"locate","meaning_en":"find where something is","meaning":"위치를 찾다"},{"word_id":"v1091","headword":"flat","story_form":"flat","form":"flat","meaning_en":"a home on one floor of a building","meaning":"아파트 한 세대"},{"word_id":"v1032","headword":"familiar","story_form":"familiar","form":"familiar","meaning_en":"well known to you","meaning":"익숙한"},{"word_id":"v2357","headword":"settle","story_form":"settle","form":"settle","meaning_en":"begin living in a new place","meaning":"정착하다"}],"english":["We **rent** a **cottage** in a **village** in a quiet **county**.","Our new **neighbor** helps us **locate** the shops in the **district**.","Nothing feels **familiar** at first, but she invites us for tea.","As we **settle** into our home, we learn the name of every street.","Our old **flat** was smaller, but I still miss it sometimes."],"korean":["우리는 조용한 군에 있는 마을에서 작은 집을 빌린다.","새 이웃이 우리 구역의 가게들이 어디 있는지 찾도록 도와준다.","처음에는 아무것도 익숙하지 않지만, 그녀가 차를 마시러 오라고 초대한다.","새집에 정착하면서 우리는 거리 이름을 하나씩 익힌다.","예전에 살던 아파트는 더 작았지만, 나는 아직도 가끔 그곳이 그립다."]},{"id":"C055","title":"모르는 사람에게 온 메일","title_en":"A Message from a Stranger","targets":[{"word_id":"v1369","headword":"identity","story_form":"identity","form":"identity","meaning_en":"who a person is","meaning":"신원"},{"word_id":"v2058","headword":"private","story_form":"private","form":"private","meaning_en":"belonging to one person","meaning":"개인적인"},{"word_id":"v2057","headword":"privacy","story_form":"privacy","form":"privacy","meaning_en":"freedom from others knowing your personal life","meaning":"사생활"},{"word_id":"v2330","headword":"secret","story_form":"secret","form":"secret","meaning_en":"kept hidden from others","meaning":"비밀의"},{"word_id":"v0020","headword":"access","story_form":"access","form":"access","meaning_en":"the ability to enter or use something","meaning":"접근"},{"word_id":"v2203","headword":"request","story_form":"request","form":"request","meaning_en":"an act of asking for something","meaning":"요청"},{"word_id":"v1004","headword":"expose","story_form":"expose","form":"expose","meaning_en":"show something that should stay hidden","meaning":"노출하다"},{"word_id":"v1372","headword":"ignore","story_form":"ignore","form":"ignore","meaning_en":"pay no attention to something","meaning":"무시하다"},{"word_id":"v0299","headword":"block","story_form":"block","form":"block","meaning_en":"stop someone from reaching or contacting you","meaning":"차단하다"},{"word_id":"v0203","headword":"aware","story_form":"aware","form":"aware","meaning_en":"knowing about something","meaning":"알고 있는"}],"english":["A stranger asks for **access** to my **private** account and my **secret** number.","I do not know his **identity**, so I **ignore** the message and **block** him.","I am **aware** that sharing too much can **expose** my family to trouble.","I tell Dad because our **privacy** matters.","Dad reads the **request** and helps me check my settings."],"korean":["낯선 사람이 내 개인 계정에 대한 접근 권한과 비밀 번호를 요구한다.","나는 그의 신원을 모르므로 메시지를 무시하고 그를 차단한다.","나는 정보를 너무 많이 공유하면 가족이 곤란한 일을 겪게 될 수 있다는 것을 알고 있다.","우리의 사생활은 중요하기 때문에 나는 아빠에게 말씀드린다.","아빠는 그 요청을 읽고 내 설정을 확인하도록 도와주신다."]},{"id":"C056","title":"학급 신문 편집","title_en":"Editing the Class Newspaper","targets":[{"word_id":"v0894","headword":"edit","story_form":"edit","form":"edit","meaning_en":"change writing to improve it","meaning":"편집하다"},{"word_id":"v0954","headword":"essay","story_form":"essay","form":"essay","meaning_en":"a short piece of writing about a subject","meaning":"에세이"},{"word_id":"v0536","headword":"comment","story_form":"comment","form":"comment","meaning_en":"something you say to give your opinion","meaning":"의견"},{"word_id":"v0347","headword":"brief","story_form":"brief","form":"brief","meaning_en":"short in length or time","meaning":"짧은"},{"word_id":"v0786","headword":"detail","story_form":"detail","form":"detail","meaning_en":"a small piece of information","meaning":"세부 사항"},{"word_id":"v0604","headword":"content","story_form":"content","form":"content","meaning_en":"the information in a piece of writing","meaning":"내용"},{"word_id":"v1395","headword":"include","story_form":"include","form":"include","meaning_en":"have something as a part","meaning":"포함하다"},{"word_id":"v2340","headword":"select","story_form":"select","form":"select","meaning_en":"choose from a group","meaning":"선택하다"},{"word_id":"v2038","headword":"press","story_form":"press","form":"press","meaning_en":"newspapers and the people who report news","meaning":"언론"},{"word_id":"v2863","headword":"version","story_form":"version","form":"version","meaning_en":"a particular form of a piece of work","meaning":"판본"}],"english":["We **edit** an **essay** for our class paper and ask for a **brief** **comment** from the teacher.","She likes the **content** but asks us to check one **detail**.","We **select** a picture to **include** in the final **version**.","Our paper is small, but working on it teaches us why the **press** must check facts."],"korean":["우리는 학급 신문에 실을 에세이를 편집하고 선생님께 짧은 의견을 부탁한다.","선생님은 내용을 좋아하시지만 세부 사항 하나를 확인해 보라고 하신다.","우리는 최종 판본에 넣을 사진을 선택한다.","우리 신문은 작지만, 제작하면서 언론이 왜 사실을 확인해야 하는지 배운다."]},{"id":"C057","title":"영화관에서","title_en":"At the Cinema","targets":[{"word_id":"v0478","headword":"cinema","story_form":"cinema","form":"cinema","meaning_en":"a place where people watch films","meaning":"영화관"},{"word_id":"v0532","headword":"comedy","story_form":"comedy","form":"comedy","meaning_en":"a funny film or play","meaning":"코미디"},{"word_id":"v2309","headword":"scene","story_form":"scene","form":"scene","meaning_en":"one part of a film or play","meaning":"장면"},{"word_id":"v0415","headword":"cast","story_form":"cast","form":"cast","meaning_en":"all the actors in a film or play","meaning":"출연진"},{"word_id":"v1355","headword":"humor","story_form":"humor","form":"humor","meaning_en":"the ability to see or show what is funny","meaning":"유머"},{"word_id":"v1484","headword":"joke","story_form":"joke","form":"joke","meaning_en":"something said to make people laugh","meaning":"농담"},{"word_id":"v0112","headword":"amuse","story_form":"amuse","form":"amuse","meaning_en":"make someone smile or laugh","meaning":"즐겁게 하다"},{"word_id":"v0319","headword":"bore","story_form":"bore","form":"bore","meaning_en":"make someone lose interest","meaning":"지루하게 하다"},{"word_id":"v1532","headword":"laugh","story_form":"laugh","form":"laugh","meaning_en":"make sounds because something is funny","meaning":"웃다"},{"word_id":"v1036","headword":"fantastic","story_form":"fantastic","form":"fantastic","meaning_en":"extremely good or exciting","meaning":"환상적인"}],"english":["We go to the **cinema** to watch a **comedy** with a **fantastic** **cast**.","In the first **scene**, a man tells a **joke** that makes everyone **laugh**.","His gentle **humor** can **amuse** both children and adults.","Even the long parts do not **bore** us, and we talk about the film all the way home."],"korean":["우리는 훌륭한 출연진이 나오는 코미디를 보러 영화관에 간다.","첫 장면에서 한 남자가 모두를 웃게 하는 농담을 한다.","그의 부드러운 유머는 아이와 어른을 모두 즐겁게 할 수 있다.","긴 부분도 지루하지 않아서 우리는 집에 가는 내내 영화 이야기를 한다."]},{"id":"C058","title":"밤에 들린 소리","title_en":"A Sound in the Night","targets":[{"word_id":"v0164","headword":"asleep","story_form":"asleep","form":"asleep","meaning_en":"sleeping","meaning":"잠든"},{"word_id":"v0201","headword":"awake","story_form":"awake","form":"awake","meaning_en":"not sleeping","meaning":"깨어 있는"},{"word_id":"v0082","headword":"alarm","story_form":"alarm","form":"alarm","meaning_en":"a sound warning you about something","meaning":"경보음"},{"word_id":"v2586","headword":"sudden","story_form":"sudden","form":"sudden","meaning_en":"happening quickly and unexpectedly","meaning":"갑작스러운"},{"word_id":"v1789","headword":"noise","story_form":"noise","form":"noise","meaning_en":"a loud or unwanted sound","meaning":"소음"},{"word_id":"v2364","headword":"shadow","story_form":"shadow","form":"shadow","meaning_en":"a dark shape made by blocked light","meaning":"그림자"},{"word_id":"v1151","headword":"fright","story_form":"fright","form":"fright","meaning_en":"a sudden feeling of fear","meaning":"놀람"},{"word_id":"v2320","headword":"scream","story_form":"scream","form":"scream","meaning_en":"cry out loudly in fear","meaning":"비명을 지르다"},{"word_id":"v1202","headword":"ghost","story_form":"ghost","form":"ghost","meaning_en":"the spirit of a dead person","meaning":"유령"},{"word_id":"v2148","headword":"real","story_form":"real","form":"real","meaning_en":"actually existing","meaning":"진짜의"}],"english":["Everyone is **asleep**, but I am still **awake** when a **sudden** **noise** sounds like an **alarm**.","A tall **shadow** moves across the wall and gives me a **fright**.","I almost **scream** because I think it is a **ghost**.","Then Dad turns on the light: the **real** cause is our cat knocking over a coat stand."],"korean":["모두가 잠들었지만, 갑작스러운 소음이 경보처럼 들릴 때 나는 아직 깨어 있다.","키 큰 그림자가 벽을 가로질러 움직여 나는 깜짝 놀란다.","나는 유령이라고 생각해서 하마터면 비명을 지를 뻔한다.","그때 아빠가 불을 켜신다. 진짜 원인은 옷걸이를 넘어뜨린 우리 고양이다."]},{"id":"C059","title":"우주 전시관","title_en":"At the Space Exhibit","targets":[{"word_id":"v1975","headword":"planet","story_form":"planet","form":"planet","meaning_en":"a large round object moving around a star","meaning":"행성"},{"word_id":"v2258","headword":"rocket","story_form":"rocket","form":"rocket","meaning_en":"a vehicle that travels into space","meaning":"로켓"},{"word_id":"v1701","headword":"mission","story_form":"mission","form":"mission","meaning_en":"an important job to be done","meaning":"임무"},{"word_id":"v2884","headword":"vision","story_form":"vision","form":"vision","meaning_en":"an idea of what the future could be","meaning":"미래상"},{"word_id":"v1486","headword":"journey","story_form":"journey","form":"journey","meaning_en":"a trip from one place to another","meaning":"여행"},{"word_id":"v1353","headword":"huge","story_form":"huge","form":"huge","meaning_en":"very large","meaning":"거대한"},{"word_id":"v2657","headword":"technology","story_form":"technology","form":"technology","meaning_en":"knowledge and tools used to solve practical problems","meaning":"기술"},{"word_id":"v1120","headword":"force","story_form":"force","form":"force","meaning_en":"a push or pull on something","meaning":"힘"},{"word_id":"v2608","headword":"surface","story_form":"surface","form":"surface","meaning_en":"the outside or top layer of something","meaning":"표면"},{"word_id":"v2270","headword":"round","story_form":"round","form":"round","meaning_en":"shaped like a circle or ball","meaning":"둥근"}],"english":["At the science center, we stand beside a **huge** **rocket**.","A film takes us on a **journey** to a **round** **planet** with a red **surface**.","The space team has a **mission** to bring back rocks.","We learn how a strong **force** lifts the **rocket** from the ground.","New **technology** may help turn this **vision** of the future into real life."],"korean":["과학관에서 우리는 거대한 로켓 옆에 선다.","영화는 우리를 붉은 표면을 가진 둥근 행성으로 여행하게 한다.","우주 탐사팀의 임무는 암석을 가져오는 것이다.","우리는 강한 힘이 어떻게 로켓을 땅에서 들어 올리는지 배운다.","새로운 기술이 이러한 미래상을 현실로 만드는 데 도움이 될지도 모른다."]},{"id":"C060","title":"날씨 연구","title_en":"Studying the Weather","targets":[{"word_id":"v0499","headword":"climate","story_form":"climate","form":"climate","meaning_en":"the usual weather in a place","meaning":"기후"},{"word_id":"v0180","headword":"atmosphere","story_form":"atmosphere","form":"atmosphere","meaning_en":"the air surrounding the earth","meaning":"대기"},{"word_id":"v0198","headword":"average","story_form":"average","form":"average","meaning_en":"usual or typical in amount","meaning":"평균의"},{"word_id":"v1013","headword":"extreme","story_form":"extreme","form":"extreme","meaning_en":"very great or severe","meaning":"극심한"},{"word_id":"v1101","headword":"flood","story_form":"flood","form":"flood","meaning_en":"water covering land that is usually dry","meaning":"홍수"},{"word_id":"v1147","headword":"freeze","story_form":"freeze","form":"freeze","meaning_en":"turn into ice","meaning":"얼다"},{"word_id":"v1664","headword":"melt","story_form":"melt","form":"melt","meaning_en":"change from solid to liquid","meaning":"녹다"},{"word_id":"v0451","headword":"chart","story_form":"chart","form":"chart","meaning_en":"a display of information using pictures or numbers","meaning":"도표"},{"word_id":"v1236","headword":"graph","story_form":"graph","form":"graph","meaning_en":"a drawing showing how numbers change","meaning":"그래프"},{"word_id":"v0113","headword":"analysis","story_form":"analysis","form":"analysis","meaning_en":"a careful study to understand something","meaning":"분석"}],"english":["We study the **climate** of a mountain town and draw a **chart** of its **average** temperature.","Our **graph** shows when the river may **freeze** and when the ice may **melt**.","We also read about an **extreme** **flood** and changes in the **atmosphere**.","Our **analysis** helps us see why one hot day does not tell the whole story."],"korean":["우리는 산간 마을의 기후를 공부하고 평균 기온 도표를 그린다.","그래프는 강이 언제 얼고 얼음이 언제 녹을 수 있는지 보여 준다.","우리는 극심한 홍수와 대기의 변화에 관해서도 읽는다.","분석을 통해 우리는 더운 날 하루만으로는 전체 상황을 알 수 없는 이유를 이해한다."]},{"id":"C061","title":"기부 행사","title_en":"An Event to Help Others","targets":[{"word_id":"v0848","headword":"donate","story_form":"donate","form":"donate","meaning_en":"give money or goods to help others","meaning":"기부하다"},{"word_id":"v1165","headword":"fund","story_form":"fund","form":"fund","meaning_en":"money saved for a special purpose","meaning":"기금"},{"word_id":"v0269","headword":"benefit","story_form":"benefit","form":"benefit","meaning_en":"an event that raises money to help others","meaning":"자선 행사"},{"word_id":"v0613","headword":"contribute","story_form":"contribute","form":"contribute","meaning_en":"give help toward a shared result","meaning":"기여하다"},{"word_id":"v2499","headword":"sponsor","story_form":"sponsor","form":"sponsor","meaning_en":"support an event with money or goods","meaning":"후원하다"},{"word_id":"v1053","headword":"fee","story_form":"fee","form":"fee","meaning_en":"money paid for a service","meaning":"요금"},{"word_id":"v0648","headword":"count","story_form":"count","form":"count","meaning_en":"find how many there are","meaning":"세다"},{"word_id":"v2092","headword":"provide","story_form":"provide","form":"provide","meaning_en":"give someone what they need","meaning":"제공하다"},{"word_id":"v2108","headword":"purpose","story_form":"purpose","form":"purpose","meaning_en":"the reason for doing something","meaning":"목적"},{"word_id":"v2452","headword":"society","story_form":"society","form":"society","meaning_en":"people living together in an organized way","meaning":"사회"}],"english":["Our club holds a **benefit** to build a **fund** for children who need books.","A local shop agrees to **sponsor** the event and **provide** food.","There is no entrance **fee**, but people can **donate** money if they wish.","We **count** the money and talk about our **purpose**: everyone can **contribute** to a kinder **society**."],"korean":["우리 동아리는 책이 필요한 아이들을 위한 기금을 마련하려고 자선 행사를 연다.","한 지역 가게가 행사를 후원하고 음식을 제공하기로 한다.","입장료는 없지만, 원하는 사람은 돈을 기부할 수 있다.","우리는 돈을 세고 우리의 목적에 관해 이야기한다. 누구나 더 다정한 사회를 만드는 데 기여할 수 있다."]},{"id":"C062","title":"우편물을 보내며","title_en":"Sending a Package","targets":[{"word_id":"v0943","headword":"envelope","story_form":"envelope","form":"envelope","meaning_en":"a paper cover for a letter","meaning":"봉투"},{"word_id":"v2516","headword":"stamp","story_form":"stamp","form":"stamp","meaning_en":"a small label showing postage is paid","meaning":"우표"},{"word_id":"v2012","headword":"post","story_form":"post","form":"post","meaning_en":"send something by mail","meaning":"우편으로 보내다"},{"word_id":"v0754","headword":"deliver","story_form":"deliver","form":"deliver","meaning_en":"take something to the person expecting it","meaning":"배달하다"},{"word_id":"v2153","headword":"receive","story_form":"receive","form":"receive","meaning_en":"get something sent or given to you","meaning":"받다"},{"word_id":"v1879","headword":"pack","story_form":"pack","form":"pack","meaning_en":"put things in a box or cover","meaning":"포장하다"},{"word_id":"v1473","headword":"item","story_form":"item","form":"item","meaning_en":"one thing in a group","meaning":"물품"},{"word_id":"v0580","headword":"confirm","story_form":"confirm","form":"confirm","meaning_en":"check that something is correct","meaning":"확인하다"},{"word_id":"v2325","headword":"seal","story_form":"seal","form":"seal","meaning_en":"close something tightly","meaning":"봉하다"},{"word_id":"v2926","headword":"weigh","story_form":"weigh","form":"weigh","meaning_en":"find how heavy something is","meaning":"무게를 재다"}],"english":["I **pack** a small **item** for my aunt and put a letter in an **envelope**.","Before I **seal** it, I check that her name and address are clear.","At the office, a worker will **weigh** it and tell me which **stamp** to buy.","I **post** it early so they can **deliver** it before Friday.","Aunt May calls to **confirm** that she did **receive** it."],"korean":["나는 이모에게 보낼 작은 물품을 포장하고 봉투에 편지를 넣는다.","봉하기 전에 이모의 이름과 주소가 분명하게 적혀 있는지 확인한다.","우체국에서는 직원이 무게를 재고 어떤 우표를 사야 하는지 알려 줄 것이다.","금요일 전에 배달할 수 있도록 나는 일찍 우편물을 보낸다.","메이 이모는 그것을 잘 받았다고 확인해 주려고 전화를 하신다."]},{"id":"C063","title":"기차역에서","title_en":"At the Train Station","targets":[{"word_id":"v2524","headword":"station","story_form":"station","form":"station","meaning_en":"a place where trains stop","meaning":"역"},{"word_id":"v1271","headword":"hall","story_form":"hall","form":"hall","meaning_en":"a large room or entrance space","meaning":"홀"},{"word_id":"v2771","headword":"transfer","story_form":"transfer","form":"transfer","meaning_en":"change from one train or bus to another","meaning":"갈아타다"},{"word_id":"v2776","headword":"transport","story_form":"transport","form":"transport","meaning_en":"carry people or goods from place to place","meaning":"수송하다"},{"word_id":"v2859","headword":"vehicle","story_form":"vehicle","form":"vehicle","meaning_en":"something used to carry people or goods","meaning":"차량"},{"word_id":"v2766","headword":"traffic","story_form":"traffic","form":"traffic","meaning_en":"vehicles moving on a road","meaning":"교통량"},{"word_id":"v1320","headword":"highway","story_form":"highway","form":"highway","meaning_en":"a main road for fast travel","meaning":"고속도로"},{"word_id":"v2853","headword":"van","story_form":"van","form":"van","meaning_en":"a large road vehicle for people or goods","meaning":"승합차"},{"word_id":"v1549","headword":"leave","story_form":"leave","form":"leave","meaning_en":"go away from a place","meaning":"떠나다"},{"word_id":"v2282","headword":"rush","story_form":"rush","form":"rush","meaning_en":"move or act very quickly","meaning":"서두르다"}],"english":["Heavy **traffic** on the **highway** slows our **van** as we travel to the **station**.","We **rush** through the **hall**, but the train will not **leave** for ten minutes.","This train can **transport** far more people than our small **vehicle**.","We will **transfer** to another train near the city, so Dad keeps both tickets ready."],"korean":["기차역으로 가는 동안 고속도로의 많은 교통량 때문에 우리 승합차가 느리게 움직인다.","우리는 홀을 서둘러 지나가지만, 기차가 떠나려면 아직 10분 남아 있다.","이 기차는 우리의 작은 차량보다 훨씬 많은 사람을 수송할 수 있다.","도시 근처에서 다른 기차로 갈아탈 예정이라 아빠는 표 두 장을 모두 준비해 두신다."]},{"id":"C064","title":"공원에서의 오해","title_en":"A Misunderstanding in the Park","targets":[{"word_id":"v0297","headword":"blind","story_form":"blind","form":"blind","meaning_en":"unable to see","meaning":"눈이 보이지 않는"},{"word_id":"v1200","headword":"gesture","story_form":"gesture","form":"gesture","meaning_en":"a movement that shows an idea or feeling","meaning":"몸짓"},{"word_id":"v1209","headword":"glance","story_form":"glance","form":"glance","meaning_en":"a quick look","meaning":"흘끗 보기"},{"word_id":"v2520","headword":"stare","story_form":"stare","form":"stare","meaning_en":"look at something for a long time","meaning":"빤히 보다"},{"word_id":"v0914","headword":"embarrass","story_form":"embarrass","form":"embarrass","meaning_en":"make someone feel awkward or ashamed","meaning":"당황하게 하다"},{"word_id":"v1896","headword":"pardon","story_form":"pardon","form":"pardon","meaning_en":"forgive someone for a mistake","meaning":"용서하다"},{"word_id":"v0323","headword":"bother","story_form":"bother","form":"bother","meaning_en":"annoy or trouble someone","meaning":"귀찮게 하다"},{"word_id":"v0542","headword":"communicate","story_form":"communicate","form":"communicate","meaning_en":"share information with someone","meaning":"의사소통하다"},{"word_id":"v1626","headword":"manner","story_form":"manner","form":"manner","meaning_en":"a way of doing something","meaning":"방식"},{"word_id":"v1828","headword":"offer","story_form":"offer","form":"offer","meaning_en":"say you are willing to give help","meaning":"제안하다"}],"english":["A man tells me he is **blind** as I **glance** at a park map, so I stop making a **gesture** he cannot see.","I do not want to **stare** or **embarrass** him.","“**Pardon** me. May I **offer** some help?” I ask in a friendly **manner**.","He says I do not **bother** him and tells me how we can **communicate** best."],"korean":["내가 공원 지도를 흘끗 볼 때 한 남자가 앞을 볼 수 없다고 말해서, 나는 그가 볼 수 없는 손짓을 멈춘다.","나는 그를 빤히 보거나 당황하게 하고 싶지 않다.","나는 친근하게 “실례합니다. 도와드려도 될까요?”라고 묻는다.","그는 내가 귀찮게 하는 것이 아니라고 말하며 어떻게 소통하면 가장 좋은지 알려 준다."]},{"id":"C065","title":"잃어버린 열쇠의 단서","title_en":"Clues to the Missing Key","targets":[{"word_id":"v1746","headword":"mystery","story_form":"mystery","form":"mystery","meaning_en":"something that is difficult to explain","meaning":"수수께끼"},{"word_id":"v0509","headword":"clue","story_form":"clue","form":"clue","meaning_en":"information that helps solve a mystery","meaning":"단서"},{"word_id":"v2762","headword":"trace","story_form":"trace","form":"trace","meaning_en":"a small sign left behind","meaning":"흔적"},{"word_id":"v2502","headword":"spot","story_form":"spot","form":"spot","meaning_en":"notice or find something","meaning":"발견하다"},{"word_id":"v0268","headword":"beneath","story_form":"beneath","form":"beneath","meaning_en":"under something","meaning":"~아래에"},{"word_id":"v0408","headword":"carpet","story_form":"carpet","form":"carpet","meaning_en":"a thick covering for a floor","meaning":"카펫"},{"word_id":"v2729","headword":"tiny","story_form":"tiny","form":"tiny","meaning_en":"very small","meaning":"아주 작은"},{"word_id":"v0661","headword":"crack","story_form":"crack","form":"crack","meaning_en":"a narrow opening in something","meaning":"틈"},{"word_id":"v0692","headword":"curious","story_form":"curious","form":"curious","meaning_en":"wanting to know more","meaning":"호기심이 있는"},{"word_id":"v0138","headword":"appear","story_form":"appear","form":"appear","meaning_en":"come into view","meaning":"나타나다"}],"english":["My missing key is a **mystery**, and my **curious** brother wants to help.","He finds a **clue**: a **trace** of mud **beneath** the **carpet**.","We **spot** a **tiny** **crack** between the floorboards and look inside.","The key does not **appear** there, but we find it under a muddy shoe nearby."],"korean":["사라진 내 열쇠는 수수께끼이고, 호기심 많은 남동생이 돕고 싶어 한다.","그는 카펫 아래의 진흙 자국이라는 단서를 찾는다.","우리는 마룻장 사이의 아주 작은 틈을 발견하고 안을 들여다본다.","열쇠는 그곳에서 나오지 않지만, 근처에 있는 진흙 묻은 신발 아래에서 찾는다."]},{"id":"C066","title":"낚시터의 작은 사건","title_en":"A Small Incident by the Stream","targets":[{"word_id":"v2556","headword":"stream","story_form":"stream","form":"stream","meaning_en":"a small narrow river","meaning":"시내"},{"word_id":"v1104","headword":"flow","story_form":"flow","form":"flow","meaning_en":"move steadily like water","meaning":"흐르다"},{"word_id":"v0267","headword":"bend","story_form":"bend","form":"bend","meaning_en":"make something curved","meaning":"구부리다"},{"word_id":"v1962","headword":"pin","story_form":"pin","form":"pin","meaning_en":"a small thin piece of pointed metal","meaning":"핀"},{"word_id":"v2963","headword":"wire","story_form":"wire","form":"wire","meaning_en":"a thin flexible piece of metal","meaning":"철사"},{"word_id":"v2777","headword":"trap","story_form":"trap","form":"trap","meaning_en":"a device used to catch animals","meaning":"덫"},{"word_id":"v2180","headword":"release","story_form":"release","form":"release","meaning_en":"let someone or something go free","meaning":"풀어 주다"},{"word_id":"v0088","headword":"alive","story_form":"alive","form":"alive","meaning_en":"living and not dead","meaning":"살아 있는"},{"word_id":"v0683","headword":"cruel","story_form":"cruel","form":"cruel","meaning_en":"causing pain without caring","meaning":"잔인한"},{"word_id":"v1969","headword":"pity","story_form":"pity","form":"pity","meaning_en":"sadness for someone who is suffering","meaning":"불쌍히 여기는 마음"}],"english":["Beside a **stream**, we watch water **flow** past an old fish **trap**.","A fish is caught inside, but it is still **alive**.","I feel **pity** for it, so we **bend** a **wire** and use a **pin** to lift the little door.","We **release** the fish and agree that leaving the **trap** there would be **cruel**."],"korean":["시냇가에서 우리는 물이 오래된 물고기 덫 옆으로 흐르는 것을 본다.","물고기 한 마리가 안에 갇혀 있지만 아직 살아 있다.","불쌍한 마음이 들어 우리는 철사를 구부리고 핀으로 작은 문을 들어 올린다.","우리는 물고기를 풀어 주고, 그곳에 덫을 그대로 두는 것은 잔인한 일이라는 데 동의한다."]},{"id":"C067","title":"놀이터의 도전","title_en":"A Playground Challenge","targets":[{"word_id":"v2627","headword":"swing","story_form":"swing","form":"swing","meaning_en":"a hanging seat that moves back and forth","meaning":"그네"},{"word_id":"v2429","headword":"slide","story_form":"slide","form":"slide","meaning_en":"a smooth slope children slide down","meaning":"미끄럼틀"},{"word_id":"v2515","headword":"stairs","story_form":"stairs","form":"stairs","meaning_en":"steps going up or down","meaning":"계단"},{"word_id":"v0326","headword":"bounce","story_form":"bounce","form":"bounce","meaning_en":"make a ball hit a surface and rise","meaning":"튀기다"},{"word_id":"v1506","headword":"knee","story_form":"knee","form":"knee","meaning_en":"the joint in the middle of your leg","meaning":"무릎"},{"word_id":"v2319","headword":"scratch","story_form":"scratch","form":"scratch","meaning_en":"a small cut on the skin","meaning":"긁힌 상처"},{"word_id":"v0713","headword":"dare","story_form":"dare","form":"dare","meaning_en":"be brave enough to do something","meaning":"용기가 있어 ~하다"},{"word_id":"v0439","headword":"challenge","story_form":"challenge","form":"challenge","meaning_en":"something difficult that tests your ability","meaning":"도전"},{"word_id":"v0399","headword":"capable","story_form":"capable","form":"capable","meaning_en":"able to do something","meaning":"할 수 있는"},{"word_id":"v2582","headword":"succeed","story_form":"succeed","form":"succeed","meaning_en":"do what you were trying to do","meaning":"성공하다"}],"english":["At the park, I sit on a **swing** while my brother tries to **bounce** a ball.","Then he takes the **stairs** to the **slide**, but a **scratch** on his **knee** makes him stop.","“Do you **dare** to try again?” he asks me.","I am **capable** of climbing, but it feels like a **challenge**.","We go slowly and **succeed** without getting hurt."],"korean":["공원에서 나는 그네에 앉아 있고 남동생은 공을 튀기려고 한다.","그다음 동생은 미끄럼틀 계단을 오르지만 무릎의 긁힌 상처 때문에 멈춘다.","그는 나에게 “다시 해 볼 용기가 있어?”라고 묻는다.","나는 올라갈 수 있지만, 도전처럼 느껴진다.","우리는 천천히 움직여 다치지 않고 성공한다."]},{"id":"C068","title":"소방서 견학","title_en":"A Visit to the Fire Station","targets":[{"word_id":"v1089","headword":"flame","story_form":"flame","form":"flame","meaning_en":"the bright burning part of a fire","meaning":"불꽃"},{"word_id":"v2440","headword":"smoke","story_form":"smoke","form":"smoke","meaning_en":"gray or black gas from burning things","meaning":"연기"},{"word_id":"v1967","headword":"pipe","story_form":"pipe","form":"pipe","meaning_en":"a tube that carries water or gas","meaning":"관"},{"word_id":"v2504","headword":"spray","story_form":"spray","form":"spray","meaning_en":"send out liquid in many small drops","meaning":"뿌리다"},{"word_id":"v2100","headword":"pump","story_form":"pump","form":"pump","meaning_en":"a device that moves water or air","meaning":"펌프"},{"word_id":"v0952","headword":"escape","story_form":"escape","form":"escape","meaning_en":"get away from danger","meaning":"탈출하다"},{"word_id":"v0990","headword":"exit","story_form":"exit","form":"exit","meaning_en":"a way out of a place","meaning":"출구"},{"word_id":"v0783","headword":"destroy","story_form":"destroy","form":"destroy","meaning_en":"damage something so badly it cannot be used","meaning":"파괴하다"},{"word_id":"v0709","headword":"damage","story_form":"damage","form":"damage","meaning_en":"cause harm to something","meaning":"손상시키다"},{"word_id":"v1254","headword":"guard","story_form":"guard","form":"guard","meaning_en":"protect against danger","meaning":"막다, 대비하다"}],"english":["At the fire station, we see a **pump** send water through a **pipe**.","Workers **spray** the water at a practice **flame**.","They explain that fire can **destroy** a house and **smoke** can **damage** our lungs.","To **guard** against danger, we must know where the **exit** is and how to **escape**."],"korean":["소방서에서 우리는 펌프가 관을 통해 물을 보내는 것을 본다.","대원들은 훈련용 불꽃에 물을 뿌린다.","그들은 불이 집을 파괴할 수 있고 연기가 폐를 손상시킬 수 있다고 설명한다.","위험에 대비하려면 출구가 어디 있는지, 어떻게 탈출하는지 알아야 한다."]},{"id":"C069","title":"전쟁과 평화 수업","title_en":"A Lesson on War and Peace","targets":[{"word_id":"v0152","headword":"army","story_form":"army","form":"army","meaning_en":"a country's soldiers who fight on land","meaning":"육군"},{"word_id":"v1758","headword":"navy","story_form":"navy","form":"navy","meaning_en":"a country's forces that fight at sea","meaning":"해군"},{"word_id":"v1685","headword":"military","story_form":"military","form":"military","meaning_en":"related to armed forces","meaning":"군사의"},{"word_id":"v2458","headword":"soldier","story_form":"soldier","form":"soldier","meaning_en":"a person serving in an army","meaning":"군인"},{"word_id":"v0929","headword":"enemy","story_form":"enemy","form":"enemy","meaning_en":"a person or group fighting against you","meaning":"적"},{"word_id":"v0237","headword":"battle","story_form":"battle","form":"battle","meaning_en":"a fight between armed forces","meaning":"전투"},{"word_id":"v0183","headword":"attack","story_form":"attack","form":"attack","meaning_en":"try to hurt or defeat someone","meaning":"공격하다"},{"word_id":"v0741","headword":"defense","story_form":"defense","form":"defense","meaning_en":"action taken to protect against attack","meaning":"방어"},{"word_id":"v2917","headword":"weapon","story_form":"weapon","form":"weapon","meaning_en":"something used to hurt or fight","meaning":"무기"},{"word_id":"v1921","headword":"peace","story_form":"peace","form":"peace","meaning_en":"a time without war or fighting","meaning":"평화"}],"english":["Our teacher shows us letters from a **soldier** who served in the **army**.","One letter describes a **battle** and help from the **navy**.","Another says that a **weapon** cannot bring lasting **peace** on its own.","We discuss why **military** leaders may choose **defense** rather than **attack** an **enemy**."],"korean":["선생님은 육군에서 복무했던 한 군인의 편지들을 보여 주신다.","한 편지에는 전투와 해군의 도움이 묘사되어 있다.","다른 편지에는 무기만으로는 오래가는 평화를 가져올 수 없다고 쓰여 있다.","우리는 군 지휘관들이 적을 공격하기보다 방어를 선택할 수 있는 이유를 논의한다."]},{"id":"C070","title":"비밀 요원의 임무","title_en":"A Secret Agent's Mission","targets":[{"word_id":"v2507","headword":"spy","story_form":"spy","form":"spy","meaning_en":"a person who secretly gathers information","meaning":"첩보원"},{"word_id":"v0070","headword":"agent","story_form":"agent","form":"agent","meaning_en":"a person working for an organization","meaning":"요원"},{"word_id":"v1264","headword":"gun","story_form":"gun","form":"gun","meaning_en":"a weapon that shoots bullets","meaning":"총"},{"word_id":"v0311","headword":"bomb","story_form":"bomb","form":"bomb","meaning_en":"a device that explodes","meaning":"폭탄"},{"word_id":"v2646","headword":"target","story_form":"target","form":"target","meaning_en":"something an attack is aimed at","meaning":"목표물"},{"word_id":"v0452","headword":"chase","story_form":"chase","form":"chase","meaning_en":"run after someone to catch them","meaning":"추격하다"},{"word_id":"v2255","headword":"rob","story_form":"rob","form":"rob","meaning_en":"take money or things by force","meaning":"털다"},{"word_id":"v0627","headword":"cop","story_form":"cop","form":"cop","meaning_en":"a police officer","meaning":"경찰관"},{"word_id":"v2878","headword":"violent","story_form":"violent","form":"violent","meaning_en":"using force to hurt people","meaning":"폭력적인"},{"word_id":"v1227","headword":"grab","story_form":"grab","form":"grab","meaning_en":"take hold of something suddenly","meaning":"붙잡다"}],"english":["In our film, a **spy** works with a local **cop** to stop a **violent** **agent**.","The **agent** plans to **rob** a bank, and the bank is his next **target**.","He carries a **gun** and a bag that may contain a **bomb**.","The heroes **chase** him, **grab** the bag, and call for help."],"korean":["우리가 만든 영화에서 첩보원은 폭력적인 요원을 막으려고 지역 경찰관과 협력한다.","그 요원은 은행을 털 계획이며, 은행이 그의 다음 목표물이다.","그는 총과 폭탄이 들어 있을지도 모르는 가방을 들고 있다.","주인공들은 그를 추격해 가방을 붙잡고 도움을 요청한다."]},{"id":"C071","title":"불평을 해결하는 가게","title_en":"A Shop Solves a Complaint","targets":[{"word_id":"v0497","headword":"client","story_form":"client","form":"client","meaning_en":"a person who uses a business's services","meaning":"고객"},{"word_id":"v0553","headword":"complain","story_form":"complain","form":"complain","meaning_en":"say you are unhappy about something","meaning":"불평하다"},{"word_id":"v0755","headword":"demand","story_form":"demand","form":"demand","meaning_en":"ask strongly for something","meaning":"요구하다"},{"word_id":"v0762","headword":"deny","story_form":"deny","form":"deny","meaning_en":"say that something is not true","meaning":"부인하다"},{"word_id":"v0981","headword":"exchange","story_form":"exchange","form":"exchange","meaning_en":"giving something back to get something else","meaning":"교환"},{"word_id":"v1253","headword":"guarantee","story_form":"guarantee","form":"guarantee","meaning_en":"promise that something will work or be fixed","meaning":"보증하다"},{"word_id":"v2081","headword":"proper","story_form":"proper","form":"proper","meaning_en":"right for the situation","meaning":"적절한"},{"word_id":"v2216","headword":"respond","story_form":"respond","form":"respond","meaning_en":"answer or react to someone","meaning":"응답하다"},{"word_id":"v1277","headword":"handle","story_form":"handle","form":"handle","meaning_en":"deal with a problem or task","meaning":"처리하다"},{"word_id":"v0144","headword":"appropriate","story_form":"appropriate","form":"appropriate","meaning_en":"suitable for the situation","meaning":"적절한"}],"english":["A **client** calls to **complain** about a broken lamp and **demand** help.","The shop does not **deny** the problem and tries to **respond** in an **appropriate** way.","“We **guarantee** a working product,” the worker says, “so an **exchange** is **proper**.”","She knows how to **handle** the problem, and the **client** thanks her."],"korean":["고객이 고장 난 램프에 대해 불평하고 도움을 요구하려고 전화를 한다.","가게는 문제를 부인하지 않고 적절한 방식으로 응답하려고 한다.","직원은 “저희는 정상 작동하는 제품을 보증하므로 교환해 드리는 것이 맞습니다.”라고 말한다.","그녀는 문제를 처리하는 방법을 알고 있고, 고객은 그녀에게 고마워한다."]},{"id":"C072","title":"새 상품 광고","title_en":"Advertising a New Product","targets":[{"word_id":"v0054","headword":"advertize","story_form":"advertise","form":"advertise","meaning_en":"tell people about a product to sell it","meaning":"광고하다"},{"word_id":"v0418","headword":"catalogue","story_form":"catalogue","form":"catalogue","meaning_en":"a list of products with details","meaning":"상품 목록"},{"word_id":"v1051","headword":"feature","story_form":"feature","form":"feature","meaning_en":"an important part or quality of something","meaning":"특징"},{"word_id":"v0188","headword":"attract","story_form":"attract","form":"attract","meaning_en":"make someone interested in something","meaning":"끌다"},{"word_id":"v1389","headword":"impress","story_form":"impress","form":"impress","meaning_en":"make someone admire something","meaning":"깊은 인상을 주다"},{"word_id":"v2002","headword":"popular","story_form":"popular","form":"popular","meaning_en":"liked by many people","meaning":"인기 있는"},{"word_id":"v2077","headword":"promote","story_form":"promote","form":"promote","meaning_en":"help people know about a product","meaning":"홍보하다"},{"word_id":"v2294","headword":"sample","story_form":"sample","form":"sample","meaning_en":"a small amount used to show a product","meaning":"견본"},{"word_id":"v0470","headword":"choice","story_form":"choice","form":"choice","meaning_en":"the act of choosing something","meaning":"선택"},{"word_id":"v1853","headword":"ordinary","story_form":"ordinary","form":"ordinary","meaning_en":"normal and not special","meaning":"보통의"}],"english":["Our shop wants to **advertise** a new bag and **promote** it in a **catalogue**.","Its best **feature** is a pocket that holds a water bottle.","We put a **sample** by the door to **attract** people and **impress** them with its light weight.","It becomes a **popular** **choice** because it costs no more than an **ordinary** bag."],"korean":["우리 가게는 새 가방을 광고하고 상품 목록에서 홍보하고 싶어 한다.","가장 좋은 특징은 물병을 넣는 주머니다.","우리는 사람들의 관심을 끌고 가벼운 무게로 좋은 인상을 주려고 문 옆에 견본을 놓는다.","일반 가방보다 비싸지 않아서 인기 있는 선택이 된다."]},{"id":"C073","title":"새로운 발명","title_en":"A New Invention","targets":[{"word_id":"v1461","headword":"invent","story_form":"invent","form":"invent","meaning_en":"create something that did not exist before","meaning":"발명하다"},{"word_id":"v0933","headword":"engineer","story_form":"engineer","form":"engineer","meaning_en":"a person who designs machines or structures","meaning":"공학자"},{"word_id":"v0789","headword":"develop","story_form":"develop","form":"develop","meaning_en":"create and improve something","meaning":"개발하다"},{"word_id":"v0568","headword":"concept","story_form":"concept","form":"concept","meaning_en":"a general idea","meaning":"개념"},{"word_id":"v0530","headword":"combine","story_form":"combine","form":"combine","meaning_en":"join things together","meaning":"결합하다"},{"word_id":"v2019","headword":"practical","story_form":"practical","form":"practical","meaning_en":"useful in real situations","meaning":"실용적인"},{"word_id":"v2015","headword":"potential","story_form":"potential","form":"potential","meaning_en":"the ability to become good or successful","meaning":"잠재력"},{"word_id":"v0051","headword":"advantage","story_form":"advantage","form":"advantage","meaning_en":"something that makes one thing better","meaning":"장점"},{"word_id":"v0050","headword":"advance","story_form":"advance","form":"advance","meaning_en":"an improvement or step forward","meaning":"발전"},{"word_id":"v0349","headword":"brilliant","story_form":"brilliant","form":"brilliant","meaning_en":"very clever or impressive","meaning":"훌륭한"}],"english":["An **engineer** visits our class and asks us to **invent** something useful.","We **develop** a **concept** for a bag with a seat and **combine** our best ideas.","The design is **practical**, and its main **advantage** is that tired walkers can sit down.","She calls it a **brilliant** idea with **potential** for further **advance**."],"korean":["공학자가 우리 반에 와서 유용한 것을 발명해 보라고 한다.","우리는 의자가 달린 가방이라는 개념을 발전시키고 가장 좋은 생각들을 결합한다.","설계는 실용적이며, 가장 큰 장점은 지친 보행자가 앉을 수 있다는 것이다.","그녀는 더 발전할 잠재력을 가진 훌륭한 생각이라고 말한다."]},{"id":"C074","title":"실수에서 배우기","title_en":"Learning from Mistakes","targets":[{"word_id":"v0584","headword":"confuse","story_form":"confuse","form":"confuse","meaning_en":"mix things up in your mind","meaning":"혼동하다"},{"word_id":"v1158","headword":"frustrate","story_form":"frustrate","form":"frustrate","meaning_en":"make someone upset by blocking their efforts","meaning":"좌절시키다"},{"word_id":"v2121","headword":"quit","story_form":"quit","form":"quit","meaning_en":"stop doing something","meaning":"그만두다"},{"word_id":"v0788","headword":"determine","story_form":"determine","form":"determine","meaning_en":"decide firmly to do something","meaning":"결정하다"},{"word_id":"v0608","headword":"continue","story_form":"continue","form":"continue","meaning_en":"keep doing something","meaning":"계속하다"},{"word_id":"v2072","headword":"progress","story_form":"progress","form":"progress","meaning_en":"movement toward a better result","meaning":"발전"},{"word_id":"v2583","headword":"success","story_form":"success","form":"success","meaning_en":"achieving what you wanted","meaning":"성공"},{"word_id":"v0816","headword":"discipline","story_form":"discipline","form":"discipline","meaning_en":"the ability to control your own behavior","meaning":"자기 관리"},{"word_id":"v0567","headword":"concentrate","story_form":"concentrate","form":"concentrate","meaning_en":"give all your attention to something","meaning":"집중하다"},{"word_id":"v1639","headword":"master","story_form":"master","form":"master","meaning_en":"learn to do something very well","meaning":"완전히 익히다"}],"english":["Two similar dance steps **confuse** me, and repeated mistakes **frustrate** me.","I want to **quit**, but I **determine** my next goal: **master** just one step today.","I **concentrate** on it and use **discipline** to **continue** practicing each morning.","My **progress** is slow, but my first small **success** makes me smile."],"korean":["비슷한 춤 동작 두 개가 헷갈리고, 반복되는 실수 때문에 좌절한다.","나는 그만두고 싶지만 오늘은 동작 하나만 완전히 익히자는 다음 목표를 정한다.","나는 그 동작에 집중하고 자기 관리를 하며 매일 아침 연습을 이어 간다.","발전은 느리지만 첫 작은 성공에 미소가 난다."]},{"id":"C075","title":"우리 반 설문 조사","title_en":"Our Class Survey","targets":[{"word_id":"v2613","headword":"survey","story_form":"survey","form":"survey","meaning_en":"questions used to collect people's opinions","meaning":"설문 조사"},{"word_id":"v2206","headword":"research","story_form":"research","form":"research","meaning_en":"careful study to discover information","meaning":"연구"},{"word_id":"v1582","headword":"list","story_form":"list","form":"list","meaning_en":"items written one after another","meaning":"목록"},{"word_id":"v0958","headword":"estimate","story_form":"estimate","form":"estimate","meaning_en":"make a careful guess about an amount","meaning":"추정하다"},{"word_id":"v2302","headword":"scale","story_form":"scale","form":"scale","meaning_en":"a set of numbers used to rate something","meaning":"점수 척도"},{"word_id":"v2135","headword":"range","story_form":"range","form":"range","meaning_en":"the distance between the lowest and highest values","meaning":"범위"},{"word_id":"v0420","headword":"category","story_form":"category","form":"category","meaning_en":"a group of similar things","meaning":"범주"},{"word_id":"v2484","headword":"specific","story_form":"specific","form":"specific","meaning_en":"clear and exact","meaning":"구체적인"},{"word_id":"v1401","headword":"indicate","story_form":"indicate","form":"indicate","meaning_en":"show or point to something","meaning":"나타내다"},{"word_id":"v1191","headword":"general","story_form":"general","form":"general","meaning_en":"true in most cases","meaning":"일반적인"}],"english":["We do **research** on reading habits with a class **survey**.","Each student rates a book on a **scale** from one to five and chooses a **category**.","We **estimate** the **range** of time students spend reading and ask for one **specific** example.","The answers **indicate** a **general** interest in funny stories.","We put the favorite books on a **list** for the library."],"korean":["우리는 학급 설문 조사로 독서 습관을 연구한다.","학생들은 책에 1점부터 5점까지 점수를 주고 범주를 선택한다.","우리는 학생들의 독서 시간 범위를 추정하고 구체적인 예 하나를 요청한다.","응답은 재미있는 이야기에 대한 전반적인 관심을 보여 준다.","우리는 도서관에 줄 인기 도서 목록을 만든다."]},{"id":"C076","title":"나무 심기 계획","title_en":"A Plan to Plant Trees","targets":[{"word_id":"v2554","headword":"strategy","story_form":"strategy","form":"strategy","meaning_en":"a plan for reaching a goal","meaning":"전략"},{"word_id":"v0170","headword":"assess","story_form":"assess","form":"assess","meaning_en":"judge how good or useful something is","meaning":"평가하다"},{"word_id":"v0592","headword":"consider","story_form":"consider","form":"consider","meaning_en":"think carefully about something","meaning":"고려하다"},{"word_id":"v1021","headword":"factor","story_form":"factor","form":"factor","meaning_en":"something that affects a result","meaning":"요인"},{"word_id":"v0231","headword":"basis","story_form":"basis","form":"basis","meaning_en":"the facts or ideas supporting a decision","meaning":"근거"},{"word_id":"v0956","headword":"establish","story_form":"establish","form":"establish","meaning_en":"set up or create something","meaning":"수립하다"},{"word_id":"v0172","headword":"assign","story_form":"assign","form":"assign","meaning_en":"give someone a task","meaning":"배정하다"},{"word_id":"v1623","headword":"manage","story_form":"manage","form":"manage","meaning_en":"organize and control work","meaning":"관리하다"},{"word_id":"v0555","headword":"complete","story_form":"complete","form":"complete","meaning_en":"finish doing something","meaning":"완료하다"},{"word_id":"v1868","headword":"overall","story_form":"overall","form":"overall","meaning_en":"including everything","meaning":"전체의"}],"english":["We need a **strategy** for planting trees around our school.","First, we **assess** the ground and **consider** water as an important **factor**.","On this **basis**, we **establish** a plan and **assign** a job to each team.","Two teachers **manage** the work, and we **complete** the **overall** project in a week."],"korean":["우리는 학교 주변에 나무를 심을 전략이 필요하다.","먼저 땅을 평가하고 물을 중요한 요인으로 고려한다.","이를 근거로 계획을 세우고 팀마다 일을 배정한다.","선생님 두 분이 작업을 관리하고, 우리는 일주일 만에 전체 프로젝트를 완료한다."]},{"id":"C077","title":"새로운 언어 배우기","title_en":"Learning a New Language","targets":[{"word_id":"v1123","headword":"foreign","story_form":"foreign","form":"foreign","meaning_en":"from another country","meaning":"외국의"},{"word_id":"v1111","headword":"folk","story_form":"folk","form":"folk","meaning_en":"related to a people's traditional culture","meaning":"민속의"},{"word_id":"v2765","headword":"tradition","story_form":"tradition","form":"tradition","meaning_en":"a custom passed down over time","meaning":"전통"},{"word_id":"v0617","headword":"converse","story_form":"converse","form":"converse","meaning_en":"talk with someone","meaning":"대화하다"},{"word_id":"v2178","headword":"relate","story_form":"relate","form":"relate","meaning_en":"show a connection between things","meaning":"관련짓다"},{"word_id":"v0174","headword":"associate","story_form":"associate","form":"associate","meaning_en":"connect things in your mind","meaning":"연관 짓다"},{"word_id":"v0606","headword":"context","story_form":"context","form":"context","meaning_en":"the situation that helps explain a meaning","meaning":"맥락"},{"word_id":"v1650","headword":"mean","story_form":"mean","form":"mean","meaning_en":"have a particular meaning","meaning":"뜻하다"},{"word_id":"v2345","headword":"sense","story_form":"sense","form":"sense","meaning_en":"a meaning that is clear and reasonable","meaning":"의미"},{"word_id":"v1375","headword":"illustrate","story_form":"illustrate","form":"illustrate","meaning_en":"make something clear with an example","meaning":"설명하다"}],"english":["In a **foreign** language class, we listen to a **folk** song about an old **tradition**.","Our teacher uses pictures to **illustrate** what the words **mean** in this **context**.","We **associate** the song with a family meal and **relate** it to our own lives.","Soon the whole song makes **sense** to us.","We then **converse** in pairs about meals at home."],"korean":["외국어 수업에서 우리는 오래된 전통에 관한 민요를 듣는다.","선생님은 그림을 이용해 이 맥락에서 단어들이 무엇을 뜻하는지 설명한다.","우리는 그 노래를 가족 식사와 연관 짓고 우리의 삶과 연결한다.","곧 우리는 노래 전체의 의미를 이해하게 된다.","그런 다음 우리는 짝을 지어 집에서 먹는 식사에 관해 대화한다."]},{"id":"C078","title":"작은 오해 풀기","title_en":"Clearing Up a Misunderstanding","targets":[{"word_id":"v0175","headword":"assume","story_form":"assume","form":"assume","meaning_en":"think something is true without being sure","meaning":"추측하다"},{"word_id":"v0853","headword":"doubt","story_form":"doubt","form":"doubt","meaning_en":"a feeling of not being certain","meaning":"의심"},{"word_id":"v2150","headword":"reason","story_form":"reason","form":"reason","meaning_en":"why something happens or is done","meaning":"이유"},{"word_id":"v1819","headword":"obvious","story_form":"obvious","form":"obvious","meaning_en":"easy to see or understand","meaning":"명백한"},{"word_id":"v2338","headword":"seem","story_form":"seem","form":"seem","meaning_en":"appear to be a certain way","meaning":"~처럼 보이다"},{"word_id":"v2091","headword":"prove","story_form":"prove","form":"prove","meaning_en":"show that something is true","meaning":"증명하다"},{"word_id":"v0481","headword":"circumstance","story_form":"circumstances","form":"circumstances","meaning_en":"a fact or condition affecting a situation","meaning":"상황"},{"word_id":"v1427","headword":"insist","story_form":"insist","form":"insist","meaning_en":"say something firmly even when others disagree","meaning":"주장하다"},{"word_id":"v0621","headword":"convince","story_form":"convince","form":"convince","meaning_en":"make someone believe something","meaning":"납득시키다"},{"word_id":"v2188","headword":"remark","story_form":"remark","form":"remark","meaning_en":"something someone says","meaning":"말"}],"english":["My friend is late, and I **assume** she has forgotten our meeting.","Her **reason** does not **seem** **obvious**, so I have some **doubt**.","She shows me a bus notice to **prove** that the road was closed.","“I **insist** that I left early,” she says, and her **remark** helps **convince** me.","I decide to ask about the **circumstances** before judging next time."],"korean":["친구가 늦어서 나는 친구가 약속을 잊었다고 추측한다.","이유가 분명해 보이지 않아 나는 약간 의심한다.","친구는 도로가 막혔다는 것을 증명하려고 버스 안내문을 보여 준다.","친구는 “나는 분명 일찍 출발했어.”라고 주장하고, 그 말에 나는 납득하게 된다.","나는 다음에는 판단하기 전에 상황을 물어보기로 한다."]},{"id":"C079","title":"가족 여행 의논","title_en":"Planning a Family Trip","targets":[{"word_id":"v2590","headword":"suggest","story_form":"suggest","form":"suggest","meaning_en":"put forward an idea","meaning":"제안하다"},{"word_id":"v1443","headword":"intend","story_form":"intend","form":"intend","meaning_en":"plan to do something","meaning":"~할 생각이다"},{"word_id":"v0776","headword":"desire","story_form":"desire","form":"desire","meaning_en":"a strong wish for something","meaning":"바람"},{"word_id":"v1936","headword":"perhaps","story_form":"perhaps","form":"perhaps","meaning_en":"maybe","meaning":"어쩌면"},{"word_id":"v2011","headword":"possible","story_form":"possible","form":"possible","meaning_en":"able to happen or be done","meaning":"가능한"},{"word_id":"v1761","headword":"necessary","story_form":"necessary","form":"necessary","meaning_en":"needed for a purpose","meaning":"필요한"},{"word_id":"v0091","headword":"allow","story_form":"allow","form":"allow","meaning_en":"let someone do something","meaning":"허락하다"},{"word_id":"v0764","headword":"depend","story_form":"depend","form":"depend","meaning_en":"be decided by something else","meaning":"달려 있다"},{"word_id":"v1858","headword":"otherwise","story_form":"otherwise","form":"otherwise","meaning_en":"if that does not happen","meaning":"그렇지 않으면"},{"word_id":"v2833","headword":"unless","story_form":"unless","form":"unless","meaning_en":"except if","meaning":"~하지 않는 한"}],"english":["I **suggest** a trip to the sea because my sister has a strong **desire** to swim.","We **intend** to go on Saturday, but the trip will **depend** on the weather.","“**Perhaps** it is **possible**,” Dad says, “but warm clothes are **necessary**.”","Mom will **allow** us to go **unless** a storm comes; **otherwise**, we will stay home."],"korean":["여동생이 수영을 몹시 하고 싶어 해서 나는 바다 여행을 제안한다.","우리는 토요일에 갈 생각이지만, 여행은 날씨에 달려 있다.","아빠는 “갈 수 있을지도 모르겠구나. 하지만 따뜻한 옷은 필요해.”라고 말씀하신다.","폭풍이 오지 않는다면 엄마는 가도 된다고 하실 것이고, 그렇지 않으면 우리는 집에 있을 것이다."]},{"id":"C080","title":"새 팀의 문제 해결","title_en":"Solving Problems as a New Team","targets":[{"word_id":"v0581","headword":"conflict","story_form":"conflict","form":"conflict","meaning_en":"a serious disagreement","meaning":"갈등"},{"word_id":"v0187","headword":"attitude","story_form":"attitude","form":"attitude","meaning_en":"the way you think or feel about something","meaning":"태도"},{"word_id":"v1402","headword":"individual","story_form":"individual","form":"individual","meaning_en":"one person","meaning":"개인, 한 사람"},{"word_id":"v0541","headword":"common","story_form":"common","form":"common","meaning_en":"shared by two or more people","meaning":"공통의"},{"word_id":"v2830","headword":"unite","story_form":"unite","form":"unite","meaning_en":"bring people together as one group","meaning":"하나로 모으다"},{"word_id":"v2355","headword":"session","story_form":"session","form":"session","meaning_en":"a period spent meeting or working together","meaning":"회의 시간"},{"word_id":"v1618","headword":"maintain","story_form":"maintain","form":"maintain","meaning_en":"keep something at the same level","meaning":"유지하다"},{"word_id":"v0038","headword":"adapt","story_form":"adapt","form":"adapt","meaning_en":"change to fit a new situation","meaning":"적응하다"},{"word_id":"v0101","headword":"alter","story_form":"alter","form":"alter","meaning_en":"make something different","meaning":"바꾸다"},{"word_id":"v2053","headword":"principle","story_form":"principle","form":"principle","meaning_en":"a basic rule guiding your actions","meaning":"원칙"}],"english":["Our new team has a **conflict** because every **individual** has a different idea.","We change our **attitude** and look for a **common** goal to **unite** us.","We agree on a **principle**: listen before speaking.","To **maintain** this rule, we **adapt** each **session** and **alter** the order of speakers."],"korean":["새 팀에는 사람마다 생각이 달라 갈등이 있다.","우리는 태도를 바꾸고 우리를 하나로 모을 공통의 목표를 찾는다.","우리는 말하기 전에 듣는다는 원칙에 동의한다.","이 규칙을 유지하려고 매 회의 방식을 조정하고 발언 순서를 바꾼다."]},{"id":"C081","title":"거울 앞에서","title_en":"In Front of the Mirror","targets":[{"word_id":"v1698","headword":"mirror","story_form":"mirror","form":"mirror","meaning_en":"a surface in which you see yourself","meaning":"거울"},{"word_id":"v2166","headword":"reflect","story_form":"reflect","form":"reflect","meaning_en":"send back an image","meaning":"비추다"},{"word_id":"v0300","headword":"blonde","story_form":"blonde","form":"blonde","meaning_en":"having light yellow hair","meaning":"금발의"},{"word_id":"v1278","headword":"handsome","story_form":"handsome","form":"handsome","meaning_en":"good-looking, usually describing a man","meaning":"잘생긴"},{"word_id":"v1225","headword":"gorgeous","story_form":"gorgeous","form":"gorgeous","meaning_en":"very beautiful or attractive","meaning":"아주 멋진"},{"word_id":"v0693","headword":"curl","story_form":"curl","form":"curl","meaning_en":"a piece of hair shaped like a ring","meaning":"곱슬머리"},{"word_id":"v2372","headword":"shave","story_form":"shave","form":"shave","meaning_en":"remove hair with a razor","meaning":"면도하다"},{"word_id":"v2441","headword":"smooth","story_form":"smooth","form":"smooth","meaning_en":"make something neat and flat","meaning":"매끈하게 정리하다"},{"word_id":"v2047","headword":"pride","story_form":"pride","form":"pride","meaning_en":"a pleased feeling about yourself or your work","meaning":"자부심"},{"word_id":"v2399","headword":"sight","story_form":"sight","form":"sight","meaning_en":"something you can see","meaning":"모습"}],"english":["A **mirror** can **reflect** a face, but it cannot show all of a person’s life.","Dad begins to **shave** while I try to **smooth** one
