**blonde** **curl**.","“You look **handsome**,” I say, and he calls my hair **gorgeous**.","We laugh at the **sight** of our wet faces and take **pride** in getting ready on time."],"korean":["거울은 얼굴을 비출 수 있지만 한 사람의 삶 전체를 보여 주지는 못한다.","내가 금발 곱슬머리 한 가닥을 정리하는 동안 아빠는 면도를 시작하신다.","내가 “잘생기셨어요.”라고 말하자 아빠는 내 머리가 아주 멋지다고 하신다.","우리는 젖은 얼굴의 모습을 보고 웃으며 제시간에 준비한 것을 뿌듯해한다."]},{"id":"C082","title":"잃어버린 도시 이야기","title_en":"The Story of a Lost City","targets":[{"word_id":"v0772","headword":"desert","story_form":"desert","form":"desert","meaning_en":"a very dry area with little rain","meaning":"사막"},{"word_id":"v0803","headword":"dig","story_form":"dig","form":"dig","meaning_en":"make a hole in the ground","meaning":"파다"},{"word_id":"v0370","headword":"bury","story_form":"bury","form":"bury","meaning_en":"put something under the ground","meaning":"묻다"},{"word_id":"v0812","headword":"dirt","story_form":"dirt","form":"dirt","meaning_en":"loose earth or soil","meaning":"흙"},{"word_id":"v2277","headword":"ruin","story_form":"ruin","form":"ruin","meaning_en":"the remains of an old building","meaning":"유적"},{"word_id":"v0345","headword":"brick","story_form":"brick","form":"brick","meaning_en":"a hard rectangular block used for building","meaning":"벽돌"},{"word_id":"v2758","headword":"tower","story_form":"tower","form":"tower","meaning_en":"a tall narrow building","meaning":"탑"},{"word_id":"v1304","headword":"height","story_form":"height","form":"height","meaning_en":"how tall something is","meaning":"높이"},{"word_id":"v2415","headword":"site","story_form":"site","form":"site","meaning_en":"a place where something is located","meaning":"장소"},{"word_id":"v0989","headword":"exist","story_form":"exist","form":"exist","meaning_en":"be real or present","meaning":"존재하다"}],"english":["In a story, we visit a **desert** **site** where an old city used to **exist**.","We **dig** through **dirt** beside a **brick** **tower** of great **height**.","Sand can **bury** a whole town, so each **ruin** takes time to find.","At sunset, we draw the lost city as we imagine it once looked."],"korean":["이야기 속에서 우리는 옛 도시가 존재했던 사막의 장소를 방문한다.","우리는 높이 솟은 벽돌 탑 옆에서 흙을 파낸다.","모래는 마을 전체를 묻을 수 있어서 유적 하나하나를 찾는 데 시간이 걸린다.","해 질 무렵, 우리는 그 도시의 옛 모습을 상상해 그린다."]},{"id":"C083","title":"마술 쇼","title_en":"A Magic Show","targets":[{"word_id":"v1613","headword":"magic","story_form":"magic","form":"magic","meaning_en":"the art of doing seemingly impossible things","meaning":"마술"},{"word_id":"v2788","headword":"trick","story_form":"trick","form":"trick","meaning_en":"a clever act meant to entertain","meaning":"묘기"},{"word_id":"v0106","headword":"amaze","story_form":"amaze","form":"amaze","meaning_en":"surprise someone very much","meaning":"놀라게 하다"},{"word_id":"v1636","headword":"marvel","story_form":"marvel","form":"marvel","meaning_en":"a feeling of great surprise and admiration","meaning":"경이로움"},{"word_id":"v1040","headword":"fascinate","story_form":"fascinate","form":"fascinate","meaning_en":"hold someone's interest strongly","meaning":"매료하다"},{"word_id":"v0517","headword":"coin","story_form":"coin","form":"coin","meaning_en":"a small flat piece of metal money","meaning":"동전"},{"word_id":"v1985","headword":"pocket","story_form":"pocket","form":"pocket","meaning_en":"a small cloth bag sewn into clothing","meaning":"주머니"},{"word_id":"v0925","headword":"empty","story_form":"empty","form":"empty","meaning_en":"having nothing inside","meaning":"빈"},{"word_id":"v2973","headword":"wonder","story_form":"wonder","form":"wonder","meaning_en":"want to know something","meaning":"궁금해하다"},{"word_id":"v1323","headword":"hint","story_form":"hint","form":"hint","meaning_en":"a small piece of helpful information","meaning":"실마리"}],"english":["A little **magic** show can **amaze** me and **fascinate** my brother.","The performer puts a **coin** in his **pocket** and then shows us that it is **empty**.","We **wonder** how the **trick** works, but he gives us only one **hint**: “Watch my hands.”","The whole show is a **marvel**, and we cheer loudly."],"korean":["작은 마술 쇼도 나를 놀라게 하고 남동생을 매료할 수 있다.","공연자는 동전을 주머니에 넣은 다음 주머니가 비었다는 것을 보여 준다.","우리는 묘기의 원리가 궁금하지만, 그는 “내 손을 보세요.”라는 실마리 하나만 준다.","공연 전체가 경이로워서 우리는 크게 환호한다."]},{"id":"C084","title":"꿈속의 왕국","title_en":"A Kingdom in a Dream","targets":[{"word_id":"v0118","headword":"angel","story_form":"angel","form":"angel","meaning_en":"a good spirit often shown with wings","meaning":"천사"},{"word_id":"v1301","headword":"heaven","story_form":"heaven","form":"heaven","meaning_en":"a place of happiness with God after death","meaning":"천국"},{"word_id":"v1307","headword":"hell","story_form":"hell","form":"hell","meaning_en":"a place of punishment after death","meaning":"지옥"},{"word_id":"v0969","headword":"evil","story_form":"evil","form":"evil","meaning_en":"very bad or harmful","meaning":"악한"},{"word_id":"v2471","headword":"soul","story_form":"soul","form":"soul","meaning_en":"a person, described in a literary way","meaning":"사람(문학적 표현)"},{"word_id":"v2494","headword":"spirit","story_form":"spirit","form":"spirit","meaning_en":"a person's inner strength or attitude","meaning":"정신"},{"word_id":"v1028","headword":"faith","story_form":"faith","form":"faith","meaning_en":"strong trust in someone or something","meaning":"믿음"},{"word_id":"v0260","headword":"belief","story_form":"belief","form":"belief","meaning_en":"an idea you accept as true","meaning":"신념"},{"word_id":"v2022","headword":"pray","story_form":"pray","form":"pray","meaning_en":"speak to God","meaning":"기도하다"},{"word_id":"v1125","headword":"forever","story_form":"forever","form":"forever","meaning_en":"for all time","meaning":"영원히"}],"english":["In my dream, an **angel** tells a story about **heaven** and **hell**.","An **evil** king thinks he can rule **forever**, but one brave **soul** will not follow his orders.","The child has **faith** that kindness can win and a strong **belief** in helping others.","People **pray** for peace, and their hopeful **spirit** changes the kingdom."],"korean":["꿈속에서 천사가 천국과 지옥에 관한 이야기를 들려준다.","악한 왕은 영원히 다스릴 수 있다고 생각하지만 용감한 한 사람은 그의 명령을 따르지 않는다.","그 아이는 친절함이 이길 수 있다는 믿음과 다른 사람을 도와야 한다는 강한 신념을 지니고 있다.","사람들은 평화를 기도하고, 희망에 찬 정신이 왕국을 바꾼다."]},{"id":"C085","title":"건강한 선택","title_en":"Healthy Choices","targets":[{"word_id":"v0800","headword":"diet","story_form":"diet","form":"diet","meaning_en":"the food you usually eat","meaning":"식단"},{"word_id":"v0599","headword":"consume","story_form":"consume","form":"consume","meaning_en":"eat or drink something","meaning":"섭취하다"},{"word_id":"v1357","headword":"hunger","story_form":"hunger","form":"hunger","meaning_en":"the feeling of needing food","meaning":"배고픔"},{"word_id":"v2544","headword":"stomach","story_form":"stomach","form":"stomach","meaning_en":"the organ that holds food after eating","meaning":"위"},{"word_id":"v0289","headword":"bitter","story_form":"bitter","form":"bitter","meaning_en":"having a strong sharp taste like black coffee","meaning":"쓴"},{"word_id":"v2474","headword":"sour","story_form":"sour","form":"sour","meaning_en":"having a sharp taste like a lemon","meaning":"신"},{"word_id":"v0675","headword":"crisp","story_form":"crisp","form":"crisp","meaning_en":"firm and crunchy when eaten","meaning":"아삭한"},{"word_id":"v1811","headword":"nut","story_form":"nuts","form":"nuts","meaning_en":"a seed with a hard shell","meaning":"견과"},{"word_id":"v2106","headword":"pure","story_form":"pure","form":"pure","meaning_en":"not mixed with anything else","meaning":"순수한"},{"word_id":"v1702","headword":"mix","story_form":"mix","form":"mix","meaning_en":"put different things together","meaning":"섞다"}],"english":["For a school project, I look at my **diet** and the food I **consume**.","When **hunger** comes, I **mix** **nuts** with **crisp** apple pieces instead of taking more cake.","A **sour** orange and a **bitter** piece of dark chocolate taste different, so I try just a little of each.","I drink **pure** water and stop eating when my **stomach** feels full."],"korean":["학교 과제를 위해 나는 내 식단과 먹는 음식을 살펴본다.","배가 고프면 케이크를 더 먹는 대신 견과류를 아삭한 사과 조각들과 섞는다.","신 오렌지와 쓴 다크초콜릿은 맛이 달라서 각각 조금씩만 먹어 본다.","나는 깨끗한 물을 마시고 배가 부르면 먹는 것을 멈춘다."]},{"id":"C086","title":"술과 담배에 관한 수업","title_en":"A Lesson on Alcohol and Smoking","targets":[{"word_id":"v0084","headword":"alcohol","story_form":"alcohol","form":"alcohol","meaning_en":"a substance in drinks that can make you drunk","meaning":"알코올"},{"word_id":"v0253","headword":"beer","story_form":"beer","form":"beer","meaning_en":"an alcoholic drink made from grain","meaning":"맥주"},{"word_id":"v2096","headword":"pub","story_form":"pub","form":"pub","meaning_en":"a place where people buy alcoholic drinks","meaning":"술집"},{"word_id":"v0224","headword":"bar","story_form":"bar","form":"bar","meaning_en":"a place that serves alcoholic drinks","meaning":"술집"},{"word_id":"v0477","headword":"cigarette","story_form":"cigarette","form":"cigarette","meaning_en":"a small paper tube of tobacco for smoking","meaning":"담배"},{"word_id":"v0870","headword":"drug","story_form":"drug","form":"drug","meaning_en":"a substance that changes how the body works","meaning":"약물"},{"word_id":"v1989","headword":"poison","story_form":"poison","form":"poison","meaning_en":"a substance that can harm or kill","meaning":"독"},{"word_id":"v2169","headword":"refuse","story_form":"refuse","form":"refuse","meaning_en":"say you will not do or take something","meaning":"거절하다"},{"word_id":"v1409","headword":"influence","story_form":"influence","form":"influence","meaning_en":"the power to change someone's actions","meaning":"영향"},{"word_id":"v2658","headword":"teenage","story_form":"teenage","form":"teenage","meaning_en":"related to ages thirteen through nineteen","meaning":"십 대의"}],"english":["In a **teenage** health class, we talk about **alcohol**, a **drug** found in **beer**.","A picture shows a **pub** and a **bar**, but our lesson is about making safe choices.","We learn that **cigarette** smoke contains **poison** and that friends can have a strong **influence**.","We practice how to **refuse** something we do not want."],"korean":["십 대 건강 수업에서 우리는 맥주에 들어 있는 약물인 알코올에 관해 이야기한다.","사진에는 술집들이 나오지만, 수업의 주제는 안전한 선택을 하는 것이다.","우리는 담배 연기에 독성 물질이 들어 있고 친구들의 영향력이 클 수 있다는 점을 배운다.","우리는 원하지 않는 것을 거절하는 방법을 연습한다."]},{"id":"C087","title":"너무 바쁜 하루","title_en":"A Very Busy Day","targets":[{"word_id":"v0386","headword":"calendar","story_form":"calendar","form":"calendar","meaning_en":"a chart showing days, weeks, and months","meaning":"달력"},{"word_id":"v0185","headword":"attend","story_form":"attend","form":"attend","meaning_en":"go to a meeting or event","meaning":"참석하다"},{"word_id":"v0965","headword":"event","story_form":"event","form":"event","meaning_en":"a planned activity or occasion","meaning":"행사"},{"word_id":"v1793","headword":"noon","story_form":"noon","form":"noon","meaning_en":"twelve o'clock in the daytime","meaning":"정오"},{"word_id":"v1937","headword":"period","story_form":"period","form":"period","meaning_en":"a length of time","meaning":"기간, 시간"},{"word_id":"v1713","headword":"moment","story_form":"moment","form":"moment","meaning_en":"a very short time","meaning":"순간"},{"word_id":"v1453","headword":"interrupt","story_form":"interrupt","form":"interrupt","meaning_en":"stop someone while they are speaking or working","meaning":"방해하다"},{"word_id":"v0833","headword":"disturb","story_form":"disturb","form":"disturb","meaning_en":"bother someone who is busy or resting","meaning":"방해하다"},{"word_id":"v2558","headword":"stress","story_form":"stress","form":"stress","meaning_en":"worry caused by difficult demands","meaning":"스트레스"},{"word_id":"v0889","headword":"ease","story_form":"ease","form":"ease","meaning_en":"make something less painful or difficult","meaning":"덜다"}],"english":["My **calendar** shows a school **event** to **attend** at **noon** and another meeting after lunch.","I have only a short **period** to eat, and the busy day causes **stress**.","I ask my friends not to **interrupt** me for a **moment** while I sit quietly.","They do not **disturb** me, and a few slow breaths **ease** my worries."],"korean":["달력에는 정오에 참석할 학교 행사와 점심 이후의 다른 모임이 적혀 있다.","먹을 시간이 짧고 바쁜 하루 때문에 스트레스를 받는다.","나는 잠시 조용히 앉아 있는 동안 친구들에게 방해하지 말아 달라고 부탁한다.","친구들은 나를 방해하지 않고, 몇 차례 천천히 숨을 쉬자 걱정이 줄어든다."]},{"id":"C088","title":"어려운 소식","title_en":"Difficult News","targets":[{"word_id":"v0059","headword":"affair","story_form":"affair","form":"affair","meaning_en":"a matter or situation","meaning":"일"},{"word_id":"v0674","headword":"crisis","story_form":"crisis","form":"crisis","meaning_en":"a very serious and difficult situation","meaning":"위기"},{"word_id":"v1600","headword":"loss","story_form":"loss","form":"loss","meaning_en":"no longer having someone or something","meaning":"상실"},{"word_id":"v0838","headword":"divorce","story_form":"divorce","form":"divorce","meaning_en":"the legal ending of a marriage","meaning":"이혼"},{"word_id":"v0060","headword":"affect","story_form":"affect","form":"affect","meaning_en":"make a change to something","meaning":"영향을 미치다"},{"word_id":"v1444","headword":"intense","story_form":"intense","form":"intense","meaning_en":"very strong","meaning":"강렬한"},{"word_id":"v2654","headword":"tear","story_form":"tear","form":"tear","meaning_en":"a drop of liquid from your eye","meaning":"눈물"},{"word_id":"v2839","headword":"upset","story_form":"upset","form":"upset","meaning_en":"unhappy or worried","meaning":"속상한"},{"word_id":"v1769","headword":"neither","story_form":"neither","form":"neither","meaning_en":"not one of two things","meaning":"~도 아닌"},{"word_id":"v1794","headword":"nor","story_form":"nor","form":"nor","meaning_en":"and not the other thing","meaning":"~도 아닌"}],"english":["A family **affair** becomes a **crisis** when my friend hears about his parents’ **divorce**.","The news can **affect** him deeply, and his sense of **loss** is **intense**.","He looks **upset**, and a **tear** runs down his face.","I remind him that it is **neither** his fault **nor** his job to fix it, and I stay beside him."],"korean":["친구가 부모님의 이혼 소식을 듣자 집안일이 위기로 다가온다.","그 소식은 그에게 깊은 영향을 줄 수 있고 상실감도 강렬하다.","그는 속상해 보이고 눈물 한 방울이 얼굴을 타고 흐른다.","나는 그것이 그의 잘못도, 그가 해결할 일도 아니라고 상기시켜 주며 곁에 머문다."]},{"id":"C089","title":"학교에서 지켜야 할 것","title_en":"Rules at School","targets":[{"word_id":"v2826","headword":"uniform","story_form":"uniform","form":"uniform","meaning_en":"special clothes worn by members of a school","meaning":"교복"},{"word_id":"v1567","headword":"license","story_form":"license","form":"license","meaning_en":"an official document giving permission","meaning":"허가증"},{"word_id":"v2172","headword":"register","story_form":"register","form":"register","meaning_en":"put your name on an official list","meaning":"등록하다"},{"word_id":"v2204","headword":"require","story_form":"require","form":"require","meaning_en":"say that something is needed","meaning":"요구하다"},{"word_id":"v1859","headword":"ought","story_form":"ought","form":"ought","meaning_en":"should do something","meaning":"~해야 한다"},{"word_id":"v2366","headword":"shall","story_form":"shall","form":"shall","meaning_en":"will do something","meaning":"~하겠다"},{"word_id":"v1234","headword":"grant","story_form":"grant","form":"grant","meaning_en":"officially give permission","meaning":"허가하다"},{"word_id":"v2089","headword":"protest","story_form":"protest","form":"protest","meaning_en":"say that you strongly disagree","meaning":"항의하다"},{"word_id":"v0485","headword":"civil","story_form":"civil","form":"civil","meaning_en":"polite and respectful","meaning":"예의 바른"},{"word_id":"v1995","headword":"politics","story_form":"politics","form":"politics","meaning_en":"activities involving government and public decisions","meaning":"정치"}],"english":["At our school, club leaders **register** new members and wear a special **uniform** at events.","The town may **require** a **license** for a big show and **grant** it after checking the plan.","“We **shall** follow the rules,” our leader says, “but we **ought** to ask questions too.”","In a lesson about **politics**, we learn that people can **protest** in a **civil** way."],"korean":["우리 학교에서는 동아리 대표들이 새 회원을 등록하고 행사에서 특별한 단체복을 입는다.","마을에서는 큰 공연에 허가증을 요구하고 계획을 확인한 뒤 허가할 수 있다.","대표는 “우리는 규칙을 따르겠지만, 질문도 해야 합니다.”라고 말한다.","정치에 관한 수업에서 우리는 사람들이 예의 바르게 항의할 수 있다는 점을 배운다."]},{"id":"C090","title":"공장에서 바뀐 하루","title_en":"How Factory Work Has Changed","targets":[{"word_id":"v2379","headword":"shift","story_form":"shift","form":"shift","meaning_en":"a group working during a set period","meaning":"근무조"},{"word_id":"v1514","headword":"labor","story_form":"labor","form":"labor","meaning_en":"physical work","meaning":"노동"},{"word_id":"v2895","headword":"wage","story_form":"wage","form":"wage","meaning_en":"money paid for work","meaning":"임금"},{"word_id":"v1687","headword":"mill","story_form":"mill","form":"mill","meaning_en":"a factory that makes or processes material","meaning":"공장"},{"word_id":"v0512","headword":"coal","story_form":"coal","form":"coal","meaning_en":"a black rock burned for fuel","meaning":"석탄"},{"word_id":"v2532","headword":"steam","story_form":"steam","form":"steam","meaning_en":"water in the form of hot gas","meaning":"증기"},{"word_id":"v1466","headword":"iron","story_form":"iron","form":"iron","meaning_en":"a strong metal used to make steel","meaning":"철"},{"word_id":"v1709","headword":"modern","story_form":"modern","form":"modern","meaning_en":"related to the present time","meaning":"현대의"},{"word_id":"v0892","headword":"economy","story_form":"economy","form":"economy","meaning_en":"the way a society makes and uses money","meaning":"경제"},{"word_id":"v1396","headword":"income","story_form":"income","form":"income","meaning_en":"money you receive from work or other sources","meaning":"소득"}],"english":["Grandma tells me about a **shift** she worked at a **mill** long ago.","**Coal** made **steam** to run machines, and heavy **iron** parts required hard **labor**.","Her **wage** was small, but it was important **income** for the family.","She says the **modern** **economy** has changed many jobs, though workers still need fair pay."],"korean":["할머니는 오래전에 공장에서 일하셨던 근무조에 관해 말씀해 주신다.","석탄으로 만든 증기가 기계를 돌렸고, 무거운 철 부품을 다루는 일에는 고된 노동이 필요했다.","임금은 적었지만 가족에게는 중요한 소득이었다.","할머니는 현대 경제가 많은 직업을 바꾸었지만 노동자들에게는 여전히 공정한 보수가 필요하다고 말씀하신다."]},{"id":"C091","title":"밤의 소음 실험","title_en":"An Experiment with Night Sounds","targets":[{"word_id":"v0221","headword":"bang","story_form":"bang","form":"bang","meaning_en":"a sudden loud noise","meaning":"쾅 하는 소리"},{"word_id":"v0315","headword":"boom","story_form":"boom","form":"boom","meaning_en":"a deep loud sound","meaning":"쿵 하는 소리"},{"word_id":"v2001","headword":"pop","story_form":"pop","form":"pop","meaning_en":"a short sharp bursting sound","meaning":"펑 하는 소리"},{"word_id":"v2444","headword":"snap","story_form":"snap","form":"snap","meaning_en":"a short sharp cracking sound","meaning":"딱 하는 소리"},{"word_id":"v0369","headword":"burst","story_form":"burst","form":"burst","meaning_en":"break open suddenly","meaning":"터지다"},{"word_id":"v0304","headword":"blow","story_form":"blow","form":"blow","meaning_en":"send air out of your mouth","meaning":"불다"},{"word_id":"v2946","headword":"whistle","story_form":"whistle","form":"whistle","meaning_en":"a small tool that makes a high sound","meaning":"호루라기"},{"word_id":"v2989","headword":"yell","story_form":"yell","form":"yell","meaning_en":"a loud cry","meaning":"외침"},{"word_id":"v2391","headword":"shout","story_form":"shout","form":"shout","meaning_en":"a loud call","meaning":"외침"},{"word_id":"v2945","headword":"whisper","story_form":"whisper","form":"whisper","meaning_en":"very quiet speech","meaning":"속삭임"}],"english":["For our sound show, I **blow** a **whistle** while my friend makes a **bang** with a drum.","A bigger drum makes a **boom**, and a thin stick breaks with a **snap**.","A balloon can **burst** with a **pop**, so we warn everyone first.","We compare a **yell** with a **shout**, then end with a **whisper** so the room becomes quiet."],"korean":["소리 공연을 위해 내가 호루라기를 부는 동안 친구는 북으로 쾅 하는 소리를 낸다.","더 큰 북은 쿵 하는 소리를 내고, 가는 막대기는 딱 소리를 내며 부러진다.","풍선은 펑 소리를 내며 터질 수 있어서 먼저 모두에게 알려 준다.","우리는 두 가지 크게 외치는 소리를 비교한 다음, 방이 조용해지도록 속삭임으로 끝낸다."]},{"id":"C092","title":"청소하다 생긴 일","title_en":"An Accident While Cleaning","targets":[{"word_id":"v1674","headword":"mess","story_form":"mess","form":"mess","meaning_en":"a dirty or untidy state","meaning":"어질러진 상태"},{"word_id":"v0877","headword":"dump","story_form":"dump","form":"dump","meaning_en":"put something down carelessly","meaning":"내려놓다"},{"word_id":"v2571","headword":"stuff","story_form":"stuff","form":"stuff","meaning_en":"things whose names are not specified","meaning":"물건들"},{"word_id":"v0858","headword":"drag","story_form":"drag","form":"drag","meaning_en":"pull something along the ground","meaning":"끌다"},{"word_id":"v0364","headword":"bump","story_form":"bump","form":"bump","meaning_en":"hit something by accident","meaning":"부딪치다"},{"word_id":"v2437","headword":"smash","story_form":"smash","form":"smash","meaning_en":"break something into many pieces","meaning":"산산조각 내다"},{"word_id":"v2371","headword":"sharp","story_form":"sharp","form":"sharp","meaning_en":"having an edge that can cut","meaning":"날카로운"},{"word_id":"v1957","headword":"piece","story_form":"piece","form":"piece","meaning_en":"a part broken off something","meaning":"조각"},{"word_id":"v0820","headword":"disgust","story_form":"disgust","form":"disgust","meaning_en":"a strong feeling of dislike","meaning":"혐오감"},{"word_id":"v2383","headword":"shock","story_form":"shock","form":"shock","meaning_en":"a strong feeling of unpleasant surprise","meaning":"충격"}],"english":["My room is a **mess**, so I **dump** my old **stuff** into a box and **drag** it to the door.","I **bump** into a table and **smash** a glass plate.","One **sharp** **piece** falls to the floor, giving me a **shock**.","Dad looks at the old food in the box with **disgust** and brings a brush to help."],"korean":["방이 어질러져 있어서 나는 낡은 물건들을 상자에 내려놓고 문 쪽으로 끈다.","나는 탁자에 부딪쳐 유리 접시를 깨뜨린다.","날카로운 조각 하나가 바닥에 떨어져 나는 깜짝 놀란다.","아빠는 상자 안의 오래된 음식을 보고 질색하며 도우려고 솔을 가져오신다."]},{"id":"C093","title":"촬영 동아리","title_en":"The Film Club","targets":[{"word_id":"v2569","headword":"studio","story_form":"studio","form":"studio","meaning_en":"a room where films or recordings are made","meaning":"스튜디오"},{"word_id":"v0209","headword":"background","story_form":"background","form":"background","meaning_en":"what is behind the main subject","meaning":"배경"},{"word_id":"v2385","headword":"shoot","story_form":"shoot","form":"shoot","meaning_en":"make a film or take photographs","meaning":"촬영하다"},{"word_id":"v0503","headword":"clip","story_form":"clip","form":"clip","meaning_en":"a short part of a video","meaning":"짧은 영상"},{"word_id":"v0815","headword":"disc","story_form":"disc","form":"disc","meaning_en":"a flat round object storing sound or data","meaning":"디스크"},{"word_id":"v0444","headword":"channel","story_form":"channel","form":"channel","meaning_en":"a service that shows videos or programs","meaning":"채널"},{"word_id":"v1715","headword":"monitor","story_form":"monitor","form":"monitor","meaning_en":"watch and check something carefully","meaning":"확인하다"},{"word_id":"v1727","headword":"motion","story_form":"motion","form":"motion","meaning_en":"movement","meaning":"움직임"},{"word_id":"v2656","headword":"technique","story_form":"technique","form":"technique","meaning_en":"a special way of doing something","meaning":"기법"},{"word_id":"v2874","headword":"view","story_form":"view","form":"view","meaning_en":"watch or look at something","meaning":"보다"}],"english":["In the **studio**, we paint a **background** and **shoot** a short **clip** of a toy car.","Our teacher shows us a **technique** for making its **motion** look smooth.","We **monitor** the light and **view** the film on our class **channel**.","Then we save a copy on a **disc** for the school show."],"korean":["스튜디오에서 우리는 배경을 칠하고 장난감 자동차의 짧은 영상을 촬영한다.","선생님은 움직임을 매끄럽게 보이게 하는 기법을 알려 주신다.","우리는 빛을 확인하고 학급 채널에서 영상을 본다.","그런 다음 학교 행사에 쓸 복사본을 디스크에 저장한다."]},{"id":"C094","title":"시를 쓰는 오후","title_en":"An Afternoon of Poetry","targets":[{"word_id":"v1986","headword":"poem","story_form":"poem","form":"poem","meaning_en":"writing arranged in lines to express feelings","meaning":"시"},{"word_id":"v1987","headword":"poet","story_form":"poet","form":"poet","meaning_en":"a person who writes poems","meaning":"시인"},{"word_id":"v0796","headword":"diary","story_form":"diary","form":"diary","meaning_en":"a book for writing daily experiences","meaning":"일기장"},{"word_id":"v0292","headword":"blank","story_form":"blank","form":"blank","meaning_en":"having no writing on it","meaning":"빈"},{"word_id":"v2375","headword":"sheet","story_form":"sheet","form":"sheet","meaning_en":"one piece of paper","meaning":"종이 한 장"},{"word_id":"v1633","headword":"mark","story_form":"mark","form":"mark","meaning_en":"a visible line or spot","meaning":"자국"},{"word_id":"v2463","headword":"somewhat","story_form":"somewhat","form":"somewhat","meaning_en":"to a small degree","meaning":"다소"},{"word_id":"v1228","headword":"grace","story_form":"grace","form":"grace","meaning_en":"beauty in movement or style","meaning":"우아함"},{"word_id":"v0450","headword":"charm","story_form":"charm","form":"charm","meaning_en":"a quality that makes something pleasing","meaning":"매력"},{"word_id":"v1972","headword":"plain","story_form":"plain","form":"plain","meaning_en":"simple and easy to understand","meaning":"평이한"}],"english":["I open my **diary** and place a **blank** **sheet** beside it to write a **poem**.","At first, there is only one pencil **mark**, but I keep trying to think like a **poet**.","I use **plain** words to describe the **grace** of a bird and the **charm** of our garden.","I feel **somewhat** unsure, but my sister says the simple words have their own beauty."],"korean":["나는 시를 쓰려고 일기장을 펴고 옆에 빈 종이 한 장을 놓는다.","처음에는 연필 자국 하나뿐이지만, 나는 계속 시인처럼 생각해 보려고 한다.","나는 평이한 단어로 새의 우아함과 우리 정원의 매력을 묘사한다.","나는 다소 자신이 없지만, 언니는 그 단순한 단어들만의 아름다움이 있다고 말한다."]},{"id":"C095","title":"운동장에 그린 도형","title_en":"Shapes on the Playground","targets":[{"word_id":"v2508","headword":"square","story_form":"square","form":"square","meaning_en":"a shape with four equal sides and right angles","meaning":"정사각형"},{"word_id":"v2786","headword":"triangle","story_form":"triangle","form":"triangle","meaning_en":"a shape with three sides","meaning":"삼각형"},{"word_id":"v2536","headword":"step","story_form":"step","form":"step","meaning_en":"one movement of your foot when walking","meaning":"걸음"},{"word_id":"v2829","headword":"unit","story_form":"unit","form":"unit","meaning_en":"a fixed amount used for measuring","meaning":"단위"},{"word_id":"v1563","headword":"level","story_form":"level","form":"level","meaning_en":"flat and not sloping","meaning":"수평인"},{"word_id":"v2952","headword":"wide","story_form":"wide","form":"wide","meaning_en":"measuring a large distance from side to side","meaning":"넓은"},{"word_id":"v0351","headword":"broad","story_form":"broad","form":"broad","meaning_en":"wide from side to side","meaning":"넓은"},{"word_id":"v2699","headword":"thin","story_form":"thin","form":"thin","meaning_en":"having a small distance across","meaning":"가는"},{"word_id":"v2697","headword":"thick","story_form":"thick","form":"thick","meaning_en":"having a large distance across","meaning":"굵은"},{"word_id":"v2551","headword":"straight","story_form":"straight","form":"straight","meaning_en":"not bent or curved","meaning":"곧은"}],"english":["We draw a **square** and a **triangle** on a **level** part of the playground.","A meter is our **unit**, and the first shape is two meters **wide**.","We use **thin** chalk for the lines and a **thick** piece to make one **straight** path.","The **broad** path leads from one shape to the other.","We take one **step** at a time to check its length."],"korean":["우리는 운동장의 평평한 곳에 정사각형과 삼각형을 그린다.","단위는 미터이고, 첫 번째 도형의 너비는 2미터다.","선은 가는 분필로 그리고, 굵은 분필 조각으로 곧은 길 하나를 만든다.","넓은 길은 한 도형에서 다른 도형으로 이어진다.","우리는 길이를 확인하려고 한 걸음씩 걷는다."]},{"id":"C096","title":"크기를 비교하는 수업","title_en":"A Lesson on Comparing Sizes","targets":[{"word_id":"v1638","headword":"mass","story_form":"mass","form":"mass","meaning_en":"the amount of matter in an object","meaning":"질량"},{"word_id":"v1645","headword":"maximum","story_form":"maximum","form":"maximum","meaning_en":"the largest possible","meaning":"최대의"},{"word_id":"v1575","headword":"limit","story_form":"limit","form":"limit","meaning_en":"the greatest amount allowed","meaning":"한도"},{"word_id":"v1398","headword":"increase","story_form":"increase","form":"increase","meaning_en":"make something greater","meaning":"늘리다"},{"word_id":"v0992","headword":"expand","story_form":"expand","form":"expand","meaning_en":"make something larger","meaning":"확장하다"},{"word_id":"v1006","headword":"extend","story_form":"extend","form":"extend","meaning_en":"make something longer","meaning":"연장하다"},{"word_id":"v0935","headword":"enormous","story_form":"enormous","form":"enormous","meaning_en":"very large","meaning":"거대한"},{"word_id":"v0279","headword":"billion","story_form":"billion","form":"billion","meaning_en":"one thousand million","meaning":"십억"},{"word_id":"v2709","headword":"thousand","story_form":"thousand","form":"thousand","meaning_en":"ten hundreds","meaning":"천"},{"word_id":"v2998","headword":"zero","story_form":"zero","form":"zero","meaning_en":"the number meaning nothing","meaning":"영"}],"english":["Our class builds a paper bridge and tests the **maximum** **mass** it can hold.","We start at **zero** and **increase** the weight toward a **limit** of a **thousand** grams.","To make it stronger, we **expand** the base and **extend** the supports.","“A real bridge might cost a **billion** dollars,” Dad says, “but yours does not need an **enormous** budget.”"],"korean":["우리 반은 종이 다리를 만들고 버틸 수 있는 최대 질량을 시험한다.","우리는 영에서 시작해 천 그램이라는 한도를 향해 무게를 늘린다.","더 튼튼하게 하려고 밑부분을 넓히고 지지대를 연장한다.","아빠는 “실제 다리는 십억 달러가 들 수도 있겠지만, 너희 다리에 거대한 예산은 필요 없겠지.”라고 말씀하신다."]},{"id":"C097","title":"공구를 빌리다","title_en":"Borrowing Tools","targets":[{"word_id":"v1181","headword":"garage","story_form":"garage","form":"garage","meaning_en":"a building for keeping a car","meaning":"차고"},{"word_id":"v1214","headword":"glove","story_form":"glove","form":"glove","meaning_en":"a covering for your hand with separate fingers","meaning":"장갑"},{"word_id":"v1571","headword":"lift","story_form":"lift","form":"lift","meaning_en":"move something upward","meaning":"들어 올리다"},{"word_id":"v1544","headword":"lean","story_form":"lean","form":"lean","meaning_en":"rest against something","meaning":"기대다"},{"word_id":"v1538","headword":"lay","story_form":"lay","form":"lay","meaning_en":"put something down carefully","meaning":"놓다"},{"word_id":"v1568","headword":"lid","story_form":"lid","form":"lid","meaning_en":"a cover for a container","meaning":"뚜껑"},{"word_id":"v2728","headword":"tin","story_form":"tin","form":"tin","meaning_en":"a metal container","meaning":"금속 통"},{"word_id":"v2644","headword":"tap","story_form":"tap","form":"tap","meaning_en":"hit something lightly","meaning":"가볍게 두드리다"},{"word_id":"v2275","headword":"rub","story_form":"rub","form":"rub","meaning_en":"move your hand back and forth over something","meaning":"문지르다"},{"word_id":"v2537","headword":"stick","story_form":"stick","form":"stick","meaning_en":"attach something to a surface","meaning":"붙이다"}],"english":["In the **garage**, I put on a **glove** and **lift** a small **tin** from a shelf.","Dad asks me to **lay** it on the table, not **lean** it against the wall.","We **tap** the **lid** until it opens and **rub** dust off the inside.","Then we **stick** a new label on it and put our tools away."],"korean":["차고에서 나는 장갑을 끼고 선반에서 작은 금속 통을 들어 올린다.","아빠는 통을 벽에 기대지 말고 탁자에 놓으라고 하신다.","우리는 뚜껑이 열릴 때까지 가볍게 두드리고 안쪽의 먼지를 문질러 닦는다.","그런 다음 새 이름표를 붙이고 도구들을 정리한다."]},{"id":"C098","title":"봄맞이 옷 수선","title_en":"Mending Clothes for Spring","targets":[{"word_id":"v2361","headword":"sew","story_form":"sew","form":"sew","meaning_en":"join cloth using a needle and thread","meaning":"바느질하다"},{"word_id":"v2722","headword":"tie","story_form":"tie","form":"tie","meaning_en":"fasten something with a knot","meaning":"묶다"},{"word_id":"v1329","headword":"hole","story_form":"hole","form":"hole","meaning_en":"an opening in something","meaning":"구멍"},{"word_id":"v2838","headword":"upper","story_form":"upper","form":"upper","meaning_en":"closer to the top","meaning":"위쪽의"},{"word_id":"v0317","headword":"boot","story_form":"boot","form":"boot","meaning_en":"a shoe that covers the ankle or leg","meaning":"장화"},{"word_id":"v0225","headword":"bare","story_form":"bare","form":"bare","meaning_en":"not covered by clothing","meaning":"맨"},{"word_id":"v2390","headword":"shoulder","story_form":"shoulder","form":"shoulder","meaning_en":"the body part between your neck and arm","meaning":"어깨"},{"word_id":"v2737","headword":"toe","story_form":"toe","form":"toe","meaning_en":"one of the five digits on your foot","meaning":"발가락"},{"word_id":"v2757","headword":"towel","story_form":"towel","form":"towel","meaning_en":"a cloth used for drying","meaning":"수건"},{"word_id":"v2393","headword":"shower","story_form":"shower","form":"shower","meaning_en":"washing under falling water","meaning":"샤워"}],"english":["After a wet walk, I take off a **boot** and dry each **bare** **toe** with a **towel**.","I have a **shower**, then look at a **hole** in the **upper** part of my coat, near the **shoulder**.","Mom can **sew** it for me, and I help **tie** the thin string at the end.","Now the coat is ready for another walk."],"korean":["비에 젖은 산책을 마치고 나는 장화를 벗어 드러난 발가락을 수건으로 하나씩 닦는다.","샤워를 한 뒤 코트 위쪽, 어깨 근처에 난 구멍을 살펴본다.","엄마가 바느질해 주실 수 있어서 나는 끝에 가는 실을 묶는 일을 돕는다.","이제 코트가 다음 산책을 위해 준비되었다."]},{"id":"C099","title":"작은 실수의 큰 결과","title_en":"A Small Mistake, a Big Problem","targets":[{"word_id":"v0423","headword":"cause","story_form":"cause","form":"cause","meaning_en":"what makes something happen","meaning":"원인"},{"word_id":"v1695","headword":"minor","story_form":"minor","form":"minor","meaning_en":"small or not very serious","meaning":"작은"},{"word_id":"v1619","headword":"major","story_form":"major","form":"major","meaning_en":"large or important","meaning":"큰"},{"word_id":"v2794","headword":"trouble","story_form":"trouble","form":"trouble","meaning_en":"a problem or difficulty","meaning":"문제"},{"word_id":"v0557","headword":"complicate","story_form":"complicate","form":"complicate","meaning_en":"make something harder to deal with","meaning":"복잡하게 하다"},{"word_id":"v2405","headword":"simple","story_form":"simple","form":"simple","meaning_en":"easy to understand or do","meaning":"간단한"},{"word_id":"v0556","headword":"complex","story_form":"complex","form":"complex","meaning_en":"having many connected parts","meaning":"복잡한"},{"word_id":"v1617","headword":"main","story_form":"main","form":"main","meaning_en":"most important","meaning":"주요한"},{"word_id":"v1643","headword":"matter","story_form":"matter","form":"matter","meaning_en":"a subject or problem to deal with","meaning":"문제"},{"word_id":"v1399","headword":"indeed","story_form":"indeed","form":"indeed","meaning_en":"really or truly","meaning":"정말로"}],"english":["The **cause** of our computer **trouble** is a **minor** mistake in one name.","We fear a **major** problem and begin to **complicate** a **simple** **matter**.","Our teacher asks us to check the **main** computer before trying a **complex** repair.","She asks us to check the name, and the whole problem disappears.","It is **indeed** a much easier fix than we expected."],"korean":["컴퓨터 문제의 원인은 이름 하나에 있는 작은 실수다.","우리는 큰 문제일까 걱정하며 간단한 일을 복잡하게 만들기 시작한다.","선생님은 복잡한 수리를 시도하기 전에 주 컴퓨터를 확인하라고 하신다.","선생님이 이름을 확인하라고 하시자 문제가 모두 해결된다.","정말로 우리가 예상한 것보다 훨씬 쉬운 해결이었다."]},{"id":"C100","title":"새벽의 산책","title_en":"A Walk at Dawn","targets":[{"word_id":"v0721","headword":"dawn","story_form":"dawn","form":"dawn","meaning_en":"the time when daylight first appears","meaning":"새벽"},{"word_id":"v2248","headword":"rise","story_form":"rise","form":"rise","meaning_en":"move up into the sky","meaning":"뜨다"},{"word_id":"v2380","headword":"shine","story_form":"shine","form":"shine","meaning_en":"give out light","meaning":"빛나다"},{"word_id":"v2131","headword":"rainbow","story_form":"rainbow","form":"rainbow","meaning_en":"colored bands seen in the sky after rain","meaning":"무지개"},{"word_id":"v1298","headword":"hear","story_form":"hear","form":"hear","meaning_en":"notice a sound with your ears","meaning":"듣다"},{"word_id":"v1593","headword":"log","story_form":"log","form":"log","meaning_en":"a thick piece of a tree trunk","meaning":"통나무"},{"word_id":"v0266","headword":"bench","story_form":"bench","form":"bench","meaning_en":"a long seat for several people","meaning":"벤치"},{"word_id":"v2273","headword":"row","story_form":"row","form":"row","meaning_en":"things arranged in a straight line","meaning":"줄"},{"word_id":"v2949","headword":"whole","story_form":"whole","form":"whole","meaning_en":"all of something","meaning":"전체의"},{"word_id":"v2960","headword":"wing","story_form":"wing","form":"wing","meaning_en":"a body part a bird uses to fly","meaning":"날개"}],"english":["At **dawn**, we watch the sun **rise** and **shine** through the trees.","After a short rain, a **rainbow** appears above a **row** of houses.","We sit on a **bench** beside an old **log** and see a bird lift one **wing**.","We **hear** water nearby, and the **whole** morning feels quiet and new."],"korean":["새벽에 우리는 해가 떠서 나무 사이로 빛나는 모습을 본다.","짧은 비가 지나간 뒤 집들이 늘어선 줄 위로 무지개가 나타난다.","우리는 오래된 통나무 옆 벤치에 앉아 새가 한쪽 날개를 드는 것을 본다.","근처에서 물소리가 들리고, 아침 전체가 조용하고 새롭게 느껴진다."]},{"id":"C101","title":"망토 속의 지도","title_en":"The Map Inside the Cape","targets":[{"word_id":"v0052","headword":"adventure","story_form":"adventure","form":"adventure","meaning_en":"an exciting and sometimes risky experience","meaning":"모험"},{"word_id":"v0400","headword":"cape","story_form":"cape","form":"cape","meaning_en":"a loose piece of clothing over the shoulders","meaning":"망토"},{"word_id":"v0461","headword":"chest","story_form":"chest","form":"chest","meaning_en":"a large strong box","meaning":"상자"},{"word_id":"v1135","headword":"fortune","story_form":"fortune","form":"fortune","meaning_en":"a large amount of money or property","meaning":"재산"},{"word_id":"v2639","headword":"tale","story_form":"tale","form":"tale","meaning_en":"a story","meaning":"이야기"},{"word_id":"v2813","headword":"twist","story_form":"twist","form":"twist","meaning_en":"an unexpected change in a story","meaning":"뜻밖의 전개"},{"word_id":"v1722","headword":"moral","story_form":"moral","form":"moral","meaning_en":"a lesson about right and wrong","meaning":"교훈"},{"word_id":"v1377","headword":"imagine","story_form":"imagine","form":"imagine","meaning_en":"form a picture in your mind","meaning":"상상하다"},{"word_id":"v2553","headword":"strange","story_form":"strange","form":"strange","meaning_en":"unusual or surprising","meaning":"이상한"},{"word_id":"v1824","headword":"odd","story_form":"odd","form":"odd","meaning_en":"different from what is usual","meaning":"특이한"}],"english":["I **imagine** an **adventure** about a girl with a map inside her **cape**.","She finds a **strange** **chest** and thinks it holds a **fortune**.","The **tale** has an **odd** **twist**: the **chest** contains only letters from people she has helped.","Its **moral** is that kindness can be worth more than gold."],"korean":["나는 망토 안에 지도를 지닌 소녀의 모험을 상상한다.","소녀는 이상한 상자를 찾아 큰 재산이 들어 있다고 생각한다.","이야기에는 특이한 반전이 있다. 상자에는 소녀가 도왔던 사람들이 보낸 편지만 들어 있다.","이야기의 교훈은 친절함이 금보다 더 가치 있을 수 있다는 것이다."]},{"id":"C102","title":"선생님이 된 언니","title_en":"My Sister Becomes a Teacher","targets":[{"word_id":"v0202","headword":"award","story_form":"award","form":"award","meaning_en":"a prize given for doing something well","meaning":"상"},{"word_id":"v0773","headword":"deserve","story_form":"deserve","form":"deserve","meaning_en":"have earned the right to receive something","meaning":"받을 만하다"},{"word_id":"v1229","headword":"grade","story_form":"grade","form":"grade","meaning_en":"a school year level","meaning":"학년"},{"word_id":"v0895","headword":"educate","story_form":"educate","form":"educate","meaning_en":"teach someone and help them learn","meaning":"교육하다"},{"word_id":"v2832","headword":"university","story_form":"university","form":"university","meaning_en":"a place for advanced study after school","meaning":"대학교"},{"word_id":"v2049","headword":"prime","story_form":"prime","form":"prime","meaning_en":"main or most important","meaning":"주된"},{"word_id":"v0077","headword":"aim","story_form":"aim","form":"aim","meaning_en":"something you want to achieve","meaning":"목표"},{"word_id":"v2034","headword":"presence","story_form":"presence","form":"presence","meaning_en":"being at an event or place","meaning":"참석"},{"word_id":"v0941","headword":"entire","story_form":"entire","form":"entire","meaning_en":"all of something","meaning":"전체의"},{"word_id":"v2170","headword":"regard","story_form":"regard","form":"regard","meaning_en":"think of someone in a particular way","meaning":"여기다"}],"english":["My sister studies at a **university** because her **prime** **aim** is to **educate** young children.","She helps an **entire** class in the first **grade** learn to read and wins an **award**.","“You **deserve** it,” I say, and she thanks our family for our **presence** at the event.","I **regard** her as someone who can make school a happier place."],"korean":["언니의 주된 목표는 어린아이들을 교육하는 것이어서 대학에서 공부한다.","언니는 1학년 학급 전체가 읽기를 배우도록 돕고 상을 받는다.","내가 “언니는 받을 만해.”라고 말하자 언니는 행사에 참석한 가족들에게 고마워한다.","나는 언니가 학교를 더 행복한 곳으로 만들 수 있는 사람이라고 생각한다."]},{"id":"C103","title":"처음 본 오페라","title_en":"My First Opera","targets":[{"word_id":"v2689","headword":"theater","story_form":"theater","form":"theater","meaning_en":"a building where plays are performed","meaning":"극장"},{"word_id":"v1840","headword":"opera","story_form":"opera","form":"opera","meaning_en":"a play with words that are sung","meaning":"오페라"},{"word_id":"v1968","headword":"pitch","story_form":"pitch","form":"pitch","meaning_en":"how high or low a sound is","meaning":"음의 높이"},{"word_id":"v2141","headword":"rather","story_form":"rather","form":"rather","meaning_en":"to some degree","meaning":"다소"},{"word_id":"v1903","headword":"particular","story_form":"particular","form":"particular","meaning_en":"a certain one","meaning":"특정한"},{"word_id":"v2157","headword":"recommend","story_form":"recommend","form":"recommend","meaning_en":"say that something is good to try","meaning":"추천하다"},{"word_id":"v2154","headword":"recent","story_form":"recent","form":"recent","meaning_en":"happening not long ago","meaning":"최근의"},{"word_id":"v1941","headword":"person","story_form":"person","form":"person","meaning_en":"a human being","meaning":"사람"},{"word_id":"v2122","headword":"quite","story_form":"quite","form":"quite","meaning_en":"fairly or to a considerable degree","meaning":"꽤"},{"word_id":"v2490","headword":"spend","story_form":"spend","form":"spend","meaning_en":"use time doing something","meaning":"시간을 보내다"}],"english":["A friend can **recommend** a **recent** **opera** at our town **theater**.","I am not the kind of **person** who knows much about it, but I decide to **spend** an evening there.","One song has a **rather** high **pitch**, and that **particular** part surprises me.","By the end, I find the whole show **quite** moving."],"korean":["한 친구가 우리 마을 극장에서 최근 공연하는 오페라를 추천해 준다.","나는 오페라를 잘 아는 사람은 아니지만 그곳에서 저녁 시간을 보내기로 한다.","한 노래의 음이 다소 높아서 그 특정한 부분이 나를 놀라게 한다.","공연이 끝날 무렵 나는 전체 공연이 꽤 감동적이라고 느낀다."]},{"id":"C104","title":"초콜릿 간식 만들기","title_en":"Making Chocolate Treats","targets":[{"word_id":"v1680","headword":"microwave","story_form":"microwave","form":"microwave","meaning_en":"an oven that heats food with electromagnetic waves","meaning":"전자레인지"},{"word_id":"v1866","headword":"oven","story_form":"oven","form":"oven","meaning_en":"a closed heated space for cooking","meaning":"오븐"},{"word_id":"v1978","headword":"plate","story_form":"plate","form":"plate","meaning_en":"a flat dish for food","meaning":"접시"},{"word_id":"v2017","headword":"powder","story_form":"powder","form":"powder","meaning_en":"a dry substance in tiny pieces","meaning":"가루"},{"word_id":"v0468","headword":"chip","story_form":"chip","form":"chip","meaning_en":"a small piece of something","meaning":"작은 조각"},{"word_id":"v0357","headword":"bubble","story_form":"bubble","form":"bubble","meaning_en":"a small round pocket of air in liquid","meaning":"거품"},{"word_id":"v0601","headword":"contain","story_form":"contain","form":"contain","meaning_en":"have something inside","meaning":"함유하다"},{"word_id":"v1010","headword":"extra","story_form":"extra","form":"extra","meaning_en":"more than the usual amount","meaning":"추가의"},{"word_id":"v1982","headword":"plenty","story_form":"plenty","form":"plenty","meaning_en":"enough or more than enough","meaning":"충분한 양"},{"word_id":"v2498","headword":"spoil","story_form":"spoil","form":"spoil","meaning_en":"make something bad or unusable","meaning":"망치다"}],"english":["We put chocolate **powder** and an **extra** chocolate **chip** into a small cake mix.","The box says it may **contain** nuts, so we check before sharing it.","We use the **oven**, not the **microwave**, and watch a **bubble** form on top.","There is **plenty** for everyone, but we let it cool on a **plate** so we do not **spoil** it by cutting too soon."],"korean":["우리는 작은 케이크 반죽에 초콜릿 가루와 초콜릿 조각 하나를 추가로 넣는다.","상자에는 견과류가 들어 있을 수 있다고 쓰여 있어서 나누어 먹기 전에 확인한다.","우리는 전자레인지 대신 오븐을 사용하고 윗면에 거품이 생기는 것을 본다.","모두가 먹을 만큼 충분하지만, 너무 일찍 잘라 망치지 않도록 접시에 놓고 식힌다."]},{"id":"C105","title":"우리 몸 전시관","title_en":"At the Human Body Exhibit","targets":[{"word_id":"v0332","headword":"brain","story_form":"brain","form":"brain","meaning_en":"the organ inside your head that controls thinking","meaning":"뇌"},{"word_id":"v1771","headword":"nerve","story_form":"nerve","form":"nerve","meaning_en":"a fiber carrying messages through the body","meaning":"신경"},{"word_id":"v2743","headword":"tongue","story_form":"tongue","form":"tongue","meaning_en":"the soft part inside your mouth used for tasting","meaning":"혀"},{"word_id":"v2618","headword":"swallow","story_form":"swallow","form":"swallow","meaning_en":"move food from your mouth to your stomach","meaning":"삼키다"},{"word_id":"v1450","headword":"internal","story_form":"internal","form":"internal","meaning_en":"inside the body","meaning":"내부의"},{"word_id":"v0430","headword":"cell","story_form":"cell","form":"cell","meaning_en":"the smallest living unit of the body","meaning":"세포"},{"word_id":"v2915","headword":"weak","story_form":"weak","form":"weak","meaning_en":"not strong","meaning":"약한"},{"word_id":"v1026","headword":"faint","story_form":"faint","form":"faint","meaning_en":"lose consciousness for a short time","meaning":"기절하다"},{"word_id":"v0987","headword":"exhaust","story_form":"exhaust","form":"exhaust","meaning_en":"make someone very tired","meaning":"지치게 하다"},{"word_id":"v1890","headword":"panic","story_form":"panic","form":"panic","meaning_en":"sudden strong fear that makes thinking difficult","meaning":"공포"}],"english":["At a body show, we see how a **nerve** carries a message to the **brain**.","A model shows the **tongue** moving food before we **swallow**, and another shows an **internal** **cell**.","The hot room can **exhaust** me, and I begin to feel **weak**.","I tell Dad before I **faint**, and he helps me sit down without **panic**."],"korean":["인체 전시에서 우리는 신경이 뇌로 메시지를 전달하는 방식을 본다.","모형 하나는 삼키기 전에 혀가 음식을 움직이는 모습을 보여 주고, 다른 모형은 몸속 세포를 보여 준다.","더운 방 때문에 지칠 수 있어서 나는 힘이 빠지기 시작한다.","기절하기 전에 아빠께 말씀드리자 아빠는 당황하지 않고 내가 앉도록 도와주신다."]},{"id":"C106","title":"우리만의 가상 도시","title_en":"Our Own Make-Believe Town","targets":[{"word_id":"v2649","headword":"tax","story_form":"tax","form":"tax","meaning_en":"money paid to the government","meaning":"세금"},{"word_id":"v2764","headword":"trade","story_form":"trade","form":"trade","meaning_en":"buy and sell goods","meaning":"거래하다"},{"word_id":"v2543","headword":"stock","story_form":"stock","form":"stock","meaning_en":"goods kept ready to sell","meaning":"재고"},{"word_id":"v2082","headword":"property","story_form":"property","form":"property","meaning_en":"things that someone owns","meaning":"재산"},{"word_id":"v2010","headword":"possess","story_form":"possess","form":"possess","meaning_en":"own or have something","meaning":"소유하다"},{"word_id":"v1439","headword":"insure","story_form":"insure","form":"insure","meaning_en":"buy protection against financial loss","meaning":"보험에 들다"},{"word_id":"v1138","headword":"found","story_form":"found","form":"found","meaning_en":"start an organization","meaning":"설립하다"},{"word_id":"v1226","headword":"govern","story_form":"govern","form":"govern","meaning_en":"control and lead a place","meaning":"다스리다"},{"word_id":"v2523","headword":"state","story_form":"state","form":"state","meaning_en":"an area with its own government within a country","meaning":"주"},{"word_id":"v2171","headword":"region","story_form":"region","form":"region","meaning_en":"a large area of land","meaning":"지역"}],"english":["In a class game, we **found** a new town in a make-believe **state** and choose people to **govern** it.","Each team can **possess** **property**, **trade** goods, and keep a **stock** of food.","We pay a small **tax** to build roads across the **region**.","Some teams also **insure** their shops against fire in the game."],"korean":["학급 게임에서 우리는 가상의 주에 새 마을을 세우고 다스릴 사람들을 뽑는다.","팀마다 재산을 소유하고 물건을 거래하며 식량 재고를 보유할 수 있다.","우리는 지역 전체에 도로를 만들려고 적은 세금을 낸다.","일부 팀은 게임 속에서 가게의 화재 보험에도 가입한다."]},{"id":"C107","title":"홍수에서 구조되다","title_en":"Rescued from a Flood","targets":[{"word_id":"v2137","headword":"rapid","story_form":"rapid","form":"rapid","meaning_en":"happening or moving quickly","meaning":"빠른"},{"word_id":"v1306","headword":"helicopter","story_form":"helicopter","form":"helicopter","meaning_en":"an aircraft with large rotating blades","meaning":"헬리콥터"},{"word_id":"v2263","headword":"roof","story_form":"roof","form":"roof","meaning_en":"the top covering of a building","meaning":"지붕"},{"word_id":"v2643","headword":"tank","story_form":"tank","form":"tank","meaning_en":"a large container for liquid","meaning":"탱크"},{"word_id":"v1524","headword":"lane","story_form":"lane","form":"lane","meaning_en":"a narrow road or path","meaning":"좁은 길"},{"word_id":"v1737","headword":"mud","story_form":"mud","form":"mud","meaning_en":"wet soft earth","meaning":"진흙"},{"word_id":"v2612","headword":"surround","story_form":"surround","form":"surround","meaning_en":"be all around something","meaning":"둘러싸다"},{"word_id":"v0779","headword":"desperate","story_form":"desperate","form":"desperate","meaning_en":"feeling that help is urgently needed","meaning":"절박한"},{"word_id":"v2711","headword":"threat","story_form":"threat","form":"threat","meaning_en":"something that may cause harm","meaning":"위협"},{"word_id":"v0143","headword":"approach","story_form":"approach","form":"approach","meaning_en":"come closer to something","meaning":"다가오다"}],"english":["After heavy rain, **rapid** streams of **mud** **surround** a house at the end of our **lane**.","A water **tank** breaks, and the rising water becomes a **threat**.","The family waits on the **roof** and feels **desperate** for help.","We see a **helicopter** **approach**, and its team brings everyone to safety."],"korean":["폭우 뒤 빠른 진흙 물줄기들이 우리 골목 끝의 집을 둘러싼다.","물탱크가 부서지고, 불어나는 물이 위협이 된다.","가족은 지붕에서 기다리며 절박하게 도움을 바란다.","헬리콥터가 다가오는 것이 보이고, 대원들이 모두를 안전한 곳으로 데려간다."]},{"id":"C108","title":"처음 해 보는 골프","title_en":"Trying Golf for the First Time","targets":[{"word_id":"v1222","headword":"golf","story_form":"golf","form":"golf","meaning_en":"a game of hitting a ball into holes","meaning":"골프"},{"word_id":"v2716","headword":"throw","story_form":"throw","form":"throw","meaning_en":"send something through the air with your hand","meaning":"던지다"},{"word_id":"v2561","headword":"strike","story_form":"s :"언급하다"},{"word_id":"v1410","headword":"inform","story_form":"inform","form":"inform","meaning_en":"give someone information","meaning":"알리다"},{"word_id":"v2331","headword":"secretary","story_form":"secretary","form":"secretary","meaning_en":"a person who keeps a meeting's records","meaning":"서기"},{"word_id":"v2191","headword":"remind","story_form":"remind","form":"remind","meaning_en":"help someone remember","meaning":"상기시키다"},{"word_id":"v2044","headword":"previous","story_form":"previous","form":"previous","meaning_en":"happening before the present one","meaning":"이전의"},{"word_id":"v2674","headword":"term","story_form":"term","form":"term","meaning_en":"one part of a school year","meaning":"학기"},{"word_id":"v0594","headword":"constant","story_form":"constant","form":"constant","meaning_en":"happening again and again","meaning":"끊임없는"},{"word_id":"v1516","headword":"lack","story_form":"lack","form":"lack","meaning_en":"not having enough of something","meaning":"부족"}],"english":["I **chat** with friends and forget a club meeting, so the **secretary** comes to **remind** me.","She says she did **inform** us and **mention** the time in her message.","My **constant** lateness may **annoy** the others, especially after the same problem in the **previous** **term**.","I admit my **lack** of planning and put the next meeting in my calendar."],"korean":["나는 친구들과 잡담하다가 동아리 회의를 잊어버려서 서기가 상기시켜 주러 온다.","그녀는 우리에게 분명 알렸고 메시지에서 시간을 언급했다고 말한다.","이전 학기에도 같은 문제가 있었으므로 내가 계속 늦으면 다른 사람들이 짜증 날 수 있다.","나는 계획이 부족했음을 인정하고 다음 회의를 달력에 적는다."]},{"id":"C110","title":"게임을 멈출 시간","title_en":"Time to Stop Playing","targets":[{"word_id":"v0271","headword":"bet","story_form":"bet","form":"bet","meaning_en":"feel sure that something is true","meaning":"확신하다"},{"word_id":"v0255","headword":"beg","story_form":"beg","form":"beg","meaning_en":"ask very strongly for something","meaning":"간청하다"},{"word_id":"v1048","headword":"favor","story_form":"favor","form":"favor","meaning_en":"a helpful thing done for someone","meaning":"부탁"},{"word_id":"v1561","headword":"let","story_form":"let","form":"let","meaning_en":"allow someone to do something","meaning":"허락하다"},{"word_id":"v2211","headword":"resist","story_form":"resist","form":"resist","meaning_en":"stop yourself from doing something","meaning":"참다"},{"word_id":"v1445","headword":"intent","story_form":"intent","form":"intent","meaning_en":"what someone plans to do","meaning":"의도"},{"word_id":"v2341","headword":"self","story_form":"self","form":"self","meaning_en":"the person you are","meaning":"자기 자신"},{"word_id":"v1599","headword":"lose","story_form":"lose","form":"lose","meaning_en":"no longer have something","meaning":"잃다"},{"word_id":"v2981","headword":"worth","story_form":"worth","form":"worth","meaning_en":"valuable enough to do or have","meaning":"~할 가치가 있는"},{"word_id":"v1433","headword":"instead","story_form":"instead","form":"instead","meaning_en":"in place of something else","meaning":"대신에"}],"english":["“I **bet** I can win the next game,” I say, but I might **lose** more time.","I **beg** Dad to **let** me play again and ask for one small **favor**.","His **intent** is not to be mean; he wants me to **resist** the wish to keep playing.","I think of my future **self** and decide to stop for today.","A short walk is **worth** trying **instead**."],"korean":["나는 “다음 게임에서는 분명 이길 수 있어.”라고 말하지만 시간을 더 잃을 수도 있다.","나는 아빠께 한 번 더 하게 해 달라고 간청하며 작은 부탁을 드린다.","아빠의 의도는 심술을 부리는 것이 아니라 내가 계속 하고 싶은 충동을 참도록 하는 것이다.","나는 미래의 나를 생각하며 오늘은 그만하기로 한다.","대신 짧게 산책해 볼 만하다."]},{"id":"C111","title":"휴가용 집 살펴보기","title_en":"A Look Inside a Vacation Home","targets":[{"word_id":"v2876","headword":"villa","story_form":"villa","form":"villa","meaning_en":"a house used for holidays","meaning":"휴가용 집"},{"word_id":"v0427","headword":"ceiling","story_form":"ceiling","form":"ceiling","meaning_en":"the inside top surface of a room","meaning":"천장"},{"word_id":"v1521","headword":"lamp","story_form":"lamp","form":"lamp","meaning_en":"a device that gives light","meaning":"등"},{"word_id":"v2739","headword":"toilet","story_form":"toilet","form":"toilet","meaning_en":"a room with a toilet in it","meaning":"화장실"},{"word_id":"v2797","headword":"trunk","story_form":"trunk","form":"trunk","meaning_en":"a large box for carrying belongings","meaning":"큰 짐 상자"},{"word_id":"v2416","headword":"situate","story_form":"situate","form":"situate","meaning_en":"put something in a particular place","meaning":"위치시키다, 배치하다"},{"word_id":"v2332","headword":"section","story_form":"section","form":"section","meaning_en":"one part of a larger area","meaning":"구역"},{"word_id":"v2349","headword":"separate","story_form":"separate","form":"separate","meaning_en":"not joined to another part","meaning":"분리된"},{"word_id":"v0133","headword":"apart","story_form":"apart","form":"apart","meaning_en":"away from each other","meaning":"떨어져"},{"word_id":"v2411","headword":"single","story_form":"single","form":"single","meaning_en":"only one","meaning":"단 하나의"}],"english":["We plan to **situate** our model **villa** beside a paper lake.","Inside, a **lamp** hangs from the **ceiling**, and the **toilet** is in a **separate** **section**.","Two beds stand far **apart**, with an old **trunk** between them.","We draw every room carefully, making sure each has a **single** door."],"korean":["우리는 모형 휴가용 집을 종이 호수 옆에 배치할 계획이다.","안에는 등이 천장에 매달려 있고, 화장실은 분리된 구역에 있다.","침대 두 개는 서로 멀리 떨어져 있으며 사이에 오래된 짐 상자가 있다.","우리는 방마다 문이 하나씩 있는지 확인하며 세심하게 그린다."]},{"id":"C112","title":"무늬의 비밀","title_en":"The Secret of the Pattern","targets":[{"word_id":"v2112","headword":"puzzle","story_form":"puzzle","form":"puzzle","meaning_en":"a game or problem that tests your thinking","meaning":"퍼즐"},{"word_id":"v2436","headword":"smart","story_form":"smart","form":"smart","meaning_en":"clever and quick to learn","meaning":"똑똑한"},{"word_id":"v2692","headword":"theory","story_form":"theory","form":"theory","meaning_en":"an idea that may explain something","meaning":"가설"},{"word_id":"v0759","headword":"demonstrate","story_form":"demonstrate","form":"demonstrate","meaning_en":"show how something works","meaning":"보여 주다"},{"word_id":"v0907","headword":"element","story_form":"element","form":"element","meaning_en":"one part of a whole","meaning":"요소"},{"word_id":"v1578","headword":"link","story_form":"link","form":"link","meaning_en":"connect things together","meaning":"연결하다"},{"word_id":"v1431","headword":"instance","story_form":"instance","form":"instance","meaning_en":"an example of something","meaning":"사례"},{"word_id":"v0447","headword":"characteristic","story_form":"characteristic","form":"characteristic","meaning_en":"a feature that helps identify something","meaning":"특징"},{"word_id":"v2404","headword":"similar","story_form":"similar","form":"similar","meaning_en":"almost the same","meaning":"비슷한"},{"word_id":"v2351","headword":"series","story_form":"series","form":"series","meaning_en":"a group of related things in order","meaning":"연속된 묶음"}],"english":["My friend has a **theory** about a **puzzle** with colored shapes.","She finds a **similar** **characteristic** in each **element** and tries to **link** the matching pieces.","To **demonstrate**, she shows one **instance** where two red edges fit together.","“That is **smart**,” I say, and we finish the last row together.","This is the first in a **series** of puzzles we want to try."],"korean":["친구는 색깔 도형 퍼즐에 관한 가설을 가지고 있다.","친구는 각 요소에서 비슷한 특징을 찾아 맞는 조각들을 연결하려고 한다.","그것을 보여 주려고 빨간 가장자리 두 개가 서로 맞는 사례 하나를 보여 준다.","나는 “똑똑한 생각이네.”라고 말하고, 우리는 마지막 줄을 함께 완성한다.","이것은 우리가 해 보고 싶은 일련의 퍼즐 중 첫 번째다."]},{"id":"C113","title":"마을 퍼레이드","title_en":"The Town Parade","targets":[{"word_id":"v1893","headword":"parade","story_form":"parade","form":"parade","meaning_en":"a public march with music or decorated vehicles","meaning":"퍼레이드"},{"word_id":"v2451","headword":"social","story_form":"social","form":"social","meaning_en":"related to meeting and enjoying other people","meaning":"사교의"},{"word_id":"v1465","headword":"involve","story_form":"involve","form":"involve","meaning_en":"make someone part of an activity","meaning":"참여시키다"},{"word_id":"v0931","headword":"engage","story_form":"engage","form":"engage","meaning_en":"take part in something","meaning":"참여하다"},{"word_id":"v0110","headword":"among","story_form":"among","form":"among","meaning_en":"in the middle of a group","meaning":"~사이에"},{"word_id":"v2855","headword":"various","story_form":"various","form":"various","meaning_en":"of different kinds","meaning":"다양한"},{"word_id":"v2359","headword":"several","story_form":"several","form":"several","meaning_en":"more than two but not many","meaning":"여러"},{"word_id":"v0883","headword":"each","story_form":"each","form":"each","meaning_en":"every one considered separately","meaning":"각각의"},{"word_id":"v2505","headword":"spread","story_form":"spread","form":"spread","meaning_en":"make something reach more people or places","meaning":"퍼뜨리다"},{"word_id":"v0104","headword":"altogether","story_form":"altogether","form":"altogether","meaning_en":"with everything counted together","meaning":"모두 합쳐"}],"english":["Our town plans a **parade** to help people **engage** in a **social** activity.","We **involve** **several** clubs, and **each** brings **various** flags and songs.","I walk **among** the singers as we **spread** smiles along the street.","There are fifty of us **altogether**, and no one has to walk alone."],"korean":["우리 마을은 사람들이 사교 활동에 참여하도록 퍼레이드를 계획한다.","우리는 여러 동아리를 참여시키고, 각 동아리는 다양한 깃발과 노래를 준비한다.","나는 노래하는 사람들 사이에서 걸으며 거리에 미소를 퍼뜨린다.","우리는 모두 합쳐 50명이고, 누구도 혼자 걸을 필요가 없다."]},{"id":"C114","title":"완벽하지 않아도 괜찮아","title_en":"It Is Okay Not to Be Perfect","targets":[{"word_id":"v2568","headword":"struggle","story_form":"struggle","form":"struggle","meaning_en":"try hard to do something difficult","meaning":"애쓰다"},{"word_id":"v0011","headword":"absolute","story_form":"absolute","form":"absolute","meaning_en":"complete and without limits","meaning":"절대적인"},{"word_id":"v0745","headw 337","headword":"seek","story_form":"seek","form":"seek","meaning_en":"try to find something","meaning":"찾다"},{"word_id":"v2426","headword":"slave","story_form":"slave","form":"slave","meaning_en":"a person forced to work and treated as property","meaning":"노예"},{"word_id":"v0103","headword":"although","story_form":"although","form":"although","meaning_en":"even though","meaning":"비록 ~이지만"},{"word_id":"v0780","headword":"despite","story_form":"despite","form":"despite","meaning_en":"without being stopped by something","meaning":"~에도 불구하고"},{"word_id":"v0963","headword":"even","story_form":"even","form":"even","meaning_en":"used to emphasize something surprising","meaning":"심지어"},{"word_id":"v1791","headword":"none","story_form":"none","form":"none","meaning_en":"not one person or thing","meaning":"아무도 ~않다"}],"english":["In an old tale, a young man held as a **slave** decides to **seek** freedom.","**Although** he is afraid, he moves **forward** **despite** the danger.","**Upon** hearing a guard, he steps **aside** behind a tree and does not **even** breathe loudly.","When the road is clear, he sets **forth** toward a town where people will help him.","**None** of his new friends will send him back."],"korean":["옛이야기에서 노예로 붙잡혀 있던 젊은 남자가 자유를 찾아 나서기로 한다.","그는 두렵지만 위험에도 불구하고 앞으로 나아간다.","경비의 소리를 듣자마자 나무 뒤로 비켜서서 숨소리조차 크게 내지 않는다.","길이 조용해지자 그는 자신을 도와줄 사람들이 있는 마을을 향해 길을 나선다.","새 친구들 중 누구도 그를 돌려보내지 않을 것이다."]},{"id":"C119","title":"바다 모양 파티","title_en":"A Sea-Themed Party","targets":[{"word_id":"v0982","headword":"excite","story_form":"excite","form":"excite","meaning_en":"make someone feel eager and happy","meaning":"신나게 하다"},{"word_id":"v0953","headword":"especial","story_form":"especially","form":"especially","meaning_en":"particularly or more than usual, in especially","meaning":"특별한 → especially: 특히"},{"word_id":"v0979","headword":"except","story_form":"except","form":"except","meaning_en":"not including","meaning":"~을 제외하고"},{"word_id":"v0913","headword":"else","story_f
