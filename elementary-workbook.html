as we walk through the door.\",\"After the ceremony, she shows me her beautiful **ring**.\",\"We **congratulate** the couple and **thank** them for the lovely meal.\",\"I wave **goodbye**, feeling happy about our special family day.\"],\"korean\":[\"휴가 중에 우리는 이모의 결혼식에 참석하려고 이모를 방문한다.\",\"이모는 작은 교회에서 친구와 결혼하실 것이다.\",\"우리가 문으로 들어가자 이모는 “어서 와!”라고 말씀하신다.\",\"예식이 끝난 뒤 이모는 아름다운 반지를 보여 주신다.\",\"우리는 두 분을 축하하고 맛있는 식사에 감사드린다.\",\"나는 특별한 가족의 날이 기뻐서 손을 흔들어 작별 인사를 한다.\"]},{\"id\":\"E055\",\"title\":\"캠핑의 밤\",\"title_en\":\"A Night of Camping\",\"targets\":[{\"word_id\":\"v0390\",\"headword\":\"camp\",\"story_form\":\"camp\",\"form\":\"camp\",\"meaning_en\":\"stay outdoors overnight\",\"meaning\":\"야영하다\"},{\"word_id\":\"v2673\",\"headword\":\"tent\",\"story_form\":\"tent\",\"form\":\"tent\",\"meaning_en\":\"a cloth shelter used outdoors\",\"meaning\":\"텐트\"},{\"word_id\":\"v1081\",\"headword\":\"fire\",\"story_form\":\"fire\",\"form\":\"fire\",\"meaning_en\":\"burning that produces heat and light\",\"meaning\":\"불\"},{\"word_id\":\"v2974\",\"headword\":\"wood\",\"story_form\":\"wood\",\"form\":\"wood\",\"meaning_en\":\"hard material from a tree\",\"meaning\":\"나무, 목재\"},{\"word_id\":\"v0368\",\"headword\":\"burn\",\"story_form\":\"burn\",\"form\":\"burn\",\"meaning_en\":\"be on fire\",\"meaning\":\"타다\"},{\"word_id\":\"v0714\",\"headword\":\"dark\",\"story_form\":\"dark\",\"form\":\"dark\",\"meaning_en\":\"with little or no light\",\"meaning\":\"어두운\"},{\"word_id\":\"v1783\",\"headword\":\"night\",\"story_form\":\"night\",\"form\":\"night\",\"meaning_en\":\"the time when the sun is down\",\"meaning\":\"밤\"},{\"word_id\":\"v2427\",\"headword\":\"sleep\",\"story_form\":\"sleep\",\"form\":\"sleep\",\"meaning_en\":\"rest with your eyes closed\",\"meaning\":\"자다\"},{\"word_id\":\"v0863\",\"headword\":\"dream\",\"story_form\":\"dream\",\"form\":\"dream\",\"meaning_en\":\"images or events experienced while asleep\",\"meaning\":\"꿈\"},{\"word_id\":\"v0964\",\"headword\":\"evening\",\"st ther picture.\",\"We learned about local **history** and **culture** at that festival.\",\"I do not want to **forget** that happy **memory**.\",\"We add a **new** class photo and plan to open the box **next** year.\"],\"korean\":[\"우리 반은 미래를 위해 추억 상자를 만든다.\",\"나는 작년 여행에서 찍은 오래된 사진을 가져온다.\",\"“이 춤 기억하니?” 메이가 다른 사진을 보여 주며 묻는다.\",\"우리는 그 축제에서 지역 역사와 문화를 배웠다.\",\"나는 그 행복한 기억을 잊고 싶지 않다.\",\"우리는 새 학급 사진을 넣고 내년에 상자를 열기로 한다.\"]},{\"id\":\"E070\",\"title\":\"현장 학습\",\"title_en\":\"A School Trip\",\"targets\":[{\"word_id\":\"v0525\",\"headword\":\"college\",\"story_form\":\"college\",\"form\":\"college\",\"meaning_en\":\"a place for study after secondary school\",\"meaning\":\"대학\"},{\"word_id\":\"v1755\",\"headword\":\"nation\",\"story_form\":\"nation\",\"form\":\"nation\",\"meaning_en\":\"a country and its people\",\"meaning\":\"국가\"},{\"word_id\":\"v2902\",\"headword\":\"war\",\"story_form\":\"war\",\"form\":\"war\",\"meaning_en\":\"fighting between countries or groups\",\"meaning\":\"전쟁\"},{\"word_id\":\"v2476\",\"headword\":\"south\",\"story_form\":\"south\",\"form\":\"south\",\"meaning_en\":\"the direction opposite north\",\"meaning\":\"남쪽\"},{\"word_id\":\"v1681\",\"headword\":\"middle\",\"story_form\":\"middle\",\"form\":\"middle\",\"meaning_en\":\"the central part\",\"meaning\":\"가운데\"},{\"word_id\":\"v0432\",\"headword\":\"center\",\"story_form\":\"center\",\"form\":\"center\",\"meaning_en\":\"a place for a particular activity\",\"meaning\":\"센터, 시설\"},{\"word_id\":\"v2748\",\"headword\":\"top\",\"story_form\":\"top\",\"form\":\"top\",\"meaning_en\":\"the highest part\",\"meaning\":\"맨 위\"},{\"word_id\":\"v0656\",\"headword\":\"course\",\"story_form\":\"course\",\"form\":\"course\",\"meaning_en\":\"a series of lessons on one subject\",\"meaning\":\"강좌\"},{\"word_id\":\"v2223\",\"headword\":\"restroom\",\"story_form\":\"restroom\",\"form\":\"restroom\",\"meaning_en\":\"a public room with toilets\",\"meaning\":\"화장실\"},{\"word_id\":\"v1425\",\"headword\":\"inside\",\"story_form\":\"inside\",\"form\":\"inside\",\"meaning_en\":\"within a building or container\",\"meaning\":\"안에\"}],\"english\":[\"We visit a **college** in the **south** of our city.\",\"A guide takes us **inside** its history **center** for a short **course**.\",\"“Where is the **restroom**?” my friend asks before we begin.\",\"Afterwards, we gather in the **middle** of a large room.\",\"A map at the **top** of the wall shows our **nation** long ago.\",\"We learn how people rebuilt their homes after a **war**.\"],\"korean\":[\"우리는 도시 남쪽에 있는 대학을 방문한다.\",\"안내자는 짧은 강좌를 듣도록 우리를 역사 센터 안으로 데려간다.\",\"시작하기 전에 친구가 “화장실은 어디예요?”라고 묻는다.\",\"그 후 우리는 큰 방의 가운데에 모인다.\",\"벽 위쪽의 지도는 오래전 우리나라의 모습을 보여 준다.\",\"우리는 전쟁 후 사람들이 집을 다시 지은 과정을 배운다.\"]},{\"id\":\"E071\",\"title\":\"달라진 하루\",\"title_en\":\"A Different Kind of Day\",\"targets\":[{\"word_id\":\"v0249\",\"headword\":\"become\",\"story_form\":\"become\",\"form\":\"become\",\"meaning_en\":\"start to be something\",\"meaning\":\"되다\"},{\"word_id\":\"v1201\",\"headword\":\"get\",\"story_form\":\"get\",\"form\":\"get\",\"meaning_en\":\"receive something\",\"meaning\":\"받다\"},{\"word_id\":\"v1620\",\"headword\":\"make\",\"story_form\":\"make\",\"form\":\"make\",\"meaning_en\":\"create something\",\"meaning\":\"만들다\"},{\"word_id\":\"v1207\",\"headword\":\"give\",\"story_form\":\"give\",\"form\":\"give\",\"meaning_en\":\"let someone have something\",\"meaning\":\"주다\"},{\"word_id\":\"v0350\",\"headword\":\"bring\",\"story_form\":\"bring\",\"form\":\"bring\",\"meaning_en\":\"carry something to a place\",\"meaning\":\"가져오다\"},{\"word_id\":\"v2638\",\"headword\":\"take\",\"story_form\":\"take\",\"form\":\"take\",\"meaning_en\":\"carry something away with you\",\"meaning\":\"가져가다\"},{\"word_id\":\"v2343\",\"headword\":\"send\",\"story_form\":\"send\",\"form\":\"send\",\"meaning_en\":\"cause something to go to someone\",\"meaning\":\"보내다\"},{\"word_id\":\"v1076\",\"headword\":\"find\",\"story_form\":\"find\",\"form\":\"find\",\"meaning_en\":\"discover where something is\",\"meaning\":\"찾다\"},{\"word_id\":\"v2300\",\"headword\":\"save\",\"story_form\":\"save\",\"form\":\"save\",\"meaning_en\":\"keep something for later\",\"meaning\":\"남겨 두다\"},{\"word_id\":\"v1699\",\"headword\":\"miss\",\"story_form\":\"miss\",\"form\":\"miss\",\"meaning_en\":\"feel sad because someone is absent\",\"meaning\":\"그리워하다\"}],\"english\":[\"Our class wants to **make** cards for a friend who moved away.\",\"“We **miss** him, so let us **send** a big surprise,” May says.\",\"I **bring** colored paper and **find** a photograph of our group.\",\"We **give** our teacher the cards to **take** to the post office.\",\"“I hope we **get** a reply and **become** pen friends,” I say.\",\"We **save** one copy of the photograph for our classroom wall.\"],\"korean\":[\"우리 반은 이사 간 친구를 위해 카드를 만들고 싶다.\",\"“그 친구가 그리우니까 큰 깜짝 선물을 보내자.” 메이가 말한다.\",\"나는 색종이를 가져오고 우리 모둠의 사진을 찾는다.\",\"우리는 우체국에 가져가시도록 선생님께 카드를 드린다.\",\"“답장을 받고 편지 친구가 되면 좋겠어.” 내가 말한다.\",\"우리는 교실 벽에 붙이려고 사진 한 장을 남겨 둔다.\"]},{\"id\":\"E072\",\"title\":\"문이 열렸어요\",\"title_en\":\"The Door Opens\",\"targets\":[{\"word_id\":\"v1839\",\"headword\":\"open\",\"story_form\":\"open\",\"form\":\"open\",\"meaning_en\":\"move something so an entrance is clear\",\"meaning\":\"열다\"},{\"word_id\":\"v0505\",\"headword\":\"close\",\"story_form\":\"close\",\"form\":\"close\",\"meaning_en\":\"shut an opening\",\"meaning\":\"닫다\"},{\"word_id\":\"v2110\",\"headword\":\"push\",\"story_form\":\"push\",\"form\":\"push\",\"meaning_en\":\"press something away from you\",\"meaning\":\"밀다\"},{\"word_id\":\"v1328\",\"headword\":\"hold\",\"story_form\":\"hold\",\"form\":\"hold\",\"meaning_en\":\"keep something in your hands\",\"meaning\":\"잡다\"},{\"word_id\":\"v0868\",\"headword\":\"drop\",\"story_form\":\"drop\",\"form\":\"drop\",\"meaning_en\":\"let something fall\",\"meaning\":\"떨어뜨리다\"},{\"word_id\":\"v0338\",\"headword\":\"break\",\"story_form\":\"break\",\"form\":\"break\",\"meaning_en\":\"damage something so it is in pieces\",\"meaning\":\"깨뜨리다\"},{\"word_id\":\"v2753\",\"headword\":\"touch\",\"story_form\":\"touch\",\"form\":\"touch\",\"meaning_en\":\"put your hand against something\",\"meaning\":\"만지다\"},{\"word_id\":\"v1734\",\"headword\":\"move\",\"story_form\":\"move\",\"form\":\"move\",\"meaning_en\":\"change position\",\"meaning\":\"움직이다\"},{\"word_id\":\"v0410\",\"headword\":\"carry\",\"story_form\":\"carry\",\"form\":\"carry\",\"meaning_en\":\"hold something while moving\",\"meaning\":\"나르다\"},{\"word_id\":\"v1497\",\"headword\":\"key\",\"story_form\":\"key\",\"form\":\"key\",\"meaning_en\":\"a small object used to unlock a door\",\"meaning\":\"열쇠\"}],\"english\":[\"Dad gives me the **key** so I can **open** the garden room.\",\"“**Push** gently, and do not **touch** the wet paint,” he says.\",\"I **hold** the door while he carries a heavy box inside.\",\"We need to **move** a small table and **carry** a glass vase.\",\"“I must not **drop** it and **break** it,” I tell myself.\",\"When everything is ready, we **close** the door and wash our hands.\"],\"korean\":[\"아버지는 내가 정원 쪽 방을 열 수 있도록 열쇠를 주신다.\",\"“살살 밀고 젖은 페인트는 만지지 마렴.” 아버지가 말씀하신다.\",\"아버지가 무거운 상자를 안으로 옮기시는 동안 나는 문을 잡는다.\",\"우리는 작은 탁자를 옮기고 유리 꽃병을 날라야 한다.\",\"“떨어뜨려서 깨뜨리면 안 돼.” 나는 혼잣말을 한다.\",\"모든 준비가 끝나자 우리는 문을 닫고 손을 씻는다.\"]},{\"id\":\"E073\",\"title\":\"좋은 습관\",\"title_en\":\"Good Habits\",\"targets\":[{\"word_id\":\"v1267\",\"headword\":\"habit\",\"story_form\":\"habit\",\"form\":\"habit\",\"meaning_en\":\"something you do regularly\",\"meaning\":\"습관\"},{\"word_id\":\"v0986\",\"headword\":\"exercise\",\"story_form\":\"exercise\",\"form\":\"exercise\",\"meaning_en\":\"physical activity that keeps you active\",\"meaning\":\"운동\"},{\"word_id\":\"v2927\",\"headword\":\"weight\",\"story_form\":\"weight\",\"form\":\"weight\",\"meaning_en\":\"how heavy something is\",\"meaning\":\"무게\"},{\"word_id\":\"v1044\",\"headword\":\"fat\",\"story_form\":\"fat\",\"form\":\"fat\",\"meaning_en\":\"a substance in some foods\",\
