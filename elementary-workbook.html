:\"Our Family Photos\",\"targets\":[{\"word_id\":\"v1033\",\"headword\":\"family\",\"story_form\":\"family\",\"form\":\"family\",\"meaning_en\":\"a group of related people\",\"meaning\":\"가족\"},{\"word_id\":\"v1046\",\"headword\":\"father\",\"story_form\":\"father\",\"form\":\"father\",\"meaning_en\":\"a male parent\",\"meaning\":\"아버지\"},{\"word_id\":\"v1726\",\"headword\":\"mother\",\"story_form\":\"mother\",\"form\":\"mother\",\"meaning_en\":\"a female parent\",\"meaning\":\"어머니\"},{\"word_id\":\"v0353\",\"headword\":\"brother\",\"story_form\":\"brother\",\"form\":\"brother\",\"meaning_en\":\"a boy with the same parents\",\"meaning\":\"남자 형제\"},{\"word_id\":\"v2413\",\"headword\":\"sister\",\"story_form\":\"sister\",\"form\":\"sister\",\"meaning_en\":\"a girl with the same parents\",\"meaning\":\"여자 형제\"},{\"word_id\":\"v1897\",\"headword\":\"parent\",\"story_form\":\"parent\",\"form\":\"parent\",\"meaning_en\":\"a mother or father\",\"meaning\":\"부모 중 한 사람\"},{\"word_id\":\"v2464\",\"headword\":\"son\",\"story_form\":\"son\",\"form\":\"son\",\"meaning_en\":\"someone's male child\",\"meaning\":\"아들\"},{\"word_id\":\"v0720\",\"headword\":\"daughter\",\"story_form\":\"daughter\",\"form\":\"daughter\",\"meaning_en\":\"someone's female child\",\"meaning\":\"딸\"},{\"word_id\":\"v0207\",\"headword\":\"baby\",\"story_form\":\"baby\",\"form\":\"baby\",\"meaning_en\":\"a very young child\",\"meaning\":\"아기\"},{\"word_id\":\"v0083\",\"headword\":\"album\",\"story_form\":\"album\",\"form\":\"album\",\"meaning_en\":\"a book for keeping photographs\",\"meaning\":\"사진첩\"}],\"english\":[\"My **family** sits together and opens an old **album**.\",\"“Is that **baby** my **brother**?” my **sister** asks.\",\"“No, that is your **father**!” my **mother** says.\",\"Dad laughs and points to another photograph on the page.\",\"“Here I am with my **son** and **daughter**.”\",\"“You look like a very happy **parent**,” I tell him.\"],\"korean\":[\"우리 가족은 함께 앉아 오래된 사진첩을 펼친다.\",\"“저 아기가 우리 오빠야?” 여동생이 묻는다.\",\"“아니, 저건 너희 아빠야!” 어머니가 말씀하신다.\",\"아버지는 웃으며 그쪽에 있는 다른 사진을 가리키신다.\",\"“여기서는 내가 아들하고 딸과 함께 있네.”\",\"“정말 행복한 부모님처럼 보여요.” 나는 아버지께 말한다.\"]},{\"id\":\"E003\",\"title\":\"할아버지의 손님\",\"title_en\":\"Grandpa's Guests\",\"targets\":[{\"word_id\":\"v1233\",\"headword\":\"grandfather\",\"story_form\":\"grandfather\",\"form\":\"grandfather\",\"meaning_en\":\"the father of a parent\",\"meaning\":\"할아버지\"},{\"word_id\":\"v0192\",\"headword\":\"aunt\",\"story_form\":\"aunt\",\"form\":\"aunt\",\"meaning_en\":\"the sister of a parent\",\"meaning\":\"이모\"},{\"word_id\":\"v2819\",\"headword\":\"uncle\",\"story_form\":\"uncle\",\"form\":\"uncle\",\"meaning_en\":\"the husband of your aunt\",\"meaning\":\"이모부\"},{\"word_id\":\"v0658\",\"headword\":\"cousin\",\"story_form\":\"cousin\",\"form\":\"cousin\",\"meaning_en\":\"a child of your aunt or uncle\",\"meaning\":\"사촌\"},{\"word_id\":\"v1361\",\"headword\":\"husband\",\"story_form\":\"husband\",\"form\":\"husband\",\"meaning_en\":\"the man someone is married to\",\"meaning\":\"남편\"},{\"word_id\":\"v2953\",\"headword\":\"wife\",\"story_form\":\"wife\",\"form\":\"wife\",\"meaning_en\":\"the woman someone is married to\",\"meaning\":\"아내\"},{\"word_id\":\"v1622\",\"headword\":\"man\",\"story_form\":\"man\",\"form\":\"man\",\"meaning_en\":\"an adult male person\",\"meaning\":\"남자\"},{\"word_id\":\"v2972\",\"headword\":\"woman\",\"story_form\":\"woman\",\"form\":\"woman\",\"meaning_en\":\"an adult female person\",\"meaning\":\"여자\"},{\"word_id\":\"v0049\",\"headword\":\"adult\",\"story_form\":\"adult\",\"form\":\"adult\",\"meaning_en\":\"a fully grown person\",\"meaning\":\"어른\"},{\"word_id\":\"v2996\",\"headword\":\"young\",\"story_form\":\"young\",\"form\":\"young\",\"meaning_en\":\"not old\",\"meaning\":\"어린\"}],\"english\":[\"My **grandfather** puts extra cups on the kitchen table.\",\"“Your **aunt** and her **husband** are coming,” he says.\",\"A **man** and a **woman** soon arrive with my **cousin**.\",\"“My **wife** made this cake,” my **uncle** tells us.\",\"My **cousin** is too **young** to cut a big slice.\",\"An **adult** helps him, and we all share the cake.\"],\"korean\":[\"할아버지는 식탁에 컵을 더 놓으신다.\",\"“네 이모와 이모부가 오신단다.” 할아버지가 말씀하신다.\",\"곧 남자 한 분과 여자 한 분이 내 사촌과 함께 도착한다.\",\"“제 아내가 이 케이크를 만들었어요.” 이모부가 말씀하신다.\",\"내 사촌은 큰 조각을 자르기에는 너무 어리다.\",\"어른 한 분이 도와주시고, 우리는 모두 케이크를 나누어 먹는다.\"]},{\"id\":\"E004\",\"title\":\"내 방 꾸미기\",\"title_en\":\"Decorating My Room\",\"targets\":[{\"word_id\":\"v2264\",\"headword\":\"room\",\"story_form\":\"room\",\"form\":\"room\",\"meaning_en\":\"a space inside a building\",\"meaning\":\"방\"},{\"word_id\":\"v0250\",\"headword\":\"bed\",\"story_form\":\"bed\",\"form\":\"bed\",\"meaning_en\":\"a place to sleep\",\"meaning\":\"침대\"},{\"word_id\":\"v0777\",\"headword\":\"desk\",\"story_form\":\"desk\",\"form\":\"desk\",\"meaning_en\":\"a table for studying\",\"meaning\":\"책상\"},{\"word_id\":\"v0437\",\"headword\":\"chair\",\"story_form\":\"chair\",\"form\":\"chair\",\"meaning_en\":\"a seat for one person\",\"meaning\":\"의자\"},{\"word_id\":\"v0849\",\"headword\":\"door\",\"story_form\":\"door\",\"form\":\"door\",\"meaning_en\":\"a thing you open to enter\",\"meaning\":\"문\"},{\"word_id\":\"v2958\",\"headword\":\"window\",\"story_form\":\"window\",\"form\":\"window\",\"meaning_en\":\"a glass opening in a wall\",\"meaning\":\"창문\"},{\"word_id\":\"v2899\",\"headword\":\"wall\",\"story_form\":\"wall\",\"form\":\"wall\",\"meaning_en\":\"a side of a room\",\"meaning\":\"벽\"},{\"word_id\":\"v1102\",\"headword\":\"floor\",\"story_form\":\"floor\",\"form\":\"floor\",\"meaning_en\":\"the surface you walk on indoors\",\"meaning\":\"바닥\"},{\"word_id\":\"v0699\",\"headword\":\"curtain\",\"story_form\":\"curtain\",\"form\":\"curtain\",\"meaning_en\":\"cloth that covers a window\",\"meaning\":\"커튼\"},{\"word_id\":\"v0504\",\"headword\":\"clock\",\"story_form\":\"clock\",\"form\":\"clock\",\"meaning_en\":\"a thing that shows the time\",\"meaning\":\"시계\"}],\"english\":[\"I want to make my **room** ready for a friend.\",\"I put a small **chair** beside my **desk**.\",\"“Can we move the **bed** away from the **door**?” I ask Dad.\",\"He helps me and finds a **clock** on the **floor**.\",\"We hang it on the **wall** beside the **window**.\",\"I open the **curtain**, and sunlight fills the **room**.\"],\"korean\":[\"나는 친구를 맞이할 수 있게 내 방을 준비하고 싶다.\",\"나는 책상 옆에 작은 의자를 놓는다.\",\"“침대를 문에서 좀 떨어진 곳으로 옮겨도 될까요?” 나는 아버지께 묻는다.\",\"아버지는 나를 도와주시다가 바닥에서 시계를 발견하신다.\",\"우리는 창문 옆 벽에 시계를 건다.\",\"내가 커튼을 열자 방 안에 햇빛이 가득 들어온다.\"]},{\"id\":\"E005\",\"title\":\"아침 준비\",\"title_en\":\"Getting Ready in the Morning\",\"targets\":[{\"word_id\":\"v1724\",\"headword\":\"morning\",\"story_form\":\"morning\",\"form\":\"morning\",\"meaning_en\":\"the early part of the day\",\"meaning\":\"아침\"},{\"word_id\":\"v2897\",\"headword\":\"wake\",\"story_form\":\"wake\",\"form\":\"wake\",\"meaning_en\":\"stop sleeping\",\"meaning\":\"잠에서 깨다\"},{\"word_id\":\"v2907\",\"headword\":\"wash\",\"story_form\":\"wash\",\"form\":\"wash\",\"meaning_en\":\"make clean with water\",\"meaning\":\"씻다\"},{\"word_id\":\"v0355\",\"headword\":\"brush\",\"story_form\":\"brush\",\"form\":\"brush\",\"meaning_en\":\"clean using a brush\",\"meaning\":\"솔로 닦다\"},{\"word_id\":\"v2747\",\"headword\":\"tooth\",\"story_form\":\"teeth\",\"form\":\"teeth\",\"meaning_en\":\"a hard white part inside the mouth\",\"meaning\":\"이\"},{\"word_id\":\"v1017\",\"headword\":\"face\",\"story_form\":\"face\",\"form\":\"face\",\"meaning_en\":\"the front part of the head\",\"meaning\":\"얼굴\"},{\"word_id\":\"v1269\",\"headword\":\"hair\",\"story_form\":\"hair\",\"form\":\"hair\",\"meaning_en\":\"the strands growing on the head\",\"meaning\":\"머리카락\"},{\"word_id\":\"v0864\",\"headword\":\"dress\",\"story_form\":\"dress\",\"form\":\"dress\",\"meaning_en\":\"put clothes on yourself\",\"meaning\":\"옷을 입다\"},{\"word_id\":\"v2454\",\"headword\":\"sock\",\"story_form\":\"sock\",\"form\":\"sock\",\"meaning_en\":\"a soft covering for a foot\",\"meaning\":\"양말\"},{\"word_id\":\"v2384\",\"headword\":\"shoe\",\"story_form\":\"shoe\",\"form\":\"shoe\",\"meaning_en\":\"an outer covering for a foot\",\"meaning\":\"신발\"}],\"english\":[\"I **wake** early on the **morning** of our school trip.\",\"I **wash** my **face** and **brush** my **teeth**.\",\"After fixing my **hair**, I **dress** for the sunny day.\",\"“Where is my other **sock**?” I ask my brother.\",\"He looks under my bed and gives a little laugh.\",\"It is inside a **shoe**, waiting for my foot!\"],\"korean\":[\"학교 소풍을 가는 날 아침, 나는 일찍 잠에서 깬다.\",\"나는 얼굴을 씻고 이를 닦는다.\",\"머리를 정돈한 뒤, 나는 맑은 날에 맞게 옷을 입는다.\",\"“내 다른 양말은 어디 있지?” 나는 남동생에게 묻는다.\",\"남동생은 내 침대 아래를 보고 작게 웃는다.\",\"양말은 신발 안에서 내 발을 기다리고 있다!\"]},{\"id\":\"E006\",\"title\":\"아침 식사\",\"title_en\":\"Breakfast Time\",\"targets\":[{\"word_id\":\"v0339\",\"headword\":\"breakfast\",\"story_form\":\"breakfast\",\"form\":\"breakfast\",\"meaning_en\":\"the first meal of the day\",\"meaning\":\"아침 식사\"},{\"word_id\":\"v0337\",\"headword\":\"bread\",\"story_form\":\"bread\",\"form\":\"bread\",\"meaning_en\":\"food made from flour and baked\",\"meaning\":\"빵\"},{\"word_id\":\"v0377\",\"headword\":\"butter\",\"story_form\":\"butter\",\"form\":\"butter\",\"meaning_en\":\"a yellow food made from cream\",\"meaning\":\"버터\"},{\"word_id\":\"v1476\",\"headword\":\"jam\",\"story_form\":\"jam\",\"form\":\"jam\",\"meaning_en\":\"a sweet spread made from fruit\",\"meaning\":\"잼\"},{\"word_id\":\"v0899\",\"headword\":\"egg\",\"story_form\":\"egg\",\"form\":\"egg\",\"meaning_en\":\"a round food laid by a hen\",\"meaning\":\"달걀\"},{\"word_id\":\"v1686\",\"headword\":\"milk\",\"story_form\":\"milk\",\"form\":\"milk\",\"meaning_en\":\"a white drink from cows\",\"meaning\":\"우유\"},{\"word_id\":\"v1489\",\"headword\":\"juice\",\"story_form\":\"juice\",\"form\":\"juice\",\"meaning_en\":\"a drink made from fruit\",\"meaning\":\"주스\"},{\"word_id\":\"v0690\",\"headword\":\"cup\",\"story_form\":\"cup\",\"form\":\"cup\",\"meaning_en\":\"a small container for drinking\",\"meaning\":\"컵\"},{\"word_id\":\"v0891\",\"headword\":\"eat\",\"story_form\":\"eat\",\"form\":\"eat\",\"meaning_en\":\"take food into your mouth\",\"meaning\":\"먹다\"},{\"word_id\":\"v0866\",\"headword\":\"drink\",\"story_form\":\"drink\",\"form\":\"drink\",\"meaning_en\":\"take liquid into your mouth\",\"meaning\":\"마시다\"}],\"english\":[\"Dad and I make **breakfast** while Mum feeds the baby.\",\"I spread **butter** and **jam** on a piece of **bread**.\",\"Dad puts an **egg** on each of our plates.\",\"“Would you like **milk** or **juice**?” he asks me.\",\"“I will **drink** **milk** from my blue **cup**,” I say.\",\"We sit down to **eat** when Mum is ready.\"],\"korean\":[\"어머니가 아기에게 밥을 먹이시는 동안 아버지와 나는 아침 식사를 준비한다.\",\"나는 빵 한 조각에 버터와 잼을 바른다.\",\"아버지는 우리 접시마다 달걀 하나를 놓으신다.\",\"“우유를 마실래, 주스를 마실래?” 아버지가 물으신다.\",\"“파란 컵에 우유를 마실래요.” 내가 말한다.\",\"어머니가 준비되시자 우리는 식사하려고 자리에 앉는다.\"]},{\"id\":\"E007\",\"title\":\"과일 바구니\",\"title_en\":\"The Fruit Basket\",\"targets\":[{\"word_id\":\"v0139\",\"headword\":\"apple\",\"story_form\":\"apple\",\"form\":\"apple\",\"meaning_en\":\"a round fruit with firm flesh\",\"meaning\":\"사과\"},{\"word_id\":\"v0219\",\"headword\":\"banana\",\"story_form\":\"banana\",\"form\":\"banana\",\"meaning_en\":\"a long fruit with yellow skin\",\"meaning\":\"바나나\"},{\"word_id\":\"v1849\",\"headword\":\"orange\",\"story_form\":\"orange\",\"form\":\"orange\",\"meaning_en\":\"a round fruit with orange skin\",\"meaning\":\"오렌지\"},{\"word_id\":\"v1235\",\"headword\":\"grape\",\"story_form\":\"grape\",\"form\":\"grape\",\"meaning_en\":\"a small round fruit growing in bunches\",\"meaning\":\"포도\"},{\"word_id\":\"v2911\",\"headword\":\"watermelon\",\"story_form\":\"watermelon\",\"form\":\"watermelon\",\"meaning_en\":\"a large fruit with green skin\",\"meaning\":\"수박\"},{\"word_id\":\"v1157\",\"headword\":\"fruit\",\"story_form\":\"fruit\",\"form\":\"fruit\",\"meaning_en\":\"food such as apples and bananas\",\"meaning\":\"과일\"},{\"word_id\":\"v0232\",\"headword\":\"basket\",\"story_form\":\"basket\",\"form\":\"basket\",\"meaning_en\":\"a container used to carry things\",\"meaning\":\"바구니\"},{\"word_id\":\"v1149\",\"headword\":\"fresh\",\"story_form\":\"fresh\",\"form\":\"fresh\",\"meaning_en\":\"recently picked and good to eat\",\"meaning\":\"신선한\"},{\"word_id\":\"v1953\",\"headword\":\"pick\",\"story_form\":\"pick\",\"form\":\"pick\",\"meaning_en\":\"choose something from a group\",\"meaning\":\"고르다\"},{\"word_id\":\"v2634\",\"headword\":\"table\",\"story_form\":\"table\",\"form\":\"table\",\"meaning_en\":\"a piece of furniture for meals\",\"meaning\":\"식탁\"}],\"english\":[\"Mum puts a **basket** of **fresh** **fruit** on the **table**.\",\"“**Pick** something for our lunch boxes,” she tells us.\",\"I choose an **apple**, and my brother chooses a **banana**.\",\"Mum cuts an **orange** so we can share it.\",\"A little **grape** rolls out, and I catch it.\",\"We save the big **watermelon** for everyone to enjoy later.\"],\"korean\":[\"어머니는 신선한 과일이 든 바구니를 식탁에 놓으신다.\",\"“도시락에 넣을 것을 골라 보렴.” 어머니가 말씀하신다.\",\"나는 사과를 고르고, 남동생은 바나나를 고른다.\",\"어머니는 우리가 나누어 먹도록 오렌지를 자르신다.\",\"작은 포도 한 알이 굴러 나와 내가 잡는다.\",\"커다란 수박은 나중에 모두 함께 먹으려고 남겨 둔다.\"]},{\"id\":\"E008\",\"title\":\"학교에 가는 길\",\"title_en\":\"On the Way to School\",\"targets\":[{\"word_id\":\"v2313\",\"headword\":\"school\",\"story_form\":\"school\",\"form\":\"school\",\"meaning_en\":\"a place where children learn\",\"meaning\":\"학교\"},{\"word_id\":\"v0213\",\"headword\":\"bag\",\"story_form\":\"bag\",\"form\":\"bag\",\"meaning_en\":\"a container for carrying things\",\"meaning\":\"가방\"},{\"word_id\":\"v0314\",\"headword\":\"book\",\"story_form\":\"book\",\"form\":\"book\",\"meaning_en\":\"written pages joined together\",\"meaning\":\"책\"},{\"word_id\":\"v1929\",\"headword\":\"pencil\",\"story_form\":\"pencil\",\"form\":\"pencil\",\"meaning_en\":\"a tool for writing that can be rubbed out\",\"meaning\":\"연필\"},{\"word_id\":\"v1927\",\"headword\":\"pen\",\ e together.\"],\"korean\":[\"아버지는 내가 부엌에서 요리를 돕게 해 주신다.\",\"나는 당근 하나, 감자 하나, 토마토 하나를 씻는다.\",\"“어떤 채소를 수프에 먼저 넣어요?” 내가 묻는다.\",\"아버지는 날카로운 칼로 단단한 채소를 자르신다.\",\"아버지가 고기를 준비하시는 동안 나는 그릇에 물을 채운다.\",\"곧 수프가 끓기 시작하고, 우리는 함께 식탁을 치운다.\"]},{\"id\":\"E012\",\"title\":\"빵집의 하루\",\"title_en\":\"A Day of Baking\",\"targets\":[{\"word_id\":\"v0214\",\"headword\":\"bake\",\"story_form\":\"bake\",\"form\":\"bake\",\"meaning_en\":\"cook food in an oven\",\"meaning\":\"오븐에 굽다\"},{\"word_id\":\"v0384\",\"headword\":\"cake\",\"story_form\":\"cake\",\"form\":\"cake\",\"meaning_en\":\"a soft sweet baked food\",\"meaning\":\"케이크\"},{\"word_id\":\"v0623\",\"headword\":\"cookie\",\"story_form\":\"cookie\",\"form\":\"cookie\",\"meaning_en\":\"a small sweet baked snack\",\"meaning\":\"쿠키\"},{\"word_id\":\"v0286\",\"headword\":\"biscuit\",\"story_form\":\"biscuit\",\"form\":\"biscuit\",\"meaning_en\":\"a small flat baked snack\",\"meaning\":\"비스킷\"},{\"word_id\":\"v0854\",\"headword\":\"doughnut\",\"story_form\":\"doughnut\",\"form\":\"doughnut\",\"meaning_en\":\"a sweet fried cake often with a hole\",\"meaning\":\"도넛\"},{\"word_id\":\"v0469\",\"headword\":\"chocolate\",\"story_form\":\"chocolate\",\"form\":\"chocolate\",\"meaning_en\":\"a brown sweet food made from cocoa\",\"meaning\":\"초콜릿\"},{\"word_id\":\"v2589\",\"headword\":\"sugar\",\"story_form\":\"sugar\",\"form\":\"sugar\",\"meaning_en\":\"a sweet substance added to food\",\"meaning\":\"설탕\"},{\"word_id\":\"v0667\",\"headword\":\"cream\",\"story_form\":\"cream\",\"form\":\"cream\",\"meaning_en\":\"the thick rich part of milk\",\"meaning\":\"크림\"},{\"word_id\":\"v0396\",\"headword\":\"candy\",\"story_form\":\"candy\",\"form\":\"candy\",\"meaning_en\":\"a small sweet treat\",\"meaning\":\"사탕\"},{\"word_id\":\"v2648\",\"headword\":\"taste\",\"story_form\":\"taste\",\"form\":\"taste\",\"meaning_en\":\"try a little food\",\"meaning\":\"맛보다\"}],\"english\":[\"My aunt will **bake** a **cake** for our family today.\",\"I help her measure the :\"E019\",\"title\":\"그림 그리는 날\",\"title_en\":\"A Day of Drawing\",\"targets\":[{\"word_id\":\"v0158\",\"headword\":\"art\",\"story_form\":\"art\",\"form\":\"art\",\"meaning_en\":\"making pictures or other creative things\",\"meaning\":\"미술\"},{\"word_id\":\"v0861\",\"headword\":\"draw\",\"story_form\":\"draw\",\"form\":\"draw\",\"meaning_en\":\"make a picture with a pencil\",\"meaning\":\"그리다\"},{\"word_id\":\"v1883\",\"headword\":\"paint\",\"story_form\":\"paint\",\"form\":\"paint\",\"meaning_en\":\"make a picture using colored liquid\",\"meaning\":\"물감으로 그리다\"},{\"word_id\":\"v0665\",\"headword\":\"crayon\",\"story_form\":\"crayon\",\"form\":\"crayon\",\"meaning_en\":\"a colored wax stick for drawing\",\"meaning\":\"크레용\"},{\"word_id\":\"v0527\",\"headword\":\"color\",\"story_form\":\"color\",\"form\":\"color\",\"meaning_en\":\"how something looks, such as red or blue\",\"meaning\":\"색\"},{\"word_id\":\"v2162\",\"headword\":\"red\",\"story_form\":\"red\",\"form\":\"red\",\"meaning_en\":\"the color of a ripe tomato\",\"meaning\":\"빨간색의\"},{\"word_id\":\"v0305\",\"headword\":\"blue\",\"story_form\":\"blue\",\"form\":\"blue\",\"meaning_en\":\"the color of a clear daytime sky\",\"meaning\":\"파란색의\"},{\"word_id\":\"v2990\",\"headword\":\"yellow\",\"story_form\":\"yellow\",\"form\":\"yellow\",\"meaning_en\":\"the color of a lemon\",\"meaning\":\"노란색의\"},{\"word_id\":\"v1244\",\"headword\":\"green\",\"story_form\":\"green\",\"form\":\"green\",\"meaning_en\":\"the color of grass\",\"meaning\":\"초록색의\"},{\"word_id\":\"v1955\",\"headword\":\"picture\",\"story_form\":\"picture\",\"form\":\"picture\",\"meaning_en\":\"an image made by drawing or painting\",\"meaning\":\"그림\"}],\"english\":[\"In **art** class, we **draw** a place we would like to visit.\",\"I use a **crayon** to make a little house.\",\"“Which **color** will you use for the door?” my friend asks.\",\"“I will **paint** it **red**, with a **yellow** flower beside it.”\",\"I add **green** trees under a bright **blue** sky.\",\"My **picture** looks like a happy place for everyone.\"],\"korean\":[\"미술 시간에 우리는 가 보고 싶은 곳을 그린다.\",\"나는 크레용으로 작은 집을 그린다.\",\"“문에는 무슨 색을 쓸 거야?” 친구가 묻는다.\",\"“빨갛게 칠하고 옆에는 노란 꽃을 그릴 거야.”\",\"나는 밝고 파란 하늘 아래에 초록 나무들을 더 그린다.\",\"내 그림은 모두에게 행복한 장소처럼 보인다.\"]},{\"id\":\"E020\",\"title\":\"알록달록 옷가게\",\"title_en\":\"The Colourful Clothes Shop\",\"targets\":[{\"word_id\":\"v0506\",\"headword\":\"clothes\",\"story_form\":\"clothes\",\"form\":\"clothes\",\"meaning_en\":\"things people wear\",\"meaning\":\"옷\"},{\"word_id\":\"v2382\",\"headword\":\"shirt\",\"story_form\":\"shirt\",\"form\":\"shirt\",\"meaning_en\":\"a piece of clothing for the upper body\",\"meaning\":\"셔츠\"},{\"word_id\":\"v1891\",\"headword\":\"pants\",\"story_form\":\"pants\",\"form\":\"pants\",\"meaning_en\":\"clothing covering both legs separately\",\"meaning\":\"바지\"},{\"word_id\":\"v2424\",\"headword\":\"skirt\",\"story_form\":\"skirt\",\"form\":\"skirt\",\"meaning_en\":\"clothing hanging from the waist\",\"meaning\":\"치마\"},{\"word_id\":\"v0265\",\"headword\":\"belt\",\"story_form\":\"belt\",\"form\":\"belt\",\"meaning_en\":\"a band worn around the waist\",\"meaning\":\"허리띠\"},{\"word_id\":\"v0398\",\"headword\":\"cap\",\"story_form\":\"cap\",\"form\":\"cap\",\"meaning_en\":\"a soft hat with a front shade\",\"meaning\":\"챙모자\"},{\"word_id\":\"v2918\",\"headword\":\"wear\",\"story_form\":\"wear\",\"form\":\"wear\",\"meaning_en\":\"have clothes on your body\",\"meaning\":\"입다, 쓰다\"},{\"word_id\":\"v2418\",\"headword\":\"size\",\"story_form\":\"size\",\"form\":\"size\",\"meaning_en\":\"how big or small something is\",\"meaning\":\"크기\"},{\"word_id\":\"v1965\",\"headword\":\"pink\",\"story_form\":\"pink\",\"form\":\"pink\",\"meaning_en\":\"a pale red color\",\"meaning\":\"분홍색의\"},{\"word_id\":\"v2572\",\"headword\":\"style\",\"story_form\":\"style\",\"form\":\"style\",\"meaning_en\":\"a particular way something looks\",\"meaning\":\"스타일\"}],\"english\":[\"Mum and I choose **clothes** for our family photograph.\",\"I find a **pink** **shirt** in just the right **size**.\",\"“Would you like **pants** or a **skirt**?” Mum asks me.\",\"I choose trousers and add a simple brown **belt**.\",\"My brother wants to **wear** his favorite blue **cap**.\",\"We have a different **style**, but we both feel happy.\"],\"korean\":[\"어머니와 나는 가족사진을 찍을 때 입을 옷을 고른다.\",\"나는 크기가 딱 맞는 분홍색 셔츠를 발견한다.\",\"“바지를 입을래, 치마를 입을래?” 어머니가 물으신다.\",\"나는 바지를 고르고 수수한 갈색 허리띠를 더한다.\",\"남동생은 가장 좋아하는 파란 챙모자를 쓰고 싶어 한다.\",\"우리의 스타일은 다르지만 둘 다 기분이 좋다.\"]},{\"id\":\"E021\",\"title\":\"동물원 나들이\",\"title_en\":\"A Trip to the Zoo\",\"targets\":[{\"word_id\":\"v3000\",\"headword\":\"zoo\",\"story_form\":\"zoo\",\"form\":\"zoo\",\"meaning_en\":\"a place where people can see many animals\",\"meaning\":\"동물원\"},{\"word_id\":\"v0121\",\"headword\":\"animal\",\"story_form\":\"animal\",\"form\":\"animal\",\"meaning_en\":\"a living creature such as a lion\",\"meaning\":\"동물\"},{\"word_id\":\"v1579\",\"headword\":\"lion\",\"story_form\":\"lion\",\"form\":\"lion\",\"meaning_en\":\"a large wild cat, often with a mane\",\"meaning\":\"사자\"},{\"word_id\":\"v2723\",\"headword\":\"tiger\",\"story_form\":\"tiger\",\"form\":\"tiger\",\"meaning_en\":\"a large wild cat with dark stripes\",\"meaning\":\"호랑이\"},{\"word_id\":\"v0908\",\"headword\":\"elephant\",\"story_form\":\"elephant\",\"form\":\"elephant\",\"meaning_en\":\"a huge animal with a long trunk\",\"meaning\":\"코끼리\"},{\"word_id\":\"v1716\",\"headword\":\"monkey\",\"story_form\":\"monkey\",\"form\":\"monkey\",\"meaning_en\":\"an animal that climbs using hands and feet\",\"meaning\":\"원숭이\"},{\"word_id\":\"v0243\",\"headword\":\"bear\",\"story_form\":\"bear\",\"form\":\"bear\",\"meaning_en\":\"a large animal with thick fur\",\"meaning\":\"곰\"},{\"word_id\":\"v2335\",\"headword\":\"see\",\"story_form\":\"see\",\"form\":\"see\",\"meaning_en\":\"notice something with your eyes\",\"meaning\":\"보다\"},{\"word_id\":\"v1597\",\"headword\":\"look\",\"story_form\":\"look\",\"form\":\"look\",\"meaning_en\":\"turn your eyes towards something\",\"meaning\":\"바라보다\"},{\"word_id\":\"v0465\",\"headword\":\"child\",\"story_form\":\"child\",\"form\":\"child\",\"meaning_en\":\"a young person\",\"meaning\":\"아이\"}],\"english\":[\"At the **zoo**, each **child** gets an **animal** picture card.\",\"“I want to **see** the **elephant** first,” my sister says.\",\"We **look** at a map and walk past a sleeping **lion**.\",\"A **tiger** rests nearby, while a **monkey** climbs above us.\",\"“Where is the **bear**?” asks a little boy with a card.\",\"We help him find it before visiting the elephants.\"],\"korean\":[\"동물원에서 아이들은 각자 동물 그림 카드를 받는다.\",\"“나는 코끼리를 먼저 보고 싶어.” 여동생이 말한다.\",\"우리는 지도를 보고 잠든 사자를 지나 걸어간다.\",\"호랑이는 근처에서 쉬고, 원숭이는 우리 위쪽에서 나무를 탄다.\",\"“곰은 어디 있어요?” 카드를 든 어린 남자아이가 묻는다.\",\"우리는 코끼리들을 보러 가기 전에 그 아이가 곰을 찾도록 돕는다.\"]},{\"id\":\"E022\",\"title\":\"농장의 아침\",\"title_en\":\"A Morning on the Farm\",\"targets\":[{\"word_id\":\"v1039\",\"headword\":\"farm\",\"story_form\":\"farm\",\"form\":\"farm\",\"meaning_en\":\"a place where animals or crops are raised\",\"meaning\":\"농장\"},{\"word_id\":\"v0660\",\"headword\":\"cow\",\"story_form\":\"cow\",\"form\":\"cow\",\"meaning_en\":\"a large farm animal that gives milk\",\"meaning\":\"소\"},{\"word_id\":\"v1958\",\"headword\":\"pig\",\"story_form\":\"pig\",\"form\":\"pig\",\"meaning_en\":\"a farm animal with a round body\",\"meaning\":\"돼지\"},{\"word_id\":\"v1341\",\"headword\":\"horse\",\"story_form\":\"horse\",\"form\":\"horse\",\"meaning_en\":\"a large animal people can ride\",\"meaning\":\"말\"},{\"word_id\":\"v0874\",\"headword\":\"duck\",\"story_form\":\"duck\",\"form\":\"duck\",\"meaning_en\":\"a water bird with a flat bill\",\"meaning\":\"오리\"},{\"word_id\":\"v1238\",\"headword\":\"grass\",\"story_form\":\"grass\",\"form\":\"grass\",\"meaning_en\":\"short green plants covering the ground\",\"meaning\":\"풀\"},{\"word_id\":\"v0500\",\"headword\":\"climb\",\"story_form\":\"climb\",\"form\":\"climb\",\"meaning_en\":\"move upwards using hands or feet\",\"meaning\":\"오르다\"},{\"word_id\":\"v0354\",\"headword\":\"brown\",\"story_form\":\"brown\",\"form\":\"brown\",\"meaning_en\":\"the color of chocolate\",\"meaning\":\"갈색의\"},{\"word_id\":\"v0290\",\"headword\":\"black\",\"story_form\":\"black\",\"form\":\"black\",\"meaning_en\":\"the darkest color\",\"meaning\":\"검은색의\"},{\"word_id\":\"v0531\",\"headword\":\"come\",\"story_form\":\"come\",\"form\":\"come\",\"meaning_en\":\"move towards the speaker\",\"meaning\":\"오다\"}],\"english\":[\"We visit a **farm** early in the morning with our uncle.\",\"A **brown** **cow** eats **grass** beside a **black** **horse**.\",\"“**Come** and see this little **pig**,” our uncle calls.\",\"A **duck** walks past us and heads towards the water.\",\"We **climb** a small hill to get a better view.\",\"From there, we can see all the animals below.\"],\"korean\":[\"우리는 아침 일찍 삼촌과 함께 농장을 방문한다.\",\"갈색 소 한 마리가 검은 말 옆에서 풀을 먹는다.\",\"“와서 이 작은 돼지를 보렴.” 삼촌이 부르신다.\",\"오리 한 마리가 우리를 지나 물 쪽으로 걸어간다.\",\"우리는 더 잘 보려고 작은 언덕을 오른다.\",\"그곳에서 아래에 있는 동물들을 모두 볼 수 있다.\"]},{\"id\":\"E023\",\"title\":\"새 강아지\",\"title_en\":\"Our New Puppy\",\"targets\":[{\"word_id\":\"v0842\",\"headword\":\"dog\",\"story_form\":\"dog\",\"form\":\"dog\",\"meaning_en\":\"an animal often kept as a pet\",\"meaning\":\"개\"},{\"word_id\":\"v2104\",\"headword\":\"puppy\",\"story_form\":\"puppy\",\"form\":\"puppy\",\"meaning_en\":\"a very young dog\",\"meaning\":\"강아지\"},{\"word_id\":\"v0417\",\"headword\":\"cat\",\"story_form\":\"cat\",\"form\":\"cat\",\"meaning_en\":\"a small pet animal that says meow\",\"meaning\":\"고양이\"},{\"word_id\":\"v2125\",\"headword\":\"rabbit\",\"story_form\":\"rabbit\",\"form\":\"rabbit\",\"meaning_en\":\"an animal with long ears\",\"meaning\":\"토끼\"},{\"word_id\":\"v1732\",\"headword\":\"mouse\",\"story_form\":\"mouse\",\"form\":\"mouse\",\"meaning_en\":\"a small animal with a long thin tail\",\"meaning\":\"생쥐\"},{\"word_id\":\"v2637\",\"headword\":\"tail\",\"story_for m\":\"tree\",\"meaning_en\":\"a tall plant with a wooden trunk\",\"meaning\":\"나무\"},{\"word_id\":\"v1252\",\"headword\":\"grow\",\"story_form\":\"grow\",\"form\":\"grow\",\"meaning_en\":\"become bigger over time\",\"meaning\":\"자라다\"},{\"word_id\":\"v0251\",\"headword\":\"bee\",\"story_form\":\"bee\",\"form\":\"bee\",\"meaning_en\":\"a flying insect that visits flowers\",\"meaning\":\"벌\"},{\"word_id\":\"v1757\",\"headword\":\"nature\",\"story_form\":\"nature\",\"form\":\"nature\",\"meaning_en\":\"plants, animals and the world outdoors\",\"meaning\":\"자연\"},{\"word_id\":\"v2506\",\"headword\":\"spring\",\"story_form\":\"spring\",\"form\":\"spring\",\"meaning_en\":\"the season after winter\",\"meaning\":\"봄\"},{\"word_id\":\"v0196\",\"headword\":\"autumn\",\"story_form\":\"autumn\",\"form\":\"autumn\",\"meaning_en\":\"the season after summer\",\"meaning\":\"가을\"},{\"word_id\":\"v0247\",\"headword\":\"beauty\",\"story_form\":\"beauty\",\"form\":\"beauty\",\"meaning_en\":\"the quality of being lovely to see\",\"meaning\":\"아름다움\"}],\"english\":[\"In **spring**, Grandma takes me into her small **garden**.\",\"A **bee** moves from one **flower** to another near a **tree**.\",\"“Will this **rose** **grow** taller than me?” I ask her.\",\"“Perhaps, if we care for it,” she says with a smile.\",\"She shows me a photograph of the same place in **autumn**.\",\"I begin to see the **beauty** of **nature** in every season.\"],\"korean\":[\"봄에 할머니는 나를 작은 정원으로 데려가신다.\",\"벌 한 마리가 나무 근처에서 꽃 사이를 오간다.\",\"“이 장미가 나보다 더 크게 자랄까요?” 나는 할머니께 묻는다.\",\"“우리가 잘 돌보면 그럴 수도 있지.” 할머니가 웃으며 말씀하신다.\",\"할머니는 같은 장소의 가을 사진을 보여 주신다.\",\"나는 모든 계절에 있는 자연의 아름다움을 알아보기 시작한다.\"]},{\"id\":\"E025\",\"title\":\"숲속 산책\",\"title_en\":\"A Walk in the Forest\",\"targets\":[{\"word_id\":\"v1124\",\"headword\":\"forest\",\"story_form\":\"forest\",\"form\":\"forest\",\"meaning_en\":\"a large area covered with trees\",\"meaning\":\"숲\"},{\"word_id\":\"v0284\",\"headword\":\"bird\",\"story_form\":\"bird\",\"form\":\"bird\",\"meaning_en\":\"an animal with feathers and wings\",\"meaning\":\"새\"},{\"word_id\":\"v1141\",\"headword\":\"fox\",\"story_form\":\"fox\",\"form\":\"fox\",\"meaning_en\":\"a wild animal with a bushy tail\",\"meaning\":\"여우\"},{\"word_id\":\"v1731\",\"headword\":\"mountain\",\"story_form\":\"mountain\",\"form\":\"mountain\",\"meaning_en\":\"a very high natural rise in land\",\"meaning\":\"산\"},{\"word_id\":\"v1322\",\"headword\":\"hill\",\"story_form\":\"hill\",\"form\":\"hill\",\"meaning_en\":\"a rise in land lower than a mountain\",\"meaning\":\"언덕\"},{\"word_id\":\"v1321\",\"headword\":\"hike\",\"story_form\":\"hike\",\"form\":\"hike\",\"meaning_en\":\"take a long walk outdoors\",\"meaning\":\"도보 여행하다\"},{\"word_id\":\"v2898\",\"headword\":\"walk\",\"story_form\":\"walk\",\"form\":\"walk\",\"meaning_en\":\"move at a steady pace on foot\",\"meaning\":\"걷다\"},{\"word_id\":\"v1250\",\"headword\":\"ground\",\"story_form\":\"ground\",\"form\":\"ground\",\"meaning_en\":\"the surface of the land\",\"meaning\":\"땅\"},{\"word_id\":\"v2545\",\"headword\":\"stone\",\"story_form\":\"stone\",\"form\":\"stone\",\"meaning_en\":\"a small piece of hard natural material\",\"meaning\":\"돌\"},{\"word_id\":\"v2257\",\"headword\":\"rock\",\"story_form\":\"rock\",\"form\":\"rock\",\"meaning_en\":\"a large piece of hard natural material\",\"meaning\":\"바위\"}],\"english\":[\"Dad and I **hike** through a **forest** below a **mountain**.\",\"We **walk** slowly up a **hill** and hear a **bird** singing.\",\"“Is that a **fox**?” I whisper, pointing between the trees.\",\"Dad nods, and we let it pass without following it.\",\"A little **stone** on the **ground** looks like a heart.\",\"We rest beside a large **rock** before heading home.\"],\"korean\":[\"아버지와 나는 산 아래 숲을 따라 도보 여행을 한다.\",\"우리는 언덕을 천천히 걸어 올라가며 새가 노래하는 소리를 듣는다.\",\"“저건 여우예요?” 내가 나무 사이를 가리키며 속삭인다.\",\"아버지는 고개를 끄덕이시고, 우리는 따라가지 않고 여우가 지나가게 둔다.\",\"땅 위의 작은 돌이 하트처럼 보인다.\",\"우리는 집으로 돌아가기 전에 큰 바위 옆에서 쉰다.\"]},{\"id\":\"E026\",\"title\":\"바닷가에서\",\"title_en\":\"At the Seaside\",\"targets\":[{\"word_id\":\"v2324\",\"headword\":\"sea\",\"story_form\":\"sea\",\"form\":\"sea\",\"meaning_en\":\"the large area of salty water\",\"meaning\":\"바다\"},{\"word_id\":\"v0240\",\"headword\":\"beach\",\"story_form\":\"beach\",\"form\":\"beach\",\"meaning_en\":\"land beside the sea, often sandy\",\"meaning\":\"해변\"},{\"word_id\":\"v2295\",\"headword\":\"sand\",\"story_form\":\"sand\",\"form\":\"sand\",\"meaning_en\":\"tiny grains of rock on a beach\",\"meaning\":\"모래\"},{\"word_id\":\"v1084\",\"headword\":\"fish\",\"story_form\":\"fish\",\"form\":\"fish\",\"meaning_en\":\"an animal that lives and breathes in water\",\"meaning\":\"물고기\"},{\"word_id\":\"v0307\",\"headword\":\"boat\",\"story_form\":\"boat\",\"form\":\"boat\",\"meaning_en\":\"a small vehicle that travels on water\",\"meaning\":\"배\"},{\"word_id\":\"v2381\",\"headword\":\"ship\",\"story_form\":\"ship\",\"form\":\"ship\",\"meaning_en\":\"a large vessel that travels on water\",\"meaning\":\"큰 배\"},{\"word_id\":\"v2425\",\"headword\":\"sky\",\"story_form\":\"sky\",\"form\":\"sky\",\"meaning_en\":\"the space above the earth\",\"meaning\":\"하늘\"},{\"word_id\":\"v0738\",\"headword\":\"deep\",\"story_form\":\"deep\",\"form\":\"deep\",\"meaning_en\":\"going a long way down\",\"meaning\":\"깊은\"},{\"word_id\":\"v2251\",\"headword\":\"river\",\"story_form\":\"river\",\"form\":\"river\",\"meaning_en\":\"a long natural flow of water\",\"meaning\":\"강\"},{\"word_id\":\"v0346\",\"headword\":\"bridge\",\"story_form\":\"bridge\",\"form\":\"bridge\",\"meaning_en\":\"a structure for crossing water or a road\",\"meaning\":\"다리\"}],\"english\":[\"We cross a **bridge** where a **river** meets the **sea**.\",\"A small **boat** moves slowly under us in the **deep** water.\",\"“Can you see that **fish**?” my brother asks excitedly.\",\"I look down, then point to a **ship** far away.\",\"Later, we reach the **beach** and sit on the **sand**.\",\"The **sky** turns pink as we finish our picnic.\"],\"korean\":[\"우리는 강이 바다와 만나는 곳의 다리를 건넌다.\",\"작은 배 한 척이 우리 아래 깊은 물에서 천천히 움직인다.\",\"“저 물고기 보여?” 남동생이 신나서 묻는다.\",\"나는 아래를 본 뒤 멀리 있는 큰 배를 가리킨다.\",\"나중에 우리는 해변에 도착해 모래 위에 앉는다.\",\"우리가 소풍 음식을 다 먹을 무렵 하늘이 분홍색으로 변한다.\"]},{\"id\":\"E027\",\"title\":\"비 오는 오후\",\"title_en\":\"A Rainy Afternoon\",\"targets\":[{\"word_id\":\"v2130\",\"headword\":\"rain\",\"story_form\":\"rain\",\"form\":\"rain\",\"meaning_en\":\"water falling in drops from clouds\",\"meaning\":\"비\"},{\"word_id\":\"v2818\",\"headword\":\"umbrella\",\"story_form\":\"umbrella\",\"form\":\"umbrella\",\"meaning_en\":\"a cover held above you in rain\",\"meaning\":\"우산\"},{\"word_id\":\"v2919\",\"headword\":\"weather\",\"story_form\":\"weather\",\"form\":\"weather\",\"meaning_en\":\"conditions such as sunshine or rain\",\"meaning\":\"날씨\"},{\"word_id\":\"v2957\",\"headword\":\"wind\",\"story_form\":\"wind\",\"form\":\"wind\",\"meaning_en\":\"moving air\",\"meaning\":\"바람\"},{\"word_id\":\"v0507\",\"headword\":\"cloud\",\"story_form\":\"cloud\",\"form\":\"cloud\",\"meaning_en\":\"a white or gray mass in the sky\",\"meaning\":\"구름\"},{\"word_id\":\"v2597\",\"headword\":\"sun\",\"story_form\":\"sun\",\"form\":\"sun\",\"meaning_en\":\"the star that gives us light\",\"meaning\":\"태양\"},{\"word_id\":\"v0064\",\"headword\":\"afternoon\",\"story_form\":\"afternoon\",\"form\":\"afternoon\",\"meaning_en\":\"the time between midday and evening\",\"meaning\":\"오후\"},{\"word_id\":\"v0348\",\"headword\":\"bright\",\"story_form\":\"bright\",\"form\":\"bright\",\"meaning_en\":\"full of light\",\"meaning\":\"밝은\"},{\"word_id\":\"v0878\",\"headword\":\"during\",\"story_form\":\"during\",\"form\":\"during\",\"meaning_en\":\"through part or all of a period\",\"meaning\":\"동안\"},{\"word_id\":\"v1029\",\"headword\":\"fall\",\"story_form\":\"fall\",\"form\":\"fall\",\"meaning_en\":\"move down from a higher place\",\"meaning\":\"떨어지다\"}],\"english\":[\"The **weather** changes **during** our **afternoon** walk home.\",\"A dark **cloud** covers the **sun**, and the **wind** grows stronger.\",\"“I think **rain** is coming,” my friend tells me.\",\"Big drops begin to **fall**, so I open my **umbrella**.\",\"We share it and walk carefully along the wet road.\",\"By the time we arrive home, the sky is **bright** again.\"],\"korean\":[\"오후에 집으로 걸어가는 동안 날씨가 변한다.\",\"검은 구름이 태양을 가리고 바람이 더 세진다.\",\"“비가 올 것 같아.” 친구가 내게 말한다.\",\"큰 빗방울이 떨어지기 시작해서 나는 우산을 편다.\",\"우리는 우산을 함께 쓰고 젖은 길을 조심히 걷는다.\",\"집에 도착할 무렵 하늘은 다시 밝아진다.\"]},{\"id\":\"E028\",\"title\":\"함께하는 음악\",\"title_en\":\"Making Music Together\",\"targets\":[{\"word_id\":\"v1743\",\"headword\":\"music\",\"story_form\":\"music\",\"form\":\"music\",\"meaning_en\":\"sounds arranged for listening or singing\",\"meaning\":\"음악\"},{\"word_id\":\"v2465\",\"headword\":\"song\",\"story_form\":\"song\",\"form\":\"song\",\"meaning_en\":\"words sung to music\",\"meaning\":\"노래\"},{\"word_id\":\"v2410\",\"headword\":\"sing\",\"story_form\":\"sing\",\"form\":\"sing\",\"meaning_en\":\"make music with your voice\",\"meaning\":\"노래하다\"},{\"word_id\":\"v1952\",\"headword\":\"piano\",\"story_form\":\"piano\",\"form\":\"piano\",\"meaning_en\":\"a large musical instrument with keys\",\"meaning\":\"피아노\"},{\"word_id\":\"v1261\",\"headword\":\"guitar\",\"story_form\":\"guitar\",\"form\":\"guitar\",\"meaning_en\":\"a musical instrument with strings you pluck\",\"meaning\":\"기타\"},{\"word_id\":\"v2879\",\"headword\":\"violin\",\"story_form\":\"violin\",\"form\":\"violin\",\"meaning_en\":\"a small string instrument played with a bow\",\"meaning\":\"바이올린\"},{\"word_id\":\"v0871\",\"headword\":\"drum\",\"story_form\":\"drum\",\"form\":\"drum\",\"meaning_en\":\"an instrument you hit to make a beat\",\"meaning\":\"북\"},{\"word_id\":\"v0711\",\"headword\":\"dance\",\"story_form\":\"dance\",\"form\":\"dance\",\"meaning_en\":\"move your body to music\",\"meaning\":\"춤추다\"},{\"word_id\":\"v2472\",\"headword\":\"sound\",\"story_form\":\"sound\",\"form\":\"sound\",\"meaning_en\":\"something you can hear\",\"meaning\":\"소리\"},{\"word_id\":\"v2891\",\"headword\":\"voice\",\"story_form\":\"voice\",\"form\":\"voice\",\"meaning_en\":\"the sound made when someone speaks or sings\",\"meaning\":\"목소리\"}],\"english\":[\"Our class makes **music** for the school show this week.\",\"May plays the **piano**, while Ben brings his **guitar**.\",\"“I can play the **violin**,” says a girl near the door.\",\"I tap a **drum** and listen to its low **sound**.\",\"Our friends **sing** a **song**, and each **voice** joins the others.\",\"Soon everyone wants to **dance** to our happy **music**.\"],\"korean\":[\"이번 주에 우리 반은 학교 공연을 위한 음악을 만든다.\",\"메이는 피아노를 치고, 벤은 기타를 가져온다.\",\"“나는 바이올린을 켤 수 있어.” 문 근처의 여자아이가 말한다.\",\"나는 북을 두드리고 낮은 소리를 듣는다.\",\"친구들이 노래를 부르고 각자의 목소리가 어우러진다.\",\"곧 모두 우리 즐거운 음악에 맞춰 춤추고 싶어 한다.\"]},{\"id\":\"E029\",\"title\":\"생일 파티\",\"title_en\":\"A Birthday Party\",\"targets\":[{\"word_id\":\"v0285\",\"headword\":\"birth\",\"story_form\":\"birth\",\"form\":\"birth\",\"meaning_en\":\"the time when a baby is born\",\"meaning\":\"탄생\"},{\"word_id\":\"v1905\",\"headword\":\"party\",\"story_form\":\"party\",\"form\":\"party\",\"meaning_en\":\"a gathering to celebrate something\",\"meaning\":\"파티\"},{\"word_id\":\"v2035\",\"headword\":\"present\",\"story_form\":\"present\",\"form\":\"present\",\"meaning_en\":\"something given as a gift\",\"meaning\":\"선물\"},{\"word_id\":\"v2239\",\"headword\":\"ribbon\",\"story_form\":\"ribbon\",\"form\":\"ribbon\",\"meaning_en\":\"a narrow strip of decorative cloth\",\"meaning\":\"리본\"},{\"word_id\":\"v1464\",\"headword\":\"invite\",\"story_form\":\"invite\",\"form\":\"invite\",\"meaning_en\":\"ask someone to come to an event\",\"meaning\":\"초대하다\"},{\"word_id\":\"v1281\",\"headword\":\"happy\",\"story_form\":\"happy\",\"form\":\"happy\",\"meaning_en\":\"feeling pleased or joyful\",\"meaning\":\"행복한\"},{\"word_id\":\"v0067\",\"headword\":\"age\",\"story_form\":\"age\",\"form\":\"age\",\"meaning_en\":\"how many years someone has lived\",\"meaning\":\"나이\"},{\"word_id\":\"v1503\",\"headword\":\"kiss\",\"story_form\":\"kiss\",\"form\":\"kiss\",\"meaning_en\":\"touch someone with your lips in affection\",\"meaning\":\"입맞춤\"},{\"word_id\":\"v1603\",\"headword\":\"love\",\"story_form\":\"love\",\"form\":\"love\",\"meaning_en\":\"a strong feeling of caring\",\"meaning\":\"사랑\"},{\"word_id\":\"v0405\",\"headword\":\"card\",\"story_form\":\"card\",\"form\":\"card\",\"meaning_en\":\"a folded message given on a special day\",\"meaning\":\"카드\"}],\"english\":[\"We plan a **party** to celebrate the **birth** of our baby sister.\",\"I tie a **ribbon** around a small **present** for her.\",\"“Can we **invite** Grandma?” I ask as I make a **card**.\",\"Mum smiles and says, “Of course! She will be **happy**.”\",\"Grandma writes the baby's **age** in weeks on the **card**.\",\"She gives her a gentle **kiss**, and the room feels full of **love**.\"],\"korean\":[\"우리는 여동생의 탄생을 축하하는 파티를 계획한다.\",\"나는 작은 선물에 리본을 묶는다.\",\"“할머니를 초대해도 돼요?” 카드를 만들며 내가 묻는다.\",\"어머니는 웃으며 “물론이지! 할머니가 기뻐하실 거야.”라고 말씀하신다.\",\"할머니는 카드에 아기가 태어난 지 몇 주가 되었는지 적으신다.\",\"할머니가 아기에게 살며시 입 맞추시자 방 안이 사랑으로 가득한 듯하다.\"]},{\"id\":\"E030\",\"title\":\"공원에서 쉼표\",\"title_en\":\"A Break in the Park\",\"targets\":[{\"word_id\":\"v1898\",\"headword\":\"park\",\"story_form\":\"park\",\"form\":\"park\",\"meaning_en\":\"a public place with grass and paths\",\"meaning\":\"공원\"},{\"word_id\":\"v2414\",\"headword\":\"sit\",\"story_form\":\"sit\",\"form\":\"sit\",\"meaning_en\":\"rest your body on a seat\",\"meaning\":\"앉다\"},{\"word_id\":\"v2517\",\"headword\":\"stand\",\"story_form\":\"stand\",\"form\":\"stand\",\"meaning_en\":\"be upright on your feet\",\"meaning\":\"서다\"},{\"word_id\":\"v2120\",\"headword\":\"quiet\",\"story_form\":\"quiet\",\"form\":\"quiet\",\"meaning_en\":\"making little noise\",\"meaning\":\"조용한\"},{\"word_id\":\"v2439\",\"headword\":\"smile\",\"story_form\":\"smile\",\"form\":\"smile\",\"meaning_en\":\"a happy expression on your face\",\"meaning\":\"미소\"},{\"word_id\":\"v1163\",\"headword\":\"fun\",\"story_form\":\"fun\",\"form\":\"fun\",\"meaning_en\":\"enjoyment\",\"meaning\":\"즐거움\"},{\"word_id\":\"v2160\",\"headword\":\"recreation\",\"story_form\":\"recreation\",\"form\":\"recreation\",\"meaning_en\":\"activities done for enjoyment\",\"meaning\":\"여가 활동\"},{\"word_id\":\"v1196\",\"headword\":\"gentleman\",\"story_form\":\"gentleman\",\"form\":\"gentleman\",\"meaning_en\":\"a polite word for a man\",\"meaning\":\"신사\"},{\"word_id\":\"v1518\",\"headword\":\"lady\",\"story_form\":\"lady\",\"form\":\"lady\",\"meaning_en\":\"a polite word for a woman\",\"meaning\":\"숙녀\"},{\"word_id\":\"v0653\",\"headword\":\"couple\",\"story_form\":\"couple\",\"form\":\"couple\",\"meaning_en\":\"two people who are together\",\"meaning\":\"두 사람, 한 쌍\"}],\"english\":[\"We visit a **quiet** **park** for some afternoon **recreation**.\",\"An older **couple** watches children playing near the trees.\",\"“Please **sit** here,” I tell the **lady**, moving my bag.\",\"The **gentleman** gives me a **smile** and thanks me.\",\"I **stand** beside Dad and watch a little dog chasing a ball.\",\"We do very little, but we still have **fun** together.\"],\"korean\":[\"우리는 오후 여가를 즐기려고 조용한 공원에 간다.\",\"나이 든 두 분이 나무 근처에서 노는 아이들을 지켜본다.\",\"“여기에 앉으세요.” 나는 가방을 옮기며 여자분께 말한다.\",\"남자분은 미소를 지으며 내게 감사 인사를 하신다.\",\"나는 아버지 옆에 서서 작은 개가 공을 쫓는 모습을 본다.\",\"우리는 별다른 일을 하지 않지만 여전히 함께 즐거운 시간을 보낸다.\"]},{\"id\":\"E031\",\"title\":\"장난감 가게\",\"title_en\":\"The Toy Shop\",\"targets\":[{\"word_id\":\"v2761\",\"headword\":\"toy\",\"story_form\":\"toy\",\"form\":\"toy\",\"meaning_en\":\"an object children play with\",\"meaning\":\"장난감\"},{\"word_id\":\"v0843\",\"headword\":\"doll\",\"story_form\":\"doll\",\"form\":\"doll\",\"meaning_en\":\"a toy shaped like a person\",\"meaning\":\"인형\"},{\"word_id\":\"v2256\",\"headword\":\"robot\",\"story_form\":\"robot\",\"form\":\"robot\",\"meaning_en\":\"a machine that performs actions\",\"meaning\":\"로봇\"},{\"word_id\": ,\"korean\":[\"우리 반은 경찰관과 함께 길을 건너는 법을 배운다.\",\"“가장자리에서 멈추고 신호등을 보세요.” 경찰관이 말한다.\",\"우리는 차 두 대가 붐비는 도로를 지나가게 기다린다.\",\"다른 사람들도 우리 옆에서 보행 신호를 기다린다.\",\"신호가 바뀌면 우리는 길에 차가 없는지 확인한다.\",\"그런 다음 안전할 때 함께 걸어서 건넌다.\"]},{\"id\":\"E034\",\"title\":\"자전거 점검\",\"title_en\":\"Checking My Bike\",\"targets\":[{\"word_id\":\"v0277\",\"headword\":\"bike\",\"story_form\":\"bike\",\"form\":\"bike\",\"meaning_en\":\"a two-wheeled vehicle moved by pedals\",\"meaning\":\"자전거\"},{\"word_id\":\"v1309\",\"headword\":\"helmet\",\"story_form\":\"helmet\",\"form\":\"helmet\",\"meaning_en\":\"a hard hat that protects the head\",\"meaning\":\"안전모\"},{\"word_id\":\"v2731\",\"headword\":\"tire\",\"story_form\":\"tire\",\"form\":\"tire\",\"meaning_en\":\"the rubber covering around a wheel\",\"meaning\":\"타이어\"},{\"word_id\":\"v1087\",\"headword\":\"fix\",\"story_form\":\"fix\",\"form\":\"fix\",\"meaning_en\":\"repair something broken\",\"meaning\":\"고치다\"},{\"word_id\":\"v2434\",\"headword\":\"slow\",\"story_form\":\"slow\",\"form\":\"slow\",\"meaning_en\":\"moving at a low speed\",\"meaning\":\"느린\"},{\"word_id\":\"v2488\",\"headword\":\"speed\",\"story_form\":\"speed\",\"form\":\"speed\",\"meaning_en\":\"how fast something moves\",\"meaning\":\"속도\"},{\"word_id\":\"v2804\",\"headword\":\"turn\",\"story_form\":\"turn\",\"form\":\"turn\",\"meaning_en\":\"change direction\",\"meaning\":\"방향을 돌리다\"},{\"word_id\":\"v2245\",\"headword\":\"right\",\"story_form\":\"right\",\"form\":\"right\",\"meaning_en\":\"the opposite direction to left\",\"meaning\":\"오른쪽\"},{\"word_id\":\"v0614\",\"headword\":\"control\",\"story_form\":\"control\",\"form\":\"control\",\"meaning_en\":\"the ability to guide movement\",\"meaning\":\"조절 능력\"},{\"word_id\":\"v1116\",\"headword\":\"foot\",\"story_form\":\"foot\",\"form\":\"foot\",\"meaning_en\":\"the body part used for standing\",\"meaning\":\"발\"}],\"english\":[\"Dad checks my **bike** before our ride in the park.\",\"“We must **fix** this **tire** first,” he tells me.\",\"I put on my **helmet** while he finishes the job.\",\"We start at a **slow** **speed** so I have good **control**.\",\"“**Turn** **right** at the tree,” Dad says from beside me.\",\"I stop carefully and put one **foot** on the ground.\"],\"korean\":[\"아버지는 공원에 자전거를 타러 가기 전에 내 자전거를 점검하신다.\",\"“먼저 이 타이어를 고쳐야겠구나.” 아버지가 말씀하신다.\",\"아버지가 일을 마무리하시는 동안 나는 안전모를 쓴다.\",\"내가 잘 조절할 수 있도록 우리는 느린 속도로 출발한다.\",\"“나무에서 오른쪽으로 돌렴.” 아버지가 내 옆에서 말씀하신다.\",\"나는 조심스럽게 멈추고 한 발을 땅에 내려놓는다.\"]},{\"id\":\"E035\",\"title\":\"버스 여행\",\"title_en\":\"A Bus Journey\",\"targets\":[{\"word_id\":\"v0371\",\"headword\":\"bus\",\"story_form\":\"bus\",\"form\":\"bus\",\"meaning_en\":\"a large vehicle carrying many passengers\",\"meaning\":\"버스\"},{\"word_id\":\"v2581\",\"headword\":\"subway\",\"story_form\":\"subway\",\"form\":\"subway\",\"meaning_en\":\"an underground city railway\",\"meaning\":\"지하철\"},{\"word_id\":\"v2769\",\"headword\":\"train\",\"story_form\":\"train\",\"form\":\"train\",\"meaning_en\":\"connected vehicles running on rails\",\"meaning\":\"기차\"},{\"word_id\":\"v2650\",\"headword\":\"taxi\",\"story_form\":\"taxi\",\"form\":\"taxi\",\"meaning_en\":\"a car you pay to ride in\",\"meaning\":\"택시\"},{\"word_id\":\"v0404\",\"headword\":\"car\",\"story_form\":\"car\",\"form\":\"car\",\"meaning_en\":\"a road vehicle for a few people\",\"meaning\":\"자동차\"},{\"word_id\":\"v2795\",\"headword\":\"truck\",\"story_form\":\"truck\",\"form\":\"truck\",\"meaning_en\":\"a large vehicle for carrying goods\",\"meaning\":\"트럭\"},{\"word_id\":\"v0867\",\"headword\":\"drive\",\"story_form\":\"drive\",\"form\":\"drive\",\"meaning_en\":\"control a vehicle on a road\",\"meaning\":\"운전하다\"},{\"word_id\":\"v2778\",\"headword\":\"travel\",\"story_form\":\"travel\",\"form\":\"travel\",\"meaning_en\":\"go from place to place\",\"meaning\":\"여행하다\"},{\"word_id\":\"v2791\",\"headword\":\"trip\",\"story_form\":\"trip\",\"form\":\"trip\",\"meaning_en\":\"a journey to a place\",\"meaning\":\"여행, 나들이\"},{\"word_id\":\"v2720\",\"headword\":\"ticket\",\"story_form\":\"ticket\",\"form\":\"ticket\",\"meaning_en\":\"a pass showing you have paid to travel\",\"meaning\":\"표\"}],\"english\":[\"Our family plans a **trip** to see Grandma this weekend.\",\"“Shall we **drive** our **car** or **travel** by **train**?” Dad asks.\",\"We choose the railway, and Mum buys each **ticket** online.\",\"A **bus** takes us past a **truck** loaded with flowers.\",\"We change to the **subway** to reach the main station.\",\"At the other end, a **taxi** takes us to Grandma's door.\"],\"korean\":[\"우리 가족은 이번 주말에 할머니를 뵈러 가는 여행을 계획한다.\",\"“우리 차를 운전해서 갈까, 기차로 갈까?” 아버지가 물으신다.\",\"우리는 철도를 선택하고 어머니는 온라인으로 각자의 표를 사신다.\",\"버스는 꽃을 실은 트럭을 지나 우리를 데려간다.\",\"우리는 큰 역에 도착하려고 지하철로 갈아탄다.\",\"도착한 곳에서는 택시가 우리를 할머니 댁 앞까지 데려다준다.\"]},{\"id\":\"E036\",\"title\":\"첫 비행기\",\"title_en\":\"My First Flight\",\"targets\":[{\"word_id\":\"v0080\",\"headword\":\"airplane\",\"story_form\":\"airplane\",\"form\":\"airplane\",\"meaning_en\":\"a flying vehicle with wings\",\"meaning\":\"비행기\"},{\"word_id\":\"v1961\",\"headword\":\"pilot\",\"story_form\":\"pilot\",\"form\":\"pilot\",\"meaning_en\":\"a person who flies an aircraft\",\"meaning\":\"조종사\"},{\"word_id\":\"v0078\",\"headword\":\"air\",\"story_form\":\"air\",\"form\":\"air\",\"meaning_en\":\"the gases around us that we breathe\",\"meaning\":\"공기, 공중\"},{\"word_id\":\"v1107\",\"headword\":\"fly\",\"story_form\":\"fly\",\"form\":\"fly\",\"meaning_en\":\"move through the air\",\"meaning\":\"날다\"},{\"word_id\":\"v1522\",\"headword\":\"land\",\"story_form\":\"land\",\"form\":\"land\",\"meaning_en\":\"come down onto the ground\",\"meaning\":\"착륙하다\"},{\"word_id\":\"v0650\",\"headword\":\"country\",\"story_form\":\"country\",\"form\":\"country\",\"meaning_en\":\"a nation with its own government\",\"meaning\":\"나라\"},{\"word_id\":\"v2978\",\"headword\":\"world\",\"story_form\":\"world\",\"form\":\"world\",\"meaning_en\":\"the earth and all its places\",\"meaning\":\"세계\"},{\"word_id\":\"v1629\",\"headword\":\"map\",\"story_form\":\"map\",\"form\":\"map\",\"meaning_en\":\"a drawing showing where places are\",\"meaning\":\"지도\"},{\"word_id\":\"v1796\",\"headword\":\"north\",\"story_form\":\"north\",\"form\":\"north\",\"meaning_en\":\"the direction opposite south\",\"meaning\":\"북쪽\"},{\"word_id\":\"v1867\",\"headword\":\"over\",\"story_form\":\"over\",\"form\":\"over\",\"meaning_en\":\"above something\",\"meaning\":\"위로\"}],\"english\":[\"It is my first journey in an **airplane** with my family.\",\"The **pilot** says we will **fly** **north** to another **country**.\",\"“Where are we on this **map**?” I ask my mother.\",\"She shows me our small part of the **world**.\",\"High in the **air**, we pass **over** fields and towns.\",\"I watch through the window as we **land** at last.\"],\"korean\":[\"나는 가족과 함께 처음 비행기 여행을 한다.\",\"조종사는 우리가 다른 나라를 향해 북쪽으로 날아갈 것이라고 말한다.\",\"“이 지도에서 우리는 어디에 있어요?” 나는 어머니께 묻는다.\",\"어머니는 세계에서 우리가 있는 작은 부분을 보여 주신다.\",\"우리는 높은 공중에서 들판과 마을 위를 지나간다.\",\"마침내 착륙할 때 나는 창문으로 밖을 바라본다.\"]},{\"id\":\"E037\",\"title\":\"시간 약속\",\"title_en\":\"Being on Time\",\"targets\":[{\"word_id\":\"v2727\",\"headword\":\"time\",\"story_form\":\"time\",\"form\":\"time\",\"meaning_en\":\"the point when something happens\",\"meaning\":\"시간, 시각\"},{\"word_id\":\"v1347\",\"headword\":\"hour\",\"story_form\":\"hour\",\"form\":\"hour\",\"meaning_en\":\"a period of sixty minutes\",\"meaning\":\"한 시간\"},{\"word_id\":\"v0722\",\"headword\":\"day\",\"story_form\":\"day\",\"form\":\"day\",\"meaning_en\":\"a period of twenty-four hours\",\"meaning\":\"하루\"},{\"word_id\":\"v2924\",\"headword\":\"week\",\"story_form\":\"week\",\"form\":\"week\",\"meaning_en\":\"a period of seven days\",\"meaning\":\"일주일\"},{\"word_id\":\"v1718\",\"headword\":\"month\",\"story_form\":\"month\",\"form\":\"month\",\"meaning_en\":\"one of twelve parts of a year\",\"meaning\":\"한 달\"},{\"word_id\":\"v2988\",\"headword\":\"year\",\"story_form\":\"year\",\"form\":\"year\",\"meaning_en\":\"a period of twelve months\",\"meaning\":\"일 년\"},{\"word_id\":\"v0886\",\"headword\":\"early\",\"story_form\":\"early\",\"form\":\"early\",\"meaning_en\":\"before the planned time\",\"meaning\":\"일찍\"},{\"word_id\":\"v1530\",\"headword\":\"late\",\"story_form\":\"late\",\"form\":\"late\",\"meaning_en\":\"after the planned time\",\"meaning\":\"늦은\"},{\"word_id\":\"v2896\",\"headword\":\"wait\",\"story_form\":\"wait\",\"form\":\"wait\",\"meaning_en\":\"stay until something happens\",\"meaning\":\"기다리다\"},{\"word_id\":\"v0156\",\"headword\":\"arrive\",\"story_form\":\"arrive\",\"form\":\"arrive\",\"meaning_en\":\"reach a place\",\"meaning\":\"도착하다\"}],\"english\":[\"Our club meets on the same **day** every **week**.\",\"This **month**, we are planning a show for the end of the **year**.\",\"“What **time** should we **arrive**?” I ask our teacher.\",\"“Come at ten; we will practise for an **hour**,” she says.\",\"I get there **early** and **wait** near the classroom door.\",\"Nobody is **late**, so we can begin together.\"],\"korean\":[\"우리 동아리는 매주 같은 요일에 모인다.\",\"이번 달에 우리는 연말 공연을 계획하고 있다.\",\"“몇 시에 도착해야 하나요?” 나는 선생님께 묻는다.\",\"“열 시에 오렴. 한 시간 동안 연습할 거야.” 선생님이 말씀하신다.\",\"나는 일찍 도착해 교실 문 근처에서 기다린다.\",\"아무도 늦지 않아서 우리는 함께 시작할 수 있다.\"]},{\"id\":\"E038\",\"title\":\"숫자 놀이\",\"title_en\":\"Playing with Numbers\",\"targets\":[{\"word_id\":\"v1837\",\"headword\":\"one\",\"story_form\":\"one\",\"form\":\"one\",\"meaning_en\":\"the number 1\",\"meaning\":\"하나\"},{\"word_id\":\"v2814\",\"headword\":\"two\",\"story_form\":\"two\",\"form\":\"two\",\"meaning_en\":\"the number 2\",\"meaning\":\"둘\"},{\"word_id\":\"v2712\",\"headword\":\"three\",\"story_form\":\"three\",\"form\":\"three\",\"meaning_en\":\"the number 3\",\"meaning\":\"셋\"},{\"word_id\":\"v1140\",\"headword\":\"four\",\"story_form\":\"four\",\"form\":\"four\",\"meaning_en\":\"the number 4\",\"meaning\":\"넷\"},{\"word_id\":\"v1086\",\"headword\":\"five\",\"story_form\":\"five\",\"form\":\"five\",\"meaning_en\":\"the number 5\",\"meaning\":\"다섯\"},{\"word_id\":\"v2417\",\"headword\":\"six\",\"story_form\":\"six\",\"form\":\"six\",\"meaning_en\":\"the number 6\",\"meaning\":\"여섯\"},{\"word_id\":\"v2358\",\"headword\":\"seven\",\"story_form\":\"seven\",\"form\":\"seven\",\"meaning_en\":\"the number 7\",\"meaning\":\"일곱\"},{\"word_id\":\"v0900\",\"headword\":\"eight\",\"story_form\":\"eight\",\"form\":\"eight\",\"meaning_en\":\"the number 8\",\"meaning\":\"여덟\"},{\"word_id\":\"v1785\",\"headword\":\"nine\",\"story_form\":\"nine\",\"form\":\"nine\",\"meaning_en\":\"the number 9\",\"meaning\":\"아홉\"},{\"word_id\":\"v2667\",\"headword\":\"ten\",\"story_form\":\"ten\",\"form\":\"ten\",\"meaning_en\":\"the number 10\",\"meaning\":\"열\"}],\"english\":[\"My little sister and I count blocks on the floor.\",\"“**One**, **two**, **three**,” she says, making a small tower.\",\"I give her **four** more blocks, and now she has **seven**.\",\"“Can we make it **ten**?” she asks, reaching for another box.\",\"We count **five**, **six**, **seven**, **eight**, **nine**, **ten** as we rebuild.\",\"Our tall tower stands until the cat walks past!\"],\"korean\":[\"여동생과 나는 바닥에 놓인 블록을 센다.\",\"“하나, 둘, 셋.” 여동생이 작은 탑을 만들며 말한다.\",\"내가 블록 네 개를 더 주니 이제 일곱 개가 된다.\",\"“열 개로 만들 수 있어?” 여동생이 다른 상자를 향해 손을 뻗으며 묻는다.\",\"우리는 다시 쌓으면서 다섯, 여섯, 일곱, 여덟, 아홉, 열을 센다.\",\"우리의 높은 탑은 고양이가 옆을 지나갈 때까지 서 있다!\"]},{\"id\":\"E039\",\"title\":\"달력의 표시\",\"title_en\":\"Marking the Calendar\",\"targets\":[{\"word_id\":\"v0910\",\"headword\":\"eleven\",\"story_form\":\"eleven\",\"form\":\"eleven\",\"meaning_en\":\"the number 11\",\"meaning\":\"열하나\"},{\"word_id\":\"v2806\",\"headword\":\"twelve\",\"story_form\":\"twelve\",\"form\":\"twelve\",\"meaning_en\":\"the number 12\",\"meaning\":\"열둘\"},{\"word_id\":\"v2704\",\"headword\":\"thirteen\",\"story_form\":\"thirteen\",\"form\":\"thirteen\",\"meaning_en\":\"the number 13\",\"meaning\":\"열셋\"},{\"word_id\":\"v2807\",\"headword\":\"twenty\",\"story_form\":\"twenty\",\"form\":\"twenty\",\"meaning_en\":\"the number 20\",\"meaning\":\"스물\"},{\"word_id\":\"v2705\",\"headword\":\"thirty\",\"story_form\":\"thirty\",\"form\":\"thirty\",\"meaning_en\":\"the number 30\",\"meaning\":\"서른\"},{\"word_id\":\"v1356\",\"headword\":\"hundred\",\"story_form\":\"hundred\",\"form\":\"hundred\",\"meaning_en\":\"the number 100\",\"meaning\":\"백\"},{\"word_id\":\"v0718\",\"headword\":\"date\",\"story_form\":\"date\",\"form\":\"date\",\"meaning_en\":\"a particular day of a month\",\"meaning\":\"날짜\"},{\"word_id\":\"v2808\",\"headword\":\"twenty-first\",\"story_form\":\"twenty-first\",\"form\":\"twenty-first\",\"meaning_en\":\"in position 21; here, day 21\",\"meaning\":\"스물한 번째; 여기서는 21일\"},{\"word_id\":\"v2809\",\"headword\":\"twenty-second\",\"story_form\":\"twenty-second\",\"form\":\"twenty-second\",\"meaning_en\":\"in position 22; here, day 22\",\"meaning\":\"스물두 번째; 여기서는 22일\"},{\"word_id\":\"v2810\",\"headword\":\"twenty-third\",\"story_form\":\"twenty-third\",\"form\":\"twenty-third\",\"meaning_en\":\"in position 23; here, day 23\",\"meaning\":\"스물세 번째; 여기서는 23일\"}],\"english\":[\"Our school fair runs from the **twenty-first** to the **twenty-third** of June.\",\"“Circle the **twenty-second**; that is our game **date**,” Dad says.\",\"**Eleven** children have joined, and **twelve** more will come tomorrow.\",\"I count **thirteen** balls and **twenty** small flags.\",\"We prepare **thirty** cups for water beside the field.\",\"A **hundred** colorful paper stars make the room look lovely.\"],\"korean\":[\"우리 학교 축제는 6월 21일부터 23일까지 열린다.\",\"“22일에 동그라미를 쳐. 그날이 우리 경기 날이야.” 아버지가 말씀하신다.\",\"열한 명이 참가했고 내일 열두 명이 더 올 것이다.\",\"나는 공 열세 개와 작은 깃발 스무 개를 센다.\",\"우리는 운동장 옆에 물컵 서른 개를 준비한다.\",\"알록달록한 종이별 백 개가 방을 아름답게 꾸며 준다.\"]},{\"id\":\"E040\",\"title\":\"경주하는 날\",\"title_en\":\"Race Day\",\"targets\":[{\"word_id\":\"v2126\",\"headword\":\"race\",\"story_form\":\"race\",\"form\":\"race\",\"meaning_en\":\"a competition to see who is fastest\",\"meaning\":\"경주\"},{\"word_id\":\"v1630\",\"headword\":\"marat ":\"몸을 살펴봐요\",\"title_en\":\"Learning About Our Bodies\",\"targets\":[{\"word_id\":\"v0308\",\"headword\":\"body\",\"story_form\":\"body\",\"form\":\"body\",\"meaning_en\":\"all the physical parts of a person\",\"meaning\":\"몸\"},{\"word_id\":\"v1294\",\"headword\":\"head\",\"story_form\":\"head\",\"form\":\"head\",\"meaning_en\":\"the body part above the neck\",\"meaning\":\"머리\"},{\"word_id\":\"v1014\",\"headword\":\"eye\",\"story_form\":\"eyes\",\"form\":\"eyes\",\"meaning_en\":\"the body parts used for seeing\",\"meaning\":\"눈\"},{\"word_id\":\"v0885\",\"headword\":\"ear\",\"story_form\":\"ears\",\"form\":\"ears\",\"meaning_en\":\"the body parts used for hearing\",\"meaning\":\"귀\"},{\"word_id\":\"v1797\",\"headword\":\"nose\",\"story_form\":\"nose\",\"form\":\"nose\",\"meaning_en\":\"the body part used for smelling\",\"meaning\":\"코\"},{\"word_id\":\"v1733\",\"headword\":\"mouth\",\"story_form\":\"mouth\",\"form\":\"mouth\",\"meaning_en\":\"the opening used for eating and speaking\",\"meaning\":\"입\"},{\"word_id\":\"v1580\",\"headword\":\"lip\",\"story_form\":\"lips\",\"form\":\"lips\",\"meaning_en\":\"the soft edges around the mouth\",\"meaning\":\"입술\"},{\"word_id\":\"v1762\",\"headword\":\"neck\",\"story_form\":\"neck\",\"form\":\"neck\",\"meaning_en\":\"the part joining head and body\",\"meaning\":\"목\"},{\"word_id\":\"v0151\",\"headword\":\"arm\",\"story_form\":\"arm\",\"form\":\"arm\",\"meaning_en\":\"a body part from shoulder to hand\",\"meaning\":\"팔\"},{\"word_id\":\"v1552\",\"headword\":\"leg\",\"story_form\":\"leg\",\"form\":\"leg\",\"meaning_en\":\"a body part used for standing and walking\",\"meaning\":\"다리\"}],\"english\":[\"We draw a funny **body** on a large sheet of paper.\",\"I add a round **head**, two **eyes** and two big **ears**.\",\"“Does it need a **nose**?” my partner asks me.\",\"“Yes, and a **mouth** with smiling **lips**,” I tell her.\",\"We draw a short **neck**, then label an **arm** and a **leg**.\",\"Our picture helps us remember the words together.\"],\"korean\":[\"우리는 큰 종이에 재미있는 몸을 그린다.\",\"나는 둥근 머리와 눈 두 개, 큰 귀 두 개를 더 그린다.\",\"“코도 필요할까?” 짝꿍이 내게 묻는다.\",\"“응, 웃는 입술이 있는 입도.” 내가 말한다.\",\"우리는 짧은 목을 그린 뒤 팔과 다리에 이름을 적는다.\",\"우리의 그림은 함께 단어들을 기억하는 데 도움이 된다.\"]},{\"id\":\"E042\",\"title\":\"병원 견학\",\"title_en\":\"A Visit to the Hospital\",\"targets\":[{\"word_id\":\"v2396\",\"headword\":\"sick\",\"story_form\":\"sick\",\"form\":\"sick\",\"meaning_en\":\"not feeling well\",\"meaning\":\"아픈\"},{\"word_id\":\"v1810\",\"headword\":\"nurse\",\"story_form\":\"nurse\",\"form\":\"nurse\",\"meaning_en\":\"a person trained to care for sick people\",\"meaning\":\"간호사\"},{\"word_id\":\"v0840\",\"headword\":\"doctor\",\"story_form\":\"doctor\",\"form\":\"doctor\",\"meaning_en\":\"a person trained to treat illness\",\"meaning\":\"의사\"},{\"word_id\":\"v1342\",\"headword\":\"hospital\",\"story_form\":\"hospital\",\"form\":\"hospital\",\"meaning_en\":\"a place where people receive medical care\",\"meaning\":\"병원\"},{\"word_id\":\"v0301\",\"headword\":\"blood\",\"story_form\":\"blood\",\"form\":\"blood\",\"meaning_en\":\"the red liquid inside the body\",\"meaning\":\"피\"},{\"word_id\":\"v0313\",\"headword\":\"bone\",\"story_form\":\"bone\",\"form\":\"bone\",\"meaning_en\":\"a hard part inside the body\",\"meaning\":\"뼈\"},{\"word_id\":\"v2422\",\"headword\":\"skin\",\"story_form\":\"skin\",\"form\":\"skin\",\"meaning_en\":\"the outer covering of the body\",\"meaning\":\"피부\"},{\"word_id\":\"v1299\",\"headword\":\"heart\",\"story_form\":\"heart\",\"form\":\"heart\",\"meaning_en\":\"the organ that pumps blood\",\"meaning\":\"심장\"},{\"word_id\":\"v1078\",\"headword\":\"finger\",\"story_form\":\"finger\",\"form\":\"finger\",\"meaning_en\":\"one of the parts at the end of a hand\",\"meaning\":\"손가락\"},{\"word_id\":\"v1077\",\"headword\":\"fine\",\"story_form\":\"fine\",\"form\":\"fine\",\"meaning_en\":\"feeling well\",\"meaning\":\"괜찮은\"}],\"english\":[\"We visit a **hospital** to learn about helping **sick** people.\",\"A **nurse** shows us a model of the human body.\",\"“This **heart** moves **blood** around the body,” she explains.\",\"A **doctor** points to a **bone** beneath the model's **skin**.\",\"“Is that a **finger** **bone**?” I ask from the front.\",\"“Yes! And are you feeling **fine**?” she asks with a smile.\"],\"korean\":[\"우리는 아픈 사람을 돕는 일을 배우려고 병원을 방문한다.\",\"간호사가 인체 모형을 보여 준다.\",\"“이 심장은 몸 전체로 피를 보내요.” 간호사가 설명한다.\",\"의사는 모형의 피부 아래에 있는 뼈를 가리킨다.\",\"“그건 손가락뼈예요?” 내가 앞에서 묻는다.\",\"“맞아요! 몸은 괜찮나요?” 의사가 미소 지으며 묻는다.\"]},{\"id\":\"E043\",\"title\":\"감정을 말해요\",\"title_en\":\"Talking About Feelings\",\"targets\":[{\"word_id\":\"v1055\",\"headword\":\"feel\",\"story_form\":\"feel\",\"form\":\"feel\",\"meaning_en\":\"experience an emotion\",\"meaning\":\"느끼다\"},{\"word_id\":\"v2286\",\"headword\":\"sad\",\"story_form\":\"sad\",\"form\":\"sad\",\"meaning_en\":\"unhappy\",\"meaning\":\"슬픈\"},{\"word_id\":\"v0062\",\"headword\":\"afraid\",\"story_form\":\"afraid\",\"form\":\"afraid\",\"meaning_en\":\"worried that something bad may happen\",\"meaning\":\"두려운\"},{\"word_id\":\"v1611\",\"headword\":\"mad\",\"story_form\":\"mad\",\"form\":\"mad\",\"meaning_en\":\"angry\",\"meaning\":\"화가 난\"},{\"word_id\":\"v2395\",\"headword\":\"shy\",\"story_form\":\"shy\",\"form\":\"shy\",\"meaning_en\":\"nervous around other people\",\"meaning\":\"수줍은\"},{\"word_id\":\"v2979\",\"headword\":\"worry\",\"story_form\":\"worry\",\"form\":\"worry\",\"meaning_en\":\"feel troubled about something\",\"meaning\":\"걱정하다\"},{\"word_id\":\"v0686\",\"headword\":\"cry\",\"story_form\":\"cry\",\"form\":\"cry\",\"meaning_en\":\"have tears fall from your eyes\",\"meaning\":\"울다\"},{\"word_id\":\"v1208\",\"headword\":\"glad\",\"story_form\":\"glad\",\"form\":\"glad\",\"meaning_en\":\"pleased about something\",\"meaning\":\"기쁜\"},{\"word_id\":\"v1338\",\"headword\":\"hope\",\"story_form\":\"hope\",\"form\":\"hope\",\"meaning_en\":\"want something good to happen\",\"meaning\":\"바라다\"},{\"word_id\":\"v2469\",\"headword\":\"sorry\",\"story_form\":\"sorry\",\"form\":\"sorry\",\"meaning_en\":\"feeling regret for something\",\"meaning\":\"미안한\"}],\"english\":[\"I **feel** **sad** when my friend leaves me out of a game.\",\"I am also **mad**, but I am too **shy** to speak.\",\"“Are you **afraid** to tell her?” my teacher asks gently.\",\"I nod and begin to **cry** because I **worry** about losing her.\",\"My friend says, “I am **sorry**. I **hope** you will join us.”\",\"I am **glad** we can talk and play again.\"],\"korean\":[\"친구가 나를 놀이에서 빼면 나는 슬프다.\",\"나는 화도 나지만 너무 수줍어서 말하지 못한다.\",\"“그 친구에게 말하는 게 두렵니?” 선생님이 부드럽게 물으신다.\",\"나는 고개를 끄덕이고 친구를 잃을까 걱정되어 울기 시작한다.\",\"친구가 “미안해. 네가 우리와 함께하면 좋겠어.”라고 말한다.\",\"나는 우리가 다시 이야기하고 놀 수 있어 기쁘다.\"]},{\"id\":\"E044\",\"title\":\"친구와 화해\",\"title_en\":\"Making Up with a Friend\",\"targets\":[{\"word_id\":\"v1068\",\"headword\":\"fight\",\"story_form\":\"fight\",\"form\":\"fight\",\"meaning_en\":\"argue angrily with someone\",\"meaning\":\"다투다\"},{\"word_id\":\"v1501\",\"headword\":\"kind\",\"story_form\":\"kind\",\"form\":\"kind\",\"meaning_en\":\"caring about other people's feelings\",\"meaning\":\"친절한\"},{\"word_id\":\"v1310\",\"headword\":\"help\",\"story_form\":\"help\",\"form\":\"help\",\"meaning_en\":\"make something easier for someone\",\"meaning\":\"돕다\"},{\"word_id\":\"v1334\",\"headword\":\"honest\",\"story_form\":\"honest\",\"form\":\"honest\",\"meaning_en\":\"telling the truth\",\"meaning\":\"정직한\"},{\"word_id\":\"v1569\",\"headword\":\"lie\",\"story_form\":\"lie\",\"form\":\"lie\",\"meaning_en\":\"say something that is not true\",\"meaning\":\"거짓말하다\"},{\"word_id\":\"v2796\",\"headword\":\"true\",\"story_form\":\"true\",\"form\":\"true\",\"meaning_en\":\"matching what really happened\",\"meaning\":\"사실인\"},{\"word_id\":\"v2987\",\"headword\":\"wrong\",\"story_form\":\"wrong\",\"form\":\"wrong\",\"meaning_en\":\"not right or fair\",\"meaning\":\"잘못된\"},{\"word_id\":\"v2824\",\"headword\":\"understand\",\"story_form\":\"understand\",\"form\":\"understand\",\"meaning_en\":\"know what something means or how someone feels\",\"meaning\":\"이해하다\"},{\"word_id\":\"v0073\",\"headword\":\"agree\",\"story_form\":\"agree\",\"form\":\"agree\",\"meaning_en\":\"have the same opinion\",\"meaning\":\"동의하다\"},{\"word_id\":\"v1115\",\"headword\":\"fool\",\"story_form\":\"fool\",\"form\":\"fool\",\"meaning_en\":\"a person acting without good sense\",\"meaning\":\"어리석은 사람\"}],\"english\":[\"Ben and I **fight** over a broken toy at school.\",\"I call him a **fool**, although that is not **kind**.\",\"“Let us be **honest** and not **lie**,” our teacher says.\",\"I explain what happened, and Ben says it is **true**.\",\"We **agree** that blaming each other was **wrong**.\",\"Now we **understand** each other and **help** fix the toy together.\"],\"korean\":[\"벤과 나는 학교에서 망가진 장난감 때문에 다툰다.\",\"나는 벤에게 바보라고 말하지만, 그것은 친절한 행동이 아니다.\",\"“거짓말하지 말고 정직하게 말해 보자.” 선생님이 말씀하신다.\",\"나는 있었던 일을 설명하고 벤은 사실이라고 말한다.\",\"우리는 서로를 탓한 것이 잘못이었다는 데 동의한다.\",\"이제 우리는 서로를 이해하고 함께 장난감을 고치는 일을 돕는다.\"]},{\"id\":\"E045\",\"title\":\"도서관의 발견\",\"title_en\":\"A Discovery at the Library\",\"targets\":[{\"word_id\":\"v1566\",\"headword\":\"library\",\"story_form\":\"library\",\"form\":\"library\",\"meaning_en\":\"a place where books can be borrowed\",\"meaning\":\"도서관\"},{\"word_id\":\"v0320\",\"headword\":\"borrow\",\"story_form\":\"borrow\",\"form\":\"borrow\",\"meaning_en\":\"take something to return later\",\"meaning\":\"빌리다\"},{\"word_id\":\"v2230\",\"headword\":\"return\",\"story_form\":\"return\",\"form\":\"return\",\"meaning_en\":\"give something back\",\"meaning\":\"돌려주다\"},{\"word_id\":\"v1881\",\"headword\":\"page\",\"story_form\":\"page\",\"form\":\"page\",\"meaning_en\":\"one side of a sheet in a book\",\"meaning\":\"쪽\"},{\"word_id\":\"v2549\",\"headword\":\"story\",\"story_form\":\"story\",\"form\":\"story\",\"meaning_en\":\"an account of events, real or imagined\",\"meaning\":\"이야기\"},{\"word_id\":\"v2976\",\"headword\":\"word\",\"story_form\":\"word\",\"form\":\"word\",\"meaning_en\":\"a unit of language with meaning\",\"meaning\":\"단어\"},{\"word_id\":\"v1562\",\"headword\":\"letter\",\"story_form\":\"letter\",\"form\":\"letter\",\"meaning_en\":\"a written message to someone\",\"meaning\":\"편지\"},{\"word_id\":\"v1616\",\"headword\":\"mail\",\"story_form\":\"mail\",\"form\":\"mail\",\"meaning_en\":\"letters sent through a postal service\",\"meaning\":\"우편물\"},{\"word_id\":\"v1900\",\"headword\":\"part\",\"story_form\":\"part\",\"form\":\"part\",\"meaning_en\":\"a section of something\",\"meaning\":\"부분\"},{\"word_id\":\"v0937\",\"headword\":\"enter\",\"story_form\":\"enter\",\"form\":\"enter\",\"meaning_en\":\"go inside a place\",\"meaning\":\"들어가다\"}],\"english\":[\"I **enter** the **library** to **return** a book about animals.\",\"“May I **borrow** a **story** about getting **mail**?” I ask.\",\"The worker finds a book about a girl and a lost **letter**.\",\"On the first **page**, I find a **word** I do not know.\",\"We read that **part** together, and she helps me understand.\",\"I take the book home to discover the ending.\"],\"korean\":[\"나는 동물에 관한 책을 반납하려고 도서관에 들어간다.\",\"“우편물을 받는 이야기를 빌려도 될까요?” 내가 묻는다.\",\"직원은 한 소녀와 잃어버린 편지에 관한 책을 찾아 준다.\",\"첫 쪽에서 나는 모르는 단어를 발견한다.\",\"우리는 그 부분을 함께 읽고 직원은 내가 이해하도록 도와준다.\",\"나는 결말을 알아보려고 책을 집으로 가져간다.\"]},{\"id\":\"E046\",\"title\":\"옛 왕국 이야기\",\"title_en\":\"A Story of an Old Kingdom\",\"targets\":[{\"word_id\":\"v1502\",\"headword\":\"king\",\"story_form\":\"king\",\"form\":\"king\",\"meaning_en\":\"a male ruler in a kingdom\",\"meaning\":\"왕\"},{\"word_id\":\"v2116\",\"headword\":\"queen\",\"story_form\":\"queen\",\"form\":\"queen\",\"meaning_en\":\"a female ruler in a kingdom\",\"meaning\":\"여왕\"},{\"word_id\":\"v2051\",\"headword\":\"prince\",\"story_form\":\"prince\",\"form\":\"prince\",\"meaning_en\":\"a son of a king or queen\",\"meaning\":\"왕자\"},{\"word_id\":\"v1221\",\"headword\":\"gold\",\"story_form\":\"gold\",\"form\":\"gold\",\"meaning_en\":\"a valuable yellow metal\",\"meaning\":\"금\"},{\"word_id\":\"v2241\",\"headword\":\"rich\",\"story_form\":\"rich\",\"form\":\"rich\",\"meaning_en\":\"having a lot of money\",\"meaning\":\"부유한\"},{\"word_id\":\"v2000\",\"headword\":\"poor\",\"story_form\":\"poor\",\"form\":\"poor\",\"meaning_en\":\"having little money\",\"meaning\":\"가난한\"},{\"word_id\":\"v1220\",\"headword\":\"god\",\"story_form\":\"god\",\"form\":\"god\",\"meaning_en\":\"a being worshipped in a religion or myth\",\"meaning\":\"신\"},{\"word_id\":\"v0261\",\"headword\":\"believe\",\"story_form\":\"believe\",\"form\":\"believe\",\"meaning_en\":\"think something is true\",\"meaning\":\"믿다\"},{\"word_id\":\"v1314\",\"headword\":\"hero\",\"story_form\":\"hero\",\"form\":\"hero\",\"meaning_en\":\"someone admired for brave or good acts\",\"meaning\":\"영웅\"},{\"word_id\":\"v2816\",\"headword\":\"ugly\",\"story_form\":\"ugly\",\"form\":\"ugly\",\"meaning_en\":\"unpleasant to look at\",\"meaning\":\"못생긴\"}],\"english\":[\"Our story begins with a **king**, a **queen** and a young **prince**.\",\"The **rich** family keeps **gold** in a room beneath their home.\",\"One day, a **poor** traveler asks them for food.\",\"“Some people **believe** he is a **god**,” the **queen** whispers.\",\"The **prince** says, “His coat is **ugly**, but that does not matter.”\",\"He shares his meal and becomes the little **hero** of our tale.\"],\"korean\":[\"우리 이야기는 왕과 여왕, 어린 왕자로 시작한다.\",\"그 부유한 가족은 집 아래 방에 금을 보관한다.\",\"어느 날 가난한 나그네가 그들에게 음식을 부탁한다.\",\"“어떤 사람들은 그가 신이라고 믿어요.” 여왕이 속삭인다.\",\"왕자는 “저분의 외투는 볼품없지만 그런 건 중요하지 않아요.”라고 말한다.\",\"그는 식사를 나누어 주고 우리 이야기의 작은 영웅이 된다.\"]},{\"id\":\"E047\",\"title\":\"작은 과학자\",\"title_en\":\"The Little Scientist\",\"targets\":[{\"word_id\":\"v2314\",\"headword\":\"science\",\"story_form\":\"science\",\"form\":\"science\",\"meaning_en\":\"the study of how the natural world works\",\"meaning\":\"과학\"},{\"word_id\":\"v0888\",\"headword\":\"earth\",\"story_form\":\"earth\",\"form\":\"earth\",\"meaning_en\":\"the planet where we live\",\"meaning\":\"지구\"},{\"word_id\":\"v1721\",\"headword\":\"moon\",\"story_form\":\"moon\",\"form\":\"moon\",\"meaning_en\":\"the natural object moving around Earth\",\"meaning\":\"달\"},{\"word_id\":\"v2519\",\"headword\":\"star\",\"story_form\":\"star\",\"form\":\"star\",\"meaning_en\":\"a distant bright object like the sun\",\"meaning\":\"별\"},{\"word_id\":\"v2477\",\"headword\":\"space\",\"story_form\":\"space\",\"form\":\"space\",\"meaning_en\":\"the vast area beyond Earth's air\",\"meaning\":\"우주\"},{\"word_id\":\"v0930\",\"headword\":\"energy\",\"story_form\":\"energy\",\"form\":\"energy\",\"meaning_en\":\"what allows things to work or change\",\"meaning\":\"에너지\"},{\"word_id\":\"v2018\",\"headword\":\"power\",\"story_form\":\"power\",\"form\":\"power\",\"meaning_en\":\"electricity used to run a machine\",\"meaning\":\"전력\"},{\"word_id\":\"v1300\",\"headword\":\"heat\",\"story_form\":\"heat\",\"form\":\"heat\",\"meaning_en\":\"warmth produced or transferred\",\"meaning\":\"열\"},{\"word_id\":\"v1183\",\"headword\":\"gas\",\"story_form\":\"gas\",\"form\":\"gas\",\"meaning_en\":\"a substance like air rather than liquid\",\"meaning\":\"기체\"},{\"word_id\":\"v1528\",\"headword\":\"laser\",\"story_form\":\"laser\",\"form\":\"laser\",\"meaning_en\":\"a device producing a narrow beam of light\",\"meaning\":\"레이저\"}],\"english\":[\"At the **science** center, we watch a film about **space**.\",\"A model shows the **earth**, the **moon** and a distant **star**.\",\"“Where does the sun get its **energy**?” my sister asks.\",\"Our guide explains that the sun is made of very hot **gas**.\",\"We learn how sunlight brings **heat** to our planet.\",\"Before leaving, we see a **laser** display that uses electric **power**.\"],\"korean\":[\"과학관에서 우리는 우주에 관한 영화를 본다.\",\"모형은 지구와 달, 멀리 있는 별을 보여 준다.\",\"“태양은 에너지를 어디서 얻어요?” 여동생이 묻는다.\",\"안내자는 태양이 매우 뜨거운 기체로 이루어져 있다고 설명한다.\",\"우리는 햇빛이 지구에 열을 전하는 방법을 배운다.\",\"떠나기 전에 우리는 전력을 사용하는 레이저 전시를 본다.\"]},{\"id\":\"E048\",\"title\":\"컴퓨터 시간\",\"title_en\":\"Computer Time\",\"targets\":[{\"word_id\":\"v0564\",\"headword\":\"compute\",\"story_form\":\"compute\",\"form\":\"compute\",\"meaning_en\":\"work out an answer using numbers\",\"meaning\":\"계산하다\"},{\"word_id\":\"v2456\",\"headword\":\"software\",\"story_form\":\"software\",\"form\":\"software\",\"meaning_en\":\"instructions that make a computer work\",\"meaning\":\"소프트웨어\"},{\"word_id\":\"v2071\",\"headword\":\"program\",\"story_form\":\"program\",\"form\":\"program\",\"meaning_en\":\"a set of computer instructions\",\"meaning\":\"프로그램\"},{\"word_id\":\"v1451\",\"headword\":\"internet\",\"story_form\":\"internet\",\"form\":\"internet\",\"meaning_en\":\"a worldwide network connecting computers\",\"meaning\":\"인터넷\"},{\"word_id\":\"v2921\",\"headword\":\"website\",\"story_form\":\"website\",\"form\":\"website\",\"meaning_en\":\"a group of connected pages online\",\"meaning\":\"웹사이트\"},{\"word_id\":\"v1070\",\"headword\":\"file\",\"story_form\":\"file\",\"form\":\"file\",\"meaning_en\":\"a collection of information saved on a computer\",\"meaning\":\"파일\"},{\"word_id\":\"v1376\",\"headword\":\"image\",\"story_form\":\"image\",\"form\":\"image\",\"meaning_en\":\"a picture on a screen\",\"meaning\":\"이미지\"},{\"word_id\":\"v2054\",\"headword\":\"print\",\"story_form\":\"print\",\"form\":\"print\",\"meaning_en\":\"put words or pictures onto paper\",\"meaning\":\"인쇄하다\"},{\"word_id\":\"v2815\",\"headword\":\"type\",\"story_form\":\"type\",\"form\":\"type\",\"meaning_en\":\"enter words using a keyboard\",\"meaning\":\"타이핑하다\"},{\"word_id\":\"v2843\",\"headword\":\"use\",\"story_form\":\"use\",\"form\":\"use\",\"meaning_en\":\"do something with a tool\",\"meaning\":\"사용하다\"}],\"english\":[\"Our teacher shows us how to **use** new drawing **software**.\",\"The **program** can **compute** the size of each picture.\",\"“**Type** your name and save your **file**,” she tells us.\",\"We choose an **image** from our school's **website** on the **internet**.\",\"I add it to my page and check the colors.\",\"Then I **print** my work to show my family at home.\"],\"korean\":[\"선생님은 새 그림 소프트웨어 사용법을 보여 주신다.\",\"그 프로그램은 각 그림의 크기를 계산할 수 있다.\",\"“이름을 입력하고 파일을 저장하세요.” 선생님이 말씀하신다.\",\"우리는 인터넷의 학교 웹사이트에서 이미지를 고른다.\",\"나는 그 이미지를 내 페이지에 넣고 색을 확인한다.\",\"그런 다음 가족에게 보여 주려고 작품을 인쇄한다.\"]},{\"id\":\"E049\",\"title\":\"우리 반 영화\",\"title_en\":\"Our Class Movie\",\"targets\":[{\"word_id\":\"v1735\",\"headword\":\"movie\",\"story_form\":\"movie\",\"form\":\"movie\",\"meaning_en\":\"a story shown in moving pictures\",\"meaning\":\"영화\"},{\"word_id\":\"v1072\",\"headword\":\"film\",\"story_form\":\"film\",\"form\":\"film\",\"meaning_en\":\"a movie or recorded moving-picture work\",\"meaning\":\"영화, 영상 작품\"},{\"word_id\":\"v2873\",\"headword\":\"video\",\"story_form\":\"video\",\"form\":\"video\",\"meaning_en\":\"a recording of moving pictures\",\"meaning\":\"동영상\"},{\"word_id\":\"v0389\",\"headword\":\"camera\",\"story_form\":\"camera\",\"form\":\"camera\",\"meaning_en\":\"a device for taking pictures\",\"meaning\":\"카메라\"},{\"word_id\":\"v2661\",\"headword\":\"television\",\"story_form\":\"television\",\"form\":\"television\",\"meaning_en\":\"a device for watching broadcast programs\",\"meaning\":\"텔레비전\"},{\"word_id\":\"v2127\",\"headword\":\"radio\",\"story_form\":\"radio\",\"form\":\"radio\",\"meaning_en\":\"a device for hearing broadcast programs\",\"meaning\":\"라디오\"},{\"word_id\":\"v1779\",\"headword\":\"news\",\"story_form\":\"news\",\"form\":\"news\",\"meaning_en\":\"information about recent events\",\"meaning\":\"뉴스\"},{\"word_id\":\"v1780\",\"headword\":\"newspaper\",\"story_form\":\"newspaper\",\"form\":\"newspaper\",\"meaning_en\":\"printed pages with news and articles\",\"meaning\":\"신문\"},{\"word_id\":\"v2392\",\"headword\":\"show\",\"story_form\":\"show\",\"form\":\"show\",\"meaning_en\":\"present something for people to see\",\"meaning\":\"보여 주다\"},{\"word_id\":\"v2909\",\"headword\":\"watch\",\"story_form\":\"watch\",\"form\":\"watch\",\"meaning_en\":\"look at something for a time\",\"meaning\":\"시청하다\"}],\"english\":[\"Our class decides to make a short **movie** about our town.\",\"I hold the **camera** while May records a **video** of the park.\",\"“Can we include some local **news**?” Ben asks our teacher.\",\"We read a **newspaper** and listen to the **radio** for ideas.\",\"When the **film** is ready, we **show** it on the classroom **television**.\",\"Our families come to **watch** and clap at the end.\"],\"korean\":[\"우리 반은 우리 마을에 관한 짧은 영화를 만들기로 한다.\",\"메이가 공원의 동영상을 촬영하는 동안 나는 카메라를 잡는다.\",\"“지역 뉴스도 넣어도 될까요?” 벤이 선생님께 묻는다.\",\"우리는 아이디어를 얻으려고 신문을 읽고 라디오를 듣는다.\",\"영화가 완성되자 우리는 교실 텔레비전으로 보여 준다.\",\"가족들이 보러 와서 마지막에 박수를 친다.\"]},{\"id\":\"E050\",\"title\":\"새로운 동아리\",\"title_en\":\"A New Club\",\"targets\":[{\"word_id\":\"v0508\",\"headword\":\"club\",\"story_form\":\"club\",\"form\":\"club\",\"meaning_en\":\"a group meeting for a shared interest\",\"meaning\":\"동아리\"},{\"word_id\":\"v1665\",\"headword\":\"member\",\"story_form\":\"member\",\"form\":\"member\",\"meaning_en\":\"a person who belongs to a group\",\"meaning\":\"회원\"},{\"word_id\":\"v1482\",\"headword\":\"join\",\"story_form\":\"join\",\"form\":\"join\",\"meaning_en\":\"become part of a group\",\"meaning\":\"가입하다\"},{\"word_id\":\"v1251\",\"headword\":\"group\",\"story_form\":\"group\",\"form\":\"group\",\"meaning_en\":\"people gathered or working together\",\"meaning\":\"모임\"},{\"word_id\":\"v1327\",\"headword\":\"hobby\",\"story_form\":\"hobby\",\"form\":\"hobby\",\"meaning_en\":\"something you enjoy doing in spare time\",\"meaning\":\"취미\"},{\"word_id\":\"v0524\",\"headword\":\"collect\",\"story_form\":\"collect\",\"form\":\"collect\",\"meaning_en\":\"bring similar things together over time\",\"meaning\":\"모으다\"},{\"word_id\":\"v0534\",\"headword\":\"comic\",\"story_form\":\"comic\",\"form\":\"comic\",\"meaning_en\":\"a book of stories told in pictures\",\"meaning\":\"만화책\"},{\"word_id\":\"v1146\",\"headword\":\"free\",\"story_form\":\"free\",\"form\":\"free\",\"meaning_en\":\"not busy with work or plans\",\"meaning\":\"한가한\"},{\"word_id\":\"v2925\",\"headword\":\"weekend\",\"story_form\":\"weekend\",\"form\":\"weekend\",\"meaning_en\":\"Saturday and Sunday\",\"meaning\":\"주말\"},{\"word_id\":\"v1499\",\"headword\":\"kid\",\"story_form\":\"kid\",\"form\":\"kid\",\"meaning_en\":\"a child\",\"meaning\":\"아이\"}],\"english\":[\"I am **free** this **weekend** and want to try a new **hobby**.\",\"A **kid** from my class invites me to a **comic** **club**.\",\"“May I **join** your **group**?” I ask at the door.\",\"“Of course! Every **member** brings something to share,” she says.\",\"Some children **collect** old books, while others draw their own stories.\",\"I draw a funny cat and make two new friends.\"],\"korean\":[\"나는 이번 주말에 시간이 있어서 새 취미를 해 보고 싶다.\",\"같은 반 아이가 만화 동아리에 나를 초대한다.\",\"“너희 모임에 가입해도 될까?” 나는 문 앞에서 묻는다.\",\"“물론이지! 회원은 모두 나눌 것을 가져와.” 그 아이가 말한다.\",\"어떤 아이들은 오래된 책을 모으고, 다른 아이들은 직접 이야기를 그린다.\",\"나는 재미있는 고양이를 그리고 새 친구 두 명을 사귄다.\"]},{\"id\":\"E051\",\"title\":\"우리 동네 안내\",\"title_en\":\"Showing a Friend Around\",\"targets\":[{\"word_id\":\"v2759\",\"headword\":\"town\",\"story_form\":\"town\",\"form\":\"town\",\"meaning_en\":\"a place with homes and shops\",\"meaning\":\"마을, 소도시\"},{\"word_id\":\"v0484\",\"headword\":\"city\",\"story_form\":\"city\",\"form\":\"city\",\"meaning_en\":\"a large town\",\"meaning\":\"도시\"},{\"word_id\":\"v1348\",\"headword\":\"house\",\"story_form\":\"house\",\"form\":\"house\",\"meaning_en\":\"a building where people live\",\"meaning\":\"집\"},{\"word_id\":\"v1332\",\"headword\":\"home\",\"story_form\":\"home\",\"form\":\"home\",\"meaning_en\":\"the place where someone lives\",\"meaning\":\"집, 가정\"},{\"word_id\":\"v0134\",\"headword\":\"apartment\",\"story_form\":\"apartment\",\"form\":\"apartment\",\"meaning_en\":\"a home within a larger building\",\"meaning\":\"아파트\"},{\"word_id\":\"v0041\",\"headword\":\"address\",\"story_form\":\"address\",\"form\":
