ection></main><script>
const BOOKS=[{"name": "Elementary", "chapters": [{"id": "E001", "title": "E001 · Meeting a New Friend", "words": [{"text": "I", "meaning": "나는", "meaning_en": "the person speaking", "form": "I", "word_id": "v1364", "example": {"text": "“Hello! I am Mina. What is your name?” I ask a new girl.", "translation": "“안녕! 나는 미나야. 네 이름은 뭐니?” 나는 새로 온 여자아이에게 묻는다."}}, {"text": "you", "meaning": "너는", "meaning_en": "the person being spoken to", "form": "you", "word_id": "v2995", "example": {"text": "“You can call me May,” she says with a smile.", "translation": "“메이라고 불러도 돼.” 그녀가 웃으며 말한다."}}, {"text": "he", "meaning": "그는", "meaning_en": "a boy or man already mentioned", "form": "he", "word_id": "v1293", "example": {"text": "He has two little toy cars in his hands.", "translation": "그는 손에 작은 장난감 자동차 두 대를 들고 있다."}}, {"text": "she", "meaning": "그녀는", "meaning_en": "a girl or woman already mentioned", "form": "she", "word_id": "v2373", "example": {"text": "“You can call me May,” she says with a smile.", "translation": "“메이라고 불러도 돼.” 그녀가 웃으며 말한다."}}, {"text": "we", "meaning": "우리는", "meaning_en": "the speaker and others", "form": "we", "word_id": "v2914", "example": {"text": "We meet her brother by the classroom door.", "translation": "우리는 교실 문 옆에서 메이의 남동생을 처음 만난다."}}, {"text": "they", "meaning": "그들은", "meaning_en": "other people already mentioned", "form": "they", "word_id": "v2696", "example": {"text": "They ask me to play with them after school.", "translation": "두 아이는 방과 후에 같이 놀자고 한다."}}, {"text": "hello", "meaning": "안녕", "meaning_en": "a word used when meeting someone", "form": "hello", "word_id": "v1308", "example": {"text": "“Hello! I am Mina. What is your name?” I ask a new girl.", "translation": "“안녕! 나는 미나야. 네 이름은 뭐니?” 나는 새로 온 여자아이에게 묻는다."}}, {"text": "name", "meaning": "이름", "meaning_en": "what someone is called", "form": "name", "word_id": "v1751", "example": {"text": "“Hello! I am Mina. What is your name?” I ask a new girl.", "translation": "“안녕! 나는 미나야. 네 이름은 뭐니?” 나는 새로 온 여자아이에게 묻는다."}}, {"text": "friend", "meaning": "친구", "meaning_en": "someone you like and know well", "form": "friend", "word_id": "v1150", "example": {"text": "I am happy to have a new friend.", "translation": "나는 새 친구가 생겨서 기쁘다."}}, {"text": "meet", "meaning": "처음 만나다", "meaning_en": "see someone for the first time", "form": "meet", "word_id": "v1662", "example": {"text": "We meet her brother by the classroom door.", "translation": "우리는 교실 문 옆에서 메이의 남동생을 처음 만난다."}}]}, {"id": "E002", "title": "E002 · Our Family Photos", "words": [{"text": "family", "meaning": "가족", "meaning_en": "a group of related people", "form": "family", "word_id": "v1033", "example": {"text": "My family sits together and opens an old album.", "translation": "우리 가족은 함께 앉아 오래된 사진첩을 펼친다."}}, {"text": "father", "meaning": "아버지", "meaning_en": "a male parent", "form": "father", "word_id": "v1046", "example": {"text": "“No, that is your father!” my mother says.", "translation": "“아니, 저건 너희 아빠야!” 어머니가 말씀하신다."}}, {"text": "mother", "meaning": "어머니", "meaning_en": "a female parent", "form": "mother", "word_id": "v1726", "example": {"text": "“No, that is your father!” my mother says.", "translation": "“아니, 저건 너희 아빠야!” 어머니가 말씀하신다."}}, {"text": "brother", "meaning": "남자 형제", "meaning_en": "a boy with the same parents", "form": "brother", "word_id": "v0353", "example": {"text": "“Is that baby my brother?” my sister asks.", "translation": "“저 아기가 우리 오빠야?” 여동생이 묻는다."}}, {"text": "sister", "meaning": "여자 형제", "meaning_en": "a girl with the same parents", "form": "sister", "word_id": "v2413", "example": {"text": "“Is that baby my brother?” my sister asks.", "translation": "“저 아기가 우리 오빠야?” 여동생이 묻는다."}}, {"text": "parent", "meaning": "부모 중 한 사람", "meaning_en": "a mother or father", "form": "parent", "word_id": "v1897", "example": {"text": "“You look like a very happy parent,” I tell him.", "translation": "“정말 행복한 부모님처럼 보여요.” 나는 아버지께 말한다."}}, {"text": "son", "meaning": "아들", "meaning_en": "someone's male child", "form": "son", "word_id": "v2464", "example": {"text": "“Here I am with my son and daughter.”", "translation": "“여기서는 내가 아들하고 딸과 함께 있네.”"}}, {"text": "daughter", "meaning": "딸", "meaning_en": "someone's female child", "form": "daughter", "word_id": "v0720", "example": {"text": "“Here I am with my son and daughter.”", "translation": "“여기서는 내가 아들하고 딸과 함께 있네.”"}}, {"text": "baby", "meaning": "아기", "meaning_en": "a very young child", "form": "baby", "word_id": "v0207", "example": {"text": "“Is that baby my brother?” my sister asks.", "translation": "“저 아기가 우리 오빠야?” 여동생이 묻는다."}}, {"text": "album", "meaning": "사진첩", "meaning_en": "a book for keeping photographs", "form": "album", "word_id": "v0083", "example": {"text": "My family sits together and opens an old album.", "translation": "우리 가족은 함께 앉아 오래된 사진첩을 펼친다."}}]}, {"id": "E003", "title": "E003 · Grandpa's Guests", "words": [{"text": "grandfather", "meaning": "할아버지", "meaning_en": "the father of a parent", "form": "grandfather", "word_id": "v1233", "example": {"text": "My grandfather puts extra cups on the kitchen table.", "translation": "할아버지는 식탁에 컵을 더 놓으신다."}}, {"text": "aunt", "meaning": "이모", "meaning_en": "the sister of a parent", "form": "aunt", "word_id": "v0192", "example": {"text": "“Your aunt and her husband are coming,” he says.", "translation": "“네 이모와 이모부가 오신단다.” 할아버지가 말씀하신다."}}, {"text": "uncle", "meaning": "이모부", "meaning_en": "the husband of your aunt", "form": "uncle", "word_id": "v2819", "example": {"text": "“My wife made this cake,” my uncle tells us.", "translation": "“제 아내가 이 케이크를 만들었어요.” 이모부가 말씀하신다."}}, {"text": "cousin", "meaning": "사촌", "meaning_en": "a child of your aunt or uncle", "form": "cousin", "word_id": "v0658", "example": {"text": "A man and a woman soon arrive with my cousin.", "translation": "곧 남자 한 분과 여자 한 분이 내 사촌과 함께 도착한다."}}, {"text": "husband", "meaning": "남편", "meaning_en": "the man someone is married to", "form": "husband", "word_id": "v1361", "example": {"text": "“Your aunt a pose", "meaning": "부과하다", "meaning_en": "make people accept a rule", "form": "impose", "word_id": "v1388", "example": {"text": "“Will you impose strict rules?” one member asks.", "translation": "“엄격한 규칙을 강요할 건가요?” 한 회원이 묻는다."}}, {"text": "strict", "meaning": "엄격한", "meaning_en": "requiring rules to be followed closely", "form": "strict", "word_id": "v2560", "example": {"text": "“Will you impose strict rules?” one member asks.", "translation": "“엄격한 규칙을 강요할 건가요?” 한 회원이 묻는다."}}]}, {"id": "O023", "title": "O023 · A Small Election", "words": [{"text": "candidate", "meaning": "후보자", "meaning_en": "a person seeking an elected position", "form": "candidate", "word_id": "v0395", "example": {"text": "“I nominate Mina as a candidate,” Jun says.", "translation": "“미나를 후보로 추천합니다.” 준이 말한다."}}, {"text": "nominate", "meaning": "후보로 추천하다", "meaning_en": "officially suggest someone for a position", "form": "nominate", "word_id": "v1790", "example": {"text": "“I nominate Mina as a candidate,” Jun says.", "translation": "“미나를 후보로 추천합니다.” 준이 말한다."}}, {"text": "poll", "meaning": "투표, 여론 조사", "meaning_en": "a vote or survey of opinions", "form": "poll", "word_id": "v1996", "example": {"text": "Before the poll, we agree on one criterion: listening to others.", "translation": "투표 전에 우리는 다른 사람의 말을 듣는 것을 판단 기준으로 정한다."}}, {"text": "rank", "meaning": "순위를 매기다", "meaning_en": "place things in an order", "form": "rank", "word_id": "v2136", "example": {"text": "“Let's judge each person's merit, not just rank our friends,” I suggest.", "translation": "“친구들의 순위만 매기지 말고 각자의 장점을 판단하자.” 내가 제안한다."}}, {"text": "criterion", "meaning": "판단 기준", "meaning_en": "a standard used to judge something", "form": "criterion", "word_id": "v0676", "example": {"text": "Before the poll, we agree on one criterion: listening to others.", "translation": "투표 전에 우리는 다른 사람의 말을 듣는 것을 판단 기준으로 정한다."}}, {"text": "merit", "meaning": "장점, 공로", "meaning_en": "a good quality deserving recognition", "form": "merit", "word_id": "v1673 sks us to translate a short phrase.", "translation": "선생님은 짧은 어구를 번역하라고 하신다."}}, {"text": "phrase", "meaning": "구, 어구", "meaning_en": "a small group of words", "form": "phrase", "word_id": "v1949", "example": {"text": "The teacher asks us to translate a short phrase.", "translation": "선생님은 짧은 어구를 번역하라고 하신다."}}, {"text": "oral", "meaning": "구두의", "meaning_en": "spoken rather than written", "form": "oral", "word_id": "v1848", "example": {"text": "In our intermediate English class, we do an oral activity.", "translation": "중급 영어 수업에서 우리는 말하기 활동을 한다."}}, {"text": "vocabulary", "meaning": "어휘", "meaning_en": "the words someone knows or uses", "form": "vocabulary", "word_id": "v2889", "example": {"text": "We use our vocabulary to convey the speaker's worry.", "translation": "우리는 아는 어휘를 활용해 화자의 걱정을 전달한다."}}, {"text": "intermediate", "meaning": "중급의", "meaning_en": "between beginner and advanced levels", "form": "intermediate", "word_id": "v1449", "example": {"text": "In our intermediate English class, we do an oral activity.", "translation": "중급 영어 수업에서 우리는 말하기 활동을 한다."}}, {"text": "correspond", "meaning": "대응하다", "meaning_en": "match or have a similar meaning", "form": "correspond", "word_id": "v0637", "example": {"text": "“Does each verb correspond to just one Korean word?” I ask.", "translation": "“각 동사가 한국어 단어 하나에만 대응하나요?” 내가 묻는다."}}, {"text": "convey", "meaning": "전달하다", "meaning_en": "communicate an idea or feeling", "form": "convey", "word_id": "v0619", "example": {"text": "We use our vocabulary to convey the speaker's worry.", "translation": "우리는 아는 어휘를 활용해 화자의 걱정을 전달한다."}}, {"text": "verb", "meaning": "동사", "meaning_en": "a word expressing an action or state", "form": "verb", "word_id": "v2861", "example": {"text": "“Does each verb correspond to just one Korean word?” I ask.", "translation": "“각 동사가 한국어 단어 하나에만 대응하나요?” 내가 묻는다."}}]}, {"id": "O025", "title": "O025 · A Discovery in the Lab", "words": [{"text": "hypothesis", "meaning": "가설", "meaning_en": "an idea tha $('book').onchange=()=>{state.settings.book=+$('book').value;state.settings.start=0;state.settings.end=BOOKS[state.settings.book].chapters.length-1;controls();save();choose()};for(const id of ['start','end','limit','direction'])$(id).onchange=()=>{const s=state.settings;if(id==='direction')s.direction=$(id).value;else if(id==='limit')s.limit=Math.max(1,Math.min(100,Math.round(+$(id).value)||10));else{s[id]=+$(id).value;if(s.end<s.start){if(id==='start')s.end=s.start;else s.start=s.end}}controls();save();choose()};
$('undo').onclick=()=>{if(!undo)return;if(undo.record)state.records[undo.key]=undo.record;else delete state.records[undo.key];current=undo.card;state.settings.book=current.bi;state.settings.start=Math.min(state.settings.start,current.ci);state.settings.end=Math.min(BOOKS[current.bi].chapters.length-1,Math.max(state.settings.end,current.ci));undo=null;revealed=false;stop();controls();save();render();readFront()};$('refresh').onclick=choose;
$('export').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=url;a.download='vocabulary-progress-'+dateKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const f=$('file').files[0];if(!f)return;const parsed=JSON.parse(await f.text());if(!valid(parsed))throw Error();if(!confirm('현재 단어 암기 진도를 이 백업으로 교체할까요? 다른 학습 진도는 유지됩니다.'))return;state=parsed;undo=null;controls();save();choose();$('status').textContent='단어 암기 백업을 불러왔어요.'}catch(e){$('status').textContent='올바른 단어 암기 백업 파일이 아니에요.'}finally{$('file').value=''}};for(const k of Object.keys(AUDIO_DEFAULTS))$('audio-'+k).onclick=()=>{state.settings.audio[k]=!state.settings.audio[k];stop();audioControls();save()};
$('audio-start').onclick=()=>{if(revealed)readAnswer();else readFront()};$('audio-stop').onclick=stop;
window.addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});controls();choose();
</script></body></html>
